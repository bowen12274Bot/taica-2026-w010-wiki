IGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 即使沒有答案也能妥善退出。把報告的動詞換成能對回證據的動詞，接手者就知道該找誰，而不會把所有停頓都拿去重跑。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"手上最後一項證據表格\" data-passage=\"p-5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">手上最後一項證據\u003c/th>\n\u003cth scope=\"col\">可交回的判斷與下一步\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>沒有新回覆，最後一次嘗試狀態不明。\u003c/td>\n\u003ctd>標為未知。核對仍有效的派工、責任人、最後進度與產物，先確認原嘗試狀態及所有權。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>授權不足或產品語義待定。\u003c/td>\n\u003ctd>標為阻塞。寫出缺的輸入或決策、誰可解除，以及從哪一步繼續。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具已回傳啟動錯誤，或實際斷言不符。\u003c/td>\n\u003ctd>記下失敗發生在啟動還是產品檢查；附執行條件、命令與輸出，依原因安排下一次查證。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>指定版本、測項及結果齊備。\u003c/td>\n\u003ctd>可報指定工作完成並提交驗收。具權者核對後作出接受決定，再記為已接受。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\">\u003cstrong>自己判讀。\u003c/strong> 誰能批准 AND 或 OR？多久沒收到訊息可以認定執行這項工作的 Worker 已退出？先查委託指定的產品決策者，再拿 A、B 的不同輸出請其選擇。沉默只表示目前缺少觀察，不能由經過時間推出已退出、失敗或可重派。工具拒絕也只表示該操作受阻；模型給出 final 只表示本輪已結束。要判斷產品已接受，仍要看到對應版本的驗收決定。\u003c/p>\n\u003cp data-passage=\"p-7\">來源：U-B 的 U07（使用者直接陳述的轉述），P02（run 結束）、P05（專案指引）、P17（架構約束案例）；Wiki 的 \u003ccode>concepts/authority.md\u003c/code>、\u003ccode>examples/decision-cases.md\u003c/code>、\u003ccode>tutorials/scheduling-supervision-handoff.md\u003c/code>。\u003c/p>\n\u003cp data-passage=\"p-8\">下一步若要配置一位 Agent 的可用工具與檢查點，可跳讀第二章；若已碰到互斥需求或執行者失聯，第四章處理裁決與恢復，第五章處理交付的驗收與成本證據。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P02、P05、P17、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agents/running-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P02 · OpenAI · Running agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-loop.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/authority.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/decision-cases.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/agent-system-model.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/scheduling-supervision-handoff.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.08", "firstSlide": 70, "lastSlide": 73, "subtitle": "有權修一個行為，誰有權決定下一個行為？"}, {"id": "02-A01", "chapter": "02", "title": "單 Agent 的四種委託方式：答疑、逐步協作、先規劃、授權執行", "track": "A", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">當需求是「幫我看一下」，助手讀完後究竟要解釋、要交計畫，還是可以直接改檔？先約定由誰決定下一步。這裡的 Agent 指能根據觀察選下一步、由環境執行獲准操作的助手。「模式」指這次人與助手的分工，同一個聊天入口也可能拿得到工程工具。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> \u003cstrong>答疑\u003c/strong>適合尚在探索規則的人。人提供資料，助手交回解釋和待查問題。\u003cstrong>逐步協作\u003c/strong>適合人正在編輯的檔案。讓助手讀出一處差異，等你決定後再進下一步。\u003cstrong>先規劃再執行\u003c/strong>適合改動可能跨檔的需求。先交步驟、依賴與可觀察的檢查點，核准範圍後才開始寫。\u003cstrong>授權自主執行\u003c/strong>適合行為清楚、修正可逆、測試可用的工作。助手可以自行查檔、局部修改與重測，到約定停點交回結果。這四種委託方式也能銜接；產品是否提供同名按鈕要另查。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 試把「看看匯出功能」寫成「唯讀查出產生標頭的檔案，交回檔名與一個樣例」。即使助手找到可寫入的編輯工具，交付仍到定位為止。若你接著核准修復，明訂可動檔案、測項與變更格式時的停點。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>判斷題\u003c/strong>　只看對話框，怎麼知道它可以自行修復？要找本次授權、實際可用的工具和成功條件。僅有解釋需求時，連開放寫入的環境也應交回解釋。來源為 T04（tutorials/single-agent-coding-cycle.md）、concepts/single-agent.md；四種分工是本章設計。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　T04\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.01", "firstSlide": 75, "lastSlide": 77, "subtitle": "要助手答問題，還是授權它動手？"}, {"id": "02-A02", "chapter": "02", "title": "任務契約：用樣例約定範圍與驗收條件", "track": "A", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">「讓錯誤訊息好懂」足以表達動機，卻無法決定哪一個輸入要出現哪一句提示。任務契約是一份人和助手都能據以判定範圍與完成的約定。先讓需求者看一個具體結果，往往比繼續補形容詞更早發現歧義。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 目標是讓使用者找得到漏填的欄位。例示「名稱留空送出，在名稱下方看見提示，資料不寫入」，再給有效名稱仍能儲存的反例。範圍限表單的提示與對應測試，禁止修改儲存格式。只含空白的名稱算不算空值尚待決定。請助手先重述兩個樣例、排除項及未知；需求者接受後，才把它們列為測試預期。若無法啟動表單，交回啟動命令、錯誤與尚可檢查的部分。\u003c/p>\n\u003cfigure>\u003cfigcaption>把「名稱必填」翻成三個可以分開決定的輸入（合成表單練習）\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">輸入\u003c/th>\u003cth scope=\"col\">需求者要確認的結果\u003c/th>\u003cth scope=\"col\">助手如何處理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">沒有填名稱\u003c/th>\u003ctd>欄位下方提示，資料未寫入。\u003c/td>\u003ctd>列為拒絕案例。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">填入有效名稱\u003c/th>\u003ctd>資料仍可儲存。\u003c/td>\u003ctd>保留原有成功案例。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">只輸入空白\u003c/th>\u003ctd>是否合法仍待決定。\u003c/td>\u003ctd>交回選項，待確認後才寫預期。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cp data-passage=\"p-3\">\u003cstrong>判斷題\u003c/strong>　需求寫得很長，卻沒提空白字串，助手能自行把它列為拒絕案例嗎？該案例會改變合法輸入集合，應先查現行契約，再把缺少的決定交回需求者。來源為 T04、concepts/harness.md；\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 上述委託格式適用於可以描述外顯行為的工作。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　T04\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.02", "firstSlide": 78, "lastSlide": 79, "subtitle": "把「請改善」寫成可驗收的委託"}, {"id": "02-A03", "chapter": "02", "title": "單 Agent 規劃：階段產物與檢查點", "track": "A", "role": "core", "parent": "", "lead": "先想像你委託一位助手查清單：選「工作」時只該留下寄報表，清除後買牛奶也應回來。助手的計畫要說明怎麼找出哪一步少了第二筆，以及要看到什麼才可以動手修。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">只改一個已知拼字時，先寫長計畫沒有多少資訊價值。若一個錯誤可能分別出在讀取、轉換和顯示，直接列「修改三處」反而提前假定根因。檢查點是能決定是否繼續的觀察，例如在開始寫入前先取得能重現差異的輸入。\u003c/p>\n\u003ch2 data-section>前一步要交出什麼，才值得繼續？\u003c/h2>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先唯讀調查規格、檔案和現有測試。將「找到受影響入口」寫成第一步輸出，第二步用它製作最小可重現檢查，第三步根據差異選修改點，再用同一檢查與既有成功案例複驗。每一步寫明前一步交給它什麼、過關依據、失敗交回什麼。重現失敗就回報輸入及環境差異；此時計畫應縮回調查。這份順序由同一位助手執行，無須設計跨人派工。\u003c/p>\n\u003ch2 data-section>對讀兩種計畫：修復工作紙與規劃器契約\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 個人研究 U04 的 Planning Agent 規格提供一個更嚴格的對照。模型產生步驟，程式驗證結構後依序傳遞前一步成果。計畫格式不合即停；執行失敗要保留哪一步失敗並停止後續。這讓讀者能找出缺少輸入的步驟。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 規格及交底能核對預期控制流，缺少該作業實際執行輸出與停點觸發紀錄。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>把計畫交給下一步使用。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 委託是一位助手修復「清除後仍只見 A」。交出去的計畫首頁先填目標（清除後見 A、B）、基線（B0）、允許範圍（先唯讀，定位後才依授權改動）及排除項（多選）。每一步各填輸入、動作、可交付輸出與停點。讀者可以用下表逐步追問「下一步拿到哪件東西才開工？」\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"步驟表格\" data-passage=\"p-5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">步驟\u003c/th>\n\u003cth scope=\"col\">取用的輸入與動作\u003c/th>\n\u003cth scope=\"col\">交給下一步的輸出\u003c/th>\n\u003cth scope=\"col\">停點與回報\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1　定位\u003c/td>\n\u003ctd>在 B0 讀契約、清除按鈕處理器與測試入口\u003c/td>\n\u003ctd>一張定位單，列出處理器位置、啟動方式及 A(work)、B(home) 的資料設定\u003c/td>\n\u003ctd>無入口或無 B 時，交回缺項與待補條件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2　重現\u003c/td>\n\u003ctd>按定位單啟動，在同一份資料先選 work 再清除，記請求、回傳 ID、畫面 ID\u003c/td>\n\u003ctd>一張差異單；例如清除時已省略 tag、回應 [A,B]、畫面仍 [A]\u003c/td>\n\u003ctd>三處皆符合預期就停在調查，交回重現條件。若請求仍帶 work，改查組參數的位置。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3　修訂及複驗\u003c/td>\n\u003ctd>依差異單與寫入授權，在回應正確的例子查畫面更新處；做局部修改，重跑原操作及原本正常的 work 篩選\u003c/td>\n\u003ctd>版本與差異、修前／後觀察、實際測項、待測項；可逐一核對 work → [A]、清除 → [A,B]\u003c/td>\n\u003ctd>未獲寫入授權先交修改提案；重測失敗則附同一資料下的反例，保留未結案狀態。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\">\u003cstrong>估算一次規劃要幾次呼叫。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 上表是工程工作紙。U04 對另一個任務（生成冒險規劃書）約定了更窄的介面：Planner 回一個僅含 \u003ccode>goal\u003c/code>、\u003ccode>steps\u003c/code> 的物件。目標須非空、至多 120 字元；步驟須為 3～5 個互異的非空字串，各至多 100 字元。程式先解析及驗證，若只交兩步就停在 Planner。合法時，每個 Executor 輸入包含固定世界背景、原委託、目標、本步序號與文字，以及\u003cstrong>全部先前成功步驟的輸出\u003c/strong>。它只產生當步分析；程式檢查去空白後的文字非空、至多 1,800 字元。格式合格仍須另判內容是否合理。\u003c/p>\n\u003cp data-passage=\"p-7\">例如排三步，全程成功需一次規劃加三次逐步執行，一共四次；若第二步回空字串，至此只呼叫三次，保留第一步內容與第二步失敗原因，第三步未執行。完整路徑為 1+N 次、最多六次，程式用已有結果組成報告，沒有模型補寫、重規劃或自動重試。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 要把此設計升為實作觀察，至少要能在對應版本對上逐次輸入、輸出與狀態，並核對失敗後沒有第三步呼叫。\u003c/p>\n\u003cp data-passage=\"p-8\">\u003cstrong>判斷題\u003c/strong>　助手完成計畫文字，卻無法重現原問題，要批准它同時修改三層嗎？先看檢查點的輸出；沒有具判別力的失敗，應要求回報調查結果及待補條件。來源為 T04、U04 的 CODEX_SPEC.md 與 CODEX_HANDOFF.md（定位見章內審查）。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　T04、U-A、U04\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.03", "firstSlide": 80, "lastSlide": 86}, {"id": "02-A03-01", "chapter": "02", "title": "問題重現：用對照資料查清除篩選故障", "track": "A", "role": "lesson", "parent": "02-A03", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">若工單只要求改正一個已知位置的錯字，編輯後重讀該處，就有辦法判定這一步做完了。「清除篩選後少了一筆」的修復則需要先規劃。按鈕可能保留舊狀態，請求可能仍帶標籤，服務可能少回資料，畫面也可能沿用舊值。同時動手改這幾處，會把原本能區分原因的線索一起改掉。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-2\">把「少了一筆」變成能重播的操作\u003c/h2>\n\u003cp data-passage=\"p-3\">先挑一件工作待辦 A(work) 和一件居家待辦 B(home)，作為每次測試都載入的固定資料（fixture）。選 work 應只見 A；清除時送給服務的請求應省略標籤參數 tag，回到未篩選的 A、B。這套有明確期望的操作，讓下一步能逐層比對。\u003c/p>\n\u003cp data-passage=\"p-4\">助手先唯讀調查。讀專案規則，記下這次起始提交（稱 B0）、工作目錄裡已有的差異及允許修改範圍。從按鈕處理器跟到組裝請求的程式、資料服務介面（API）和測試入口。留給下一步的是位置、固定資料與預期的待辦編號（ID），後續才有根據決定改哪裡。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"沿著故障找入口表格\" data-passage=\"p-5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">沿著故障找入口\u003c/th>\n\u003cth scope=\"col\">到了入口，讀什麼\u003c/th>\n\u003cth scope=\"col\">可以交給下一步的判斷\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>清除後少一筆 → 找到按鈕與請求入口\u003c/td>\n\u003ctd>固定兩筆資料，記下預期 ID，再核對未篩選回應與畫面\u003c/td>\n\u003ctd>有 B 可以觀察它是否重新出現，才有可追查的差異。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除前後皆見 A → 回查原始 fixture\u003c/td>\n\u003ctd>若原本只有 A，正常清除與壞掉的清除都可能只見 A\u003c/td>\n\u003ctd>停在重現準備，回報缺一筆不匹配的資料；補上 B 後再查，暫留未定位。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\">這一份計畫由同一位助手執行。它在得到新觀察後調整下一步；缺少可分辨好壞的資料時，尚無根據直接改畫面。\u003c/p>\n\u003cp data-passage=\"p-7\">T04 的工程循環及 B0、檔案入口是合成教例（\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"SYNTHETIC_EXAMPLE\">合成教學案例\u003c/span>）。專案提供者在 U02 提及先討論目的、再交給可測環境的工作方式；U-A 是 Codex 整理的歷史摘要（\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"USER_RECONSTRUCTED\">歷史整理／轉述\u003c/span>），只可作背景引用。\u003c/p>\n\u003cp data-passage=\"p-8\">\u003ca href=\"#02-A03\">工程工作方法\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T04 單 Agent 工作循環\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-A 摘要\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003chr data-passage=\"p-9\">\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　T04、U-A\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.03.01", "firstSlide": 87, "lastSlide": 90, "subtitle": "先準備能把錯誤顯出來的兩筆資料"}, {"id": "02-A03-02", "chapter": "02", "title": "單 Agent 工程計畫：依重現結果調整修復步驟", "track": "A", "role": "lesson", "parent": "02-A03", "lead": "", "kind": "工程工作單", "body": "\u003cp>把「修好清除篩選」拆成四個動詞，還不足以指導修改。清除按鈕、請求參數、伺服器回應與畫面更新都有可能出錯。在動手之前，一位助手可以把計畫寫成一連串\u003cstrong>可交付的產物\u003c/strong>：先找到能重播故障的入口，再取得能區分幾種原因的觀察，最後才決定改哪裡。下一步若拿不到這些產物，就有明確理由停下。\u003c/p>\n\u003cp>\u003cstrong>計畫首頁｜修復清除後少一筆待辦（合成工作單）\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"要先約定的事表格\">\u003ctable class=\"cols-2\">\u003cthead>\u003ctr>\u003cth scope=\"col\">要先約定的事\u003c/th>\u003cth scope=\"col\">本次委託\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"要先約定的事\">目標與接受條件\u003c/td>\u003ctd data-label=\"本次委託\">選 \u003ccode>work\u003c/code> 只見 A；按清除時省略 tag，恢復 A、B；選未知標籤 \u003ccode>missing\u003c/code> 得到空清單。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"要先約定的事\">起點與輸入\u003c/td>\u003ctd data-label=\"本次委託\">記下起始提交 B0、工作目錄與已有改動。固定資料為 A(work)、B(home)，保留兩筆好讓清除前後可比較。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"要先約定的事\">範圍與授權\u003c/td>\u003ctd data-label=\"本次委託\">先唯讀調查；取得反例、定位修改點且有寫入授權後才改動。沿用既有單標籤契約，多選另案決定。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"要先約定的事\">交件與例外\u003c/td>\u003ctd data-label=\"本次委託\">交候驗版本、差異、實際操作與觀察、通過及未測項目。需要改契約或擴大授權時，向具權者回報。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 data-section>執行工作單\u003c/h2>\n\u003cp>四列由同一位助手依序負責。每一列先找左側所需的輸入，再把右側的產物交給下一步。下面填入的是供練習的數值；實作時要換成該次實際量到的值。\u003c/p>\n\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"步驟表格\">\u003ctable class=\"cols-4\">\u003cthead>\u003ctr>\u003cth scope=\"col\">步驟\u003c/th>\u003cth scope=\"col\">輸入與操作\u003c/th>\u003cth scope=\"col\">留給下一步的產物\u003c/th>\u003cth scope=\"col\">繼續或停止條件\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"步驟\">1　調查\u003c/td>\u003ctd data-label=\"輸入與操作\">在 B0 讀清除契約、按鈕處理器和既有測試，找出列表的讀取介面 \u003ccode>GET /todos\u003c/code>。\u003c/td>\u003ctd data-label=\"留給下一步的產物\">定位單：處理器位置、測試啟動方式、A 與 B 的資料設定。\u003c/td>\u003ctd data-label=\"繼續或停止條件\">缺版本或測試入口就交回缺項。只有 A 時，正確和錯誤的清除行為都可能只見 A，須先補足對照資料。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"步驟\">2　重現\u003c/td>\u003ctd data-label=\"輸入與操作\">依定位單先選 work，再按清除，依序記下請求參數、回應 ID、畫面 ID。\u003c/td>\u003ctd data-label=\"留給下一步的產物\">差異單：清除時已省略 tag；回應為 [A,B]；畫面仍是 [A]。\u003c/td>\u003ctd data-label=\"繼續或停止條件\">這組值將追查範圍縮到畫面更新。未重現時保留輸入、環境與實得值，停在調查。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"步驟\">3　修改\u003c/td>\u003ctd data-label=\"輸入與操作\">取差異單，在獲准範圍內追蹤畫面如何套用回應，對定位到的更新處做局部修正。\u003c/td>\u003ctd data-label=\"留給下一步的產物\">只涉及該處的程式差異，以及可供複驗的候驗版本。\u003c/td>\u003ctd data-label=\"繼續或停止條件\">缺寫入授權先交提案；若必須改變契約，說明原因與受影響的行為，等候決定。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"步驟\">4　複驗\u003c/td>\u003ctd data-label=\"輸入與操作\">在候驗版本用同一份資料，重播原來失敗的清除操作，再跑原本正常的選取及未知標籤。\u003c/td>\u003ctd data-label=\"留給下一步的產物\">逐項記錄期望、實得值與測試範圍。期望為 work → [A]、清除 → [A,B]、missing → []。\u003c/td>\u003ctd data-label=\"繼續或停止條件\">任一不符就帶反例回到定位；缺畫面觀察則將 UI 列為待驗。三條路徑符合約定且必要檢查完成後，交由驗收者簽收。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 data-section>用反例改變計畫\u003c/h2>\n\u003cp>假設第二步換了一筆觀察：清除時仍送出 \u003ccode>tag=work\u003c/code>，服務回 \u003ccode>[A]\u003c/code>，畫面顯示 \u003ccode>[A]\u003c/code>。服務對這個請求給了合理的結果。此時應撤回「修改畫面更新處」的安排，回查清除按鈕與請求組裝，重新登記差異單，再決定局部修改。若三處都符合契約，就保存本次未重現的條件，請提供仍會失敗的版本或輸入。這就是重新規劃的停點：上一列可以改變下一列要做的工作，並保留判斷改變的依據。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>T04 提供單 Agent 修復與複驗的合成情境。工作單欄位屬教學設計；表內的觀察供演練，實際交付須填自己的版本和輸出。\u003c/p>\u003ch3>本機 Wiki 與教材定位\u003c/h3>\u003cul>\u003cli>T04 單 Agent 開發循環\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003cli>02-A03 正文\u003csamp>docs/textbook/ch02/A-method.md#02-A03\u003c/samp>\u003c/li>\u003c/ul>\u003c/section>", "number": "2.A.03.02", "firstSlide": 91, "lastSlide": 95}, {"id": "02-A03-03", "chapter": "02", "title": "結構化規劃：Planner 的 JSON 契約", "track": "A", "role": "lesson", "parent": "02-A03", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">有人向公會說：「想為一次採集委託做準備。」在這個規劃作業裡，要交回的是事前規劃書。規劃者（Planner）讀固定的世界背景與原願望，提出目標與幾項分析工作；Python 先判定清單是否能交給逐步撰稿的執行者（Executor）。每次執行呼叫只寫其中一項的內容，全程無須出門採集或啟動外部工具。這是專案提供者的個人設計 U04。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-2\">用同一個例子逐欄核對\u003c/h2>\n\u003cpre tabindex=\"0\" data-passage=\"p-3\">\u003ccode class=\"language-json\">{\"goal\":\"準備採集前的確認單\",\"steps\":[\"整理已知條件\",\"列出待確認的風險\",\"編製行前確認單\"]}\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"程式讀取的位置表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">程式讀取的位置\u003c/th>\n\u003cth scope=\"col\">入口條件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>整份輸出\u003c/td>\n\u003ctd>須為單一 JSON 物件，欄位恰好只有 goal、steps。允許移除規定的外層 JSON 程式碼圍欄，再用 json.loads 解析；多出的說明文字、缺欄、錯欄或額外欄位都留下失敗資訊。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>goal\u003c/td>\n\u003ctd>非空字串，最多 120 字元。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>steps\u003c/td>\n\u003ctd>由 3～5 個字串構成的陣列；每項去空白後非空、至多 100 字元，各步不得重複。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-5\">先沿「願望 → Planner → 解析與欄位檢查」讀，通過後才進 Executor 第一步。上例三項都在規劃如何準備；還要核讀它們是否與目標相關，是否確實描述規劃或分析工作。「去森林」這種實際動作即使包成合法字串，仍不符合這份委託。結構通過能保證下一步讀得到資料，內容合理性另由人判讀。\u003c/p>\n\u003cp data-passage=\"p-6\">現在把第三項也寫成「列出待確認的風險」。三格仍然存在，重複檢查卻會失敗。若刪掉第三項，只剩兩個合法工作，也會在長度檢查停下。兩種失敗都保存 Planner 原始輸出、顯示計畫無效，並在此結束：已呼叫 Planner 一次，Executor 零次。補一個預設步驟會改掉受檢的原計畫。\u003c/p>\n\u003cp data-passage=\"p-7\">若計畫有效且完成 N 步，模型呼叫共 1＋N 次：一次規劃，加上每步一次撰稿。三到五步對應四到六次呼叫；驗證和最後組稿都由程式完成。原設計沒有自動重試、重新規劃或另加評分模型的呼叫。\u003c/p>\n\u003cp data-passage=\"p-8\">U04 原規格 §§3–5 與交底支持上述契約（\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"DESIGN\">工程設計／建議方法\u003c/span>）。三項採集工作是另擬的合成輸入；U-A 只能核對規格及交底存在，缺原作業逐次執行紀錄（\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"GAP\">證據待補／尚未驗證\u003c/span>）。\u003c/p>\n\u003cp data-passage=\"p-9\">\u003ca href=\"#02-A03\">工程工作方法\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T04 單 Agent 工作循環\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-A 摘要\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U04 原規格（本機）\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原交底（本機）\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">證據索引（本機）\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003chr data-passage=\"p-10\">\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　U-A、U04\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.03.03", "firstSlide": 96, "lastSlide": 99, "subtitle": "公會的採集願望如何變成一份有效計畫？"}, {"id": "02-A03-04", "chapter": "02", "title": "逐步執行的設計推演：累積輸出與失敗停點", "track": "A", "role": "lesson", "parent": "02-A03", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">公會要的是採集前的確認單。假設一位規劃助手已把願望整理成三項工作：整理已知條件、列出待確認的風險、編製行前確認單。最後的確認單若只收到這三個標題，就不知道前兩步究竟查出了什麼。專案提供者的 U04 規格要求每一步都收到\u003cstrong>此前全部成功步驟的實際內容\u003c/strong>。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-2\">同一份三步計畫的成功軌跡\u003c/h2>\n\u003cp data-passage=\"p-3\">下表依時間往下讀。「共同輸入」在每一步都包括固定世界背景、原願望與 Planner 生成的目標；再加從 1 起算的序號、本步工作文字及此前成功內容。每次模型只產生當步的分析文字。以下把各步內容完整列出，方便直接追讀第三步拿到了什麼。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"模型呼叫表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">模型呼叫\u003c/th>\n\u003cth scope=\"col\">本次讀到的工作與累積內容\u003c/th>\n\u003cth scope=\"col\">這次留下的產物\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1　Planner\u003c/td>\n\u003ctd>固定背景、原願望「想為一次採集委託做準備」\u003c/td>\n\u003ctd>目標「準備採集前的確認單」；依序列出上述三項工作，經 Python 解析驗證。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2　Executor ①\u003c/td>\n\u003ctd>共同輸入＋①整理已知條件；尚無前步結果\u003c/td>\n\u003ctd>「採集地點待確認」，存為 done。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3　Executor ②\u003c/td>\n\u003ctd>共同輸入＋②列出待確認的風險；讀入①「採集地點待確認」\u003c/td>\n\u003ctd>「出發前向公會核對路線」，存為 done。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4　Executor ③\u003c/td>\n\u003ctd>共同輸入＋③編製行前確認單；讀入①「採集地點待確認」與②「出發前向公會核對路線」\u003c/td>\n\u003ctd>「出發前請公會確認採集地點，並核對前往該地的路線。」，存為 done。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-5\">每一步的成功紀錄存工作 step、實際文字 output 及狀態 done。三步都完成時，Python 按規劃順序合成 Markdown，標題為「冒險規劃：準備採集前的確認單」，下接表中三項工作及其原輸出，註明這是事前規劃、缺少的世界細節需向公會確認。組稿沿用既有結果，整條軌跡到第四次模型呼叫就結束。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-6\">把第二次撰稿換成空白或超長文字\u003c/h2>\n\u003cp data-passage=\"p-7\">Python 的門檻是純文字、去空白後非空且至多 1,800 字元。若第二步只回空白，①照原樣保存，②記下工作 step、空輸出 output、狀態 failed 與失敗原因「去空白後為空」，立即停止。③仍列在原計畫，但未執行。最終標示「規劃未完成」，讀者仍看得到成功的前綴。把②換成 1,801 字元也到同一停點，原因改為超長；靜默截短會讓後續誤以為接到完整輸出。兩條早停路徑都已發起三次呼叫（規劃、①、②），第三步的呼叫數為零。\u003c/p>\n\u003cp data-passage=\"p-8\">沿完整軌跡和這兩條早停路徑對讀，先找最後成功產物，再找第一個失敗與尚未開始的工作。這種紀錄也適合一位工程助手回報進度。格式檢查通過只說明有文字可以續傳；內容是否解答願望、工程結果是否經驗收，各自還要有依據。\u003c/p>\n\u003cp data-passage=\"p-9\">U04 §§5–6 是個人規格的預期控制流程（\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"DESIGN\">工程設計／建議方法\u003c/span>）；表內文字及兩種早停是合成推演。T04 只用來連回工程工作回報。原作業仍缺能對上版本、逐次輸入、輸出與停點的成功及失敗 trace（\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"GAP\">證據待補／尚未驗證\u003c/span>）。\u003c/p>\n\u003csection class=\"practice\" id=\"plan-trace\">\u003c/section>\n\u003cp data-passage=\"p-11\">\u003ca href=\"#02-A03\">工程工作方法\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T04 單 Agent 工作循環\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-A 摘要\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U04 原規格（本機）\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原交底（本機）\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">證據索引（本機）\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003chr data-passage=\"p-12\">\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　T04、U-A、U04\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.03.04", "firstSlide": 100, "lastSlide": 106, "subtitle": "第二步只回空白，第三步還會執行嗎？"}, {"id": "02-A04", "chapter": "02", "title": "Context 管理：核對規格版本與核准範圍", "track": "A", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">工作階段越長，越容易把「曾經討論」記成「目前核准」。Context 是助手這一輪能使用的材料。材料即使相關，也要回答它屬於哪一版、適用哪個目錄、誰核准。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 說明專案指引的可發現位置，P04 說明可依需要載入的 Skill（重複操作的說明）。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先記目前工作目錄、版本、既有未提交修改，再讀適用的 AGENTS.md、現行規格、測試與所需 Skill。用一份短摘要保留「本次目標、有效版本、規格段落、工作狀態、下一個問題」；大份日誌留下原件定位，需要時回讀。測試若反映舊規則，先標出測試與新規格各自的版本，請有權者釐清適用範圍。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 舊對話說可略過名稱，現行表單契約要求必填。助手若只抽到較像提問的舊句子，就會替錯誤行為寫測試。讓它在回答前交出核准版本與可查回的段落；記憶裡的快捷答案僅當尋找線索。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>判斷題\u003c/strong>　摘要與檔案互相衝突，先刪哪一份？保留兩個定位，核對批准紀錄與工作版本，必要時暫停受影響的步驟。來源為 T02（tutorials/context-knowledge-tools.md）、T04、P04、P05。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　P04、P05、T02、T04\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://learn.chatgpt.com/docs/build-skills\" rel=\"noopener noreferrer\" target=\"_blank\">P04 · OpenAI · Build skills\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/tutorials/context-knowledge-tools.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.04", "firstSlide": 107, "lastSlide": 108}, {"id": "02-A05", "chapter": "02", "title": "模型與推理預算：依判斷難度與測試成本選擇", "track": "A", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">一份委託可能耗時在理解依賴，也可能大半時間都在等瀏覽器啟動。模型指產生判讀與建議的元件，推理強度指某些環境讓模型投入較多或較少推理的設定。可用設定要看當時帳戶與執行環境。換一個模型不會自動取得缺少的測試資料。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先列要判斷的不確定性與判斷錯誤的代價，再盤點可用模型、推理選項、容許等待、呼叫或資源上限與一次測試的成本。機械性的文字修正可在現有設定下跑局部檢查；跨層原因未明時，若有授權與預算，可先投入一次較深入的分析，要求交出能區分原因的實驗。把執行時間、模型等待、測試等待、重試及人工批准分欄記錄。在預算耗盡前交回最可靠的觀察與剩餘選項。\u003c/p>\n\u003ch2 data-section>從呼叫上限能推得多少成本資訊？\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> U04 原規格固定模型，規定一次規劃加每步一次執行，三至五步，最多六次呼叫，服務失敗即停。這是一份可審的成本約束。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 未取得同題、同模型版本、僅改推理強度的延遲、消耗與驗收配對資料，無從推定哪個設定較划算。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>判斷題\u003c/strong>　測試服務無法啟動，再加推理預算能驗收嗎？先確認故障屬於環境或理解；服務未恢復前可查啟動記錄，產品結果仍待測。來源為 U04 的 CODEX_SPEC.md、S01、T03（tutorials/coding-agent-tool-selection.md）。策略選擇是教學設計。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　S01、T03、U04\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.05", "firstSlide": 109, "lastSlide": 111}, {"id": "02-A06", "chapter": "02", "title": "單 Agent 的操作授權與停止規則", "track": "A", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">自主是把某些決定委託出去。例如允許助手在表單模組選擇如何顯示提示，需求者仍保有決定資料是否合法的權力。環境允許寫入的路徑，和這次任務授權的修改範圍要分別核對。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先列可讀、可改、可執行及必須批准的操作，標出會改契約、影響共享資料或難以回復的界線。局部可逆修正且有測試時可繼續；需要變更資料格式或新增權限時，保存目前差異，回報「目標、觀察、想做的動作、影響、可替代方案」，在該動作前等決定。權限未知時先求證。這些界線由當次專案設定。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 只准修改提示，助手發現資料庫已允許空值。它可用唯讀樣例呈現差異，若要修改資料庫約束須先取得決策。\u003cstrong>判斷題\u003c/strong>　即使程式能寫資料庫，下一步該做什麼？回報既有行為、建議與相容性影響，等負責人決定是否開新範圍。來源為 T04、concepts/harness.md、U-B（U07）。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　T04、U-B\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.06", "firstSlide": 112, "lastSlide": 113}, {"id": "02-A07", "chapter": "02", "title": "測試失敗的診斷、重試與停點", "track": "A", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">紅色的測試結果只告訴你某個檢查沒順利結束。診斷從「停在哪一層」開始。斷言是把實際輸出和預期比較的判定；測試程式可能根本還沒跑到斷言。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 執行器找不到套件時，先查命令、目錄與鎖定依賴版本；修復啟動條件後才測產品。斷言已執行但預期與核准規格不同時，先對齊解讀及測試。只有在輸入受控、預期有效、可穩定看到實際差異時，才沿資料流定位實作缺陷。保留失敗樣例，改一個已定位的環節，重跑該例和相鄰的既有行為，分別記錄結果。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 同一錯誤重現而沒有新線索，就寫明已排除的原因與需要的資料，或在權限停點結束。\u003cstrong>判斷題\u003c/strong>　補齊依賴後一個測項變綠，可以宣告所有表單都正常嗎？能確認的是該環境、輸入及斷言，上線路徑或其他輸入仍須各自驗證。來源為 T04、P17、concepts/quality.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　P17、T04\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.07", "firstSlide": 114, "lastSlide": 115}, {"id": "02-A08", "chapter": "02", "title": "工作階段續接：核對版本、差異與測試結果", "track": "A", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">Session 是一次互動的工作階段。下次還能讀到對話，只代表訊息可以找回；檔案、測試環境與獲准範圍都可能已經改變。續接要回答「從哪個版本、哪一個尚待完成的檢查開始」。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 描述個人偏好文件式交接。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 可在離開時記一張續接單：目標與規格版本、工作目錄、起始和當前 commit（可查回的版本快照）、尚未提交的 diff（檔案差異）與新增檔、測試命令及實際輸出、阻塞、未測範圍、下一步。若沒有提交，明寫改動仍在哪個工作目錄。恢復時逐項比對目前版本及差異，再重跑最後一項可重現檢查；版本不同先找出哪段結果失效。\u003c/p>\n\u003ch2 data-section>用今天的版本重驗昨天的結果\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 昨天已修提示、測過有效輸入，今天有人改了驗證函式。即使舊對話寫「完成」，接手者仍應核對新舊差異，重測失敗與成功兩個輸入，更新結果再請人驗收。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> U04 交底列有交回產物、測試、未驗事項的要求，U07 有交接偏好；缺少同一工作中斷前後兩份狀態與復測輸出的配對紀錄。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>判斷題\u003c/strong>　對話結束時只有測試摘要，要交給誰做什麼？由續接者先找工作區、版本、未提交差異與原命令；無法定位就標未知，不能用摘要補造證據。來源為 U-B、U07、U04 的 CODEX_HANDOFF.md、concepts/supervision.md、T04。若要把一次續接放回整件需求，可讀 \u003ca href=\"#C20\">C 線交付\u003c/a>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　T04、U-B、U04、U07\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/supervision.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.A.08", "firstSlide": 116, "lastSlide": 117, "subtitle": "讓關閉對話後的工作仍可接手"}, {"id": "C09", "chapter": "02", "title": "開發助手的工作入口：親手編輯與管理工作階段", "track": "B", "role": "core", "parent": "", "lead": "本線比較你在各種入口如何找回同一項工作。產品說明採研究包 2026 年 11 月的文件快照；操作題供你在自己的版本、帳戶與權限下練習。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cstrong>IDE\u003c/strong> 是把檔案、編輯器和執行工具放在一起的開發環境。若你一邊寫、一邊請助手解釋局部差異，眼前的檔案就是工作的中心。若你要離開一陣子再回來看成果，首要問題變成「剛才交給哪個工作階段？它改到哪裡？」專門管理多個工作階段（session）的視窗強調定位各自的任務。以 Agent 為中心的開發工作台（ADE）則可按專案和工作區呈現活動。視窗長相相似，檔案位置及可操作範圍仍可能不同。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先固定起始版本，稱為 B0，也就是尚未進行本次修改的同一份程式快照。各入口都拿同一項工作、同一測試資料、同一可讀寫範圍和同一組驗收條件。試著在每個入口回答「哪個目錄、哪些修改、哪裡看測試結果、由誰採納」。若其中之一根本看不到終端機，把缺少的觀測記下，改由獲准的人查，避免拿介面印象補成測試紀錄。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>判斷題\u003c/strong>　你要親寫程式，或要同時管理多件工作，各看哪些能力？前者試著從錯誤跳到原始檔、修改並讀變更；後者試著離開再回到同一 session，找回版本、等待中的問題及差異。下一節教你如何在任何入口核對位置，也可直接跳到 \u003ca href=\"#C15\">各入口比較表\u003c/a>。來源為 T03、P06、P08、P24、P25、S01。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P06、P08、P24、P25、S01\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://code.visualstudio.com/docs/agents/run/agents-window\" rel=\"noopener noreferrer\" target=\"_blank\">P06 · VS Code · Agents Window\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://antigravity.google/docs/overview\" rel=\"noopener noreferrer\" target=\"_blank\">P08 · Google Antigravity · Overview\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/introducing-the-codex-app/\" rel=\"noopener noreferrer\" target=\"_blank\">P24 · OpenAI · Introducing the Codex app\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://help.openai.com/en/articles/20001276-moving-to-the-new-chatgpt-desktop-app\" rel=\"noopener noreferrer\" target=\"_blank\">P25 · OpenAI · ChatGPT desktop app\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/tool-management.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p06-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p08-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p24-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p25-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.B.01", "firstSlide": 118, "lastSlide": 119, "subtitle": "先決定人要操作什麼，再挑入口"}, {"id": "C18", "chapter": "02", "title": "用終端機與 Git 確認測試跑在哪份程式上", "track": "B", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">測試會讀取實際執行目錄裡的檔案。編輯器顯示的檔名，可能也存在隔壁的另一份檢出裡。\u003cstrong>Shell\u003c/strong> 是接受命令的程式，\u003cstrong>cwd\u003c/strong> 是該次命令的工作目錄，Git 分支是可移動的版本參照，HEAD 表示當前檢出的版本。先釘住這些位置，測試輸出才有對象。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在將要跑測試的同一個終端機依序查看以下結果。這些命令是供練習的入口，本節沒有在案例程式上執行。\u003c/p>\n\u003cpre tabindex=\"0\" data-passage=\"p-3\">\u003ccode class=\"language-powershell\">Get-Location\ngit status -sb\ngit rev-parse HEAD\ngit diff\ngit diff --cached\n\u003c/code>\u003c/pre>\n\u003ch2 data-section>把版本與未提交的改動一起記下\u003c/h2>\n\u003cp data-passage=\"p-4\">第一行在其他 shell 也可用 \u003ccode>pwd\u003c/code>。用檔案樹找到規格、測試入口與 fixture（能重複使用的固定測試資料），核對它們來自所記基準。第二、三行分別查分支及工作狀態、提交識別碼；末兩行分別查看尚未暫存、已暫存的追蹤檔差異。新增的未追蹤檔要從 status 另查。若一開始已有別人的修改，記下路徑與狀態，避免把它當作本次產物。檢查依賴及安裝版本符合專案指引，再執行該專案的測試命令，記輸出和 exit code（程式結束狀態碼）。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>判斷題\u003c/strong>　如何證明測試跑在要交付的基準上？並列當時的目錄、分支、HEAD、未提交差異、fixture 識別和命令輸出，交付時再比一次。兩個目錄即使 HEAD 相同，未提交檔案也可能不同；沒有這部分資料時只能證明跑過某次命令。來源為 T03、T04、P05、P17。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P05、P17\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/single-agent.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.B.02", "firstSlide": 120, "lastSlide": 122, "subtitle": "檔案樹、終端機和版本各回答一個問題"}, {"id": "C19", "chapter": "02", "title": "瀏覽器驗證：對照同一次操作的請求、回應與畫面", "track": "B", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">瀏覽器裡的使用者介面稱為 UI，程式向服務索取資料的約定稱為 API。看見所需項目，只回答了「當時畫面上有它」；要判斷篩選，還得知道有沒有另一個理應被排除的項目。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 固定資料包含 A（標籤 work）、B（標籤 home）。用 Browser 執行操作，在 Network 找同一次操作的請求與回應，再回到 UI 核對顯示。Console 是執行時的訊息及錯誤線索，截圖是當下的外觀。以下是預期，可在不同環境沿用作驗收尺。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"操作表格\" data-passage=\"p-3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">操作\u003c/th>\n\u003cth scope=\"col\">Network 應看到的資料\u003c/th>\n\u003cth scope=\"col\">UI 應看到的結果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>選 work\u003c/td>\n\u003ctd>查詢帶 tag=work，回應只有 A\u003c/td>\n\u003ctd>顯示 A，B 消失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除\u003c/td>\n\u003ctd>省略 tag，回應 A、B\u003c/td>\n\u003ctd>A、B 都恢復\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查未收錄的 missing\u003c/td>\n\u003ctd>tag=missing，HTTP 200，空清單\u003c/td>\n\u003ctd>有效的空結果畫面\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>從第一處差異決定往哪一層查\u003c/h2>\n\u003cp data-passage=\"p-4\">回傳 HTTP 200 只表示請求獲得成功回應。若選 work 的回應仍含 B，查請求參數及服務比對規則；若只回 A 而畫面還有 B，查 UI 狀態更新與 Console。Console 沒有錯誤訊息也可能有邏輯錯誤。缺 Network 權限時，可由獲准的人用瀏覽器開發工具或同次服務記錄補查；只有終端機則先驗 API，畫面另列未測。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P07 支持畫面與 Console 的觀測界線，Network 的操作路徑見 T03／T04。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>判斷題\u003c/strong>　只有一張 A 的截圖，能判斷 B 曾被正確排除嗎？若資料原來就只有 A，畫面也會完全相同。先驗固定資料與清除的兩筆，再對上篩選請求、回應與畫面。來源為 P07、U-C、examples/scenario.md、T03、T04。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P07、U-C\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://code.visualstudio.com/docs/agents/run/browser-tools\" rel=\"noopener noreferrer\" target=\"_blank\">P07 · Microsoft VS Code｜Use browser tools with agents\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/single-agent.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p07-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.B.03", "firstSlide": 123, "lastSlide": 126}, {"id": "C10", "chapter": "02", "title": "VS Code 主視窗：用 Codex 協作並逐段審查修改", "track": "B", "role": "core", "parent": "", "lead": "你正在親手修改程式，也請助手跑一項測試。審閱時，要能從目前的檔案找到這次修改的差異和測試輸出，才知道該保留哪一段。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P06 區分主視窗的 OpenAI Codex 擴充功能和 Agents Window 的實驗性 Codex 整合。當人想親自閱讀或改一段程式，主視窗可讓人對照原始檔、終端機和版本控制的變更檢視。助手實際可取得的證據取決於本次工具及授權。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> U02 的整理把規劃和工程執行分開，可用來理解為什麼從討論切入能跑測試的環境。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在檔案樹選 B0 的專案資料夾，讀規格並定位對應檔。在主視窗終端機核對 cwd、HEAD、分支；讓 Codex 透過可用工具跑指定測試，保留命令和輸出。打開變更檢視逐段讀 diff，確認與委託範圍一致。人工也在編輯時，先檢查已有差異，避免同一處互相覆寫。適合親手編輯的時機是要根據差異立即決定要保留哪一段，或要和助手共同定位錯誤。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>判斷題\u003c/strong>　若 Codex 沒開瀏覽器權限，下一個驗證方法是什麼？先用獲准的終端機驗資料，再由有權的人在同版瀏覽器實際操作並留結果；做不到就標 UI 未測。助手說已完成，無法補齊畫面證據。來源為 P06、U-A、T03。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P06、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://code.visualstudio.com/docs/agents/run/agents-window\" rel=\"noopener noreferrer\" target=\"_blank\">P06 · VS Code · Agents Window\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/single-agent.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/tool-management.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p06-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.B.04", "firstSlide": 127, "lastSlide": 129}, {"id": "C11", "chapter": "02", "title": "VS Code Agents Window：沿工作階段查變更", "track": "B", "role": "core", "parent": "", "lead": "同時開了兩項修復時，先選要審的那一項。你應能從該次工作找到改動所在的目錄，再打開同一份程式產生的畫面。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 在一個視窗管理數個 session 時，先選該次工作，再看 Files（檔案）、Changes（變更）與 Browser（瀏覽器）。切換 session 後，要重新確認工作區路徑及分支，否則另一項工作的正確畫面也可能被誤用。Git 工作區可依條件選 Branch 或 New Worktree。Worktree 是同一個儲存庫的另一份檢出，有自己的工作檔；Dev Container 的 session 直接編輯容器工作區，沒有該 New Worktree 選項。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 先開 Files 找規格，在 Changes 指認該 session 的 diff，核對其 branch 和目前 commit，再用 Browser 核對該工作區啟動的頁面。若兩個 session 共用目錄，兩者可能看見同一份未提交修改；同一 repo 也能有多份 worktree，各自檢出不同分支。Session、分支和目錄名稱無法彼此推算。追到路徑後還要查誰負責、誰可採納。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>判斷題\u003c/strong>　新建 Worktree 就有權合併 main 嗎？工具顯示檔案、變更與執行位置。協調者（Coordinator，負責確認分工與追蹤的人或 Agent）還要確認有效委託、目標分支與採納者，具權者才可決定合併。來源為 P06、S01、S02、concepts/worktree.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P06、S01、S02\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://code.visualstudio.com/docs/agents/run/agents-window\" rel=\"noopener noreferrer\" target=\"_blank\">P06 · VS Code · Agents Window\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/tool-management.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/worktree.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p06-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.B.05", "firstSlide": 130, "lastSlide": 132}, {"id": "C12", "chapter": "02", "title": "Antigravity：在 Editor View 協作，在 Manager Surface 審閱產物", "track": "B", "role": "core", "parent": "", "lead": "一句提示文字還要你拍板時，可以和助手一起看原始檔；已約定驗收條件時，可以等它交回產物，再檢查版本及結果。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Google 發表文件使用 Editor View 與 Manager Surface 兩個名稱。前者適合邊看程式邊和助手工作；後者可跨工作區派任、稍後回來查看 Artifacts，也就是工作產生、可供審閱的材料。查閱時的文件另區分 App 與 IDE。教學沿用發表名稱，使用者需記下自己開的是哪個入口。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 一處修改可能改變使用者看見的措辭時，在 Editor 打開原始檔、看建議差異，現場決定後再繼續。若目標已確定，人可以離開，便在 Manager 指定工作區與交付條件，回來選該工作、對照產物與原任務，再追到實際版本及測試。缺版本定位的產物適合發問，仍不足以決定採納。\u003cstrong>判斷題\u003c/strong>　何時要同步介入？當下一步取決於人的規格選擇時就設停點；具體且可驗的工作可等產物回來再審。\u003c/p>\n\u003ch2 data-section>分開記錄文件、帳戶與個人觀察\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P10 的模型資料含非 Gemini 選項，適用方案與帳戶會影響清單。\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 描述使用當時覺得檔案狀態較難掌握，也對模型體驗有自己的判斷。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 尚無同版本、同模型及相同權限的品質或管理成本試驗。實作比較時分三欄寫下文件可用項目、自己的可見項目與未測項。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>判斷題\u003c/strong>　某帳戶當下只看到 Gemini，可以寫成整個產品只支援 Gemini 嗎？保留帳戶方案、日期及入口為觀察條件，產品範圍另依 P10。來源為 P08、P10、S01（U07）、T03。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P08、P10、S01\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://antigravity.google/docs/overview\" rel=\"noopener noreferrer\" target=\"_blank\">P08 · Google Antigravity · Overview\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://antigravity.google/docs/models\" rel=\"noopener noreferrer\" target=\"_blank\">P10 · Models｜Google Antigravity\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/tool-management.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p08-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p10-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.B.06", "firstSlide": 133, "lastSlide": 135}, {"id": "C13", "chapter": "02", "title": "ChatGPT 與 Codex 桌面入口：從討論串找回工作區", "track": "B", "role": "core", "parent": "", "lead": "助手從桌面回報修正完成。要接手這份程式，你得找回它工作的目錄，看清楚相對起始版本改了哪些地方。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P25 的新版桌面說明在 ChatGPT 下區分 Chat 與 Work，另有獨立 Codex 視圖及歷史。Chat 可用來討論需求，Work 是工作入口；要知道某次工程修改寫到哪裡，要繼續追到執行工作區。P24 的 Codex app 發表文件介紹依 project（專案）整理 thread（工作討論串）、檢閱及評論 diff，並可用 worktree 隔離改動。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 從專案中找到受託的 thread，打開其工作區，核對目錄、基準 commit 與這次的 diff，最後檢查測試是否對應同一工作區。若只在 Chat 或 Work 看見「完成」文字，請回報者補實際位置、版本及差異；可能有人貼上另一個工作區的摘要。平台、版本與方案要記在觀察旁，舊版入口不宜套用新版名稱。\u003c/p>\n\u003cfigure>\u003cfigcaption>從桌面的完成訊息追到可重查的變更\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>找出受託的 project 與 thread。\u003c/li>\u003cli>進入該次工作的目錄，核對起始提交。\u003c/li>\u003cli>打開相對該基準的 diff，辨認改了哪些檔案。\u003c/li>\u003cli>用同一工作區的測試紀錄核對結果。\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp data-passage=\"p-3\">\u003cstrong>判斷題\u003c/strong>　能從聊天介面確認本機 worktree 嗎？為何還要驗收基線？聊天內容缺少檔案定位，孤立的 diff 也缺少它相對的起點。只有把交付與核准基準對上，才能知道該修改能否在預定版本接受檢查。來源為 P24、P25、S01、T03。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P24、P25、S01\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://openai.com/index/introducing-the-codex-app/\" rel=\"noopener noreferrer\" target=\"_blank\">P24 · OpenAI · Introducing the Codex app\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://help.openai.com/en/articles/20001276-moving-to-the-new-chatgpt-desktop-app\" rel=\"noopener noreferrer\" target=\"_blank\">P25 · OpenAI · ChatGPT desktop app\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/tool-management.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p24-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p25-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.B.07", "firstSlide": 136, "lastSlide": 138, "subtitle": "桌面回報「完成」，改動在哪份程式？"}, {"id": "C14", "chapter": "02", "title": "Orca：從工作區與派工紀錄追查交付版本", "track": "B", "role": "core", "parent": "", "lead": "你負責審一項修正，先從專案找到助手工作的目錄，再把那次交回的改動和測試配在一起，才知道能否送驗。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P12 說明可指定起始 ref（分支或提交等版本參照）建立 worktree，再由專案側欄辨認工作區及活動。先展開專案、選工作區、找該處 Agent 的活動或終端機，再追實際 diff 與測試。子工作區在側欄的位置有助查找；Git 的提交親緣要看歷史本身。\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 偏好這種把專案、工作區與 Agent 對上的方式，曾在其他入口人工管理分工。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 此項偏好缺少足以推廣到其他使用者的對照樣本。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cstrong>判斷題\u003c/strong>　側欄顯示 Agent 已結束，可以驗收嗎？工作區告訴你去哪找產物。還要看提交、測項、未測範圍與接受決定，才能說哪項需求已成立。\u003c/p>\n\u003ch2 data-section>將工作區的產物對回有效的派工\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13 的 Orchestration 標為 Experimental。Worktree 隔開工作檔；監督另有 Run（這批工作的收件與識別範圍）、Task（要辦之事及依賴、狀態）與 Dispatch（一次派工嘗試）。即使在同一工作區重試，兩次嘗試也須分得開。查看回報時，先找 Task 和有效 Dispatch，再把結果與該工作區的改動比對。這讓監督者能辨認過期回報；何時派出與採納仍需明確責任人。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>判斷題\u003c/strong>　建立 Run 是否會自動建立所有 Worker？Run 只提供集合與收件位置，建立 Task、啟動執行者及處理回報還需相應操作。來源為 P12、P13、S01、U-A、concepts/coordination.md。第三章再討論怎樣安排各項責任。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件、個人直接觀點的轉述。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P12、P13、S01、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/model/worktrees\" rel=\"noopener noreferrer\" target=\"_blank\">P12 · Orca · Worktrees\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/tool-management.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p12-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.B.08", "firstSlide": 139, "lastSlide": 141, "subtitle": "Orca：工作區看得見，誰負責判定結果？"}, {"id": "C15", "chapter": "02", "title": "開發工具比較：操作能力、測試條件與人工時間", "track": "B", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">若甲在編輯器裡立刻看到問題、乙在工作台等了很久，先問兩人做的是不是相同工作。模型推理、測試等待、登入授權及人工檢查都可能改變總耗時。比較之前先用下表挑出你需要查的那一種能力。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"入口表格\" data-passage=\"p-2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">入口\u003c/th>\n\u003cth scope=\"col\">人怎麼接觸工作\u003c/th>\n\u003cth scope=\"col\">追查結果時要補的條件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>VS Code 主視窗與 Codex 擴充\u003c/td>\n\u003ctd>看原始檔、終端機、差異並直接編輯\u003c/td>\n\u003ctd>權限與擴充能否執行指定測試\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VS Code Agents Window\u003c/td>\n\u003ctd>依 session 找 Files、Changes、Browser\u003c/td>\n\u003ctd>分支或新 worktree 的實際位置；容器例外\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Antigravity Editor View\u003c/td>\n\u003ctd>人與助手同步檢視修改\u003c/td>\n\u003ctd>記入口版本、帳戶可見模型與授權\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Antigravity Manager Surface\u003c/td>\n\u003ctd>依工作審閱產物\u003c/td>\n\u003ctd>產物所屬的工作區與版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ChatGPT 桌面 Chat／Work\u003c/td>\n\u003ctd>Chat 討論、Work 承接工作\u003c/td>\n\u003ctd>查看執行環境、核對版本及產物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Codex 桌面視圖\u003c/td>\n\u003ctd>依 project、thread 檢視 diff\u003c/td>\n\u003ctd>變更對應的檢出與驗收基準\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Orca 工作區／Orchestration\u003c/td>\n\u003ctd>依專案追 worktree 與活動，實驗性派工另追 Task 與 Dispatch\u003c/td>\n\u003ctd>需檢查目標版本、測項與採納者\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>填下兩個入口共用的測試條件\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 用下列空表記錄每次比較，先填固定條件，另標可變或未控制。相同 B0 指同一提交及相同未提交狀態；固定 fixture、需求、權限邊界和品質門檻後，讓各入口各走一次找檔、測試、讀差異與續接。平台不同或無法取得同一模型時，保留差異並縮小結論。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"條件表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">條件\u003c/th>\n\u003cth scope=\"col\">入口甲\u003c/th>\n\u003cth scope=\"col\">入口乙\u003c/th>\n\u003cth scope=\"col\">固定／可變／未控制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>B0、fixture、任務、驗收\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>平台、軟體版本、帳戶方案\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型與推理設定、工具及權限\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-5\">\u003cstrong>判斷題\u003c/strong>　同時更換模型與介面，能按耗時建立工具效能排名嗎？兩者的影響無法拆開；缺固定任務、驗收、模型或權限時，結論只能描述該次配置與使用心得。來源為 T03、P06、P08、P12、P24、P25、S01。\u003c/p>\n\u003cfigure>\u003cfigcaption>讀完比較紀錄，你能回答哪個問題？\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">紀錄提供什麼\u003c/th>\u003cth scope=\"col\">可據以回答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">入口、版本與該次可見操作\u003c/th>\u003ctd>這個人當時從哪裡找到檔案與變更？\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">任務相同，模型和介面都換了\u003c/th>\u003ctd>兩次配置分別花了多久？單獨更換介面的效果仍待測。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">操作起訖、重疊動作與等待\u003c/th>\u003ctd>人實際介入多久？切換工作區且同時讀 diff 的區間只計一次。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003ch2 data-section>從操作紀錄算出人工時間\u003c/h2>\n\u003cp data-passage=\"p-6\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 人工管理成本指人為了讓工作繼續或確認結果而實際操作的時間。保留開始、結束與動作，同一段可有多種動作標記，計時只算一次。下面的記錄表尚無執行樣本。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"開始表格\" data-passage=\"p-7\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">開始\u003c/th>\n\u003cth scope=\"col\">結束\u003c/th>\n\u003cth scope=\"col\">事件（切工作區／讀 diff／處理權限／恢復）\u003c/th>\n\u003cth scope=\"col\">有效人工時間\u003c/th>\n\u003cth scope=\"col\">純等待\u003c/th>\n\u003cth scope=\"col\">缺少的觀察\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-8\">\u003cstrong>判斷題\u003c/strong>　切換工作區時一併讀 diff，接著離開等測試，應怎樣填？切換與讀 diff 的重疊區間只計一份人工時間，離開後另記等待。缺起訖填「未記錄」；只有觀察完整且確認全程無介入時才能記零。人工管理只佔工程成本的一部分；完整效率評估見第五章。來源為 S01、concepts/cost.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P06、P08、P12、P24、P25、S01\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://code.visualstudio.com/docs/agents/run/agents-window\" rel=\"noopener noreferrer\" target=\"_blank\">P06 · VS Code · Agents Window\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://antigravity.google/docs/overview\" rel=\"noopener noreferrer\" target=\"_blank\">P08 · Google Antigravity · Overview\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://orca.dev/docs/model/worktrees\" rel=\"noopener noreferrer\" target=\"_blank\">P12 · Orca · Worktrees\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/introducing-the-codex-app/\" rel=\"noopener noreferrer\" target=\"_blank\">P24 · OpenAI · Introducing the Codex app\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://help.openai.com/en/articles/20001276-moving-to-the-new-chatgpt-desktop-app\" rel=\"noopener noreferrer\" target=\"_blank\">P25 · OpenAI · ChatGPT desktop app\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/tool-management.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p06-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p08-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p12-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p24-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p25-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/coding-agent-tool-selection.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.B.09", "firstSlide": 142, "lastSlide": 147}, {"id": "C16", "chapter": "02", "title": "單 Agent 專案準備：環境、版本與測試基線", "track": "C", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">若你只交給助手一個正在顯示清單的網頁，它不知道該改哪份檔案，也不知道哪些行為是專案刻意保留的。先建立基準。這裡稱為 B0 的，是待辦程式在這次需求開始時的版本。程式已有列表、讀取全部待辦的服務入口及既有列表測試。先查工作目錄（cwd）、分支、提交識別碼與既有差異，記下固定資料的版本、依賴鎖定檔與專案要求的執行環境。確認修改只及讀取和顯示流程及測試，使用者既有改動另外記下。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 讓支援的工具能從 AGENTS.md 找到目錄限制、建置與測試命令；P04 的 Skill 可以保存重複使用的操作，例如啟動頁面、選標籤、核對資料、清除、保存觀察。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 固定規範放在可發現的位置，執行技巧另載入，需要阻止的錯誤再轉成能產生失敗訊號的檢查。P17 描述過團隊用自動檢查守住依賴方向。\u003c/p>\n\u003ch2 data-section>用一個違規依賴驗證檢查器\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設規範要求「畫面模組只能經資料服務讀取待辦」。文件能讓人讀到規則；若沒有檢查程式，直接匯入儲存模組仍可能成功建置。可設計一項掃描匯入關係的測試，用一個違規依賴確認它會指出 違規匯入的路徑，再用合法範例確認它會通過。這樣助手便有可觀察的修正依據。對需要人判斷的文字品質，保留驗收樣例及審閱人較合適。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>判斷題\u003c/strong>　找不到既有測試入口，可以直接改碼嗎？先查模組說明、測試檔及套件指令，請負責人確認可重現的基準檢查，或議定最小替代測試並記錄缺口，再動手。哪種約束最好轉成可執行測試？能明確描述有效與違規輸入、失敗能定位的依賴規則就是一例。來源為 P04、P05、P17、U-A、T02、T04、concepts/harness.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、公開技術文件。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P04、P05、P17、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://learn.chatgpt.com/docs/build-skills\" rel=\"noopener noreferrer\" target=\"_blank\">P04 · OpenAI · Build skills\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/single-agent.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p04-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/context-knowledge-tools.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.C.01", "firstSlide": 148, "lastSlide": 151}, {"id": "C17", "chapter": "02", "title": "從篩選需求到驗收：用 API 與畫面檢查定位改動", "track": "C", "role": "core", "parent": "", "lead": "需求者和助手要核對同一件事：使用者選「工作」時只看見工作待辦，清除選擇時完整清單恢復。先約好預期，再判斷該改資料還是畫面。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">尚未決定「依標籤」的意思以前，任何實作都可能看起來合理。為了讓兩個人能算出同樣的答案，先給兩筆固定資料，稱為 fixture。A 是帶 work 標籤的待辦，B 帶 home。API 是畫面向服務讀取資料的介面；下列 GET 表示取資料，問號後的 tag 是篩選條件。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 需求者核准本次只支援單一標籤精確比對。按下面三列先算回應再說明畫面；明訂清除時省略參數。這些是驗收預期。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"人的操作表格\" data-passage=\"p-3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">人的操作\u003c/th>\n\u003cth scope=\"col\">同一次 API 請求\u003c/th>\n\u003cth scope=\"col\">預期回應與畫面\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>選 work\u003c/td>\n\u003ctd>\u003ccode>GET /todos?tag=work\u003c/code>\u003c/td>\n\u003ctd>只回 A，只見 A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除選擇\u003c/td>\n\u003ctd>\u003ccode>GET /todos\u003c/code>\u003c/td>\n\u003ctd>回 A、B，兩筆都恢復\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查不存在的標籤\u003c/td>\n\u003ctd>\u003ccode>GET /todos?tag=missing\u003c/code>\u003c/td>\n\u003ctd>HTTP 200、空陣列，畫面顯示空結果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-4\">排除多選、新增標籤與寫入資料。大小寫、多個值與空字串尚未定義，清除時不可自行把省略參數換成 \u003ccode>tag=\u003c/code>。未知標籤回空是預期還是猜測？本案例有經核准的第三列可回查；若自己的需求單未定義，應先列待決。案例規則來自 examples/scenario.md，P05、P17 只支持工程指引與回饋機制。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> U02 歷史整理描述先用對話釐清目的，再到工程環境執行的做法。\u003c/p>\n\u003ch2 data-section>從已核准的預期建立回歸檢查\u003c/h2>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 需求者授權助手自行選擇檔案內的實作方式、重跑相關測試；若要改 API 語義或資料結構須先停。因這項需求跨畫面和服務，先規劃三個檢查點：現行資料與入口、第一個不符契約的位置、修復後三列的結果。選擇能讀寫指定檔案、跑測試、讀 Git 差異的環境；若環境只能跑命令，事前安排有權的人補 UI 操作。\u003c/p>\n\u003cp data-passage=\"p-6\">在 B0，先跑原列表檢查確認 A、B 都在，再建立「work 必須只回 A」的斷言。假設新的檢查收到 A、B，記下命令及實際輸入。確認請求已帶 work，服務仍回全部時，才把修改定位在服務讀取及比對條件；若請求根本沒帶 tag，就先查前端如何組請求。修正後以完全相同的資料重跑三個 API 樣例、原列表檢查，以及選取和清除的畫面操作。把結果附在當次 diff 旁交需求者驗收。若初次檢查已符合預期，就先保存通過證據並檢查其餘兩列，毋須憑猜想修程式。\u003c/p>\n\u003cp data-passage=\"p-7\">\u003cstrong>判斷題\u003c/strong>　截圖正確能代替 API 測試嗎？畫面可以在本地把 B 隱藏，即使服務錯誤地回兩筆也能顯示 A。對照同次請求與回應才測到 API，操作清除才測到恢復路徑。來源為 T04、P05、P17、U-A、examples/scenario.md。下一節把其中一個失敗分支走到交付。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P05、P17、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/single-agent.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.C.02", "firstSlide": 152, "lastSlide": 157}, {"id": "C20", "chapter": "02", "title": "單 Agent 修復流程：定位、修改、複驗與回報", "track": "C", "role": "core", "parent": "", "lead": "使用者選「工作」時應只看見工作待辦，清除後應恢復整份清單。接手修復的人要查明，第一個偏離預期的是送出的條件、服務回應，還是畫面。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">接手者看到「篩選失敗」時，需要知道失敗發生在工具啟動、規格解讀、服務回應，還是畫面更新。先把核准行為寫在失敗觀察旁。以下假設服務在固定資料 A(work)、B(home) 下已符合三種請求，專案委託還要求清除選擇時恢復全部待辦。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> \u003cstrong>修前\u003c/strong>先選 work 看 A，再按清除，發現新的請求仍帶 work。服務對這個舊條件正確地回 A，畫面因而沒有 B。直接呼叫不帶 tag 的服務則能回兩筆。這兩次觀察把調查縮到清除操作與請求組裝之間。\u003cstrong>修正\u003c/strong>時讓清除的處理器先移除所選條件，以目前狀態建立省略 tag 的請求；保留既有 API 契約、寫入介面和資料格式。若測試根本沒啟動，先查執行環境，無從對上述故障定位。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>修後\u003c/strong>用同一 fixture 把「選 work 再清除，請求省略 tag 且兩筆恢復」加入回歸測試，重測原列表、work、missing 及窄畫面。修前與修後要保留命令、版本和實際輸出。若這時發現產品其實要求多標籤，該用交集還是聯集會改變可見結果，先保留 diff 與兩種預期，停在改 API 語義之前交需求者決定。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 此修復限於假設觀察成立，另一個故障位置需要新的定位證據。\u003c/p>\n\u003ch2 data-section>交接前，哪些結果與決定還欠著？\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cstrong>判斷題\u003c/strong>　若下一步需讓空字串代表全部，該停在哪裡？既有契約只核准省略 tag，先提出相容性影響與選項，不把新語義寫進修正或測試。來源為 T04、P17、U-B、U-C。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>一份尚未填結果的交付卡\u003c/strong>　即使同一人從頭做到尾，也要讓驗收者可重查產物。「Worker」在這張卡只表示承辦這項工作的人或助手。以下為 \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span>，案例中的假設分支沒有在本輪執行。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"欄位表格\" data-passage=\"p-6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">欄位\u003c/th>\n\u003cth scope=\"col\">交付時應填什麼\u003c/th>\n\u003cth scope=\"col\">這張教學卡的狀態\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>工作與版本\u003c/td>\n\u003ctd>任務、B0 實際提交、工作區／分支、交付 commit\u003c/td>\n\u003ctd>版本未填\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>差異\u003c/td>\n\u003ctd>diff 或其路徑，改動檔案與理由、既有未提交檔\u003c/td>\n\u003ctd>未產生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>執行\u003c/td>\n\u003ctd>作業系統、依賴、cwd、測試命令\u003c/td>\n\u003ctd>未執行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>測項結果\u003c/td>\n\u003ctd>三組 API、選取／清除 UI、既有回歸各自的 exit code 或實際觀察及輸出位置\u003c/td>\n\u003ctd>未執行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>問題與限制\u003c/td>\n\u003ctd>失敗／未測路徑、重現方式、接手人與下一步\u003c/td>\n\u003ctd>待實作環境補查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>驗收\u003c/td>\n\u003ctd>需求者對指定版本的接受、退回或保留事項\u003c/td>\n\u003ctd>待驗收\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-7\">\u003cstrong>判斷題\u003c/strong>　為何一句「已完成」不夠？它沒有讓人找到哪份程式、哪個環境或哪條預期已被驗證。能核准的是特定版本在指定範圍內的行為；接受後才把新基準記為 B1。來源為 examples/handoff-and-evidence.md、T04、P17、U-C。日後換 session 可接 \u003ca href=\"#02-A08\">A 線續接\u003c/a>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P17、U-B、U-C\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/single-agent.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.C.03", "firstSlide": 158, "lastSlide": 162}, {"id": "C21", "chapter": "02", "title": "Dungeon Lab 實測紀錄判讀：畫布縮放與滑牆碰撞", "track": "C", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">假設要審一項遊戲修正，先找測試者描述的環境、原始症狀、修改的位置與重跑方式，再看通過數。\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 以下限於使用者個人工程資料包中的 Dungeon Lab Round 01／02 README。兩輪日期均為 2026-11-15，本教材核對文件，本輪未重跑其遊戲或產生截圖。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cstrong>第一輪：同一張地圖換到窄視窗會怎樣？\u003c/strong> 起始提交 \u003ccode>76d8a5f\u003c/code>，分支 \u003ccode>experiment/map\u003c/code>，下一輪文件將本輪成果定位為 \u003ccode>6ad3029\u003c/code>。紀錄的環境是 Windows、Node.js 24.21.0、npm 11.7.0、TypeScript 7.0.2、Phaser 4.2.1、Vite 8.3.8，以及 Orca 內嵌 Chromium。原先 CSS Grid 的預設最小欄寬受畫布固有寬度影響；縮小視窗時，容器仍被撐寬，產生水平溢出。改用 \u003ccode>minmax(0, 1fr)\u003c/code> 讓欄可以收窄，再把子項的 \u003ccode>min-width\u003c/code> 設成 \u003ccode>0\u003c/code>，畫布才有空間隨容器縮放。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 第一輪的單元測試通過 8/8。另在 1440×1000、1024×768、390×844、320×640、844×390 五種視窗重驗容器邊界與畫布比例。320×640 時房間能縮小且無水平捲動；844×390 因最低頁高仍有少量垂直捲動。若要複查同類修正，應縮放實際 viewport（網頁可用顯示區），比較容器和畫布邊界，再記下水平與垂直方向的結果。\u003cstrong>判斷題\u003c/strong>　這能證明 Firefox 或手機實機也通過嗎？原紀錄使用內嵌 Chromium 的五種 viewport，Firefox、Safari、實體行動裝置及遠端部署均未驗。來源為 U-C／U05，raw_originals/README.txt。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>第二輪：牆能擋住玩家，為什麼仍可能做錯？\u003c/strong> 從 \u003ccode>6ad3029\u003c/code> 開始，在 \u003ccode>experiment/movement\u003c/code> 驗角色移動。若只測正面向牆推進，能停下就會過關；沿牆持續斜向移動還需要保持切線方向的速度。每格各設一個碰撞體，格子的接縫也可能擋住本來應該滑動的角色。原首次滑牆測試預期到 Y 約 2.745，實際停在 52。改成合併相鄰阻擋格的矩形後，另加斷言核對這些矩形仍恰好覆蓋原本 68 個阻擋格且沒有占用地板，避免「滑得過去」只是因為牆被削掉。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 第二輪報告 12/12 單元測試（含第一輪的八項）與 58 項內嵌 Chromium 瀏覽器定時整合檢查通過。前者核對資料與規則，後者透過實際鍵盤處理及物理更新檢查移動；文件另記一般畫面更新下的即時操作。鍵盤事件由程式派發，未用實體鍵盤人工遊玩，也未測 Firefox、Safari、實機手機或長時間壓力。讀紀錄時可逐項對照「格子覆蓋正確」和「連續移動不卡」各由哪個檢查支持。\u003c/p>\n\u003cfigure>\u003cfigcaption>第二輪的兩個檢查各排除一種假修復（U06 歷史報告）\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">即使這項通過\u003c/th>\u003cth scope=\"col\">還可能有什麼錯\u003c/th>\u003cth scope=\"col\">另外核對\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">角色沿牆能滑動\u003c/th>\u003ctd>修正可能移除了部分牆體。\u003c/td>\u003ctd>合併矩形恰好覆蓋原有 68 個阻擋格，未占用地板。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">阻擋格覆蓋正確\u003c/th>\u003ctd>角色仍可能在碰撞體接縫卡住。\u003c/td>\u003ctd>在內嵌 Chromium 重做連續斜向移動，觀察切線方向位移。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003ch2 data-section>比較兩輪之前，先核對研究問題\u003c/h2>\n\u003cp data-passage=\"p-6\">\u003cstrong>判斷題\u003c/strong>　第二輪比第一輪有更多測項，可以當成多 Agent 效率實驗嗎？兩輪驗不同功能，沒有同需求同品質門檻的單／多 Agent 對照，也缺兩種流程的時間與人工投入資料。這些紀錄支持特定版本的故障、修復與複驗。來源為 U-C／U06，raw_originals/README(1).txt；比較效益的方法見第五章。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋原版本有測試觀察。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　U-C\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/single-agent-coding-cycle.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "2.C.04", "firstSlide": 163, "lastSlide": 169, "subtitle": "每個測試數字能支持哪一句話？"}, {"id": "C22", "chapter": "03", "title": "多 Agent 分工的條件與交接成本", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 想像你只有一位能讀寫程式、執行測試的開發助手。新增一位助手之前，請試著各寫一張交付單，寫出它收到的輸入、能獨力產出的結果，以及別人用什麼例子驗收。寫第二張時若只能寫「等第一位決定」，目前仍只有一條可執行的路。所謂可分離，是雙方能依同一份約定各自完成並檢查一件工作。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 待辦網站由伺服器提供資料，畫面再將資料顯示給人看。假設資料介面（API）回傳的標籤欄位可能從字串清單改成物件清單，使用者介面（UI）的開發者就連測試資料該怎麼寫也得等。此時多開一位執行者（Worker），依然要等欄位決策，還多一次交接和整合。改由一人先釐清共同欄位，能把決定連同樣例留給下游。\u003c/p>\n\u003ch2 data-section>什麼條件讓兩人可以同時開工\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 再看約定已定的情況。API 可以拿固定資料檢查回傳內容，UI 可以先用約定的回應檢查畫面。分別寫下可同時進行的工作，再在旁邊記下交接契約、合併修改、審查差異及失敗後重試的代價。只有當可分開驗收帶來的預期收益值得負擔這些工作，增派人才有理由。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Anthropic 的 P01 討論可預拆的平行工作與額外步驟成本，Team Topologies 的 P15 討論人類團隊的負荷。將後者用來安排 Agent 是教材的設計類推。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>自我驗收\u003c/strong>　什麼情況下單 Agent 反而更合理？Agent 越多是否必然越快？若要解的只有共享欄位這一個決定，第二位沒有獨立產物，可以只留一人。若兩邊已可自測，才有機會縮短等待。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 這項分析沒有量到實際交付時間。\u003c/p>\n\u003cp data-passage=\"p-5\">依據：P01、P15、U-A；T05、concepts/cost.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、教學編排。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P01、P15、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://teamtopologies.com/key-concepts/\" rel=\"noopener noreferrer\" target=\"_blank\">P15 · Key Concepts\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/role-design.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p15-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/multi-agent-org-and-environment.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.01", "firstSlide": 171, "lastSlide": 173, "subtitle": "什麼工作值得分給第二位 Agent？"}, {"id": "C23", "chapter": "03", "title": "多 Agent 分工中的決策、派工與驗收責任", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者的 U07 陳述提出先配置工程職責與環境，再依需求派工。假如一項需求叫作「依標籤看待辦」，先讓產品負責人說明使用者應看到什麼，再問誰整理規格、誰實作、誰查驗，能看出工作漏在哪一段。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在本例，人類決定目的、可接受的風險與最終採納。協調者（Coordinator）接收核准的目的，整理工作、記依賴、指派負責人；執行者（Worker）依票修改並交回可查的產物。當執行者碰到影響使用者的兩種合理解讀，把兩種結果及受影響的票送回協調者，由協調者找具權者決定，再把決議送回原票。專案應寫明誰有簽收權；流程中的職稱本身不會授權。\u003c/p>\n\u003cfigure>\u003cfigcaption>案例中的決策路徑｜畫面出現兩種合理解讀時，誰接下一棒？\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>\u003cstrong>執行者 → 協調者\u003c/strong>　附上兩種可見結果，列出會受影響的票。\u003c/li>\u003cli>\u003cstrong>協調者 → 具權者\u003c/strong>　查專案的授權記錄，請有權決定產品行為的人選定預期。\u003c/li>\u003cli>\u003cstrong>具權者 → 協調者 → 執行者\u003c/strong>　把決議寫回原票，讓各方按同一個預期續做。\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp data-passage=\"p-3\">\u003cstrong>自我驗收\u003c/strong>　主管是否必須知道所有程式細節？要決定是否採納時，主管需要看到目標、風險、例外和檢查結果，並能追查原始產物。若兩種選擇會改變使用者看到的清單，主管須能決定或找到有權決定的人，無須代替每位 Worker 修改程式。\u003c/p>\n\u003ch2 data-section>審查意見和整合結果由誰交付\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 審查者（Reviewer）拿契約與修改差異對讀，交出符合項、偏差與風險。整合者（Integrator）則拿雙方的確切版本放回指定的共同基線，也就是團隊承認的起始版本，檢查它們一起運作時的行為，再交付整合版及回歸結果。審查可能先發現缺少清除按鈕的測例；即使這條測例已補齊，整合者仍需查清除時畫面真的取得了完整清單。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>自我驗收\u003c/strong>　兩位 Worker 都自測通過，誰檢查合併後版本？把目標基線及兩份產物交給負有整合責任的人。小改動時同一位 Agent 可以兼任 Reviewer、Integrator，但應留下兩項輸出，讓接手者能分別找出審查意見及整合結果；涉及高風險改動時可另指派審查者。\u003c/p>\n\u003cp data-passage=\"p-6\">依據：P15、U-A（U07）、S02；T05、concepts/role-design.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P15、S02、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>
