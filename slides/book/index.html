\u003cli>\u003ca href=\"https://teamtopologies.com/key-concepts/\" rel=\"noopener noreferrer\" target=\"_blank\">P15 · Key Concepts\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/role-design.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p15-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/multi-agent-org-and-environment.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.02", "firstSlide": 174, "lastSlide": 177, "subtitle": "誰負責把哪個決定交給誰？"}, {"id": "C25", "chapter": "03", "title": "依可開工的任務與收件能力配置 Agent", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 同一個專案在不同時刻，能交出的工作量可能差很多。拿出工作票（記錄一項交付及其完成條件的文件），在每張旁邊填三件事：還缺哪個上游決定、要用哪個版本的共用資料型別、拿什麼輸出驗收。前置已滿足而且有權開始的票，這裡稱為 ready。把 ready 的票依能否各自驗收分組，最後再問負責協調的人能否接收、審查和整合這些回報。\u003c/p>\n\u003ch2 data-section>在契約核准前後各數一次\u003c/h2>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在待辦案例，先由一張契約票 F0 決定標籤的型別、查詢的規則與一組共用樣本。F0 未准前，伺服器票 F1 與畫面票 F2 都要等同一個欄位，即使大型專案多出第三位 Worker，瓶頸還在。F0 核准後，F1 能單獨驗查詢結果，F2 能依同一份樣本驗畫面；此時可以各派一位，也可以在只能仔細接收一份回報時依序做。實際配置還受人力可管理的票數限制。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>自我驗收\u003c/strong>　新增第三個 Worker 會解除 F0 阻塞嗎？哪個例子更有平行化空間？請比對「大專案的兩票共等同一型別」和「小改動已有定版樣本、兩票可各交一份測試」；後者有兩件可同時驗收的事，前者要先取得決策。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 這個推導無法算出放諸各專案皆準的最佳人數。\u003c/p>\n\u003cp data-passage=\"p-4\">依據：P01、P15、U-A；T05、concepts/role-design.md、examples/task-dag.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P01、P15、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://teamtopologies.com/key-concepts/\" rel=\"noopener noreferrer\" target=\"_blank\">P15 · Key Concepts\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/role-design.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/task-graph.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-dag.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p15-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/multi-agent-org-and-environment.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.03", "firstSlide": 178, "lastSlide": 179}, {"id": "C24", "chapter": "03", "title": "Project 記錄中的六種協作實體", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 一位同事關掉編輯器，接手的人該向哪裡找進度？先看專案（Project）這個長期容器，再辨認裡面的六種實體。把它們寫在不同欄位，才能說清楚換掉的究竟是人、工作、這一次指派，還是裝著檔案的目錄。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"實體表格\" data-passage=\"p-2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">實體\u003c/th>\n\u003cth scope=\"col\">在待辦專案裡如何辨認\u003c/th>\n\u003cth scope=\"col\">什麼時候改變\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Role，角色\u003c/td>\n\u003ctd>例如「負責伺服器介面」這份職責\u003c/td>\n\u003ctd>可跨多項需求保留，直到組織調整責任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent，執行個體\u003c/td>\n\u003ctd>本次履行這個角色的開發助手\u003c/td>\n\u003ctd>能換人接手，一個個體也可兼任另一職責\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session，工作階段\u003c/td>\n\u003ctd>一次帶有對話與操作上下文的工作時段\u003c/td>\n\u003ctd>關閉後可另開，接手者須從記錄恢復\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Task，任務\u003c/td>\n\u003ctd>有目標及驗收條件的一張票\u003c/td>\n\u003ctd>同一工作重試時保留，到接受或終止才結案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dispatch，派工嘗試\u003c/td>\n\u003ctd>把這張票交給特定執行者的某一次指派\u003c/td>\n\u003ctd>重派時另編，舊嘗試保留歷史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Worktree，工作目錄\u003c/td>\n\u003ctd>檢出檔案、實際修改的地方\u003c/td>\n\u003ctd>可以在階段結束後保留，整理前要先查明產物\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 將待辦網站的起始版本記為 B0。請把「API 角色、承辦助手、這次對話、API 票 F1、這次指派 d1、以 B0 起步的目錄」各放回表中一列。這樣即使對話結束，接手者仍知道要去哪裡查檔案、查哪張票，以及誰有權判定完成。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>自我驗收\u003c/strong>　結束 Session 是否等於任務完成？若查票只找到一個目錄和一段已結束的對話，仍應查有效指派、產物及接受記錄；光憑關閉時間無從結案。\u003c/p>\n\u003ch2 data-section>同一張票重新指派後，哪份回報有效\u003c/h2>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Orca 的 P13 文件摘要區分 Task 與 Dispatch，完成訊息帶回任務、嘗試及結果。此處按專案收錄時標為 Experimental 的文件說明機制。\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設同一張 F1 先派 d1，協調者確認重派後將 d2 登記為目前有效；此時才收到 d1 的成功訊息。把訊息附回 F1 的 d1 歷史，查 d2 的承辦者與狀態，再依 d2 的實際產物審核 F1。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cstrong>自我驗收\u003c/strong>　為何舊 Dispatch 的完成訊息不能直接覆寫新狀態？票號相同只說明目標相同。舊嘗試可能依賴舊輸入，也沒有當前指派的交付權；用它覆寫會讓真正仍在工作的 d2 消失在帳上。\u003c/p>\n\u003cp data-passage=\"p-7\">依據：P13、S02；concepts/coordination.md、T05、T06。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、公開技術文件、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P13、S02\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/supervision.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/worktree.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-spec.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/multi-agent-org-and-environment.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.04", "firstSlide": 180, "lastSlide": 184, "subtitle": "關掉工作階段以後，什麼還存在？"}, {"id": "C26", "chapter": "03", "title": "多 Agent 協作模式的工作順序與控制權", "track": "", "role": "core", "parent": "", "lead": "在這個待辦網站練習裡，使用者選工作標籤後只看見工作待辦，清除後又看見全部。伺服器負責查詢，畫面負責顯示。請沿著兩人的交件路徑，找出誰負責把結果交回使用者。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先畫資料的箭頭。若乙必須讀甲的產物才能開始，兩步依序執行（Sequential）；若兩者已各自拿到穩定輸入，就能並行（Parallel）。\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在紙上寫下「核准契約 F0 → API 修改 F1 與畫面修改 F2 → 整合 F3」，讓 F1、F2 分別指向 F3。F1 的回傳格式和 F2 的畫面預期都取自 F0，兩人無須等對方寫完，但整合需要兩份產物。\u003c/p>\n\u003cfigure>\u003cfigcaption>合成案例｜沿每一條箭頭讀出下游要等的產物\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">上游 → 下游\u003c/th>\u003cth scope=\"col\">箭頭上要交什麼\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">F0 → F1\u003c/th>\u003ctd>核准的單標籤契約與固定樣本，供後端驗查詢。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">F0 → F2\u003c/th>\u003ctd>同一版契約與樣本，供畫面驗參數和顯示。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">F1、F2 → F3\u003c/th>\u003ctd>兩邊指定的提交與局部檢查都齊備，整合者才有一組可重測的輸入。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cp data-passage=\"p-2\">\u003cstrong>自我驗收\u003c/strong>　F3 能和 F1 同時開始嗎？可先準備整合用的測例；正式檢查合併版本這一步仍要等 F1 和 F2 交來指定版本。\u003c/p>\n\u003ch2 data-section>結果由誰收回，最後由誰回覆\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 接著畫控制權的箭頭。在 OpenAI Agents SDK 的 Manager 模式中，管理者呼叫專家取得局部結果，回來後仍由管理者綜合與回覆。在 Handoff 模式中，原執行者把本輪主控交給接手者，由後者接續處理與回應。先問結果回到誰手上，再問誰決定對外回什麼，就能區分委託與移交。這是 P16 描述的控制方式，跨輪工程治理仍要另行設計。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>自我驗收\u003c/strong>　Worker 交結果給 Coordinator 是 handoff 嗎？如果協調者仍要審核、彙整及答覆，控制權留在協調者。一般文件交接也可以只移交資訊。\u003c/p>\n\u003ch2 data-section>把主控責任放回工作順序裡\u003c/h2>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 把兩種箭頭疊在剛才的圖上。協調者保留主控，同時請兩位 Worker 做 F1、F2，收件後依序安排 F3 並將結果報給人類。這條路同時用到 Manager、Parallel 和 Sequential。如果任務改成「請熟悉此模組的專家接手本輪說明」，可選 Handoff 並指定接手者直接答覆。單把整合票交給專家做，仍可能由原協調者收件。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cstrong>自我驗收\u003c/strong>　哪個模式決定誰最後向人類回報？沿控制權去找最後持有者。看到兩位助手同時工作，只能判斷時序；要判斷最終回報人，還得知道主控留在管理者還是已移交。\u003c/p>\n\u003cp data-passage=\"p-7\">依據：P01、P16、P13（Experimental）；T06、examples/task-dag.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P01、P13、P16\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.github.io/openai-agents-python/multi_agent/\" rel=\"noopener noreferrer\" target=\"_blank\">P16 · Agent orchestration｜OpenAI Agents SDK for Python\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/task-graph.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-dag.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p16-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.05", "firstSlide": 185, "lastSlide": 188, "subtitle": "畫兩種箭頭，分清工作順序與控制權"}, {"id": "C27", "chapter": "03", "title": "專案初始化的版本基準、權限與交件規則", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 在 U07 的工作方法裡，先把專案環境和責任建立起來，再把需求交進來。想像今天有人加入，只收到「到最新的程式碼改畫面」。他即使改對了功能，也可能改在無人準備接受的版本上。初始化要交付的是一份能讓新承辦人抵達同一起點的專案記錄。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 以虛構的 todos 專案演練，逐欄填好後，請接手者依記錄指出自己的工作目錄和交付對象。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"初始化欄位表格\" data-passage=\"p-3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">初始化欄位\u003c/th>\n\u003cth scope=\"col\">接手者應能從記錄還原的事\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>產品與架構\u003c/td>\n\u003ctd>目標是顯示待辦，伺服器提供資料、畫面發出查詢；誰能批准跨兩者的改動\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>版本庫（repo）、權威分支與基準\u003c/td>\n\u003ctd>指定 todos 的 main 作接受成果的分支，記下起始提交，以 B0 代稱。分支可前進，提交識別特定快照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>規範與共享資料\u003c/td>\n\u003ctd>專案指引列建置、測試、提交步驟與限制，共同介面和測試樣本附版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>責任與工作區\u003c/td>\n\u003ctd>登記產品決策者、協調者、執行者及整合者，為每次指派記目錄、分支及起點\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>權限\u003c/td>\n\u003ctd>逐一核對誰能讀、寫、執行、整合與批准，確認環境實際開放哪些操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>品質門檻\u003c/td>\n\u003ctd>先找舊列表測試，再約定每張票的局部測試、整合重驗及簽收記錄要放在哪裡\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>用實際位置和權限核對專案記錄\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 說明如何用 AGENTS.md 讓開發者與助手找到專案規則；寫下禁止事項仍須搭配環境的存取控制。P12 說明工作區可選起始版本，P14 說明如何核對檢出位置。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 新承辦人若發現實際起點不同，先帶著目錄與提交回報差異，再決定是否放行。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>自我驗收\u003c/strong>　沒有權威分支，合併後誰能決定 B1？要回到專案指定的批准者，先確認接受成果的位置、測試門檻與權限。例中 B1 指整合後獲准採用的下一個基準，僅找到最新提交無法推得這項批准。下一輪可沿用環境，如何重開任務見 \u003ca href=\"#C35\">3.14\u003c/a>。\u003c/p>\n\u003cp data-passage=\"p-6\">依據：P05、P12、S02、P14；T05、concepts/role-design.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P05、P12、P14、S02\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://orca.dev/docs/model/worktrees\" rel=\"noopener noreferrer\" target=\"_blank\">P12 · Orca · Worktrees\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://git-scm.com/docs/git-worktree\" rel=\"noopener noreferrer\" target=\"_blank\">P14 · Git · git-worktree\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/role-design.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p12-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p14-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/multi-agent-org-and-environment.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.06", "firstSlide": 189, "lastSlide": 192}, {"id": "C28", "chapter": "03", "title": "Git Worktree 的隔離範圍與共享資源風險", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Git 把已提交的內容存進版本庫（repo），分支（branch）指向一段工作的提交位置，工作樹（worktree）則讓你在一個目錄檢出並修改檔案。從同一個 repo 掛接多個工作樹，各自有目前檢出位置 HEAD 和準備提交內容的暫存區 index；物件及多數版本參照仍共用。知道 repo 名稱，還不足以知道一位 Worker 正在改哪份檔案。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 設團隊核准的起點是 main 指向的 B0。先記下 B0 的提交識別，再分別由此建立 API、UI 及整合用的分支，在三個工作目錄檢出。本例從專案根目錄讀路徑，\u003ccode>worktrees/wt-api\u003c/code> 檢出分支 \u003ccode>feature/api-filter\u003c/code>，\u003ccode>worktrees/wt-ui\u003c/code> 檢出 \u003ccode>feature/ui-filter\u003c/code>，\u003ccode>worktrees/wt-int\u003c/code> 檢出 \u003ccode>integration/filter\u003c/code>。下文的 wt-api、wt-ui、wt-int 是這三個目錄的簡稱。以 \u003ccode>git worktree list\u003c/code> 對照目錄及分支，到各目錄執行 \u003ccode>git rev-parse HEAD\u003c/code> 核對起點，將實際值填回票上。兩位 Worker 各交出新提交後，原先同祖的三個目錄內容就可以各不相同。Orca 側欄的父子分組供瀏覽，不能用來推斷 Git 的祖先關係。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>自我驗收\u003c/strong>　多個 Worktree 會有完全獨立的資料庫嗎？要查測試的連線設定。若指向同一個資料庫，兩目錄的程序讀寫的仍是同一批資料。\u003c/p>\n\u003ch2 data-section>共用服務與測試資料怎樣互相干擾\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設兩套測試都要啟動固定埠的服務。第一個程序佔用該埠後，第二個可能啟動失敗，甚至把請求送到上一個服務。也可能兩人共用一批固定測試資料（fixture），其中一方重設資料時，另一方的預期清單就變了。派工時列出埠、資料庫、樣本版本與權限；能分開的各配位置，無法分開的排好使用順序，並在測試報告寫出實際連到哪個服務。\u003c/p>\n\u003ch2 data-section>如何發現合併工具看不出的錯誤\u003c/h2>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 檔案互不覆寫仍可能產生語義衝突。例如前端把空字串當作清除，後端卻把它當成查不到。即使 Git 能乾淨合併兩份檔案，人看到的清單仍可能不合契約。先給雙方同一份介面樣例，整合時重跑跨模組路徑。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 埠衝突是此處用來推理的假設，沒有本例事故紀錄。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cstrong>自我驗收\u003c/strong>　Git merge 乾淨就能表示產品正確嗎？合併檢查回答的是檔案變更能否套用；要回答產品問題，得在合併版本上實際選取、清除並觀察請求與畫面。\u003c/p>\n\u003cp data-passage=\"p-7\">依據：P14、P12、U-A；T05、concepts/worktree.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P12、P14、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/model/worktrees\" rel=\"noopener noreferrer\" target=\"_blank\">P12 · Orca · Worktrees\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://git-scm.com/docs/git-worktree\" rel=\"noopener noreferrer\" target=\"_blank\">P14 · Git · git-worktree\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/worktree.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p12-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p14-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/multi-agent-org-and-environment.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.07", "firstSlide": 193, "lastSlide": 196, "subtitle": "工作目錄隔開了，哪些東西還會互相影響？"}, {"id": "C29", "chapter": "03", "title": "前後端共用的單標籤查詢契約與測試樣本", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 想像你負責一個已有待辦列表的網站。收到「按標籤顯示待辦」後，你若只把同一句話轉寄給畫面和伺服器的作者，一人可能做多選，另一人只收一個值。先把共同承諾寫成契約票。這輪從 B0 開始，契約的全案唯一票號是 \u003ccode>R1-F0\u003c/code>；講解第一輪時簡稱 F0。工作票索引與跨輪交接一律寫全號。目標（Target）是讀取並顯示單一標籤精確匹配的待辦；限制（Constraints）是沿用既有資料與列表順序，本輪排除新增標籤、寫入資料與多選。最後寫可直接觀察的接受條件（Acceptance），交由產品負責人確認，並保存獲准的版本供兩邊讀取。\u003c/p>\n\u003cp data-passage=\"p-2\">在這個契約裡，「清除」要送出沒有 tag 參數的列表請求，未知標籤則是一次合法查詢，只是沒有匹配記錄。明寫這個差別，兩位作者才知道畫面空了代表什麼。大小寫變體、多值、空字串的解讀留作待決，不能把自己選的值寫成已核准的預期。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>自我驗收\u003c/strong>　未定義空字串的行為應由誰決定？請先讓負責人看兩個可見後果：若等同省略，會看到全部；若當作未匹配，會看到空清單。交有產品決策權的人裁決並更新 F0；使用既有省略規則完成清除操作的部分仍有明確判準。\u003c/p>\n\u003ch2 data-section>讓伺服器與畫面共用三組預期\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 用固定輸入把「如預期」換成可核對的結果。一筆待辦 A 帶 work 標籤，另一筆 B 帶 home 標籤。把這組資料編入 F0 核准版，同時交給伺服器票 F1 和畫面票 F2。GET 表示讀取資料，\u003ccode>/todos\u003c/code> 是列表位置，問號後面帶查詢參數。兩邊各在同一列寫下自己能驗的部分。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"動作表格\" data-passage=\"p-5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">動作\u003c/th>\n\u003cth scope=\"col\">F1 對介面的斷言\u003c/th>\n\u003cth scope=\"col\">F2 對畫面的斷言\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>選 work\u003c/td>\n\u003ctd>GET /todos?tag=work 回傳 [A]\u003c/td>\n\u003ctd>送出 tag=work，回應後只顯示 A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除選取\u003c/td>\n\u003ctd>GET /todos 省略 tag，回傳 [A,B]\u003c/td>\n\u003ctd>查詢不帶 tag，恢復 A、B\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查不存在的標籤 missing\u003c/td>\n\u003ctd>GET /todos?tag=missing 回傳成功狀態 200 和空清單\u003c/td>\n\u003ctd>收到空清單後顯示有效的空結果，畫面仍可操作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\">\u003cstrong>自我驗收\u003c/strong>　為何 UI/API 都用同一版 fixture？若伺服器測試把 B 設為 home，而畫面測試把 B 設為 work，兩邊都可按自己的預期通過，整合者卻無法判讀哪一份符合需求。F2 可先以模擬回應（mock）測畫面；這只能證明畫面能處理該回應，真實串接仍要在整合票驗。\u003c/p>\n\u003cp data-passage=\"p-7\">依據：P05、P17、U-A；T06、examples/scenario.md、examples/task-spec.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P05、P17、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/authority.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-spec.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.08", "firstSlide": 197, "lastSlide": 201, "subtitle": "怎樣把「按標籤顯示待辦」交給兩個互不等候的人？"}, {"id": "C30", "chapter": "03", "title": "Task Spec 的八個欄位與拆票方法", "track": "", "role": "core", "parent": "", "lead": "假設團隊要替待辦網站加上單標籤篩選。產品負責人核准「選工作只見工作待辦，清除後恢復全部」，接下來要讓寫資料介面、做畫面和整合的三方各自知道交什麼才算完成。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 收到工作票的人應能自己判斷「我改哪裡、憑什麼開始、什麼算交件」。八個欄位分別回答目的、改動、邊界、人、版本、前置、交付與驗收。若目的只寫「完成 API」，承辦人可能順手改掉排序，審查者也不知道該拿哪版資料檢查。下面把這張票填到另一人可以接手；提交和測試結果只能由真正執行的人補。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"F1 工作票欄位表格\" data-passage=\"p-2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">F1 工作票欄位\u003c/th>\n\u003cth scope=\"col\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 核准後可派的內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Target 目標\u003c/td>\n\u003ctd>使用者可依單一標籤讀取待辦\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Change 改動\u003c/td>\n\u003ctd>在既有 GET /todos 加入單值精確匹配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Constraints 邊界\u003c/td>\n\u003ctd>維持原列表順序與省略 tag 的行為，維持唯讀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Owner 負責人\u003c/td>\n\u003ctd>API Worker，在 wt-api 工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Base 起點\u003c/td>\n\u003ctd>已登記的 B0 提交與核准的 F0 契約版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dependencies 前置\u003c/td>\n\u003ctd>F0 已接受，且同版 A(work)、B(home) 樣本可取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Output 產物\u003c/td>\n\u003ctd>提交識別、程式差異（diff）、測試命令與實際輸出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Acceptance 驗收\u003c/td>\n\u003ctd>work 只回 A，missing 回成功空列表，省略回 A、B\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-3\">\u003cstrong>自我驗收\u003c/strong>　只寫「完成 API」為何不夠？請試著只靠這句話判斷重排清單算不算完成。要有原順序的限制、比對用的基準和三種預期，驗收者才有理由接受或退回。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13 描述任務與派工嘗試；這份八欄票是教材的設計。\u003c/p>\n\u003ch2 data-section>從單張票查到整輪交付\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 四張票共用同一個需求，但交回來的東西可以逐張點收。B0 是團隊已承認的起點，B1 是下一次接受新版本後才會登記的名稱。這張工作票索引屬於第一輪。下表 F0、F1、F2、F3 的全案票號依序為 \u003ccode>R1-F0\u003c/code>、\u003ccode>R1-F1\u003c/code>、\u003ccode>R1-F2\u003c/code>、\u003ccode>R1-F3\u003c/code>。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"票與責任人表格\" data-passage=\"p-5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">票與責任人\u003c/th>\n\u003cth scope=\"col\">輸入、位置與限制\u003c/th>\n\u003cth scope=\"col\">可交付的結果與接受條件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>F0 契約；協調者整理、人類核准\u003c/td>\n\u003ctd>從 B0 與原需求出發，在規格區決定單標籤匹配、清除及未知值，排除多選\u003c/td>\n\u003ctd>帶版本的介面例與樣本，三組預期經具權者核准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F1 資料介面；API Worker\u003c/td>\n\u003ctd>在 wt-api 以 B0 和 F0 做讀取篩選，前置為 F0\u003c/td>\n\u003ctd>依上表交修改提交、差異及三項介面測試\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F2 使用者介面；UI Worker\u003c/td>\n\u003ctd>在 wt-ui 以 B0 和同版 F0 實作選取與清除，以模擬回應測試，維持 F0 語義\u003c/td>\n\u003ctd>交畫面修改、提交、操作與模擬範圍；核對送出的參數、顯示清單與清除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F3 整合；Integrator\u003c/td>\n\u003ctd>在 wt-int 以 B0 收 F1 與 F2 的指定提交，遇介面歧義交決策者\u003c/td>\n\u003ctd>交整合提交、真實介面與畫面回歸結果、未測清單；具權者查三例並簽收才登記 B1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\">\u003cstrong>自我驗收\u003c/strong>　F2 可以自行改變 F0 的 API 語義嗎？若畫面需要的行為超出契約，把差異和受影響的案例交回 F0；要等新版本核准才能改寫共用規則。否則 F1 和 F2 看似各自完成，F3 收到的卻是兩個產品。\u003c/p>\n\u003cp data-passage=\"p-7\">依據：P13（Experimental）、S02；T06、examples/task-spec.md、examples/task-dag.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P13、S02\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/task-graph.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-spec.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.09", "firstSlide": 202, "lastSlide": 208, "subtitle": "把一份契約拆成四張能交回來的票"}, {"id": "C31", "chapter": "03", "title": "Task DAG 的依賴、開工與阻塞條件", "track": "", "role": "core", "parent": "", "lead": "假設你負責整合待辦網站。選取工作標籤應只留下工作待辦，清除後其他待辦也應回來。你要判斷後端和畫面各交了哪個版本，以及兩份產物何時可以放在一起測。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把工作票畫成點，以箭頭表示「下游要讀到這份上游產物」。沿箭頭前進不會繞回起點，這種圖稱為有向無環圖（DAG）。畫圖時要把「什麼算取得產物」寫在邊上；有人開始打字或傳來進度都無法滿足「契約已接受」這個條件。\u003c/p>\n\u003ch2 data-section>契約核准後，哪些工作可以開始\u003c/h2>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 從待辦網站第一次進案開始，請逐行更新狀態。F0 等核准時，F1 資料介面和 F2 畫面都等同一份契約；F0 accepted 表示契約已被接受，這時 F1 與 F2 同時 ready，可以派工。F1 交件並經局部核對後，F3 的 API 輸入齊了，畫面輸入仍缺。F2 也交付符合約定的版本後，重查兩份是否源自同一基準，才放行 F3 做整合。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>自我驗收\u003c/strong>　F1 完成後能直接進 F3 嗎？找出 F3 的兩條入邊，分別填上可取用的提交。只填得出 F1 時，即使整合者有空，也不能執行雙方版本的檢查。\u003c/p>\n\u003cfigure>\u003cfigcaption>合成案例｜只有後端先交件時，逐邊檢查整合票\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">F3 要讀的產物\u003c/th>\u003cth scope=\"col\">契約已准，兩邊尚未交件\u003c/th>\u003cth scope=\"col\">僅 F1 已交且經核對\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">後端輸入\u003c/th>\u003ctd>待交\u003c/td>\u003ctd>可取用\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">畫面輸入\u003c/th>\u003ctd>待交\u003c/td>\u003ctd>待交\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">整合者現在能做什麼\u003c/th>\u003ctd>等待兩份提交\u003c/td>\u003ctd>保留後端提交，繼續等畫面版本\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003ch2 data-section>規格待決與測試失敗分別交給誰\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 同一張圖有兩種暫停原因。若 UI 提議把標籤改成多選，協調者把受影響的票標記 BLOCKED（缺決策而暫停），寫明待決語義與批准者。收到有權者的決議後，更新契約並重新核對每條前置。若已有明確契約而 F3 發現「清除後仍只見 A」，保存請求與回應以定位責任：畫面還送 work 就退 F2，省略 tag 而伺服器仍回 A 就退 F1。修正者交出新版本，整合者再用新輸入驗 F3。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>自我驗收\u003c/strong>　哪種事件能解除 BLOCKED？有權者的決議解開語義問題，負責人才能重查依賴並放行；等待時間變長或多開一位 Worker 都沒有補齊輸入。測試失敗則需要能重現的反例與修正產物。圖上的修正回路是下一次嘗試的時間順序，不要在同一次 DAG 加上互等的前置條件。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cstrong>沿著兩條入邊核對版本。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 這一輪的 F0 是 R1-F0 的短稱，核准的是 B0 上的單標籤契約。下列代號用於紙上追蹤；A1、U1、U2 各代表一份可取用的提交。協調者在每條入邊記下票號、當前派工嘗試（Dispatch）、基線、提交及局部檢查。F3 可開始代表輸入已齊，簽收還需要整合驗證。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"事件表格\" data-passage=\"p-7\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">事件\u003c/th>\n\u003cth scope=\"col\">F3 當下可採用的輸入\u003c/th>\n\u003cth scope=\"col\">整合者的動作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>F1 的有效嘗試交回 A1，局部 API 驗收通過；F2 還在工作\u003c/td>\n\u003ctd>API：B0/A1；UI：缺\u003c/td>\n\u003ctd>等 UI 產物。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F2 第一次派工 d1 交回 B0/U1，局部 UI 案例通過\u003c/td>\n\u003ctd>API：A1；UI：d1/U1，兩者都依 R1-F0\u003c/td>\n\u003ctd>記下這組版本，開始 F3 真實資料路徑檢查。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F3 清除後仍見 A；紀錄顯示 UI 仍送 tag=work\u003c/td>\n\u003ctd>A1 仍可用；d1/U1 退回，這組整合輸入失效\u003c/td>\n\u003ctd>保存反例，撤回 F3 放行。協調者結束 d1，在同一張 F2 登記新嘗試 d2；此時 UI 入邊重新缺件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d2 尚未交件，d1 遲到的「通過」回報抵達\u003c/td>\n\u003ctd>仍只有 A1\u003c/td>\n\u003ctd>將回報留給 d1 的歷史；即使指向 U1，也不能替 d2 補件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d2 交回 B0/U2，重查契約、提交與局部結果均合格\u003c/td>\n\u003ctd>API：A1；UI：d2/U2\u003c/td>\n\u003ctd>用 A1＋U2 重跑選取、清除與未知標籤，留下新的整合結果，交具權者決定是否接受 B1。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-8\">若退回時發現爭議其實是「要不要支援多選」，先標待決並記錄裁決者。第一輪簽收後才從 B1 建第二輪契約票 R2-F0；它須取得自己的核准，不能承接 R1-F0 的 accepted。\u003c/p>\n\u003cp data-passage=\"p-9\">依據：P13（Experimental）、P01；T06、concepts/task-graph.md、examples/task-dag.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P01、P13\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/task-graph.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-dag.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.10", "firstSlide": 209, "lastSlide": 216, "subtitle": "怎麼知道下一張票能動了？"}, {"id": "C31-01", "chapter": "03", "title": "用共用契約判斷前後端何時可派工", "track": "", "role": "lesson", "parent": "C31", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">待辦網站要加上標籤篩選。一位開發者寫提供資料的服務，另一位寫使用者操作的畫面。假如前者把「清除」理解成省略篩選條件，後者卻送一個空字串，兩人各自在自己的測試裡通過，也可能接不起來。先把共同承諾的行為寫下來，再談哪張票可以交出去。\u003c/p>\n\u003cp data-passage=\"p-2\">第一輪從同一個起始提交 B0 出發。測試資料有工作待辦 A(work)、居家待辦 B(home)。服務介面（API）和畫面（UI）都按以下約定實作：選 work 只見 A，清除時省略 tag，恢復 A、B。未知標籤回空清單，HTTP 狀態碼 200 表示成功處理請求。首輪只承諾單標籤；空字串或多選的意思仍要交由有決策權的人核定。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-3\">讀箭頭上的交件條件\u003c/h2>\n\u003cp data-passage=\"p-4\">先開一張契約票，由具權者核准介面契約和固定資料；然後分別交給後端與畫面的實作者。最後由整合者把兩份可定位的程式放回共同基準，沿真實資料路徑核驗。這四張工作票在第一輪的全號為 R1-F0～R1-F3，同輪簡稱 F0～F3。圖中虛線只標採用的基準；四條實線箭頭才表示下游須取得的上游產物。\u003c/p>\n\u003cpre tabindex=\"0\" data-passage=\"p-5\">\u003ccode class=\"language-text\">B0 ···▷ F0（契約、固定資料）\nF0 ──已核准的契約──→ F1（API）\nF0 ──已核准的契約──→ F2（UI）\nF1 ──API 提交與局部檢查──→ F3（整合）\nF2 ──UI 提交與局部檢查───→ F3（整合）\n\u003c/code>\u003c/pre>\n\u003cp data-passage=\"p-6\">這叫有向無環圖（DAG）：順著依賴走不會回到原點。先看分岔，再看匯合。若契約還是草案，一句「差不多了」、兩位執行者都空閒、開著兩個視窗或等過一段時間，都填不上前兩條邊。把具權者批准的版本連到兩張票，F1、F2 才同時 ready（可派工）。真正開工還要指定負責人並登記這次派工。F3 則要等最後兩條入邊同時成立。\u003c/p>\n\u003cp data-passage=\"p-7\">Orca 的 P13 公開文件快照（Experimental）以 Task 記工作責任、依賴與狀態，以 Dispatch 辨識一次派工嘗試。Anthropic Engineering 的 P01 支持順序與平行工作流分類（\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"PUBLIC_DOC\">公開技術文件\u003c/span>）。T06 與上圖是教材合成案例（\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"SYNTHETIC_EXAMPLE\">合成教學案例\u003c/span>）；這些票、版本與狀態沒有協調器實跑紀錄。\u003c/p>\n\u003cp data-passage=\"p-8\">\u003ca href=\"#C31\">3.10 正文\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T06 從需求到交付\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">任務圖\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">依賴圖例\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P13\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P01\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003chr data-passage=\"p-9\">\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　P01、P13、T06\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/task-graph.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-dag.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.10.01", "firstSlide": 217, "lastSlide": 220}, {"id": "C31-02", "chapter": "03", "title": "整合前置條件：有效提交與局部測試證據", "track": "", "role": "lesson", "parent": "C31", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">待辦網站要能選工作標籤和清除篩選。寫後端的人交來可取得的程式版本；寫畫面的人交來一張清除按鈕運作正常的截圖。整合者想把兩端接起來，手上卻只有一份能放進應用程式的程式碼。要知道這項工作何時能開始，可以替兩個輸入各留一格。\u003c/p>\n\u003cp data-passage=\"p-2\">這次大家從同一程式起點 B0 開發，按第一輪核准的單標籤契約 K1 驗收。契約票叫 F0，後端資料服務票叫 F1，前端畫面票叫 F2，接起兩份程式的整合票叫 F3。工作資料 A 帶 work 標籤，B 帶 home。後端交回版本 api-a，對 \u003ccode>GET /todos?tag=work\u003c/code> 的局部檢查得到 [A]。前端先用預先準備的模擬回應（mock）測清除按鈕；這只能說明局部畫面在那個回應下的行為。直到後來交回 ui-a，才有可以取用的前端提交。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-3\">沿每次收件重算兩格\u003c/h2>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"事件表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">事件\u003c/th>\n\u003cth scope=\"col\">F1 狀態\u003c/th>\n\u003cth scope=\"col\">F2 狀態\u003c/th>\n\u003cth scope=\"col\">F3 的 API 格／UI 格\u003c/th>\n\u003cth scope=\"col\">F3 判斷\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>K1 待批准\u003c/td>\n\u003ctd>等契約\u003c/td>\n\u003ctd>等契約\u003c/td>\n\u003ctd>缺／缺\u003c/td>\n\u003ctd>等兩件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>K1 獲准\u003c/td>\n\u003ctd>ready\u003c/td>\n\u003ctd>ready\u003c/td>\n\u003ctd>缺／缺\u003c/td>\n\u003ctd>等兩件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接受 B0/K1 的 api-a\u003c/td>\n\u003ctd>已接受\u003c/td>\n\u003ctd>實作中\u003c/td>\n\u003ctd>api-a／缺\u003c/td>\n\u003ctd>只有一條入邊成立\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F2 只傳截圖\u003c/td>\n\u003ctd>已接受\u003c/td>\n\u003ctd>待補提交\u003c/td>\n\u003ctd>api-a／缺\u003c/td>\n\u003ctd>無 UI 可整合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接受 B0/K1 的 ui-a\u003c/td>\n\u003ctd>已接受\u003c/td>\n\u003ctd>已接受\u003c/td>\n\u003ctd>api-a／ui-a\u003c/td>\n\u003ctd>ready，可在整合版操作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-5\">從上往下追同一張整合票，遇到「已接受」先橫讀另一格。局部收件要核對起始版本（base）、契約、可取用的提交、局部證據的範圍，以及這份交件目前是否仍有效。假如兩格看似都有提交，ui-a 卻按照尚未批准的多選契約製作，仍欠符合 B0/K1 的 UI。先取回或補做該版本及局部檢查，再核兩格。\u003c/p>\n\u003cp data-passage=\"p-6\">兩個有效輸入到齊，協調者才可派 F3。整合者在共同版本接上真 API 與真畫面，重跑選 work 見 A、清除時省略 tag 並見 A、B、未知標籤見空清單，再跑既有回歸。具權者接受整合結果後才登記新的已簽收基線 B1。表的最後一列只到「可以開始整合」。\u003c/p>\n\u003cp data-passage=\"p-7\">T06 與 Wiki 依賴圖是合成場景；K1、api-a、ui-a 均是教學代號，沒有實際提交雜湊。Orca 的 P13（Experimental 文件快照）支持 Task 與派工概念，表中狀態是教學約定。\u003c/p>\n\u003cp data-passage=\"p-8\">\u003ca href=\"#C31\">3.10 正文\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T06 從需求到交付\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">任務圖\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">依賴圖例\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P13\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003chr data-passage=\"p-9\">\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　P13、T06\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/task-graph.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-dag.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.10.02", "firstSlide": 221, "lastSlide": 225, "subtitle": "整合者收件時，一張畫面截圖少了什麼"}, {"id": "C31-03", "chapter": "03", "title": "Task DAG 案例：定位整合故障、重派與重驗", "track": "", "role": "lesson", "parent": "C31", "lead": "", "kind": "整合診斷", "body": "\u003cblockquote>在這個合成教學案例裡，團隊正在替待辦網站加上標籤篩選。清單上有兩件事：「回覆客戶」屬於工作，「買牛奶」屬於生活。點「工作」，應該只看見回覆客戶；再點「清除篩選」，兩件事都應該回來。\u003c/blockquote>\n\u003cp>一位 Agent 負責撰寫、測試後端的查詢程式。網站運作時，後端會按畫面送來的條件，從資料中挑出符合的待辦。另一位 Agent 負責前端程式，讓按鈕送出正確的條件，也讓畫面在收到資料後更新清單。團隊先約好按鈕的意思和預期清單，兩位就能各自開工。後端可以單獨測資料查詢，前端也可以用預先準備好的回應測按鈕。\u003c/p>\n\u003cp>兩邊都交了通過的局部測試。第三位 Agent 負責整合，把兩份修改放進同一版網站，用真正的服務試一次。它點「工作」，畫面正確地剩下一件；再點「清除篩選」，買牛奶卻沒有回來。現在需要知道的是哪一段要修，以及修完後該拿哪兩份程式再試。\u003c/p>\n\u003ch2 data-section>跟著同一次點擊，看清單從哪裡開始少了一筆\u003c/h2>\n\u003cp>按清除時，前端要向後端重新索取清單，這次應該把篩選條件整個省略。後端可能根本沒收到這個意思；也可能收對了，卻少給一筆；還可能兩筆都送回來了，畫面仍沿用舊清單。三種情況在使用者眼裡一模一樣。\u003c/p>\n\u003cp>重現故障時，先保存正在使用的前、後端版本、那兩筆測試資料，以及「選工作、再清除」的操作順序。接著從瀏覽器的網路紀錄（Network）找出\u003cstrong>這次清除\u003c/strong>送出的請求和它的回應，最後對照同一次操作的畫面。為了能在紀錄中認出兩件待辦，把「回覆客戶」記為 A，把「買牛奶」記為 B。程式用參數 \u003ccode>tag\u003c/code> 表示標籤，其中 \u003ccode>work\u003c/code> 是工作、\u003ccode>home\u003c/code> 是生活。讀下面三列時，可以先遮住最後一欄，自己沿資料走一次。若和表中的判斷不同，回到第一個與預期不符的欄位，再選一次負責修改的人。\u003c/p>\n\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"清除時前端送了什麼表格\">\u003ctable class=\"cols-4\">\u003cthead>\u003ctr>\u003cth scope=\"col\">清除時前端送了什麼\u003c/th>\u003cth scope=\"col\">後端給了哪些待辦\u003c/th>\u003cth scope=\"col\">畫面列出哪些待辦\u003c/th>\u003cth scope=\"col\">從哪裡開始修\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"清除時前端送了什麼\">仍帶著上一次的 \u003ccode>tag=work\u003c/code>\u003c/td>\u003ctd data-label=\"後端給了哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"畫面列出哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"從哪裡開始修\">回到前端查按鈕如何組出請求。後端其實照收到的條件交出了工作事項。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"清除時前端送了什麼\">已省略 tag\u003c/td>\u003ctd data-label=\"後端給了哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"畫面列出哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"從哪裡開始修\">回到後端查無篩選條件時的查詢。買牛奶在資料送到畫面之前就已經少了。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"清除時前端送了什麼\">已省略 tag\u003c/td>\u003ctd data-label=\"後端給了哪些待辦\">[A,B]\u003c/td>\u003ctd data-label=\"畫面列出哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"從哪裡開始修\">回到前端查收到回應後如何更新清單。服務已把買牛奶送回來了。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 data-section>用工作票記住這次整合採用了什麼\u003c/h2>\n\u003cp>團隊需要讓下一位接手的人能重現剛才的判斷。先記兩個不同的版本：\u003cstrong>B0\u003c/strong> 是大家開始修改時共用的程式提交；\u003cstrong>K1\u003c/strong> 是產品負責人核准的行為約定，寫明工作標籤只回 A、清除恢復 A 與 B，以及查無相符標籤時要成功回傳空清單；畫面也應顯示空清單。前者讓人能還原程式起點，後者讓人知道該拿哪個結果驗收。核准這份約定的首輪工作票，全號叫 \u003cstrong>R1-F0\u003c/strong>，本輪內簡稱 \u003cstrong>F0\u003c/strong>。\u003c/p>\n\u003cp>每件可以獨立交付與驗收的工作記成一張任務票（Task）。後端的資料介面叫 API，它的工作票記為 \u003cstrong>F1\u003c/strong>；前端的操作畫面叫 UI，工作票是 \u003cstrong>F2\u003c/strong>；將兩者接起來做整合檢查的是 \u003cstrong>F3\u003c/strong>。所以剛才三列故障依序退回 F2、F1、F2。負責安排和追蹤工作的協調者可以依票號轉交反例，歸屬的理由仍是表裡那三項觀察。\u003c/p>\n\u003cfigure>\u003cfigcaption>整合任務的兩條前置依賴\u003c/figcaption>\u003cdiv class=\"flow-node\">核准的約定（F0）\u003c/div>\n        \u003cdiv class=\"fork\">\u003cdiv>\u003cb>↓ 後端任務（F1）\u003c/b>\u003cspan>後端提交與局部測試 ↓\u003c/span>\u003c/div>\n        \u003cdiv>\u003cb>↓ 前端任務（F2）\u003c/b>\u003cspan>前端提交與局部測試 ↓\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"flow-node\">兩份齊備 → 整合任務（F3）\u003c/div>\u003cdetails>\u003csummary>讀取原稿文字圖\u003c/summary>\u003cpre>核准的約定（F0） → 後端任務（F1） → 後端提交與局部測試 ┐\n核准的約定（F0） → 前端任務（F2） → 前端提交與局部測試 ┘\n                                     兩份齊備 → 整合任務（F3）\u003c/pre>\u003c/details>\u003c/figure>\n\u003cp>箭頭表示下游開工需要的產物。沿箭頭不會繞回原點，這就是任務的有向無環圖（Task DAG）。F0 獲准後，F1、F2 可以分頭派工。F3 有兩條必須\u003cstrong>同時成立\u003c/strong>的依賴，工程上也稱 AND 依賴。整合者要取得前、後端兩份仍有效、源自 B0、符合 K1 的提交及局部測試紀錄。只有其中一份，或前端只交了模擬畫面的截圖，仍缺可放進網站的版本。兩份齊備才可以開始驗整體行為。\u003c/p>\n\u003ch2 data-section>前端重修一次，上一份「通過」還算嗎？\u003c/h2>\n\u003cp>沿表中第一種情況繼續。後端交來的程式版本暫稱 \u003ccode>api-a\u003c/code>，前端第一次交來的版本稱 \u003ccode>ui-a\u003c/code>。整合者把 \u003ccode>api-a + ui-a\u003c/code> 這個組合和失敗紀錄留在 F3，協調者將「按清除還送 work」的請求交回前端。前端仍在完成同一張 F2 票，但現在要能分辨是哪一次執行交回的結果。一次具體派工叫 \u003cstrong>Dispatch\u003c/strong>；把原來那次叫 \u003cstrong>d1\u003c/strong>，新派的修正叫 \u003cstrong>d2\u003c/strong>。\u003c/p>\n\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"接著發生的事表格\">\u003ctable class=\"cols-4\">\u003cthead>\u003ctr>\u003cth scope=\"col\">接著發生的事\u003c/th>\u003cth scope=\"col\">整合者手上的後端版本\u003c/th>\u003cth scope=\"col\">整合者手上的前端版本\u003c/th>\u003cth scope=\"col\">此刻的處置\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"接著發生的事\">F2 退修並派出 d2\u003c/td>\u003ctd data-label=\"整合者手上的後端版本\">api-a 仍有效\u003c/td>\u003ctd data-label=\"整合者手上的前端版本\">原 ui-a 已退回，待補\u003c/td>\u003ctd data-label=\"此刻的處置\">撤回原配對的放行，保存第一次失敗，不急著重跑。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"接著發生的事\">d1 這才傳來「通過」，附的仍是 ui-a\u003c/td>\u003ctd data-label=\"整合者手上的後端版本\">api-a\u003c/td>\u003ctd data-label=\"整合者手上的前端版本\">仍待補\u003c/td>\u003ctd data-label=\"此刻的處置\">將回報歸入 d1 的歷史。它無法證明這次的修正已經完成。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"接著發生的事\">d2 交來新版本 ui-b，附上清除請求已省略 tag 的局部測試\u003c/td>\u003ctd data-label=\"整合者手上的後端版本\">重核 api-a\u003c/td>\u003ctd data-label=\"整合者手上的前端版本\">重核 ui-b\u003c/td>\u003ctd data-label=\"此刻的處置\">重新確認兩份提交的起點、約定、有效派工及局部證據，再登記新的配對。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>也可以遮住處置欄再讀一次：如果只有 d1 的通知到了，前端那一格該填什麼？把通知上的版本和現在等候的派工對起來，就知道那一格還得留空。\u003c/p>\n\u003cp>整合者用 \u003ccode>api-a + ui-b\u003c/code> 先重播那個曾經失敗的操作，查看買牛奶是否回來；再測選工作仍只見 A、未知標籤仍是空清單，並重跑既有測試，檢查這次修改有沒有弄壞原本正常的功能。這就是回歸測試。如果退回的是後端 F1，就改取新接受的 API 提交，搭配仍然有效的 UI 提交。若修正連 API、UI 都改了，兩份新提交都要重新核對。最後由具簽收權的人依共同版本的證據決定接受，\u003cstrong>獲接受的新程式提交才記為 B1\u003c/strong>。\u003c/p>\n\u003cp>這串退修事件是時間上的先後：F3 發現問題，F2 開了新嘗試，F3 再驗一次。畫依賴圖時，前端與後端的產物仍然都流向整合票；把退修畫成 F2、F3 互相等對方完成，反而會讓兩張票都不能開工。\u003c/p>\n\u003cp>還有一種情形需要停在產品決定上。若有人提議同時勾「工作」和「生活」，究竟應列出符合\u003cstrong>任一項\u003c/strong>的兩件待辦，還是只列出\u003cstrong>兩項都有\u003c/strong>的待辦，因而在這份資料中顯示空清單？K1 只核准單一標籤，這兩種結果都無法從既有約定選出。協調者應將受影響的票記為「待裁決」（BLOCKED），寫下兩種預期和有權決定的人；收到決議後更新對應約定，再重查前置條件。多派一次工作，不能替使用者選擇產品行為。\u003c/p>\n\u003csection id=\"diagnose\" class=\"practice\">\u003c/section>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源與案例性質：待辦、工作票、提交及回報均為合成示範，沒有本案實跑紀錄。T06 提供教學情境，P13 的實驗性文件支持 Task、Dispatch 與依賴的區分。\u003c/p>\u003ch3>公開技術文件\u003c/h3>\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://orca.dev/docs/cli/orchestration\">P13 · Orca · Orchestration ↗\u003c/a>\u003ch3>本機 Wiki 與教材定位\u003c/h3>\u003cul>\u003cli>T06 從需求到交付\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003cli>任務圖工作紙\u003csamp>.wiki/wiki/examples/task-dag.md\u003c/samp>\u003c/li>\u003cli>P13 來源摘要\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>C31 正式教材\u003csamp>docs/textbook/ch03/organization-and-delivery.md#c31\u003c/samp>\u003c/li>\u003c/ul>\u003c/section>", "number": "3.10.03", "firstSlide": 226, "lastSlide": 239, "subtitle": "清除篩選後，買牛奶的待辦去哪了？"}, {"id": "C31-04", "chapter": "03", "title": "多標籤篩選的 AND／OR 語義與產品裁決", "track": "", "role": "lesson", "parent": "C31", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">第一輪的待辦篩選還沒簽收。設計畫面的開發者提議讓使用者一次選「工作」和「居家」。清單裡，回覆客戶（A）只有 work 標籤，買牛奶（B）只有 home 標籤。同樣兩個勾選動作，有兩種說得通的結果。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"產品規則候選表格\" data-passage=\"p-2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">產品規則候選\u003c/th>\n\u003cth scope=\"col\">逐件套用在這份資料\u003c/th>\n\u003cth scope=\"col\">預期畫面 ID\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>符合任一標籤（OR）\u003c/td>\n\u003ctd>A 符合 work，B 符合 home，各收一件\u003c/td>\n\u003ctd>[A,B]\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同時具有兩個標籤（AND）\u003c/td>\n\u003ctd>A 缺 home，B 缺 work，兩件都排除\u003c/td>\n\u003ctd>[]\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-3\">兩位開發者可以各寫一個測試，測出各自期待的結果。再執行幾遍，仍然選不出產品該採用哪條規則。這件事發生在首輪簽收\u003cstrong>之前\u003c/strong>；它是缺決策的分支，與已知驗收值但實作違約的退修情形分開處理。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-4\">先記裁定，再逐票放行\u003c/h2>\n\u003cp data-passage=\"p-5\">團隊把首輪核准的單標籤契約稱為 K1。第一輪契約票的全號是 R1-F0，簡稱 F0；F1 提供 API，F2 提供 UI，F3 需要兩份版本才能整合。F2 提出多選時，協調者把依賴該語義的工作標成 BLOCKED（待裁決），登記待決問題、受影響的票、所需決議與批准者。未受影響且已有授權的工作可繼續。\u003c/p>\n\u003cp data-passage=\"p-6\">假設產品負責人決定首輪維持 K1，多選留待下一輪。沿時間讀：BLOCKED → 留存具權者可定位的裁定 → 按 K1 重查逐票的上游、版本及整合的兩個輸入格。即使新 Worker 到場或裁定已到，缺 UI 提交的 F3 仍不能開工。要補的分別是決策與有效產物；若拿到的是一個違反已核定契約的技術反例，則要回到責任票，取修正產物、重驗，再重查受影響的依賴。\u003c/p>\n\u003cp data-passage=\"p-7\">等第一輪的整合真的通過並被簽收，才把已接受的版本記為 B1。第二輪從 B1 另開契約票 R2-F0，核定 AND／OR 與相應樣例。跨輪保存票號和契約版本，就能從每項測試追到當時的規則；第一輪的 accepted 只適用於首輪。\u003c/p>\n\u003cp data-passage=\"p-8\">T06 與上述產品裁定、狀態名均屬合成教學情境。Orca P13 的實驗性文件記載待決工作可被擋下，產品語義仍須具權者決定。\u003c/p>\n\u003cp data-passage=\"p-9\">\u003ca href=\"#C31\">3.10 正文\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T06 從需求到交付\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">任務圖\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">依賴圖例\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P13\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003chr data-passage=\"p-10\">\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　P13、T06\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/task-graph.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-dag.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.10.04", "firstSlide": 240, "lastSlide": 243}, {"id": "C32", "chapter": "03", "title": "人工與 Coordinator 派工的狀態管理責任", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 只要有兩張可開始的票，就會出現一個實際問題：誰確定每張只有一個有效的承辦者？用人工派工時，人可以直接交付，不必先建自動調度器。先確認已批准的交付契約，在任務記錄寫下票號、目前狀態與責任人，再把目標、基準、工作目錄、權限、預期及回報位置一併交出去。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 待辦網站的資料介面票 F1 交給 API Worker，附起點 B0、wt-api、定版契約與三條查詢預期；畫面票 F2 交給 UI Worker，附同一基準、wt-ui、模擬回應與選取、清除的操作預期。兩人都要回報提交及未測項。只貼一句「把篩選做好」會讓兩位各選一個起點，之後即使收到兩條完成訊息，也無法知道能否合在一起。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>自我驗收\u003c/strong>　誰負責維護目前有效的 Task 狀態？在人工路線，應由指定的派工人或明確移交給的狀態維護者登記；每次重派都讓原票可查到當前有效的嘗試。不能讓兩位執行者各自把自己的看板當權威。\u003c/p>\n\u003ch2 data-section>協調者收到回報後怎樣決定下一步\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把派工責任委給 Coordinator 時，仍需指定它能派哪些工作、遇到什麼需回報人類。協調者先查前置，從 ready 票選出可開工項，確認 owner 有權且工作區可用，登記本次 Dispatch，送出工作包。等收到回報，先比對票與有效嘗試、再查產物，更新狀態後重算哪張票已能開始。發現產品語義未決時，保存問題與受影響票，等具權者裁決。每一輪的輸出既是當前記錄，也是下一輪的輸入。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>自我驗收\u003c/strong>　派出任務後 Coordinator 可以直接宣稱結束嗎？若 F1 還沒回件，就只能留下「已派、待收」與恢復入口。待審核產物、確認整合及權責範圍內的簽收後，才有結案依據。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13 記述收件匣與派工識別，P16 描述管理者收回局部結果；兩者都無法證明本例曾無人監督地跑完。\u003c/p>\n\u003cp data-passage=\"p-6\">依據：P13（Experimental）、P16、S02；T06、concepts/coordination.md、examples/task-spec.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P13、P16、S02\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.github.io/openai-agents-python/multi_agent/\" rel=\"noopener noreferrer\" target=\"_blank\">P16 · Agent orchestration｜OpenAI Agents SDK for Python\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-spec.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p16-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.11", "firstSlide": 244, "lastSlide": 247}, {"id": "C33", "chapter": "03", "title": "Dispatch 收件：核對有效派工與交付證據", "track": "", "role": "core", "parent": "", "lead": "這次練習只查伺服器這張票。承辦者要證明選工作標籤只會查到工作待辦，移除篩選會查到全部。協調者手上有兩份回報，得先確認哪一次派工仍然有效。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把「這是誰交的」和「它證明了什麼」分兩步檢查。接到回報先在票上找當前有效的派工嘗試與起點，再查該嘗試交來的版本、修改差異及其測試。否則可能花時間審查一個已撤換的版本，或把在別的版本上跑的測試算給它。\u003c/p>\n\u003ch2 data-section>以目前有效的派工核對交件單\u003c/h2>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 設 API 票 F1 已從 d1 重派為 d2。假如遲到的 d1 帶著 diff 並宣稱成功，先把附件存到 d1 的歷史項，保持 d2 的狀態。收到 d2 時按下列交件單核對；沒有執行過的欄位留待填，不能拿題目的預期充當輸出。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"F1 局部交件單表格\" data-passage=\"p-3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">F1 局部交件單\u003c/th>\n\u003cth scope=\"col\">收件時實際查什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Task F1、有效 Dispatch ___、base B0 的實際提交 ___\u003c/td>\n\u003ctd>與權威任務記錄核對票、嘗試及起點\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>產物提交 ___、diff 定位 ___\u003c/td>\n\u003ctd>查看從起點到提交的變更，有無跨出票的限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>命令 ___、環境 ___、結束碼 ___、輸出位置 ___\u003c/td>\n\u003ctd>在該版本對讀單標籤、未知值及省略的實際回應與預期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已知失敗 ___、未測 ___、阻塞與下一位接手者 ___\u003c/td>\n\u003ctd>只測了介面時，把真實畫面串接留給整合者\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者 U07 偏好用文件交接。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> S03 對 U01、U08、U09 的歷史研究只支持摘要層次的資訊與管理背景。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 給協調者一份短摘要，保留可追查的原始輸出定位，是這裡採用的編輯設計。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>自我驗收\u003c/strong>　沒有 commit 的摘要能否支持程式已改好？這張票要求可取用的程式版本，摘要只能讓人知道有人聲稱完成，應請承辦者補產物。哪一次回報應被 Coordinator 接受？d2 是可進入本票審核的嘗試；還要核對基準、diff 和測試才能接受局部交件。舊嘗試附有差異，也不能覆蓋新指派。\u003c/p>\n\u003cp data-passage=\"p-6\">依據：P13（Experimental）、S04、S03；T06、concepts/supervision.md、examples/handoff-and-evidence.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P13、S03、S04\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/supervision.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s03-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s04-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.12", "firstSlide": 248, "lastSlide": 250, "subtitle": "兩份都說成功的回報，收哪一份？"}, {"id": "C34", "chapter": "03", "title": "多 Agent 整合驗收：版本配對、回歸與簽收", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在各自的目錄中，伺服器能回傳正確資料，畫面也能處理模擬回應；真實使用者走的卻是一條連起來的路。整合者要能指出「這個畫面配上哪個伺服器、在什麼起點上驗過」。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P14 支持 Git 的多工作樹機制；哪個版本具有接受成果的權威，取決於專案記下的決定。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 對照兩張票登記的起始提交 B0、核准的介面契約與樣本版本。把 wt-api、wt-ui 各自交出的輸入提交逐一填進整合票 F3，在面向權威分支 main 的整合目錄 wt-int 核對起點，再套入兩份變更並記錄整合提交。若有人從別的起點修改、缺少其中一份提交或擅改契約，先退回釐清。這樣即使兩個分支之後繼續前進，也知道本次實際驗的是哪個組合。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>自我驗收\u003c/strong>　兩個局部測試全綠能否直接採納 B1？局部各自通過只讓兩份產物具備送整合的條件。F3 還缺共同版本的行為證據，也缺具權者的簽收。\u003c/p>\n\u003ch2 data-section>在同一版上比對請求、回應與畫面\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在整合提交啟動真實的 API 和 UI，使用 A(work)、B(home) 這組資料。選 work，查畫面送出 tag=work，伺服器只回 A，畫面只見 A；清除，查請求確實省略 tag，回應及畫面都恢復 A、B；再送未知標籤，查真實服務回 200 與空清單，UI 能顯示空結果。若畫面使用模擬服務，即使清單正確，也沒有觀察到這個整合版的伺服器處理請求。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在 F3 各列填入實際值、測試命令或操作、環境和輸出定位，列出未測項。結果尚空就維持待驗，有落差時用請求、回應及畫面資料退回責任票。通過後把範圍、兩份輸入提交、整合提交、回歸輸出及例外送給被授權簽收的人。本例由產品負責人記錄接受或退回、姓名與日期；接受後才把該提交登記為 B1。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cstrong>自我驗收\u003c/strong>　只有 UI mock 測試能否證明系統端到端正確？它最多顯示畫面如何處理給定回應。要簽收，還需看到同一整合提交上的真實請求、回應與畫面，以及批准記錄。\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 在本章僅用於確有實際觀察且標出範圍的核查，見章內編審；上述三例的產品結果皆待實跑。\u003c/p>\n\u003cp data-passage=\"p-7\">依據：P14、P17、S04；T06、concepts/quality.md、examples/handoff-and-evidence.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P14、P17、S04\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://git-scm.com/docs/git-worktree\" rel=\"noopener noreferrer\" target=\"_blank\">P14 · Git · git-worktree\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/worktree.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-spec.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p14-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s04-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.13", "firstSlide": 251, "lastSlide": 253}, {"id": "C35", "chapter": "03", "title": "多輪需求管理：從已簽收版本建立新契約", "track": "", "role": "core", "parent": "", "lead": "設想產品負責人已接受待辦網站的單選功能，現在想多勾一個標籤。協調者得先找出上次簽收的版本，再請產品負責人說明，多勾一項時清單應縮小還是擴大。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設已從原版 B0 完成單標籤篩選並簽收 B1，產品方又問：「可以同時選 work 和 home 嗎？」在 A 只帶 work、B 只帶 home 的資料裡，若要求兩個標籤都符合（AND），結果是空；若其中一個符合即可（OR），結果是 A、B。同一句新需求導出不同畫面，原來的單標籤契約無法替產品方選擇。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先定位 B1 的簽收與提交，以它為第二輪起點，在工作票索引登記新契約票 \u003ccode>R2-F0\u003c/code>，列兩種預期與對既有單標籤測試的影響，請有權者選擇，再凍結樣本、拆新的實作票。索引內的 \u003ccode>R1-F0\u003c/code> 仍指第一輪單標籤契約，\u003ccode>R2-F0\u003c/code> 指從 B1 提出的多選需求。原票保留當時的起點、規則與結果，才能追查為何當時接受 B1。\u003c/p>\n\u003cfigure>\u003cfigcaption>合成案例｜在兩張契約票上分別記起點與決定\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">核對欄位\u003c/th>\u003cth scope=\"col\">第一輪 R1-F0\u003c/th>\u003cth scope=\"col\">第二輪 R2-F0\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">承接的版本\u003c/th>\u003ctd>原待辦清單 B0\u003c/td>\u003ctd>具權者已接受的單選版 B1\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">這張票要決定什麼\u003c/th>\u003ctd>選 work 得 A，清除得 A、B，未知標籤得空清單\u003c/td>\u003ctd>同選 work、home 要求全部符合，還是任一符合？\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">下一步的依據\u003c/th>\u003ctd>按核准的單選契約做局部與整合驗證\u003c/td>\u003ctd>記下具權者對多選的決議，才可按新契約拆票\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cp data-passage=\"p-3\">\u003cstrong>自我驗收\u003c/strong>　新需求可直接沿用 F1 的已完成狀態嗎？舊票證明的範圍只到先前核准的單標籤交付。即使指派原班人馬，雙標籤的輸入與接受條件都要重新確認。\u003c/p>\n\u003ch2 data-section>下一輪要保留什麼、重新登記什麼\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 接續需求時可用兩列交底。第一列填「沿用」：既有角色與責任邊界、版本庫、單標籤回歸測試、規範與治理記錄；這些資產讓下一位執行者能從已知狀態出發。第二列填「重核」：已接受的 B1 具體提交、當輪授權、待辦 Task 的新編號及其前置，每次派出才登記新 Dispatch。若舊 Session 已關，新的承辦者仍可從這兩列還原工作。若沿用目錄，還要查它檢出的版本是否已對上 B1。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>自我驗收\u003c/strong>　哪項資料是下次需求的權威起點？查已接受的 B1 提交和對應的批准記錄。第二項需求需要全部重新建立角色嗎？可沿用 API 責任和原負責人；把舊票的成功狀態抄到他的新票上，卻會跳過雙標籤的決策與驗收。\u003c/p>\n\u003cp data-passage=\"p-6\">依據：P13（Experimental）、S02、U-B、P05、P12；T05、T06、examples/scenario.md、examples/decision-cases.md。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P05、P12、P13、S02、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://orca.dev/docs/model/worktrees\" rel=\"noopener noreferrer\" target=\"_blank\">P12 · Orca · Worktrees\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/authority.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/role-design.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/decision-cases.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p12-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/multi-agent-org-and-environment.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.14", "firstSlide": 254, "lastSlide": 256}, {"id": "C36", "chapter": "03", "title": "持續監督設計：從任務記錄恢復派工與驗收", "track": "", "role": "core", "parent": "", "lead": "接手上一班的協調者時，先從工作票查出誰正在做、還缺哪份交件。恢復監督後，協調者應能接收有效回報，把有爭議的產品選擇送給具權者。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 按 Orca P13 收錄的 Experimental 文件，Run 提供一輪協作的命名空間與收件匣，Task 記規格、依賴和狀態，Dispatch 辨認某次嘗試，決策門可阻擋待裁決工作。Run 本身不會挑選或放置 Worker。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 使用者的 U03／S02 探討持續監督；要把它具體化，就得交代協調者暫停時狀態存在哪裡，又靠哪個事件回來。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在專案可持續讀取的任務記錄保存票、前置、責任人、基準、有效派工及最近的證據定位。協調者掃描 ready 票，在授權內派出，寫回嘗試後進入等待。收到通知是恢復入口：重讀任務記錄與收件匣，核對訊息屬於目前有效的派工，檢查產物，更新狀態，再掃描可開工的後續票。若過期訊息被再次送達，沿用已存的嘗試歷史，不得重複放行下游。這樣換一個工作階段，也能回答「我在等什麼、什麼條件到齊才繼續」。\u003c/p>\n\u003cfigure>\u003cfigcaption>監督流程設計｜換一個工作階段，也能從任務記錄接續\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>\u003cstrong>派出\u003c/strong>　查授權與前置條件，把這次派工登記在可接手的任務記錄。\u003c/li>\u003cli>\u003cstrong>等待\u003c/strong>　記下期待的回件與證據位置，收到通知時重讀票和收件匣。\u003c/li>\u003cli>\u003cstrong>核件\u003c/strong>　核對有效派工、版本與產物。過期回報歸入原嘗試。\u003c/li>\u003cli>\u003cstrong>重排\u003c/strong>　依更新後的前置條件選下一票；若欠產品決議，記明誰能裁決。\u003c/li>\u003c/ol>\u003c/figure>\n\u003ch2 data-section>什麼時候要等人裁決或退回修正\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假如收到的是「兩標籤要取聯集或交集？」而票上沒有授權，登記為待裁決，通知具權者並停住相依工作。等決議入案才重查依賴；測試失敗則附反例退回，缺失的測項保留待驗。工作票已全交回時仍要查驗收與簽收，才能結束這輪。由此可分辨該等待通知、該交還決策，或已能進行下一次派工。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>自我驗收\u003c/strong>　文檔中的實驗性能力能否當作使用者完整實測？要主張某次無人端到端完成，至少要能沿同一輪的記錄追到派工、等待、喚回、有效回件、重新放行及最終接受，並標明中間有無人工介入。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 現有來源沒有這條完整的個人執行軌跡；可以檢查設計所需的狀態與出口，持續自治和加速效果仍是待驗假設。\u003c/p>\n\u003cp data-passage=\"p-5\">依據：P13、S02、U-B；T06、concepts/coordination.md、concepts/supervision.md、examples/task-dag.md。\u003c/p>\n\u003cp data-passage=\"p-6\">若要處理兩份互斥版本、權限不足或阻塞時要等多久，接讀第四章的執行決策。若要決定這樣分工是否划算，接讀第五章的驗證與量測，帶上本章留下的版本、退回、等待與接受記錄。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、待比較的假設、公開技術文件。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P13、S02、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/supervision.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/task-dag.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/requirements-to-delivery.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "3.15", "firstSlide": 257, "lastSlide": 261, "subtitle": "沒有人盯著聊天室時，工作靠什麼繼續？"}, {"id": "C37", "chapter": "04", "title": "需求歧義：區分產品決定與實作自由", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者研究 U07 提出一個實際困難：需求省略的選擇，執行者仍得設法處理。讀一張規格時，可以圈出那些一換寫法就會改變使用者所得結果的字。若有兩種輸出都符合文字，產品仍留有選擇。至於用迴圈或查表，只要行為、效能及架構約束都滿足，專案可以把這部分自由度留給實作者。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 「讓我按標籤找待辦」給了目的。加入契約「選一個標籤，列出精確相符的待辦；清除時顯示全部」，才縮小可接受的結果。再給固定資料 A 只有 work、B 只有 home，讀者便能算出選 work 應只見 A。把這組資料載入，呼叫清單介面並比較回傳識別碼與 \u003ccode>expected_ids=[A]\u003c/code>，才有一個可重跑的測試。參考程式也能示範怎樣計算結果；採用前仍要查它示範的版本和情境，尤其要確認其偶然行為有無被批准。\u003c/p>\n\u003ch2 data-section>用一次雙選找出規格漏掉的決定\u003c/h2>\n\u003cp data-passage=\"p-3\">現在假定上述單選已驗收，稱這個共同起點為 B1。新需求要求同時選 work、home。舊測試只選 work，兩種多選演算法都能過；把它照抄一份，仍無法區分兩者。把相同的 A、B 餵給「每個標籤都符合」和「至少一個符合」兩個候選，預期識別碼分別是空清單與 A、B。先把兩份預期並列交給決策者，批准後才採用其中一份作新契約。這一步讓缺的產品決定浮現，也保留了原本單選的測例。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>驗收練習。\u003c/strong> 詳細文件是否必然比不完整文件更正確？即使寫清楚按鈕大小與字體，仍可漏掉「全部符合或任一符合」。試著指出一項仍由實作者選擇的可見行為。範例有一個輸入就足以定義所有情況嗎？只給單選時無法排除任一多選規則，應再給能讓兩條規則產生不同結果的輸入。文件長度無法換算為需求正確率。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05（AGENTS.md 專案）支持把專案指引做成可找到的入口；P17（Ryan Lopopolo／OpenAI）描述把約束做成檢查的一個團隊案例。需求自由度的討論取自 U-B／U07。算例見 Wiki \u003ccode>examples/scenario.md\u003c/code>、\u003ccode>tutorials/uncertainty-conflict-governance.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例、個人直接觀點的轉述。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P05、P17、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/authority.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/decision-cases.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/uncertainty-conflict-governance.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.01", "firstSlide": 263, "lastSlide": 266, "subtitle": "規格寫到哪裡，實作者才能動手？"}, {"id": "C38", "chapter": "04", "title": "從需求到實作：用同一輸入追查語義分歧", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 除錯先找行為在哪一次轉換中分開。人想「找相關待辦」，文件寫成「可選兩個標籤」，實作者再把文字譯成比對條件，最後畫面呈現符合條件的資料。請分別保存意圖、規格原句、比對條件、畫面上預期的識別碼。從結果倒查，就看得見哪個推論原先缺了根據。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 用兩張紙代表兩筆待辦：A 只有 work，B 只有 home。同時勾 work 和 home。若採 AND（交集），先找出有 work 的 A，再看 A 是否也有 home；A 被排除，B 原來就缺 work，結果是空清單。若採 OR（聯集），逐筆問是否至少中一個，結果是 A、B。只勾 work 時兩條規則卻都傳回 A。用每一方自己選定的預期去測自己的程式，只能得知它有沒有照自己的解讀實作。\u003c/p>\n\u003cfigure>\u003cfigcaption>紙上演算｜A 只有 work，B 只有 home，同時勾選兩個標籤\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">候選規則\u003c/th>\u003cth scope=\"col\">A 會留下嗎？\u003c/th>\u003cth scope=\"col\">B 會留下嗎？\u003c/th>\u003cth scope=\"col\">候選畫面\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">全部符合（AND）\u003c/th>\u003ctd>缺 home\u003c/td>\u003ctd>缺 work\u003c/td>\u003ctd>空清單\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">任一符合（OR）\u003c/th>\u003ctd>符合 work\u003c/td>\u003ctd>符合 home\u003c/td>\u003ctd>A、B\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003ch2 data-section>請產品負責人選擇畫面應出現的結果\u003c/h2>\n\u003cp data-passage=\"p-3\">把「希望更準」換成一個能回答的問題：「在這兩筆資料下，同時勾選時，你要看到空清單，還是兩筆都看到？」若回答希望縮小清單，請他對照空清單確認；若希望擴大檢索，同樣確認 A、B。將批准人、適用的需求版本、這組輸入及獲選的輸出存入契約，再讓兩個實作對同一份預期重測。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>驗收練習。\u003c/strong> 為什麼雙方測試都通過仍可能衝突？找兩份測試各自拿什麼當正確答案；它們可以在同一份模糊文字下採取相反規則。未批准時哪個輸出可以記成正式答案？兩個輸出都可登記為候選，正式答案欄仍待有權者確認。這個手算示範沒有提供實際程式執行結果。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提供越過產品決策邊界時回交的觀點。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P17 支持將已知規則回饋到工程環境。四段追查及手算依 Wiki \u003ccode>tutorials/uncertainty-conflict-governance.md\u003c/code>、\u003ccode>examples/decision-cases.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P17、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/authority.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/decision-cases.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/uncertainty-conflict-governance.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.02", "firstSlide": 267, "lastSlide": 271, "subtitle": "兩個實作者怎會各自證明自己正確？"}, {"id": "C39", "chapter": "04", "title": "工程約束：檢查已核准的規則，保留待決選項", "track": "", "role": "core", "parent": "", "lead": "假設你維護待辦清單的資料介面。使用者目前一次選一個標籤，清除後應看見全部。這一頁從第一輪已核准的單選規則出發，再看誰能決定下一輪是否開放多選。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> F0 是這個待辦案例的規格核准票。有人準備把篩選參數 tag 從一個字串改成一串值，理由是日後容易加多選。這會改變其他程式呼叫清單介面（API）的方式。請先按下表核對 F0，再決定這項「順手改善」是否在票內。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"F0 允許表格\" data-passage=\"p-2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">F0 允許\u003c/th>\n\u003cth scope=\"col\">F0 禁止\u003c/th>\n\u003cth scope=\"col\">F0 待決\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>在指定模組實作唯讀單標籤精確比對；清除時省略 tag；未知標籤回成功與空清單。\u003c/td>\n\u003ctd>新增標籤、寫入待辦資料、引入多選或擅改既有 API 型別。\u003c/td>\n\u003ctd>空字串與大小寫的解釋；未來多值規則須另案決定。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>讓資料形狀、產品行為和模組依賴各有檢查\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把允許和禁止的邊界交給不同檢查。Schema 是資料形狀的約定，可在既有單選介面的檢查中攔下意外的型別變更。fixture 是每次測試都能重建的固定資料；以 A(work)、B(home) 呼叫 API，核對 work 得 A、省略參數得 A/B、未知標籤得空且狀態碼 200。回歸測試保存先前已允諾的行為，供日後改版重跑。架構 Lint 則讀程式結構，例如發現畫面模組直接匯入受限的資料寫入模組時，報出違規檔案。測清單正確與檢查依賴方向，各有自己的失敗訊號。\u003c/p>\n\u003ch2 data-section>新規則何時能寫進測試\u003c/h2>\n\u003cp data-passage=\"p-4\">若日後需求二由有權者選定 OR，才加入雙選的 expected_ids 為 A、B，並保留選 work 只見 A 的相容測試。若批准前就寫 OR 為唯一正解，檢查器會拒絕仍合理的 AND，反而把作者的猜測固化。越過停點時，保存輸入和兩個方案，停下受影響的修改。其他已授權、與待決規則無關的測項仍可進行。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>驗收練習。\u003c/strong> 未授權 Worker 可否自行變更 API 的 tag 型別？應指出受影響的呼叫端與既有契約，將變更交給具權者。測試通過能否保證所有未列情境？只測 work 與省略 tag，便沒有覆蓋傳空字串的路徑。人類可把逐行審查集中在權限、資料遷移或未測相容性；審查投入和程式品質須各自以具體改動與結果判讀。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 支持記錄專案操作指引，P17 支持以工具檢查架構限制。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> U-B 中 U04 提供規格停點的設計背景；上述檢查為案例設計。Wiki \u003ccode>concepts/harness.md\u003c/code>、\u003ccode>examples/scenario.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、公開技術文件。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P05、P17、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/authority.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/decision-cases.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/uncertainty-conflict-governance.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.03", "firstSlide": 272, "lastSlide": 275}, {"id": "C40", "chapter": "04", "title": "決策授權矩陣：產品規則由誰批准", "track": "", "role": "core", "parent": "", "lead": "第一輪的單標籤功能已經簽收。假設產品負責人現在想讓使用者多勾一項標籤，協調者可以安排人力，還需要請有權決定產品行為的人指出清單應如何變化。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 工作交到誰手上，和誰可以改變約定，是兩個不同問題。授權矩陣把每一類決定對應到獲准的人。假定 F0 是核准待辦清單單選行為的工作票，本案如此分工：\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"角色表格\" data-passage=\"p-2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">角色\u003c/th>\n\u003cth scope=\"col\">本案獲准的決定\u003c/th>\n\u003cth scope=\"col\">遇到界線時的交付\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Worker（執行者）\u003c/td>\n\u003ctd>在指定模組修正符合既有契約的程式。\u003c/td>\n\u003ctd>交差異、測項及仍不明的輸出。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Coordinator（協調者）\u003c/td>\n\u003ctd>調整已批准工作的人手、相依順序及等待安排。\u003c/td>\n\u003ctd>把影響產品的選項送給產品負責人。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integrator（整合者）\u003c/td>\n\u003ctd>合併維持行為的變更，在共同版本重測。\u003c/td>\n\u003ctd>遇互斥結果時保留兩邊及重現資料。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>具權的人類\u003c/td>\n\u003ctd>本案由產品負責人批產品語義，重大架構另向具相應授權者確認。\u003c/td>\n\u003ctd>留下適用版本、選擇、理由與生效範圍。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>把兩個候選結果送給有權決定的人\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 一份可直接裁決的決策包可以這樣寫：「單選版本已驗收。新需求要同時勾 work、home，A 只有 work，B 只有 home。選 AND 顯示空清單，適合縮小結果；選 OR 顯示 A、B，適合擴大結果。兩案都要同步更新 API、畫面說明與相容測試。先等可避免依錯誤語義開發；若需要試用，可授權做兩個唯讀原型，代價是額外實作與比較。請產品負責人確認期望清單。答覆前，雙選實作待決。」收到答案後由協調者更新票、通知受影響者，整合者持同一預期重測。沒收到答覆時仍可維護既有單選檢查。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>驗收練習。\u003c/strong> Coordinator 若無產品決策權能否擅自決定 OR？查票上「改產品語義」那一列的批准權，只有排程授權就只能整理選項。人類應收到哪兩種輸出才能裁決？對同一輸入給出 AND 的空清單與 OR 的 A、B，附上受影響介面、等待或原型的成本與待回覆者。其他專案可明文授權給另一角色；換一個職稱無法自行取得這項權力。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07、S02 記錄使用者對分工與越權停點的觀點。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Orca 的 P13 記述實驗性 Orchestration 的派工與決策閘門。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 角色權限取自案例 T07，非產品預設值。Wiki \u003ccode>concepts/coordination.md\u003c/code>、\u003ccode>examples/decision
