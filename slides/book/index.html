<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多 Agent 軟體開發實踐指南</title>
  <style>:root {
  --ink:#1a322f; --muted:#4e635d; --green:#154e43; --line:#c5cec3;
  --paper:#faf9f3; --tint:#e9eee3; --accent:#9b4c2e;
  font-family:"Source Sans 3","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink); background:var(--paper); line-height:1.75;
}
* {box-sizing:border-box}
[hidden] {display:none!important}
body {margin:0}
a {color:var(--green);text-underline-offset:.2em}
a:hover {color:var(--accent)}
:focus-visible {outline:3px solid #ae561c;outline-offset:3px}
h1:focus:not(:focus-visible),h2:focus:not(:focus-visible) {outline:0}
.mast {border-top:5px solid var(--green);border-bottom:1px solid var(--line)}
.mast>div {max-width:1320px;padding:15px clamp(16px,4vw,64px);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mast a {text-decoration:none;font-weight:700;font-size:.88rem}
.mast .brand {display:flex;align-items:center;gap:12px;font-size:1.05rem;letter-spacing:.035em}
.brand span {display:inline-grid;place-items:center;color:white;background:var(--green);width:31px;height:34px;border-radius:2px 7px 2px 2px;font:700 26px/1 Georgia,serif}
.spread {display:grid;grid-template-columns:minmax(165px,230px) minmax(0,850px);gap:clamp(36px,5vw,80px);justify-content:center;padding:46px clamp(20px,4vw,64px) 64px}
.rail {position:sticky;top:24px;max-height:94vh;overflow:auto;font-size:.94rem}
.rail>a,.rail-title {font-weight:750}
.rail>a {text-decoration:none}
.rail-title {margin:28px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
nav {display:grid;gap:10px}
nav a {border-left:2px solid var(--line);padding:3px 10px;text-decoration:none;color:var(--muted)}
nav a:hover {border-color:var(--accent)}
.compact-nav {display:none}
.opening {border-bottom:2px solid var(--green);padding-bottom:24px}
.kicker {display:flex;align-items:center;gap:18px;color:var(--accent);font-size:.9rem;letter-spacing:.075em;font-weight:750}
.kicker span,small,samp,code {font-family:"IBM Plex Mono",Consolas,"Microsoft JhengHei",monospace}
.kicker span {color:var(--muted);margin-left:auto;letter-spacing:.02em}
h1,h2 {font-family:"Source Han Serif TC","Noto Serif TC","PMingLiU",serif;text-wrap:pretty}
h1 {font-size:clamp(2.05rem,3.6vw,3.45rem);line-height:1.3;margin:14px 0 0;font-weight:750;letter-spacing:-.025em}
h2 {font-size:clamp(1.55rem,2.2vw,2rem);line-height:1.45;color:var(--green);margin:2em 0 .6em;scroll-margin-top:20px}
h3 {line-height:1.5}
.reading {font-size:clamp(1.05rem,1.4vw,1.19rem);line-height:1.96;overflow-wrap:anywhere}
.reading p {margin:1.1em 0}
.reading>p:first-child,.reading>blockquote {font-size:1.1em}
blockquote {margin:1.5em 0;padding:12px 20px;border-left:4px solid var(--accent);background:#f2eee1}
code {font-size:.94em;background:#e9ece4;border-radius:3px;padding:.06em .22em}
figure,.practice {margin:24px 0;padding:clamp(16px,2.5vw,30px);border:1px solid var(--line);border-radius:6px;background:#f1f3ea}
figcaption,.practice h3 {font-size:1.15rem;color:var(--green);font-weight:750;margin:0 0 18px}
.flow-node,.flow-end {text-align:center;line-height:1.5;padding:12px 8px;background:var(--green);color:white;border-radius:4px;font-weight:700}
.flow-end {background:none;color:var(--ink);padding-bottom:0}
.fork,dl {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
.fork>div,dl>div {background:var(--paper);padding:12px;border:1px solid var(--line);border-radius:3px;text-align:center}
.fork span {display:block;font-size:.91em}
details {font-size:.95rem;margin-top:15px}
summary {cursor:pointer;color:var(--green);font-weight:650}
pre {overflow:auto;padding:12px;background:white;font:1rem/1.6 Consolas,monospace}
.table-scroll {overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:4px}
table {width:100%;border-spacing:0;font-size:1rem;line-height:1.7}
th,td {text-align:left;padding:12px;vertical-align:top;border-bottom:1px solid var(--line)}
th {background:var(--green);color:white}
td {background:#fffefa}
tr:nth-child(even) td {background:#f0f2e9}
tr:last-child td {border-bottom:0}
tbody td:first-child {font-weight:650}
.cols-6 {min-width:780px}.cols-8 {min-width:1080px}
.cards th:first-child {min-width:5.5em}
.ledger td:first-child,.ledger th:first-child {position:sticky;left:0;box-shadow:1px 0 var(--line);min-width:4.6em}
textarea {min-width:6em;width:100%;font:inherit;background:var(--paper);border:1px solid #879b8f;border-radius:3px}
button {font:inherit;font-size:.96rem;line-height:1.45;padding:9px 14px;cursor:pointer;color:var(--green);border:1px solid #8aa297;border-radius:4px;background:var(--paper)}
button:hover,button[aria-pressed=true] {background:var(--green);color:white}
button:disabled {background:#e6e9e0;color:#52635c;border-color:#c3ccc2;cursor:default}
.controls {display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
dl {grid-template-columns:repeat(3,minmax(0,1fr))}
dt {font-size:.88rem;color:var(--muted)} dd {margin:4px 0;font-weight:650}
.practice [role=status]:not(:empty) {background:#fffdf4;border-left:3px solid var(--accent);padding:10px 14px}
.practice [role=status]:empty {display:none}
.sources {border-top:1px solid var(--line);margin-top:40px;font-size:1rem}
.sources h2 {margin-top:24px}
.sources h3 {font-size:1rem}
.sources ul {padding-left:1.2em}
.sources samp {display:block;color:var(--muted);font-size:.89rem}
@media(max-width:920px) {
  .spread {display:block;max-width:820px;margin:auto;padding-top:28px}
  aside {display:none}
  .compact-nav {display:block;padding:8px 0;border-bottom:1px solid var(--line);margin:0}
  .compact-nav nav {padding:10px 0}
}
@media(max-width:620px) {
  .mast .brand {font-size:.87rem;gap:7px}.mast>div {padding:10px 14px}
  .mast .brand span {width:23px;height:27px;font-size:21px}
  .mast a {font-size:.8rem}
  .spread {padding:24px 16px 38px}
  .opening {padding-bottom:18px}
  .kicker {font-size:.8rem;gap:5px}
  h1 {font-size:2.1rem}

  .cards {border:0}
  .cards table,.cards tbody,.cards tr,.cards td {display:block}
  .cards thead {position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
  .cards tr {border:1px solid var(--line);margin:0 0 12px;border-radius:4px;overflow:hidden}
  .cards td {padding:8px 12px;border-bottom:1px solid var(--line)}
  .cards td:before {content:attr(data-label);display:block;font-size:.83rem;font-weight:700;color:var(--muted)}
  .cards td:first-child {background:var(--tint)}
  .fork {gap:6px}.fork>div {padding:8px 4px}
  dl {grid-template-columns:1fr} dl>div {text-align:left}
  footer {font-size:.9rem}
}

/* The catalogue uses the same paper, ink and typescale as the lesson pages. */
.skip {position:absolute;left:12px;top:-6em;background:var(--green);color:white;padding:8px 16px;z-index:2}
.skip:focus {top:8px;color:white}
.catalogue {max-width:1320px;margin:auto;padding:clamp(20px,3vw,44px) clamp(16px,4vw,64px) 80px}
.cover {color:#fffdf4;background:var(--green);padding:clamp(24px,4.5vw,66px);display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(32px,6vw,80px);align-items:center}
.cover h1 {font-size:clamp(2.3rem,4.5vw,4.2rem);letter-spacing:.005em;line-height:1.28;margin:0}
.edition {font-size:.94rem;font-weight:650;letter-spacing:.14em;color:#e7dcc1;margin:0 0 14px}
.start {display:inline-flex;gap:22px;align-items:center;font-weight:700;color:var(--green);background:var(--paper);padding:9px 16px;text-decoration:none;margin-top:26px}
.start:hover {background:white;color:var(--green);text-decoration:underline}
.routes {padding-left:clamp(20px,3vw,42px);border-left:1px solid #72908a;gap:0}
.routes h2 {color:#e7dcc1;font-weight:650;line-height:1.5;font-family:inherit;font-size:1rem;letter-spacing:.08em;margin:0 0 8px}
.routes a {border:0;border-bottom:1px solid #5a7e73;color:#fffdf4;padding:8px 0;display:flex;align-items:center;justify-content:space-between}
.routes a:hover {color:white;text-decoration:underline}
.catalogue-heading {margin:42px 0 26px;display:flex;gap:12px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--green);padding-bottom:10px}
.catalogue-heading h2,.chapter-entry h3 {margin:0}
.catalogue-heading span {color:var(--muted);font-size:.92rem}
.catalogue-grid {display:grid;grid-template-columns:minmax(180px,230px) minmax(0,1fr);gap:clamp(32px,4vw,66px)}
.rail {padding:4px}
.rail small,.index-list small,.chapter-entry small {font-variant-numeric:tabular-nums;color:var(--accent)}
.chapter-entry {margin-bottom:34px}
.chapter-entry h3 {font-family:"Noto Serif TC","PMingLiU",serif;font-size:clamp(1.35rem,2vw,1.7rem)}
.chapter-entry h3 a {text-decoration:none;display:flex;align-items:baseline;gap:12px}
.chapter-entry h3 a:hover,.index-list a:hover span {text-decoration:underline}
.chapter-entry h3 small {font:normal 1.05rem/1.4 Georgia,serif}
.chapter-entry h3 span {font:normal 1.1rem/1 system-ui;margin-left:auto}
.track h3 {color:var(--muted);font-weight:700;line-height:1.6;font-family:inherit;font-size:1rem;margin:18px 0 4px}
.index-list {list-style:none;padding:0;margin:12px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px}
.index-list li {border-top:1px solid var(--line)}
.index-list a {display:flex;align-items:baseline;gap:.8em;padding:10px 2px;text-decoration:none;font-weight:600;line-height:1.6}
.index-list small {font-size:.79rem;white-space:nowrap;font-weight:500}
.spread {align-items:start}
.spread>article {min-width:0}
.spread>aside,.catalogue-grid>aside {position:sticky;top:20px}
.breadcrumbs {font-size:.92rem;color:var(--muted);margin-bottom:22px}
.lead {font-size:1.13rem;color:var(--muted)}
.deeper {margin:32px 0 12px;border-top:2px solid var(--green)}
.deeper h3 {color:var(--green)}
.chapter-notes {border-bottom:1px solid var(--line);padding:10px 0 14px}
.turns {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.turn {padding:10px 0;text-decoration:none;font-weight:650}
.turn small {display:block;color:var(--muted);margin-bottom:5px}
footer {margin-top:42px;border-top:2px solid var(--green);padding:14px 0}
.reading img,.reading svg,.reading video,.reading canvas {max-width:100%;height:auto}
.reading pre {max-width:100%;white-space:pre;overflow-x:auto}
.reading pre code {background:none}
.reading td {overflow-wrap:anywhere}
.reading textarea {resize:vertical;max-width:100%}
.reading .table-scroll table {min-width:max(100%,32em)}
.reading .table-scroll .cols-6 {min-width:780px}
.reading .table-scroll .cols-8 {min-width:1080px}
.reading [data-passage] {scroll-margin-top:12px}
.trace-results li {padding:6px 2px}
.trace-results details {margin:0}
@media(max-width:920px) {
  .catalogue-grid {display:block}
  .cover {gap:24px;grid-template-columns:1.2fr 1fr}
  .catalogue-grid>aside {display:block;position:static;margin-bottom:24px}
  .catalogue-grid .rail {display:flex;flex-wrap:wrap;gap:5px 10px;position:static}
  .catalogue-grid .rail a {padding:3px 8px}
}
@media(max-width:650px) {
  .cover {grid-template-columns:minmax(0,1fr);padding:24px}
  .cover h1 {font-size:clamp(2.1rem,7.5vw,3rem)}
  .routes {border:0;border-top:1px solid #72908a;padding:14px 0 0}
  .routes a {padding:6px 0}
  .catalogue-heading {align-items:flex-start;flex-direction:column;gap:0;margin-top:25px}
  .index-list {grid-template-columns:minmax(0,1fr)}
  .index-list a {padding:11px 2px}
}
@media(max-width:620px) {
  .reading .cards table {min-width:0}
  .turns {display:block}
  .turn {display:block}
  .reading ul,.reading ol {padding-inline-start:1.4em}
  .ledger td:first-child,.ledger th:first-child {position:static}
}

.reader-actions,.player-tools,.deck-turns,.deck-jumps {display:flex;align-items:center;gap:14px}
.reader-actions {flex-wrap:wrap;justify-content:flex-end}
.source-id {font-size:.85rem;color:var(--muted)}
.evidence-label {font:650 .8em/1.6 "Microsoft JhengHei",sans-serif;color:var(--green);background:#e5ece1;padding:.08em .4em;border-radius:2px}
.evidence-label[data-evidence="GAP"] {color:#7b371d;background:#f7e5ce}
.in-deck {background:#e8ebe3}
.in-deck .mast,#printed-deck {display:none}
.player {height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:1920px;margin:auto}
.player-bar,.deck-controls {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px clamp(14px,3vw,60px);background:var(--paper)}
.player-bar {border-top:4px solid var(--green);border-bottom:1px solid var(--line)}
.deck-brand {display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:750;letter-spacing:.02em}
.deck-brand span {color:var(--paper);background:var(--green);font:700 21px/1.5 "PMingLiU",serif;padding:0 5px;border-radius:1px 6px 1px 1px}
.player-tools a,.player-tools button {font-family:inherit;font-size:.88rem;line-height:1.4;font-weight:650}
.player-tools button {min-height:40px}
.deck-stage {min-height:0;min-width:0;display:grid;place-items:center;padding:clamp(8px,1.6vw,26px);container-type:size}
#slide {width:min(100cqw,177.778cqh);height:min(56.25cqw,100cqh);container-type:inline-size}
.slide-sheet {position:relative;isolation:isolate;display:flex;flex-direction:column;width:100%;height:100%;min-height:0;
  padding:clamp(16px,3.2cqw,66px) clamp(18px,5cqw,98px) clamp(10px,1.8cqw,40px);
  background:var(--paper);border:1px solid #bac6ba;border-top:5px solid var(--green);box-shadow:0 4px 16px #24392b12;overflow-wrap:anywhere}
.slide-sheet header {flex:none}
.slide-sheet h1 {font-size:clamp(23px,3.8cqw,72px);line-height:1.28;margin:0;color:var(--green);letter-spacing:-.025em}
.slide-eyebrow {margin:0 0 .8em;color:var(--muted);font-size:clamp(13px,1.35cqw,25px);line-height:1.4;font-weight:700}
.title-subtitle {margin:.32em 0 0;color:var(--muted);font-weight:400;line-height:1.45}
.opening .title-subtitle {font-size:clamp(1rem,1.7vw,1.25rem)}
.slide-sheet .title-subtitle {font-size:clamp(15px,1.65cqw,26px)}
.slide-body {overflow:auto;overscroll-behavior:contain;min-height:0;min-width:0;flex:1;margin-top:clamp(10px,2cqw,38px);font-size:clamp(17px,2.15cqw,40px);line-height:1.72;scrollbar-color:#879b8f transparent}
.slide-body>:first-child {margin-top:0}
.slide-body>:last-child {margin-bottom:0}
.slide-body p {margin-block:0 .78em}
.slide-body li {margin-bottom:.28em}
.slide-body h2,.slide-body h3,.slide-body h4 {font-size:1.12em;line-height:1.45;color:var(--green);margin:.45em 0}
.slide-body figure,.slide-body .practice {margin:0;padding:.75em 1em}
.slide-body figcaption {font-size:1em;margin-bottom:.5em}
.slide-body img,.slide-body svg {max-width:100%;height:auto}
.slide-body .table-scroll {margin:0}
.slide-body table {font-size:clamp(15px,1.58cqw,30px);line-height:1.5}
.slide-body th,.slide-body td {padding:.5em .68em}
.slide-body pre {font-size:clamp(15px,1.6cqw,30px);line-height:1.5;margin:.45em 0}
.slide-body pre code {background:none}
.slide-body details {font-size:.9em}
.slide-body .practice {font-size:clamp(16px,1.55cqw,27px)}
.slide-body .practice button {font-size:max(15px,.9em)}
.slide-body .practice dl,.slide-body .practice .controls {margin:.45em 0}
.slide-body .practice p:last-child {margin-bottom:0}
.slide-body.compact {font-size:clamp(16px,1.8cqw,34px);line-height:1.58}
.slide-body.compact figure,.slide-body.compact .practice {padding:.55em .8em}
.slide-body.compact table {font-size:clamp(14px,1.4cqw,25px);line-height:1.45}
.slide-body.compact th,.slide-body.compact td {padding:.34em .55em}
.slide-body.compact .flow-node,.slide-body.compact .fork>div {padding:6px}
.slide-body.compact figure:has(.flow-node) {font-size:clamp(16px,1.68cqw,32px);line-height:1.4}
.slide-body.compact .fork {margin:.22em 0}
.slide-body.compact .flow-node {padding:.16em .5em}
.slide-body.compact .flow-end {padding:.25em .5em 0}
.slide-body.compact figure details {margin-top:.35em}
.slide-folio {min-height:1.75em;line-height:1.4;margin-top:clamp(8px,1.5cqw,26px);padding-top:.5em;border-top:1px solid var(--line);display:flex;align-items:center;gap:1em;
  font-size:clamp(11px,1.05cqw,19px);color:var(--muted);font-variant-numeric:tabular-nums}
.slide-folio span:first-child {flex:1}
.slide-folio b {font:700 1.3em/1 Georgia,serif;color:var(--green)}
.slide-sheet.type-cover {background:var(--green);color:var(--paper);border-color:var(--green);overflow:hidden}
.front-copy,.chapter-copy {position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.front-copy {max-width:62%}
.front-copy h1 {font-size:clamp(30px,6.4cqw,116px);line-height:1.22;color:var(--paper);text-wrap:balance}
.front-copy .slide-eyebrow,.type-cover .slide-folio,.type-cover .slide-folio b {color:#e4ddc6}
.front-route {margin:1.8em 0 0}
.front-route a {color:var(--paper);font-size:clamp(15px,1.55cqw,30px);text-decoration-thickness:1px;text-underline-offset:.45em}
.type-cover .slide-folio {border-color:#6e9183}
.book-art {position:absolute;right:8%;top:24%;width:22%;height:49%;transform:skewY(-12deg);color:#ddd3b7}
.book-art i {position:absolute;inset:0;background:#1f5549;border:1px solid currentColor;transform:translate(12%,10%)}
.book-art i:nth-child(2) {transform:translate(6%,5%)}
.book-art i:last-child {transform:none;background:linear-gradient(90deg,#d8d0b6 0 6%,transparent 6% 10%,#8caa94 10% 10.5%,transparent 10.5%),repeating-linear-gradient(0deg,transparent 0 17%,#789487 17% 17.5%),#255d50}
.chapter-copy {border-left:clamp(4px,.65cqw,12px) solid var(--accent);padding-left:4%;margin:4% 0 2%}
.chapter-copy h1 {font-size:clamp(30px,5.2cqw,98px)}
.chapter-intro {font-size:clamp(18px,2.35cqw,44px);line-height:1.7;max-width:34em;margin:.85em 0 0}
.deck-index {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;gap:0 4%;font-size:clamp(16px,1.75cqw,32px)}
.deck-index a {display:flex;align-items:baseline;gap:.6em;line-height:1.5;border:0;border-bottom:1px solid var(--line);padding:.8em 0;color:var(--green)}
.deck-index b {font-size:.82em;color:var(--accent);white-space:nowrap}
.deck-index i {margin-left:auto;font-style:normal}
.deck-controls {border-top:1px solid var(--line);min-width:0}
.deck-controls label {display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.85rem;font-weight:650;min-width:0}
.deck-jumps {min-width:0;gap:16px}
.deck-jumps select {font:inherit;font-size:.94rem;min-width:0;max-width:24vw;padding:5px;color:var(--green);background:var(--paper);border:1px solid var(--line);border-radius:3px;height:42px}
.deck-turns {flex:none}
.deck-turns button {font-size:1.3rem;min-width:46px;min-height:42px;line-height:1;padding:8px}
#slide-counter {font-size:.94rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#deck-notice {position:absolute;top:50px;right:10px;z-index:2;max-width:85vw;background:var(--green);color:white;padding:6px 12px;font-size:.85rem;border-radius:3px}
#deck-notice:empty {display:none}
@media (max-aspect-ratio:1/1) {
  #slide {width:100cqw;height:min(100cqh,110cqw)}
  .slide-sheet {padding:clamp(16px,4cqw,36px);border-top-width:4px}
  .slide-sheet h1 {font-size:clamp(24px,4.5cqw,42px)}
  .front-copy h1,.chapter-copy h1 {font-size:clamp(36px,7cqw,66px)}
  .slide-body {font-size:clamp(17px,2.8cqw,26px)}
}
@media(max-width:700px) {
  .deck-controls {flex-wrap:wrap;gap:6px;padding:6px 12px}
  .deck-jumps {width:100%;gap:8px}
  .deck-jumps label {flex:1}
  .deck-jumps select {flex:1;width:0;max-width:none}
  .deck-turns {margin:auto;gap:1em}
  .player-tools {gap:8px}
  .player-tools button {padding:5px 8px}
  .deck-brand {font-size:.84rem;gap:5px;line-height:1.4}

  <noscript>請開啟 JavaScript 以使用本機教材目錄。</noscript>
  <script>const BOOK={"chapters": [{"id": "00", "title": "導論｜五章閱讀路線與案例驗收", "description": "從交付責任選擇閱讀路線，認識貫穿各章的待辦網站案例。", "body": "", "firstSlide": 3, "lastSlide": 11}, {"id": "01", "title": "Agent 基礎｜模型、工具呼叫、Agent Loop、Context 與 Harness", "description": "從對話、工具與執行環境，追到一次工程行動留下的證據。", "body": "\u003cp>你收到一份故障診斷，要決定現在能不能動手修，還是該先請人補一項檢查。判斷錯了，就可能改到原本正常的程式。C01 練習從紀錄分辨推測與觀察；C02 在同一個故障上判讀兩種調查方式。\u003c/p>\n\u003cp>可按問題跳讀：\u003ca href=\"#C01\">1.01 檢查依據\u003c/a> · \u003ca href=\"#C02\">1.02 選擇路徑\u003c/a> · \u003ca href=\"#C03\">1.03 至 C08 的閱讀入口\u003c/a>\u003c/p>\n\u003cp>想像你打開聊天視窗，問開發助手：「這個網站選了『工作』標籤，為什麼還看得到家裡的待辦事項？」助手答：「畫面可能還在顯示上一次的清單。」這是個值得檢查的想法。如果下一句是「我剛試過了」，你會想看到什麼，才願意根據它的回答去改程式？\u003c/p>\n\u003cp>理解這個問題要做兩次判斷。第一次要看這個回答的\u003cstrong>依據從哪裡來\u003c/strong>。第二次要看有了新依據之後，\u003cstrong>誰決定接下來查什麼\u003c/strong>。這兩個問題即使在同一個聊天視窗裡，也可能有不同答案。\u003c/p>\n\u003cp>若想知道聊天助手如何決定下一步，可從 \u003ca href=\"#C01\">1.01、C02\u003c/a> 讀起。本篇各節也可獨立閱讀。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"手上的問題表格\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">手上的問題\u003c/th>\n\u003cth scope=\"col\">閱讀入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>助手說測過，去哪裡找執行的證據？\u003c/td>\n\u003ctd>\u003ca href=\"#C03\">1.03 模型與執行環境\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有工具回覆之後，還要做什麼？\u003c/td>\n\u003ctd>\u003ca href=\"#C04\">1.04 工作循環與停止\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同一模型怎麼在兩個專案遇到不同障礙？\u003c/td>\n\u003ctd>\u003ca href=\"#C05\">1.05 五個工程問題\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>換人接手，哪一版規格有效？\u003c/td>\n\u003ctd>\u003ca href=\"#C06\">1.06 恢復工作狀態\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>規格埋在一堆文件裡，怎麼拿來用？\u003c/td>\n\u003ctd>\u003ca href=\"#C07\">1.07 規則、步驟、連接與檢索\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>助手能改，但誰有權決定？\u003c/td>\n\u003ctd>\u003ca href=\"#C08\">1.08 授權與退出\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "firstSlide": 12, "lastSlide": 73}, {"id": "02", "title": "單 Agent 開發｜委託方法、工具環境與工程交付", "description": "從委託方式與開發環境，走到一位助手可以重現、修復及交付的工程流程。", "body": "\u003cp>你可以讓助手解釋一段程式，也可以讓它在目錄裡改檔、跑測試。兩者都從一句話開始，結束時應交回的東西卻很不同。本線從「我要自己決定哪些事」開始。想比較開發工具，可直接去 \u003ca href=\"#C09\">B 線\u003c/a>；想從一件完整委託學起，可直接去 \u003ca href=\"#C16\">C 線\u003c/a>。\u003c/p>\n\u003cp>本章以 \u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 表示來源包核對過的公開文件，以 \u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 標示研究者親述，以 \u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> 標示歷史整理。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 是供採用的設計或教學做法，\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 是為推理設定的情境，\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 限於所引紀錄的實測範圍，\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 指明尚缺的觀察。\u003c/p>\n\u003cp>要開始一件工作，可跳到\u003ca href=\"#02-A01\">工作模式\u003c/a>、\u003ca href=\"#02-A02\">任務契約\u003c/a>或\u003ca href=\"#02-A03\">檢查點\u003c/a>。已經在執行，可查\u003ca href=\"#02-A04\">有效規格\u003c/a>、\u003ca href=\"#02-A05\">模型與預算\u003c/a>、\u003ca href=\"#02-A06\">批准停點\u003c/a>、\u003ca href=\"#02-A07\">失敗診斷\u003c/a>或\u003ca href=\"#02-A08\">續接\u003c/a>。\u003c/p>\n\u003cp>你可以直接從本線開始。假設助手交來一個修正，你想知道它動了哪份程式、在哪裡測過，以及你能不能接手。下面把同一類工作放進幾種開發環境。產品能力均採研究包 P 系列在 2026-11-21 的公開文件快照（P07 為 11-22）；介面名稱、帳戶可用性及權限以各次觀察為準。本線的操作為 \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span>，沒有跨產品跑分。\u003c/p>\n\u003cp>選路時可以按你手上的問題跳讀。要核對實際修改，先看\u003ca href=\"#C18\">檔案、終端機與版本\u003c/a>或\u003ca href=\"#C19\">瀏覽器觀測\u003c/a>。要找某個介面的操作，直接去 \u003ca href=\"#C10\">VS Code 主視窗\u003c/a>、\u003ca href=\"#C11\">Agents Window\u003c/a>、\u003ca href=\"#C12\">Antigravity\u003c/a>、\u003ca href=\"#C13\">ChatGPT／Codex 桌面\u003c/a>或 \u003ca href=\"#C14\">Orca\u003c/a>。本線把一套受版本管理的專案稱為 repository（repo），把目前工作檔案與參照版本間的逐處差異稱為 diff。想知道該交代助手哪些事，可從 \u003ca href=\"#02-A01\">A 線\u003c/a>開始；想親自走遍一次流程，可進 \u003ca href=\"#C16\">C 線\u003c/a>。\u003c/p>\n\u003cp>從這裡開始，只需知道 Git 能記錄程式的版本與修改。你是需求負責人，一位 Coding Agent 可以讀取專案、改程式、執行獲准的檢查。你們要把「可以依標籤看待辦」變成一件有起點與終點的工作。C16、C17、C20 是同一個 \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span>；C21 另讀個人專案的歷史測試紀錄。兩者的證據不可混用。\u003c/p>\n\u003cp>可以從\u003ca href=\"#C16\">準備工作區\u003c/a>、\u003ca href=\"#C17\">寫出可驗的需求\u003c/a>、\u003ca href=\"#C20\">修復與交付\u003c/a>或\u003ca href=\"#C21\">閱讀真實的修復紀錄\u003c/a>進入。文中 commit 是可識別的提交版本，diff 是兩份程式的差異；同一版本上的未提交修改也可能影響執行結果。\u003c/p>", "firstSlide": 74, "lastSlide": 169}, {"id": "03", "title": "多 Agent 協作｜角色、Worktree、Task DAG 與整合", "description": "決定如何分工，並將不同工作票交回的版本整合成一件可驗收的產品。", "body": "\u003cp>面對一項改動，可以先問「誰能交給下一個人什麼？」如果接手者還得猜上一位的意思，團隊就算同時開始，也很難在同一個版本上結案。本章從分工的理由一路追到第二項需求。例中的待辦網站、工作票、分支與回報都是教學假設，讀者可把同一套問題帶回自己的專案。\u003c/p>\n\u003cp>\u003cstrong>依問題跳讀\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>要不要分工？\u003ca href=\"#C22\">判斷交付能否分開\u003c/a> → \u003ca href=\"#C23\">找負責人\u003c/a> → \u003ca href=\"#C25\">估可同時開工的票數\u003c/a>。\u003c/li>\n\u003cli>重開視窗、移交工作會改變什麼？\u003ca href=\"#C24\">辨認六種實體\u003c/a> → \u003ca href=\"#C26\">選工作順序與控制方式\u003c/a>。\u003c/li>\n\u003cli>在哪個版本工作？\u003ca href=\"#C27\">初始化專案\u003c/a> → \u003ca href=\"#C28\">分開工作目錄與共用資源\u003c/a>。\u003c/li>\n\u003cli>要派什麼、何時派？\u003ca href=\"#C29\">寫行為契約\u003c/a> → \u003ca href=\"#C30\">拆四張票\u003c/a> → \u003ca href=\"#C31\">判讀依賴圖\u003c/a> → \u003ca href=\"#C32\">指定執行者\u003c/a>。\u003c/li>\n\u003cli>誰可以結案？\u003ca href=\"#C33\">辨認有效回報\u003c/a> → \u003ca href=\"#C34\">整合簽收\u003c/a> → \u003ca href=\"#C35\">接第二項需求\u003c/a> → \u003ca href=\"#C36\">中斷後恢復監督\u003c/a>。\u003c/li>\n\u003c/ul>", "firstSlide": 170, "lastSlide": 261}, {"id": "04", "title": "多 Agent 工程決策｜需求歧義、授權、衝突與阻塞", "description": "在需求未定、工作衝突或回報中斷時，找出需要的證據和有權決定的人。", "body": "\u003cp>同一張工作票交給兩位實作者，兩邊的測試都通過，產品卻可能給使用者相反的答案。此時多跑一次原測試能告訴你什麼？如果你只能調度人手，誰有權決定採用哪個答案？本章從這兩個問題出發，走到決策尚未作出時，如何保住成果、安排其他工作，並把證據交給下一位負責人。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"手上的問題表格\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">手上的問題\u003c/th>\n\u003cth scope=\"col\">可以從這裡開始\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>怎麼找出需求留下的選擇？\u003c/td>\n\u003ctd>\u003ca href=\"#C37\">4.01 規格留下的自由度\u003c/a> · \u003ca href=\"#C38\">4.02 算出兩種解讀\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>何時能動手，何時該請人決定？\u003c/td>\n\u003ctd>\u003ca href=\"#C39\">4.03 可執行契約與停點\u003c/a> · \u003ca href=\"#C40\">4.04 授權與決策包\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>兩個分支都綠，該用哪版？\u003c/td>\n\u003ctd>\u003ca href=\"#C41\">4.05 版本權威\u003c/a> · \u003ca href=\"#C42\">4.06 暫停或保留兩版\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作卡住，能換人或換案嗎？\u003c/td>\n\u003ctd>\u003ca href=\"#C43\">4.07 阻塞與調度\u003c/a> · \u003ca href=\"#C44\">4.08 失聯與接手\u003c/a> · \u003ca href=\"#C46\">4.10 跨案與返回\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接到完成報告，要追到哪裡？\u003c/td>\n\u003ctd>\u003ca href=\"#C45\">4.09 分層回報與交接\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>方括號標出依據。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 指本機 Wiki 所整理的公開文件；\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 與 \u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> 分別指使用者直接觀點的轉述與歷史重建。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 是供選用的工程設計，\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 是可手算的教學題設。\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 限於附有觀察的檢查，\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 表示所需證據仍缺。\u003c/p>", "firstSlide": 262, "lastSlide": 308}, {"id": "05", "title": "品質與效率｜驗收證據、交付成本與工程資產", "description": "用反例、測試與完整試次，分開判讀產品是否合格、交付成本以及長期收益。", "body": "\u003cp>一位開發者把修改交給你，附上一句「已完成」。你要決定今天能不能簽收。隔天，團隊又想知道，多找一位 Agent 幫忙是否值得。第一個問題需要能重現的產品行為和有權接受的人；第二個問題還需要知道從開始到簽收究竟發生過什麼。等使用者真正用上功能，才有機會回答第三個問題：這次開發幫到了誰？\u003c/p>\n\u003cp>可依手上的材料直接進入：\u003ca href=\"#C47\">查完成回報\u003c/a> · \u003ca href=\"#C48\">設計產品驗收\u003c/a> · \u003ca href=\"#C50\">決定哪些程式要人看\u003c/a> · \u003ca href=\"#C49\">判讀交付過程\u003c/a> · \u003ca href=\"#C51\">量時間與成本\u003c/a> · \u003ca href=\"#C52\">比較兩種分工\u003c/a> · \u003ca href=\"#C53\">量使用者效益\u003c/a> · \u003ca href=\"#C54\">決定哪些做法值得留下\u003c/a>。\u003c/p>", "firstSlide": 309, "lastSlide": 385}, {"id": "99", "title": "總結｜從需求與交付證據檢驗工程效益", "description": "把需求、分工、版本、驗收和下一輪的決策接回自己的工程現場。", "body": "", "firstSlide": 386, "lastSlide": 392}], "units": [{"id": "I01", "chapter": "00", "title": "五章閱讀路線與工程交付責任", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">想像同事把一個新按鈕交給你，請你同意讓大家使用。你看得到按鈕，也看過助手寫的程式。試著按一下之後，畫面變了。現在還差哪一項資料，才足以說「可以接受」？得先知道這個按鈕原先答應使用者什麼，再找一個能區分做對和做錯的操作。寫出程式、跑過操作、依需求接受成果，是可以由不同人完成的三件事。\u003c/p>\n\u003cp data-passage=\"p-2\">開發助手若能根據觀察選擇下一步，並請環境執行獲准操作，本書稱這樣的系統為 Agent。把工作交給一位 Agent，第一個難題是讓它收到能做、能驗的委託。分給多位 Agent，還要讓各方知道共用哪份規格、能改什麼、交回哪一版。負責監督的人則要能從一句「完成」追回那次工作的產物與測試，辨認哪些問題應由人決定。每多委託一層，原本由同一人記在腦中的約定，就多了一處需要明寫的交接。\u003c/p>\n\u003cfigure>\u003cfigcaption>誰把什麼交給下一個人？\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>\u003cstrong>需求者\u003c/strong>說明按下按鈕後應看見的行為。\u003c/li>\u003cli>\u003cstrong>執行者\u003c/strong>交出實作與可查的改動。\u003c/li>\u003cli>\u003cstrong>整合者\u003c/strong>在共同版本重做操作，記錄實得結果。\u003c/li>\u003cli>\u003cstrong>具簽收權的人\u003c/strong>把結果與原先承諾逐項對照，決定是否接受。\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp data-passage=\"p-3\">\u003cstrong>最終交付由誰負責判定？\u003c/strong> 先看專案指定誰有權決定需求、誰能接受交付。在本書的待辦案例，人類產品負責人確認期望行為，也負責依整合結果簽收。執行者交出改動，整合者驗證共同版本；即使兩人都說滿意，仍須把可觀察的結果交到具有簽收權的人手上。你自己的專案可以有另一種授權安排，開始前要寫得出來。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"你手上正在做的決定表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">你手上正在做的決定\u003c/th>\n\u003cth scope=\"col\">從哪裡讀\u003c/th>\n\u003cth scope=\"col\">讀完可以試做什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>助手說它測過了，我要看什麼？\u003c/td>\n\u003ctd>\u003ca href=\"#C01\">第一章　Agent 基礎\u003c/a>\u003c/td>\n\u003ctd>從同一段紀錄分出推測、執行與選路。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想把一項改動交給一位助手，怎樣交代？\u003c/td>\n\u003ctd>\u003ca href=\"#02-A01\">第二章 A 線　工作方法\u003c/a>\u003c/td>\n\u003ctd>指定可改範圍、要交的結果與應停下詢問的情況。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>哪些工作可以分開做？\u003c/td>\n\u003ctd>\u003ca href=\"#C22\">第三章　工程架構\u003c/a>\u003c/td>\n\u003ctd>找出可以獨立驗收的交付，以及必須等誰先決定的事項。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>兩邊都交了，卻對規格有不同解讀？\u003c/td>\n\u003ctd>\u003ca href=\"#C38\">第四章　實務決策\u003c/a>\u003c/td>\n\u003ctd>用同一個輸入重現差異，把選項交給有權裁決的人。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>做完了，值得接受或再次採用嗎？\u003c/td>\n\u003ctd>\u003ca href=\"#C47\">第五章　品質與效率\u003c/a>\u003c/td>\n\u003ctd>分別核對產品行為、人工與時間成本，以及是否幫到使用者。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-5\">這條閱讀路線是編輯安排。公開文件 P01 支持預定流程與動態選路的區分；U-A 提供個人研究中規劃、執行與分工的背景。五章各有自己的問題入口，亦可直接依手邊工作跳讀。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">Wiki 的控制方式說明\u003c/span> · \u003ca href=\"#contents\">全書單元索引\u003c/a>\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P01、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-workflow.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/guides/chapter-01.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/guides/chapter-03.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/guides/chapter-04.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/guides/chapter-05.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "導論 · 01", "firstSlide": 4, "lastSlide": 7, "subtitle": "先從你要負責的決定選一章"}, {"id": "I02", "chapter": "00", "title": "待辦篩選的需求規則與驗收標準", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cstrong>\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span>\u003c/strong> 一個網站已經能列出待辦事項。現在你要委託助手加上「按標籤篩選」：從兩筆資料開始，一筆是寄報表，標為工作；另一筆是買牛奶，標為家庭。試著在動手前回答：選「工作」時哪一筆要留下，哪一筆要消失？接著清除選擇時，哪一筆應重新出現？選到完全沒有使用過的標籤時，正確結果是空清單。只放「寄報表」一筆就看不出程式到底有沒有篩選，因為一律顯示全部也會得到相同畫面。\u003c/p>\n\u003cp data-passage=\"p-2\">這個練習約定第一項需求只能選一個標籤。假設下次有人想同時選工作和家庭，請先讓他指出想看到什麼：要找兼具兩種標籤的待辦，還是任一種符合就列出？沿用剛才兩筆資料，前者找不到，後者兩筆都找得到。舊功能的簽收並沒有替新需求選好答案。這個例子只用來手算、設計檢查及討論責任，無須先安裝程式。\u003c/p>\n\u003cfigure>\u003cfigcaption>用兩筆待辦問清楚下一項需求（合成練習）\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">你怎麼解讀「工作和家庭」\u003c/th>\u003cth scope=\"col\">寄報表（只有工作標籤）\u003c/th>\u003cth scope=\"col\">買牛奶（只有家庭標籤）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">同時具有兩個標籤\u003c/th>\u003ctd>排除\u003c/td>\u003ctd>排除\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">具有其中任一標籤\u003c/th>\u003ctd>留下\u003c/td>\u003ctd>留下\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003ch2 data-section>從三次操作到簽收版本\u003c/h2>\n\u003cp data-passage=\"p-3\">沿著這件事走一遍：先保存原本能列出兩筆的版本；把「選取、清除、無匹配」三個預期交產品負責人確認；再讓提供資料的人與顯示畫面的人按同一組樣本製作；最後由整合者在兩份修改合在一起的版本上重做三次操作，留下實際輸出、例外與待確認事項。\u003cstrong>在具權者接受前，新版本仍是等待驗收的候選。\u003c/strong> 接下來若提多選，就從已接受的版本另立契約。\u003c/p>\n\u003cp data-passage=\"p-4\">讀到後面的工作票時，可回來對照下表。只想學方法的讀者，可以直接略過名稱。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"已在練習中見過的事表格\" data-passage=\"p-5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">已在練習中見過的事\u003c/th>\n\u003cth scope=\"col\">後文用的定位\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>還沒有新功能、能讀出原清單的起點；兩筆固定測試資料\u003c/td>\n\u003ctd>B0；讀取列表的請求為 \u003ccode>GET /todos\u003c/code>；A 帶 \u003ccode>work\u003c/code>，B 帶 \u003ccode>home\u003c/code>。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>請有權者確認單選規則與樣本\u003c/td>\n\u003ctd>F0 契約票。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>依約提供資料、依約顯示畫面\u003c/td>\n\u003ctd>F1 資料介面票與 F2 畫面票；兩者都讀同一版契約。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>把兩項產物放在一起重驗\u003c/td>\n\u003ctd>F3 整合票。只有兩邊的局部結果還不夠。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>具權者簽收後，後續需求可以據以開工的版本\u003c/td>\n\u003ctd>B1。只找到較新的提交或一張完成截圖，均不足以判定已接受。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\">待辦內容與工作票出自教學工作紙；這段推演沒有產生產品測試結果。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">案例底稿\u003c/span> · \u003ca href=\"#C17\">用同一組資料走完整個單 Agent 任務\u003c/a> · \u003ca href=\"#C30\">把契約拆成四張票\u003c/a>\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　U-A\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/single-agent.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "導論 · 02", "firstSlide": 8, "lastSlide": 11, "subtitle": "用兩筆待辦試著寫下「做對了」的樣子"}, {"id": "C01", "chapter": "01", "title": "從紀錄分辨 LLM 的推測、工具執行與選路", "track": "", "role": "core", "parent": "", "lead": "看到「選了工作標籤，家庭待辦卻還在」的故障報告時，先找出測試者真正觀察到的清單。正常情況下，只該留下帶工作標籤的項目。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cstrong>大型語言模型（large language model，LLM）\u003c/strong> 接收這一輪提供給它的材料，根據學到的語言規律，接續產生回答。你只給它一句故障描述，它就能提出可能原因，例如「網站沒有把選好的標籤送出去」，也能說明該怎麼檢查。這對想知道「有哪些可能」的人很有幫助。可是同一個現象也可能發生在另一種情況：網站送出了正確的標籤，收到新清單後，畫面卻繼續顯示舊資料。光憑那句描述，模型沒有足夠的線索從兩者之間挑出真正的原因。\u003c/p>\n\u003cp data-passage=\"p-2\">如果你把一份測試報告貼進對話，模型便能解釋報告裡的差異。這時它多了一份證據，而執行測試的人仍可能是你。\u003cstrong>聊天\u003c/strong>描述的是人如何跟系統交換訊息。訊息泡泡的外形不會告訴你，資料是人貼進來的、程式自動取回的，還是模型讀過問題後決定去查的。\u003c/p>\n\u003ch2 data-section>查出「試過了」所指的操作\u003c/h2>\n\u003cp data-passage=\"p-3\">現在把委託說得更清楚：「請在這份專案裡查明原因；可以讀檔和執行測試。」面對同一項委託，只有文字可用的系統仍然可以給出上述推測，並請你提供測試輸出。配有\u003cstrong>工具\u003c/strong>的系統多一條路。這裡的工具指能做一項具體操作、把結果送回來的程式，例如讀取指定檔案，或啟動既有測試。模型可以提出「讀取篩選規則，再執行這項測試」的請求。接住請求的程式稱為\u003cstrong>執行環境\u003c/strong>。它依本次可用的工具與權限執行動作，把讀到的規則、測試輸出或錯誤送回模型。這些從操作取得的結果，就是後面所說的\u003cstrong>觀察\u003c/strong>。\u003c/p>\n\u003cp data-passage=\"p-4\">因而，當助手說「我剛試過了」，值得追問的是「這次測的是哪個行為？實際得到什麼？」假如紀錄只到「要求執行測試」，你知道它提出過請求；若執行環境回報「無權讀取測試資料」，你知道檢查卡在取資料；若紀錄列出「預期一筆，實際兩筆」，你才有這次行為與預期不符的證據。三種情況需要三種不同的回報。即使最後一種已經重現問題，造成差異的那一行程式也還有待定位。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-5\">已經能動手了，下一步交給誰？\u003c/h2>\n\u003cp data-passage=\"p-6\">假設留下了「預期一筆，實際兩筆」的紀錄。設計者可以事先寫好規則：「遇到這種差異就保存輸出、標記失敗、結束檢查。」每次碰到相同條件，程式都知道該走哪一支。這種由程式預先安排操作及分支的方式稱為\u003cstrong>工作流程（Workflow）\u003c/strong>。它可以呼叫工具，也可以請語言模型把兩筆結果寫成容易閱讀的報告。報告的措辭由模型產生，報告寫完就結束這一步，仍由程式規定。\u003c/p>\n\u003cp data-passage=\"p-7\">另一種設計是把調查目標、允許做的事和這份失敗輸出交給模型。模型讀到「多出來的是家裡的待辦」，於是從可用操作中選擇先讀負責比對標籤的檔案；若後來發現資料早已正確篩過，它可以轉查顯示清單的程式。這裡稱為 \u003cstrong>Agent\u003c/strong> 的，是讓模型在執行途中根據觀察選擇後續動作、再由環境執行並回傳結果的系統。模型在其中負責判讀與選路。它也可以判斷已有足夠資訊而直接回答，一次工作不要求湊足某個工具呼叫次數。\u003c/p>\n\u003cp data-passage=\"p-8\">有個容易看錯的地方：程式也能寫出「如果多出一筆，就開啟比對標籤的檔案」這樣的條件。於是兩種系統都可能讀了同一份檔案。要判斷控制方式，請追到\u003cstrong>選檔的那一刻\u003c/strong>：是開發者早就把「這個條件 → 這個檔案」寫進程式，還是模型讀到本次錯誤後，才從獲准的操作中挑了這個檔案？如果手上只有檔名和最後的答案，兩種解釋都說得通。工具確實被用過，與模型確實做過這個選擇，分別需要證據。同一個 LLM 可以放進這兩種設計：在一處，它只負責寫報告；在另一處，系統把下一個調查動作也交給它選。要替這段工作分類，先看模型在其中負責什麼。\u003c/p>\n\u003cp data-passage=\"p-9\">\u003cstrong>C01 自我驗收。\u003c/strong> 如果助手讀過你貼的報告，也準確說出多出來的那一筆，要證明它自己做過測試，還缺什麼？請找與本次委託相符的執行請求和工具回覆。要進一步確認誰選擇執行這項測試，再找觸發它的程式規則或模型決策紀錄。公開機制見 P01、P02；聊天與工程執行的使用背景見 U-A 中的 U02 歷史重建。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P01、P02、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agents/running-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P02 · OpenAI · Running agents\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-loop.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-workflow.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/agent-system-model.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.01", "firstSlide": 13, "lastSlide": 19, "subtitle": "一句合理的解釋，根據的是什麼？"}, {"id": "C02", "chapter": "01", "title": "Workflow 與 Agent 如何決定下一步", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">即使你已知道測試確實跑過，若想把調查交給別人重做，還需要知道哪一步可以預先寫好，哪一步需要有人讀了結果再作判斷。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 下面是一個\u003cstrong>合成教學例\u003c/strong>。刻意只留下兩筆待辦，好讓你能自己算出預期結果。A 是「寄工作報表」，標籤是 \u003ccode>work\u003c/code>；B 是「買牛奶」，標籤是 \u003ccode>home\u003c/code>。規則是選一個標籤，只列出標籤相符的待辦。因此選 \u003ccode>work\u003c/code> 應只看到 A，取消篩選則應再看到 A、B。這組每次檢查都能重新載入的已知資料，在測試裡稱為 \u003cstrong>fixture（測試用固定資料）\u003c/strong>。有了它，「應該只剩一筆」就有了可以核對的依據。\u003c/p>\n\u003cp data-passage=\"p-3\">一個網站上有兩個地方可以觀察這件事。畫面向伺服器索取清單時，雙方透過約定的軟體介面交換資料，這個介面稱為 \u003cstrong>API\u003c/strong>。例如 \u003ccode>GET /todos?tag=work\u003c/code> 是請伺服器傳回標籤為 \u003ccode>work\u003c/code> 的待辦。使用者按得到的標籤、看得到的清單，則屬於\u003cstrong>使用者介面（UI）\u003c/strong>。拿到正確資料和把正確資料畫出來是兩個步驟，所以同一個問題可以在兩處留下不同線索。\u003c/p>\n\u003ch2 data-section>沿同一次故障追查選路依據\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 把同一句委託交給兩方：「找出選 work 後畫面仍列出 B 的原因，回報可重現的證據。」兩方用同一版程式、同一組 A、B，可以讀 API 與 UI 程式及執行測試。兩方都先載入 fixture、操作標籤、核對同一次請求的參數，逐筆比對預期、回應及畫面。題設給的觀察也完全相同：請求帶 work，伺服器只回 A，畫面卻留下 A、B。這一步能縮小故障位置，但尚未查明根因。\u003c/p>\n\u003cp data-passage=\"p-5\">固定 Workflow 的作者預先規定：若 API 多回 B，就保存輸入與差異，轉做伺服器比對檢查；若回應正確而畫面仍有 B，就執行清單更新測試，記錄更新前後的資料。若連 fixture 都沒載入，回報缺少輸入，不能判定篩選對錯。本題走第二條分支。工作紀錄要列出觸發分支的觀察、已執行的檢查及其結果。預寫路徑用盡仍不能解釋故障時，把未定位的原因寫進回報。\u003c/p>\n\u003cp data-passage=\"p-6\">Agent 收到同一份回應與畫面紀錄。這次回應裡已經沒有 B，因此它有理由先讀「收到新清單之後，有沒有用它取代舊清單」的程式，再決定要觀察更新前後的資料，還是核對畫面繪製所讀的清單。假設兩方最後都執行了同一個清單更新測試，區別仍然存在：一方可出示事前寫好的分支，另一方可出示模型在看到差異後才提出的選擇。要斷定根因，兩方都還需要能重現差異、指出哪個更新步驟留下 B 的證據。\u003c/p>\n\u003cfigure>\u003cfigcaption>同一個觀察：服務只回 A，畫面仍有 A、B（合成案例）\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">追查哪個決定\u003c/th>\u003cth scope=\"col\">固定 Workflow\u003c/th>\u003cth scope=\"col\">Agent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">為什麼轉查畫面？\u003c/th>\u003ctd>執行前寫好的分支指定清單更新測試。\u003c/td>\u003ctd>模型讀到這次差異後，從許可的動作中選擇追查更新處。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">要保留什麼？\u003c/th>\u003ctd>分支條件與觸發分支的觀察。\u003c/td>\u003ctd>作出選擇時的觀察、所選動作與後續工具回覆。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cp data-passage=\"p-7\">何時固定流程已經足夠？當輸入、操作、成功條件和遇錯出口都穩定，能把委託所需的判斷完整預排。例如只受託驗 API，載入資料、送出請求、比對並回報即可；若受託解釋畫面，就還要涵蓋回應正確而畫面錯誤的路徑。一次 API 通過的範圍只到該查詢與這組資料。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-8\">可以選路，走到哪裡該停？\u003c/h2>\n\u003cp data-passage=\"p-9\">在這個例子裡，「值得查畫面」是根據證據作出的技術判斷；「可以讀畫面程式」取決於使用者授權和執行環境開放的操作。如果本次只准測 API，合理的回報是：「指定查詢回傳 A；你提供的畫面仍顯示 A、B。下一步想檢查清單更新邏輯，需要畫面程式的讀取權。」這樣接手的人能從分岔處繼續。如果調查需要改動「哪些待辦算相符」的產品規則，還得請有權決定需求的人確認。讓模型判斷查哪裡，並不會連帶授予讀取、寫入或改規則的權力。\u003c/p>\n\u003cp data-passage=\"p-10\">實務上可以把兩種方式接起來。如果這種畫面故障經常出現，團隊也可以事先規定「API 回 A 後，再檢查畫面是否只列 A」；連查兩處照樣可以是固定流程。另一種安排是把固定資料、API 查詢和比對寫成可重跑的檢查，讓每次調查有相同起點；碰到既定檢查解釋不了的觀察，再讓 Agent 在授權內選擇下一項調查。這樣既保有可比較的結果，也為未知原因留出探查空間。代價是每多查一次，就可能多用一次模型推理、工具時間或人工批准。選擇的依據應該是這次任務有多少步驟能預定，以及新觀察能否改變值得採取的動作。光看分支數量或一次成功示例，還無法判定哪種架構整體更快、更便宜。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-11\">換你判讀一份工作紀錄\u003c/h2>\n\u003cp data-passage=\"p-12\">\u003cstrong>只看見聊天視窗和「我測過了」，你能說背後有 Agent 嗎？\u003c/strong> 先指出還缺哪兩項資訊。第一項是這次操作及其結果，例如用哪組資料測出了什麼。第二項是選擇操作的依據，例如程式規則已經指定要跑這項測試，或模型在看到錯誤後才提出具體的下一步。只有聊天截圖時，兩項都待查。\u003c/p>\n\u003cp data-passage=\"p-13\">\u003cstrong>甲、乙都在測試失敗後打開同一個檔案。哪一次是模型決定下一步？\u003c/strong> 甲的設定檔早已寫明失敗時開啟該檔；乙的紀錄顯示，模型拿到本次失敗輸出後，才選擇查看該檔並送出讀取請求。乙提供了模型選路的證據。甲即使隨後請模型解釋檔案，選檔這一步仍屬預定流程。\u003c/p>\n\u003cp data-passage=\"p-14\">\u003cstrong>如果明天要檢查同一組待辦，你會預先寫好哪些步驟？何時才需要改查畫面？\u003c/strong> 只要問題仍是「這個 API 是否回傳 A」，就能預排載入、查詢、比對與回報。若任務是解釋使用者看到 B，而且已核對同一次請求回 A、畫面卻顯示 A、B，此時才有具體理由從 API 轉向 UI。若手上的授權只到 API，先帶著這兩個觀察申請下一步的權限。\u003c/p>\n\u003cp data-passage=\"p-15\">讀到這裡，你已經可以從工作紀錄分辨模型提出了什麼、環境做了什麼，以及哪一步容許模型選路。紀錄沒有涵蓋的事也可以說清楚，例如「這項檢查通過，畫面行為仍待確認」。想接著追一個工具請求怎麼變成執行結果，可以讀本機 Wiki 的延伸教學。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">從模型輸出追到停止條件\u003c/span>\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-16\">來源與案例性質\u003c/h2>\n\u003cp data-passage=\"p-17\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 固定流程與動態選路的區分採用 Anthropic 的 P01；工具請求、結果回傳以及一次執行可以直接結束，採用 OpenAI 的 P02。上面的兩筆待辦及對照路徑改編自 Wiki 合成工作紙，所有輸出均為題設。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P01 來源摘要\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P02 來源摘要\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">合成案例底稿\u003c/span>\u003c/p>\n\u003cp data-passage=\"p-18\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> 使用者研究 U-A 中的 U02 以歷史摘要記下先透過對話討論目的，再把工作交到可測環境的做法。本單元借它說明兩種委託為何容易混淆；它的證據狀態是歷史重建，不能據此推算任何一種做法的成效。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-A 本機摘要\u003c/span>\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P01、P02\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agents/running-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P02 · OpenAI · Running agents\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-loop.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-workflow.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/agent-system-model.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.02", "firstSlide": 20, "lastSlide": 30, "subtitle": "同一個篩選故障，為何都轉查畫面？"}, {"id": "C03", "chapter": "01", "title": "Agent 系統中模型、執行環境與工具的分工", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">有人在調查報告裡寫「已修正清單」。你想知道這句話指的是提出修改建議、真的寫入檔案，還是修改後的畫面也已通過檢查。追一次請求的去向，比數報告有幾行更容易回答。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> \u003cstrong>Model（模型）\u003c/strong> 讀取本輪輸入，可以產生文字，也可以產生帶參數的工具請求。\u003cstrong>Runtime（執行環境）\u003c/strong> 接住請求，其中驅動一次工作的程式可稱為 runner。Runner 辨認輸出類型，依環境的權限與設定，把獲准的請求送往相應的工具，再把工具回覆帶回模型。\u003cstrong>Tool（工具）\u003c/strong> 負責具體操作。Shell 可在工作目錄下啟動測試命令；Browser 可操作頁面、讀取可見清單。工具的輸出記錄了它所觀察的那一層。\u003c/p>\n\u003cfigure>\u003cfigcaption>工具請求怎麼變成下一輪模型可讀的觀察？\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>模型提出動作與參數。\u003c/li>\u003cli>Runner 核對許可。拒絕轉送時，回報原因；獲准時，才交給對應工具。\u003c/li>\u003cli>Shell 啟動指定命令，或 Browser 操作頁面。各自回傳該次操作的觀察。\u003c/li>\u003cli>Runner 將回覆對回請求，模型據此選下一步。\u003c/li>\u003c/ol>\u003c/figure>\n\u003ch2 data-section>寫入、測試與畫面各留下什麼？\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在紙上分四欄寫下「請求、執行者、作用、回傳」。假設模型要求修改清單更新函式，先把檔名與擬議修改放在第一欄。若 runtime 拒絕寫入，作用欄寫「此請求未寫入」，回傳欄記下拒絕原因。若獲准，實際寫檔的是編輯工具；回傳成功後，可以重讀檔案核對差異。再由 Shell 跑指定測試並保存實際輸出。若要回答畫面是否改好，還要用 Browser 選標籤，核對頁面到底顯示哪些資料。一次成功寫入，只能回答這張表裡的一個問題。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>把一個結果配回一個請求。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設工作區已有測試 \u003ccode>clear-filter\u003c/code>，固定資料是 A(work)、B(home)。下面每列都從同一份未修的版本出發，代號供讀者對帳。請先遮住最右欄，只看模型要求的動作和 runner 帶回的回覆，再判斷下一步。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"請求與參數表格\" data-passage=\"p-5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">請求與參數\u003c/th>\n\u003cth scope=\"col\">runner 的處置\u003c/th>\n\u003cth scope=\"col\">模型下一輪收到的結果\u003c/th>\n\u003cth scope=\"col\">能核對什麼、接著查什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Q1：編輯工具將清除處理器改為省略 tag\u003c/td>\n\u003ctd>工作區僅准讀取，拒絕轉送\u003c/td>\n\u003ctd>Q1：拒絕寫入，目標超出本次許可\u003c/td>\n\u003ctd>本次沒有呼叫編輯工具。交回擬改位置與所需授權。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q2：Shell 在專案根目錄執行 \u003ccode>npm test -- clear-filter\u003c/code>\u003c/td>\n\u003ctd>允許，Shell 已啟動命令\u003c/td>\n\u003ctd>Q2：退出碼 1，測試報告「清除後預期 A、B，實得 A」\u003c/td>\n\u003ctd>有失敗斷言，可查清除時送出的參數與畫面更新。這次回覆只涵蓋該測試。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q3：以相同參數請 Shell 跑同一測試\u003c/td>\n\u003ctd>允許，Shell 嘗試啟動命令\u003c/td>\n\u003ctd>Q3：找不到 npm，測試程序未啟動\u003c/td>\n\u003ctd>外部執行環境缺少入口。保留錯誤並核對安裝或路徑，產品結果仍待測。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q4：Browser 在該版本選 work 後按清除，讀取可見 ID\u003c/td>\n\u003ctd>允許，Browser 執行兩個操作\u003c/td>\n\u003ctd>Q4：選取後 [A]，清除後 [A]\u003c/td>\n\u003ctd>可見行為違反清除後應見 [A,B] 的契約；還要對照請求與回應才能歸因。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\">同樣一句「沒通過」，Q1 缺授權，Q3 缺可執行的測試入口，只有 Q2 提供跑到斷言的證據。若只剩 Q2 的請求與 Q4 的回覆，保留 Q4 的畫面觀察，把 Q2 的結果記為「回覆缺失，執行情形待核」。同樣地，若工具已開始寫入才報錯，應重讀目標與差異，確認有沒有留下部分改動；只有在轉送之前明確拒絕，才能就該請求判定沒有呼叫寫入工具。表中的 Q 編號與回覆文字是教學記號，各工具的實際欄位依環境而定。\u003c/p>\n\u003ch2 data-section>讓架構規則在執行時接受檢查\u003c/h2>\n\u003cp data-passage=\"p-7\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 工具怎麼知道可以寫哪裡？專案指引可以說明規則，工具權限可以限制寫入範圍，自動檢查可以把違規位置送回。將這些規則、工具、權限與回饋組在一起的工程環境，在這裡稱為 \u003cstrong>Harness\u003c/strong>。它可以圍繞同一個模型運作，無須再加一個負責監看的模型。P17 描述一個團隊如何把架構限制做成執行時能取得的回饋；P02 說明的是一套 SDK 的 runner，兩者解答不同問題。\u003c/p>\n\u003cp data-passage=\"p-8\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 試把「畫面程式只能透過服務層存取資料」落到環境裡。在專案指引寫明允許的依賴方向，在檢查器設定禁止畫面模組直接匯入資料模組，再用一個含違規匯入的範例檢查它會不會報出兩端檔名。修正該依賴後應能再跑同一檢查。只把規則寫進文件，仍容許工具寫出違規程式；即使依賴檢查通過，也只保證所檢查的關係。\u003c/p>\n\u003cp data-passage=\"p-9\">\u003cstrong>自己判讀。\u003c/strong> 紀錄只剩「請寫檔並跑測試」，模型直接改到了什麼？能保證架構維持嗎？此時僅能確認提出了請求。依序找寫檔工具回覆、修改後差異及對應架構檢查的輸出；缺哪一項，就保留哪一項待查。想追工具回覆如何影響下一個動作，可接 C04。\u003c/p>\n\u003cp data-passage=\"p-10\">來源：P02（OpenAI）、P17（Ryan Lopopolo／OpenAI）；Wiki 的 \u003ccode>tutorials/agent-system-model.md\u003c/code>、\u003ccode>concepts/harness.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P02、P17\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agents/running-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P02 · OpenAI · Running agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-loop.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/authority.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/agent-system-model.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.03", "firstSlide": 31, "lastSlide": 38, "subtitle": "模型說要測試，到底誰動了手？"}, {"id": "C03-01", "chapter": "01", "title": "用工具呼叫紀錄追查一次寫檔", "track": "", "role": "lesson", "parent": "C03", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">待辦網站上有兩件事：回覆客戶（A，標籤 work）和買牛奶（B，標籤 home）。點選工作標籤後應該只見第一件，畫面卻還列著兩件。助手說「已修正清單」。要接手這次修復，你需要找到一份檔案差異，還要看那個版本的網站在同一次操作後顯示哪一件。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-2\">從一句話走到一次寫入\u003c/h2>\n\u003cp data-passage=\"p-3\">模型（Model）根據當輪輸入產生文字。它可以用一句答覆結束這一輪，也可以送出帶有工具名稱、目標與參數的請求。例如，要改動負責更新清單的函式，就得說明改哪個檔案、打算寫入什麼。執行環境（Runtime）中的 runner 辨認這兩種輸出；收到工具請求，先依權限核對操作，再把獲准的工作交給編輯工具。\u003cstrong>工具實際寫入\u003c/strong>才可能改變工作目錄。\u003c/p>\n\u003cp data-passage=\"p-4\">用一個紙上編號 q1 串起去程和回程。從上往下先認發送者，再看接收者此時能觀察到什麼。實際產品可用不同訊息格式。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"方向表格\" data-passage=\"p-5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">方向\u003c/th>\n\u003cth scope=\"col\">發送者 → 接收者\u003c/th>\n\u003cth scope=\"col\">紙上訊息與可見作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>去程\u003c/td>\n\u003ctd>Model → runner\u003c/td>\n\u003ctd>q1：編輯 list-view 的清單更新函式；此時只有擬議修改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>去程\u003c/td>\n\u003ctd>runner → 編輯工具\u003c/td>\n\u003ctd>授權通過，轉交 q1 的目標與變更\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回程\u003c/td>\n\u003ctd>編輯工具 → runner\u003c/td>\n\u003ctd>q1：寫入成功；可重讀 list-view 核對差異\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回程\u003c/td>\n\u003ctd>runner → Model\u003c/td>\n\u003ctd>以 q1 的結果補入下一輪輸入，模型才有寫入回覆可參照\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\">如果紀錄停在第一列，你能確認的是模型提出 q1。下一筆要找 runner 的許可決定，再找帶同一識別碼的工具回覆。回傳也可能是一個錯誤；把它配回原請求，下一輪模型才能依實際結果選擇行動。即使拿到表中第三列的成功回覆，簽收仍需要重讀對應版本的差異，再實際選 work，記下畫面的待辦編號。\u003c/p>\n\u003cp data-passage=\"p-7\">OpenAI 的 P02 公開文件支持輸出分流與結果回送（\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"PUBLIC_DOC\">公開技術文件\u003c/span>）。T01 是教材的合成系統模型；上述待辦、q1 與成功寫入均為紙上示例（\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"SYNTHETIC_EXAMPLE\">合成教學案例\u003c/span>）。\u003c/p>\n\u003cp data-passage=\"p-8\">\u003ca href=\"#C03\">1.03 正文\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T01 系統模型\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">Agent Loop\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P02\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003chr data-passage=\"p-9\">\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　P02、T01\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agents/running-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P02 · OpenAI · Running agents\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-loop.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/agent-system-model.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.03.01", "firstSlide": 39, "lastSlide": 41}, {"id": "C03-02", "chapter": "01", "title": "Tool Calling 的執行生命週期與錯誤處理", "track": "", "role": "lesson", "parent": "C03", "lead": "", "kind": "呼叫機制", "body": "\u003cp>模型能提出「在這個目錄執行清單測試」的請求。讓測試程式真正啟動，還需要一個能辨認請求、決定是否放行的執行環境，以及一個能在工作目錄下執行命令的工具。這三個角色各自留下不同的紀錄。沿著一次工具呼叫（Tool Calling）讀這些紀錄，就能分辨「模型要求測試」「測試有跑到斷言」和「使用者看見正確清單」分別有哪些依據。\u003c/p>\n\u003ch2 data-section>一次呼叫的去程與回程\u003c/h2>\n\u003cp>Model（模型）從當輪輸入產生輸出。輸出可以直接是文字；若要取得外部觀察，它可以提出工具名稱與參數。Runtime（執行環境）中的 runner 接住這個請求，依當輪可用的工具、工作範圍與權限決定是否轉送。Shell 可以啟動測試命令，Browser 可以操作畫面並讀取可見結果，編輯工具則可能改變檔案。工具完成或遇錯時，runner 將回覆對回原請求，讓模型在下一輪讀到發生了什麼。\u003c/p>\n\u003cfigure>\u003cfigcaption>一次工具呼叫的訊息路徑\u003c/figcaption>\u003cdiv class=\"flow-node\">Model 輸出\u003c/div>\n        \u003cdiv class=\"fork\">\u003cdiv>\u003cb>最終文字\u003c/b>\u003cspan>↓ 結束本輪\u003c/span>\u003c/div>\n        \u003cdiv>\u003cb>工具請求\u003c/b>\u003cspan>識別碼、名稱、參數 ↓\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"flow-node\">runner 核對允許的工具、目標與操作\u003c/div>\n        \u003cdiv class=\"fork\">\u003cdiv>\u003cb>拒絕\u003c/b>\u003cspan>↓ 記錄原因\u003c/span>\u003c/div>\n        \u003cdiv>\u003cb>放行 → Tool 執行\u003c/b>\u003cspan>↓ 回傳觀察或錯誤\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"flow-node\">runner 配對請求與回覆\u003c/div>\n        \u003cdiv class=\"flow-end\">↓　Model 取得下一輪輸入\u003c/div>\u003cdetails>\u003csummary>讀取原稿文字圖\u003c/summary>\u003cpre>Model 輸出\n  ├─ 最終文字 → 結束本輪\n  └─ 工具請求（識別碼、名稱、參數）\n       ↓\n     runner 核對允許的工具、目標與操作\n       ├─ 拒絕 → 記錄原因 ──────────────────┐\n       └─ 放行 → Tool 執行 → 回傳觀察或錯誤 ──┤\n                                               ↓\n                              runner 配對請求與回覆\n                                               ↓\n                                  Model 取得下一輪輸入\u003c/pre>\u003c/details>\u003c/figure>\n\u003cp>圖中的識別碼是教學記號。例如 \u003ccode>q2\u003c/code> 指「請 Shell 在指定目錄執行測試」，\u003ccode>q3\u003c/code> 指「請 Browser 讀出畫面上的待辦編號」。若手上只有 q2 的請求和 q3 的回覆，仍可引用 q3 的畫面觀察；\u003cstrong>q2 的執行結果待查\u003c/strong>。下一輪收到文字回覆，只能依回覆記錄的範圍下判斷。\u003c/p>\n\u003ch2 data-section>錯誤發生的位置，決定下一步要查什麼\u003c/h2>\n\u003cp>以下是假設同一個待辦清單的四種紀錄。固定測試資料（fixture）有 A、B 兩筆，只有 A 帶 \u003ccode>work\u003c/code> 標籤。\u003c/p>\n\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"最後可定位的事件表格\">\u003ctable class=\"cols-3\">\u003cthead>\u003ctr>\u003cth scope=\"col\">最後可定位的事件\u003c/th>\u003cth scope=\"col\">能從紀錄確認的事\u003c/th>\u003cth scope=\"col\">下一步\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"最後可定位的事件\">runner 在轉送前拒絕寫檔\u003c/td>\u003ctd data-label=\"能從紀錄確認的事\">本次請求沒有呼叫編輯工具。\u003c/td>\u003ctd data-label=\"下一步\">記下目標與拒絕原因，先做獲准的唯讀檢查；確需寫入時交具權者決定。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"最後可定位的事件\">編輯工具開始寫入才報錯\u003c/td>\u003ctd data-label=\"能從紀錄確認的事\">工具已執行，檔案可能只改了一部分。\u003c/td>\u003ctd data-label=\"下一步\">重讀目標並比對差異，確認已生效的部分，再決定是否重試。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"最後可定位的事件\">Shell 已啟動，測試程式找不到 fixture\u003c/td>\u003ctd data-label=\"能從紀錄確認的事\">工作環境未就緒，尚未跑到資料比對。\u003c/td>\u003ctd data-label=\"下一步\">核對工作目錄、測試入口及資料位置，補正後重跑。即使命令正常退出，若發現零個測項，行為仍待驗。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"最後可定位的事件\">測試跑到斷言，記下「期望 [A]，實得 [A,B]」\u003c/td>\u003ctd data-label=\"能從紀錄確認的事\">在這個版本、這組輸入與該測試層，兩個結果確實不同。\u003c/td>\u003ctd data-label=\"下一步\">留下測項、期望與實得值，再沿請求、回應和畫面定位第一個差異。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003csection id=\"paths\" class=\"practice\">\u003c/section>\n\u003cp>把這項檢查用在真實操作路徑上：在 Browser 選 \u003ccode>work\u003c/code>，觀察送出的篩選參數 \u003ccode>tag\u003c/code>、資料介面（API）回傳的待辦編號（ID），以及畫面（UI）實際列出的 ID。若請求已帶 \u003ccode>tag=work\u003c/code>，服務回 \u003ccode>[A]\u003c/code> 而畫面仍是 \u003ccode>[A,B]\u003c/code>，先查畫面如何用回應更新清單。若選取後發出的請求漏了 tag，則先查前端組裝參數的地方。API 測試通過能支持資料介面的結果；要確認畫面也改對了，仍需要 Browser 的觀察。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>P02 的公開文件支持 runner 辨認輸出、調用工具與回送結果。圖中的許可閘門和故障紀錄依 T01 的教學模型繪製；q2、q3 與清單值都是合成示例。\u003c/p>\u003ch3>公開技術文件\u003c/h3>\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://developers.openai.com/api/docs/guides/agents/running-agents\">P02 · OpenAI · Running agents ↗\u003c/a>\u003ch3>本機 Wiki 與教材定位\u003c/h3>\u003cul>\u003cli>P02 來源摘要\u003csamp>.wiki/wiki/sources/p02-summary.md\u003c/samp>\u003c/li>\u003cli>T01 系統模型\u003csamp>.wiki/wiki/tutorials/agent-system-model.md\u003c/samp>\u003c/li>\u003cli>C03 正文\u003csamp>docs/textbook/ch01/C03-C08.md#c03\u003c/samp>\u003c/li>\u003c/ul>\u003c/section>", "number": "1.03.02", "firstSlide": 42, "lastSlide": 48}, {"id": "C03-03", "chapter": "01", "title": "Harness 設計：用依賴檢查守住架構限制", "track": "", "role": "lesson", "parent": "C03", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">專案允許助手編輯清單畫面，也規定畫面只能透過服務層讀資料。假設助手在可寫的畫面檔直接匯入資料模組。寫入成功告訴你路徑權限已放行；架構是否守住，要看另一項檢查能否找出剛寫進檔案的那條依賴。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-2\">讓同一個檢查器先報錯、再通過\u003c/h2>\n\u003cp data-passage=\"p-3\">在專案指引寫下這個理由：畫面只依賴服務提供的讀取介面，由服務負責接觸資料。把允許的方向設成依賴檢查器的規則，以下用兩個版本驗它。箭頭從寫下匯入的模組指向被匯入的模組。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"版本表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">版本\u003c/th>\n\u003cth scope=\"col\">順著匯入方向讀\u003c/th>\n\u003cth scope=\"col\">同一條規則應留下的回饋\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>故意越層\u003c/td>\n\u003ctd>畫面 list-view → 資料 todo-store\u003c/td>\n\u003ctd>拒絕這條邊；報告須能定位來源 list-view 與目標 todo-store。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>依規則修正\u003c/td>\n\u003ctd>畫面 list-view → 服務 todo-service → 資料 todo-store\u003c/td>\n\u003ctd>畫面改為匯入服務，由服務讀資料；重跑相同檢查，預期通過。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-5\">沿操作順序再看一次：指引 → 模型提出修改意圖 → 權限閘門 → 工具寫檔 → 檢查器檢視匯入 → runner 回送檢查結果。原來的模型就能依回饋定位並修正違規。這套\u003cstrong>指引、工具、權限與可重跑的回饋\u003c/strong>，合起來稱為 Harness。\u003c/p>\n\u003cp data-passage=\"p-6\">一張清單截圖加一份專案指引，只能讓你看見當時的畫面和寫下的規則。驗收架構要收上述違規與修正兩份輸出。驗收功能則要另開 Browser（瀏覽器工具），在含工作與居家兩筆待辦的頁面選 work，確認只顯示工作事項。若想追查這個操作如何成為新一輪模型輸入，可續讀 C04。\u003c/p>\n\u003cp data-passage=\"p-7\">Ryan Lopopolo／OpenAI 的 P17 團隊案例支持可執行的架構約束，OpenAI 的 P02 說明 runner 如何回送觀察（\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"PUBLIC_DOC\">公開技術文件\u003c/span>）。此處模組、規則及預期報告是 T01 延伸的教學設計（\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"DESIGN\">工程設計／建議方法\u003c/span>），缺這個檢查器的實測輸出。\u003c/p>\n\u003cp data-passage=\"p-8\">\u003ca href=\"#C03\">1.03 正文\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T01 系統模型\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">Agent Loop\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P02\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P17\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">Harness\u003c/span> · \u003ca href=\"#C04\">追蹤下一輪觀察\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003chr data-passage=\"p-9\">\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　P02、P17、T01\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agents/running-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P02 · OpenAI · Running agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-loop.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/agent-system-model.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.03.03", "firstSlide": 49, "lastSlide": 52, "subtitle": "用一條故意越層的匯入檢查架構"}, {"id": "C04", "chapter": "01", "title": "Agent Loop 如何依觀察重試或停止", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">拿到一段綠色的命令輸出，先看看上面列了哪些測項。如果工具找到零項測試，程式可能已經正常退出，你卻還不知道哪個產品行為符合規格。工作需要循環，正因為第一個結果有時只告訴你接著該查什麼。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> \u003cstrong>Agent Loop\u003c/strong> 是把一次操作的結果帶入下一次決策的循環。模型提出請求，環境核對權限後叫用工具；工具產生結果，runner 將結果作為觀察送回模型。接下來模型可以提出不同請求，或產生最終輸出（final output），結束這次執行。如果問題只需解釋已有文件，第一次輸出就可能是最終答案。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 試著遮住以下每一列的右欄，先決定這次能從觀察推出什麼。委託是修正單標籤篩選，已准讀專案、修改比對邏輯及執行測試。已知資料包含工作項 A 和家庭項 B，選工作應只列 A。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"請求及工具回覆（題設）表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">請求及工具回覆（題設）\u003c/th>\n\u003cth scope=\"col\">下一步與理由\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>要求執行篩選測試；測試程式回報找不到固定資料檔。\u003c/td>\n\u003ctd>還沒進入比對。先讀專案列出的測試入口和工作目錄，找出資料路徑後才重試。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>從正確入口執行；預期 A，實際 A、B。\u003c/td>\n\u003ctd>這次真正執行了斷言，也就是拿預期值和實際值比對。讀取比對邏輯，找出讓 B 留下的條件，再於授權內修正。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>以相同資料重跑選工作案例，得到 A。\u003c/td>\n\u003ctd>再跑取消篩選的案例，預期恢復 A、B。若只驗第一項，把任何輸入一律縮成 A 的錯誤實作也可能通過。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>結束這一輪時，有哪些結果可以交回？\u003c/h2>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 回報出口取決於最後能證明什麼。指定檢查成功，記下版本、測項、結果及待驗收範圍；斷言仍失敗，保留預期與實際值；資料補不到，寫清哪一步未測及缺什麼；必須改產品規格，寫出待批准的選項。這四種情況都可以結束本輪。正式接受需求，要由具權者把交付版本及測試對回約定的行為；runner 沒有從一段最終文字得知這件事的依據。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cstrong>自己判讀。\u003c/strong> 哪個節點能傳回實際測試結果？若模型已回答、指定測試卻未執行，能否簽收？測試工具產生輸出，由 runner 回送；模型只能解讀已取得的觀察。先確認指定測項被找到且在交付版本上執行，缺結果就記為未驗，等待補測或由具權者另行決定接受條件。\u003c/p>\n\u003cp data-passage=\"p-7\">來源：P02（OpenAI）、P01（Anthropic）；Wiki 的 \u003ccode>concepts/agent-loop.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。四種出口是教學判斷，無意對應特定 SDK 的四個狀態值。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、公開技術文件。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P01、P02\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agents/running-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P02 · OpenAI · Running agents\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-loop.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/agent-system-model.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.04", "firstSlide": 53, "lastSlide": 56, "subtitle": "一輪結束，工作就完成了嗎？"}, {"id": "C05", "chapter": "01", "title": "分析 Agent 工作的五個角度：指令、資料、環境、循環與依賴", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">助手一直改錯地方，換個模型或許會得到不同建議。但若每次交給它的都是舊版測試資料，換誰來讀都會從錯的起點出發。先找造成錯誤的條件，才能決定是改指令、補資料，還是調整工作環境。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> 使用者研究 U01 的歷史摘要以 Prompt、Context、Harness、Loop、Graph 整理工程問題。這五個觀察角度可以同時用在一份紀錄上；摘要沒有提供作者逐字定義，也沒有建立全業界通用的演進順序。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 設想在一個叫 B0 的起始版本上增修待辦清單的單標籤篩選。你可以拿同一張工作記錄，依下列問題各找一件能核對的東西。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"要查的工程問題表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">要查的工程問題\u003c/th>\n\u003cth scope=\"col\">在這次修復中找什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Prompt（指令）要求什麼？\u003c/td>\n\u003ctd>找委託的預期行為，如「選 work 後只顯示有該標籤的待辦」。若只寫「改善列表」，先釐清工作目標。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Context（當輪可見資料）有什麼？\u003c/td>\n\u003ctd>找已載入的規格和固定測試資料 A(work)、B(home)。磁碟上有檔案，也可能未送入本輪。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness（操作環境）允許、檢查什麼？\u003c/td>\n\u003ctd>找可寫目錄、可用工具及限制它們的設定。文字說請勿動某目錄，還應查工具能否阻止寫入。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Loop（反覆觀察與決策）依什麼再走一步？\u003c/td>\n\u003ctd>先看 API 回哪幾筆，再看畫面列哪幾筆；若資料正確而顯示有誤，接著查顯示端。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Graph（工作依賴圖）哪件事得等別件事？\u003c/td>\n\u003ctd>畫出 API 工作 F1 與畫面工作 F2 各有一條箭頭指向整合 F3。等兩項交付可供核對，才放行整合。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>分清工作內的重試與工作間的等待\u003c/h2>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 這裡的工作圖是 DAG，即箭頭表示前置關係、沿箭頭走不會繞回原工作的一種圖。F2 裡反覆查看畫面和修正程式，屬於單項工作內的 Loop；F3 能否開始，取決於外層圖上 F1、F2 的交付狀態。一次動作可以改變內圈的觀察，卻未必改變外圈的就緒條件。反過來，F1 已交付只代表整合少了一項等待，不能拿來證明畫面正常。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cstrong>自己判讀。\u003c/strong> 如果助手知道該做什麼，也看過正確資料，卻能寫進別人的工作區，該先查哪裡？先核對 Harness 的寫入限制；換 Prompt 可以提醒，限制是否生效仍須試查環境。再在紙上畫出 F1、F2 指向 F3 的兩個箭頭，把「觀察 API 後重試 UI」圈在 F2 裡。能解釋哪個條件會放行 F3，就能區分一次工具循環和工作圖。第三章再處理多人如何分派這些工作。\u003c/p>\n\u003cp data-passage=\"p-7\">來源：U-A 的 U01（使用者研究歷史重建）；P01、P17 分別提供流程及環境背景。Wiki 的 \u003ccode>concepts/coordination.md\u003c/code>、\u003ccode>examples/scenario.md\u003c/code> 提供工作關係和案例底稿。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋合成教學案例、歷史研究重建。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P01、P17、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\">P01 · Anthropic · Building effective agents\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/agent-workflow.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p01-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/agent-system-model.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.05", "firstSlide": 57, "lastSlide": 60, "subtitle": "同一模型為何在另一個專案寸步難行？"}, {"id": "C06", "chapter": "01", "title": "依專案與任務狀態重建 Context", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">舊對話記得「沿用最初的篩選提案」，專案紀錄卻顯示團隊昨天已接受新版本。把整段對話貼給下一個助手，只會讓它同時看到兩個答案。要恢復工作，得先弄清楚哪一份資料有決定當前工作的效力。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 一個 session（工作階段）承載一段互動。\u003cstrong>Context\u003c/strong> 是這一輪真正送入模型的內容；\u003cstrong>Memory\u003c/strong> 是跨回合或跨任務留下、日後可以再取用的知識。\u003cstrong>Project State（專案狀態）\u003c/strong> 記錄具權者已接受的版本、現行規格和未決事項。\u003cstrong>Task State（任務狀態）\u003c/strong> 則回答一項工作交給誰、哪一次嘗試有效、卡在哪裡，以及已經驗到什麼。一段舊文字可以被找出並放進 Context；這個動作只改變可見性，沒有更新任何核准紀錄。\u003c/p>\n\u003ch2 data-section>從接受紀錄找回有效的委託\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 現在要在已交付的待辦網站上接手後續工作。B0 是最初的程式基準；記憶帶出當時的一份草案。B1 是單標籤功能整合後由具權者驗收的版本。先到專案紀錄找到 B1 的版本定位、接受者與範圍；再到任務紀錄核對 Task（委託的工作）和 Dispatch（對該工作的一次派工嘗試）。比對責任人、基準及是否仍有效後，只將相關的 B1 規格段落、任務範圍、測試入口和未決事項連同位置送進新一輪。如此一來，接手者可以從段落回查原件，也知道哪些動作屬於自己。\u003c/p>\n\u003cp data-passage=\"p-4\">舊草案若與 B1 衝突，保留它作為查找變更原因的線索，依已核准的 B1 辦理。若工作票仍要求從 B0 修改，先釐清是刻意維護舊版，還是派工尚未更新；版本較新也不能自動授予修改另一版本的權力。若找不到接受者或有效派工，把衝突記為待決，交給負責人核對。\u003c/p>\n\u003cfigure>\u003cfigcaption>換人接手時，去哪裡核對哪一個問題？\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">接手者的問題\u003c/th>\u003cth scope=\"col\">要找的材料\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">以前討論過哪些做法？\u003c/th>\u003ctd>Memory 提供查找舊草案的線索。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">目前哪一版有效？\u003c/th>\u003ctd>Project State 提供已接受的版本、範圍與接受者。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">這一項工作仍由誰負責？\u003c/th>\u003ctd>Task State 記下有效派工、基準與阻塞。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">助手這一輪能用哪些依據？\u003c/th>\u003ctd>核對後送入 Context 的規格片段、任務範圍與原件位置。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cp data-passage=\"p-5\">\u003cstrong>自己判讀。\u003c/strong> 換 session 時應優先讀哪個版本？過期草案與已核准 B1 衝突時怎麼辦？先指出 Project State 中 B1 的接受紀錄，再指出 Task State 中仍有效的嘗試。能交代基準、工作範圍和誰確認它，才能據此重建 Context。若只能找到相似的聊天內容，還缺一條可追到批准者的依據。\u003c/p>\n\u003cp data-passage=\"p-6\">來源：S03（使用者私人補充研究的衍生摘要）、U-A；Wiki 的 \u003ccode>tutorials/context-knowledge-tools.md\u003c/code>、\u003ccode>concepts/supervision.md\u003c/code>。P03 僅支持外部連接機制，四種資訊的分工是教材採用的工程設計。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P03、S03、U-A\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://modelcontextprotocol.io/docs/learn/architecture\" rel=\"noopener noreferrer\" target=\"_blank\">P03 · Model Context Protocol · Architecture\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/context-tools.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/supervision.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p03-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s03-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/context-knowledge-tools.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.06", "firstSlide": 61, "lastSlide": 65, "subtitle": "重新開啟工作階段，怎麼接到正確的版本？"}, {"id": "C07", "chapter": "01", "title": "AGENTS.md、Skill、MCP 與 RAG 的分工", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">接手一個專案，你想查「沒有傳標籤時，應該顯示哪些待辦？」有時只差一頁規格，有時知道答案卻缺少執行測試的入口。先辨認缺的是規則、做法、連接還是資料，可以省下裝好工具卻仍答不出問題的工夫。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 專案慣例需要一個容易發現的位置。支援 \u003cstrong>AGENTS.md\u003c/strong> 的工具可以從專案或模組的指引讀到應在哪個目錄工作、採用哪個測試命令。若多個工作都需要同一套瀏覽器驗收步驟，可將做法包成 \u003cstrong>Skill\u003c/strong>，依名稱和說明選用後再讀操作指引，必要時取用附帶腳本。讀到命令或腳本只提供做法；能否執行仍取決於環境與授權。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 如果紀錄存在另一個服務，才需要考慮怎麼連過去。\u003cstrong>Model Context Protocol（MCP）\u003c/strong> 讓應用程式（host）經由 client 連到供應能力的 server，發現可讀資源或可呼叫的工具，再按配置發出請求。若困難在於許多文件裡只有一段相關，\u003cstrong>檢索增強生成（RAG）\u003c/strong> 則以問題搜尋有權存取的資料，把候選片段帶給模型組織答案。前者解決「用什麼介面取得」，後者解決「挑什麼材料讀」。返回片段的服務可以很準確地找到一份早已作廢的草案。\u003c/p>\n\u003ch2 data-section>從搜尋命中走到可用的測試預期\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 試走一次資料流。從專案紀錄查明本次任務採用 B0 基準上獲准的單標籤需求，讀相關目錄的 AGENTS.md 找測試入口。若規格只有一頁，直接讀原件；若文件很多，再以「省略 tag」查找。對每個命中回查文件版本、批准者和適用條件，只把現行段落與來源位置帶入本輪。規格說省略 tag 時返回 A、B；舊草案說「空字串表示全部」，那是另一種輸入，且未獲採納。直接把舊句變成斷言會替產品擅定一個規則。\u003c/p>\n\u003cp data-passage=\"p-5\">若要一致地驗畫面，可載入描述清除標籤步驟的 Skill；若測試紀錄在已授權的外部服務，可透過 MCP server 取回。只有本機環境時，仍可在規定的目錄執行專案指引列出的測試命令，保存實際命令、版本及輸出。依找到的現行規格核對「清除後請求省略 tag，畫面回到 A、B」。沒有合適片段，或沒有讀取權限，就記錄缺少的依據，不自行補出測試預期。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cstrong>自己判讀。\u003c/strong> 沒有 MCP 是否一定不能做本機測試？哪個環節確認規格有效？只要有獲准的本機測試入口就能執行；確認有效性發生在把候選片段對回專案批准紀錄的時候。用一份短規格試做，可以跳過檢索、外部連接和 Skill，仍須對回版本與條件。\u003c/p>\n\u003cp data-passage=\"p-7\">來源：P05（AGENTS.md 專案）、P04（OpenAI 的 Skill 指引）、P03（MCP 架構）、P30（Microsoft Learn 的 RAG 說明）；Wiki 的 \u003ccode>tutorials/context-knowledge-tools.md\u003c/code>。上述組合是教學選擇。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋公開技術文件、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P03、P04、P05、P30\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://modelcontextprotocol.io/docs/learn/architecture\" rel=\"noopener noreferrer\" target=\"_blank\">P03 · Model Context Protocol · Architecture\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://learn.chatgpt.com/docs/build-skills\" rel=\"noopener noreferrer\" target=\"_blank\">P04 · OpenAI · Build skills\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview\" rel=\"noopener noreferrer\" target=\"_blank\">P30 · Microsoft Learn · Retrieval-augmented generation\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/context-tools.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p03-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p04-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p30-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/context-knowledge-tools.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "1.07", "firstSlide": 66, "lastSlide": 69, "subtitle": "找到了文件，如何把可信的一段帶去測試？"}, {"id": "C08", "chapter": "01", "title": "Agent 的操作授權與產品決策權", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">修好單標籤篩選後，有人說「順手支援多個標籤吧」。寫程式的人也許知道怎麼做，卻還不知道使用者期待的結果。這一刻最值得交出的成果，可能是一組能讓產品負責人作選擇的資料。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者研究 U07 指出，未描述的細節可能被執行者自行補完，應辨認選擇是否改動已核准的產品或架構。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 此處把\u003cstrong>自主性\u003c/strong>界定為在工作範圍內選路的空間，把\u003cstrong>授權\u003c/strong>落在可操作的資源、可作的決定與可接受成果的人。工具能夠寫入檔案，只能證明有這項能力；能不能代表產品決定行為，要回到委託查核。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在 B0 起始版本上，委託允許讀取、測試和修正單標籤比對。依這個契約修復「選 work 卻見到 home」可以繼續。待單標籤版整合、接受為 B1，若下一項需求允許同時選 work 和 home，先列出兩種預期：AND 要求同一筆同時具備兩個標籤，OR 接受其中任一個。給定 A 只有 work、B 只有 home，AND 會得到空清單，OR 會得到 A、B。這是使用者看得見的差異，兩種結果各能寫出通過自己的測試。在改動前將這組輸入、兩個輸出及影響交給具產品決策權的人；取得批准後更新契約，才把選中的預期納入驗收。\u003c/p>\n\u003ch2 data-section>怎樣回報未知、阻塞、失敗與完成\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"DES
