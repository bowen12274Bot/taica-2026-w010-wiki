委託一層，原本由同一人記在腦中的約定，就多了一處需要明寫的交接。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、U-A", "passages": ["p-2"]}, {"number": 6, "type": "content", "title": "從需求到簽收的角色與交付責任", "chapter": "00", "unit": "I01", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>誰把什麼交給下一個人？\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>\u003cstrong>需求者\u003c/strong>說明按下按鈕後應看見的行為。\u003c/li>\u003cli>\u003cstrong>執行者\u003c/strong>交出實作與可查的改動。\u003c/li>\u003cli>\u003cstrong>整合者\u003c/strong>在共同版本重做操作，記錄實得結果。\u003c/li>\u003cli>\u003cstrong>具簽收權的人\u003c/strong>把結果與原先承諾逐項對照，決定是否接受。\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cstrong>最終交付由誰負責判定？\u003c/strong> 先看專案指定誰有權決定需求、誰能接受交付。在本書的待辦案例，人類產品負責人確認期望行為，也負責依整合結果簽收。執行者交出改動，整合者驗證共同版本；即使兩人都說滿意，仍須把可觀察的結果交到具有簽收權的人手上。你自己的專案可以有另一種授權安排，開始前要寫得出來。\u003c/p>", "layout": "figure", "note": "", "sources": "P01、U-A", "passages": ["p-3"]}, {"number": 7, "type": "content", "title": "依手上的工程決定選讀五章", "chapter": "00", "unit": "I01", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"你手上正在做的決定表格\" data-passage=\"p-4\" data-block=\"5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">你手上正在做的決定\u003c/th>\n\u003cth scope=\"col\">從哪裡讀\u003c/th>\n\u003cth scope=\"col\">讀完可以試做什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>助手說它測過了，我要看什麼？\u003c/td>\n\u003ctd>\u003ca href=\"#C01\">第一章　Agent 基礎\u003c/a>\u003c/td>\n\u003ctd>從同一段紀錄分出推測、執行與選路。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想把一項改動交給一位助手，怎樣交代？\u003c/td>\n\u003ctd>\u003ca href=\"#02-A01\">第二章 A 線　工作方法\u003c/a>\u003c/td>\n\u003ctd>指定可改範圍、要交的結果與應停下詢問的情況。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>哪些工作可以分開做？\u003c/td>\n\u003ctd>\u003ca href=\"#C22\">第三章　工程架構\u003c/a>\u003c/td>\n\u003ctd>找出可以獨立驗收的交付，以及必須等誰先決定的事項。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>兩邊都交了，卻對規格有不同解讀？\u003c/td>\n\u003ctd>\u003ca href=\"#C38\">第四章　實務決策\u003c/a>\u003c/td>\n\u003ctd>用同一個輸入重現差異，把選項交給有權裁決的人。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>做完了，值得接受或再次採用嗎？\u003c/td>\n\u003ctd>\u003ca href=\"#C47\">第五章　品質與效率\u003c/a>\u003c/td>\n\u003ctd>分別核對產品行為、人工與時間成本，以及是否幫到使用者。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-5\" data-block=\"6\">這條閱讀路線是編輯安排。公開文件 P01 支持預定流程與動態選路的區分；U-A 提供個人研究中規劃、執行與分工的背景。五章各有自己的問題入口，亦可直接依手邊工作跳讀。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">Wiki 的控制方式說明\u003c/span> · \u003ca href=\"#contents\">全書單元索引\u003c/a>\u003c/p>", "layout": "table", "note": "", "sources": "P01、U-A", "passages": ["p-4", "p-5"]}, {"number": 8, "type": "content", "title": "單標籤篩選的三種驗收情境", "chapter": "00", "unit": "I02", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cstrong>\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span>\u003c/strong> 一個網站已經能列出待辦事項。現在你要委託助手加上「按標籤篩選」：從兩筆資料開始，一筆是寄報表，標為工作；另一筆是買牛奶，標為家庭。試著在動手前回答：選「工作」時哪一筆要留下，哪一筆要消失？接著清除選擇時，哪一筆應重新出現？選到完全沒有使用過的標籤時，正確結果是空清單。只放「寄報表」一筆就看不出程式到底有沒有篩選，因為一律顯示全部也會得到相同畫面。\u003c/p>", "layout": "prose", "note": "", "sources": "U-A", "passages": ["p-1"]}, {"number": 9, "type": "content", "title": "多標籤篩選的交集與聯集規則", "chapter": "00", "unit": "I02", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">這個練習約定第一項需求只能選一個標籤。假設下次有人想同時選工作和家庭，請先讓他指出想看到什麼：要找兼具兩種標籤的待辦，還是任一種符合就列出？沿用剛才兩筆資料，前者找不到，後者兩筆都找得到。舊功能的簽收並沒有替新需求選好答案。這個例子只用來手算、設計檢查及討論責任，無須先安裝程式。\u003c/p>\n\u003cfigure data-block=\"3\">\u003cfigcaption>用兩筆待辦問清楚下一項需求（合成練習）\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">你怎麼解讀「工作和家庭」\u003c/th>\u003cth scope=\"col\">寄報表（只有工作標籤）\u003c/th>\u003cth scope=\"col\">買牛奶（只有家庭標籤）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">同時具有兩個標籤\u003c/th>\u003ctd>排除\u003c/td>\u003ctd>排除\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">具有其中任一標籤\u003c/th>\u003ctd>留下\u003c/td>\u003ctd>留下\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "U-A", "passages": ["p-2"], "subtitle": "同時選兩個標籤會留下哪一筆？"}, {"number": 10, "type": "content", "title": "從預期行為到整合版本的簽收", "chapter": "00", "unit": "I02", "body": "\u003cp data-passage=\"p-3\" data-block=\"5\">沿著這件事走一遍：先保存原本能列出兩筆的版本；把「選取、清除、無匹配」三個預期交產品負責人確認；再讓提供資料的人與顯示畫面的人按同一組樣本製作；最後由整合者在兩份修改合在一起的版本上重做三次操作，留下實際輸出、例外與待確認事項。\u003cstrong>在具權者接受前，新版本仍是等待驗收的候選。\u003c/strong> 接下來若提多選，就從已接受的版本另立契約。\u003c/p>", "layout": "prose", "note": "", "sources": "U-A", "passages": ["p-3"]}, {"number": 11, "type": "content", "title": "用基線、契約與工作票追溯功能交付", "chapter": "00", "unit": "I02", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">讀到後面的工作票時，可回來對照下表。只想學方法的讀者，可以直接略過名稱。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"已在練習中見過的事表格\" data-passage=\"p-5\" data-block=\"7\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">已在練習中見過的事\u003c/th>\n\u003cth scope=\"col\">後文用的定位\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>還沒有新功能、能讀出原清單的起點；兩筆固定測試資料\u003c/td>\n\u003ctd>B0；讀取列表的請求為 \u003ccode>GET /todos\u003c/code>；A 帶 \u003ccode>work\u003c/code>，B 帶 \u003ccode>home\u003c/code>。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>請有權者確認單選規則與樣本\u003c/td>\n\u003ctd>F0 契約票。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>依約提供資料、依約顯示畫面\u003c/td>\n\u003ctd>F1 資料介面票與 F2 畫面票；兩者都讀同一版契約。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>把兩項產物放在一起重驗\u003c/td>\n\u003ctd>F3 整合票。只有兩邊的局部結果還不夠。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>具權者簽收後，後續需求可以據以開工的版本\u003c/td>\n\u003ctd>B1。只找到較新的提交或一張完成截圖，均不足以判定已接受。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\" data-block=\"8\">待辦內容與工作票出自教學工作紙；這段推演沒有產生產品測試結果。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">案例底稿\u003c/span> · \u003ca href=\"#C17\">用同一組資料走完整個單 Agent 任務\u003c/a> · \u003ca href=\"#C30\">把契約拆成四張票\u003c/a>\u003c/p>", "layout": "table", "note": "", "sources": "U-A", "passages": ["p-4", "p-5", "p-6"]}, {"number": 12, "type": "chapter", "title": "Agent 基礎｜模型、工具呼叫、Agent Loop、Context 與 Harness", "chapter": "01", "unit": "", "body": "", "layout": "prose", "note": "", "sources": "", "passages": []}, {"number": 13, "type": "content", "title": "LLM 能從故障描述推測哪些原因？", "chapter": "01", "unit": "C01", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cstrong>大型語言模型（large language model，LLM）\u003c/strong> 接收這一輪提供給它的材料，根據學到的語言規律，接續產生回答。你只給它一句故障描述，它就能提出可能原因，例如「網站沒有把選好的標籤送出去」，也能說明該怎麼檢查。這對想知道「有哪些可能」的人很有幫助。可是同一個現象也可能發生在另一種情況：網站送出了正確的標籤，收到新清單後，畫面卻繼續顯示舊資料。光憑那句描述，模型沒有足夠的線索從兩者之間挑出真正的原因。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">如果你把一份測試報告貼進對話，模型便能解釋報告裡的差異。這時它多了一份證據，而執行測試的人仍可能是你。\u003cstrong>聊天\u003c/strong>描述的是人如何跟系統交換訊息。訊息泡泡的外形不會告訴你，資料是人貼進來的、程式自動取回的，還是模型讀過問題後決定去查的。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02、U-A", "passages": ["p-1", "p-2"]}, {"number": 14, "type": "content", "title": "執行環境如何把工具結果送回模型", "chapter": "01", "unit": "C01", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">現在把委託說得更清楚：「請在這份專案裡查明原因；可以讀檔和執行測試。」面對同一項委託，只有文字可用的系統仍然可以給出上述推測，並請你提供測試輸出。配有\u003cstrong>工具\u003c/strong>的系統多一條路。這裡的工具指能做一項具體操作、把結果送回來的程式，例如讀取指定檔案，或啟動既有測試。模型可以提出「讀取篩選規則，再執行這項測試」的請求。接住請求的程式稱為\u003cstrong>執行環境\u003c/strong>。它依本次可用的工具與權限執行動作，把讀到的規則、測試輸出或錯誤送回模型。這些從操作取得的結果，就是後面所說的\u003cstrong>觀察\u003c/strong>。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02、U-A", "passages": ["p-3"]}, {"number": 15, "type": "content", "title": "判讀請求、拒絕與失敗斷言", "chapter": "01", "unit": "C01", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">因而，當助手說「我剛試過了」，值得追問的是「這次測的是哪個行為？實際得到什麼？」假如紀錄只到「要求執行測試」，你知道它提出過請求；若執行環境回報「無權讀取測試資料」，你知道檢查卡在取資料；若紀錄列出「預期一筆，實際兩筆」，你才有這次行為與預期不符的證據。三種情況需要三種不同的回報。即使最後一種已經重現問題，造成差異的那一行程式也還有待定位。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02、U-A", "passages": ["p-4"]}, {"number": 16, "type": "content", "title": "Workflow 依預寫分支處理測試失敗", "chapter": "01", "unit": "C01", "body": "\u003cp data-passage=\"p-6\" data-block=\"7\">假設留下了「預期一筆，實際兩筆」的紀錄。設計者可以事先寫好規則：「遇到這種差異就保存輸出、標記失敗、結束檢查。」每次碰到相同條件，程式都知道該走哪一支。這種由程式預先安排操作及分支的方式稱為\u003cstrong>工作流程（Workflow）\u003c/strong>。它可以呼叫工具，也可以請語言模型把兩筆結果寫成容易閱讀的報告。報告的措辭由模型產生，報告寫完就結束這一步，仍由程式規定。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02、U-A", "passages": ["p-6"]}, {"number": 17, "type": "content", "title": "Agent 依失敗輸出選擇下一項檢查", "chapter": "01", "unit": "C01", "body": "\u003cp data-passage=\"p-7\" data-block=\"8\">另一種設計是把調查目標、允許做的事和這份失敗輸出交給模型。模型讀到「多出來的是家裡的待辦」，於是從可用操作中選擇先讀負責比對標籤的檔案；若後來發現資料早已正確篩過，它可以轉查顯示清單的程式。這裡稱為 \u003cstrong>Agent\u003c/strong> 的，是讓模型在執行途中根據觀察選擇後續動作、再由環境執行並回傳結果的系統。模型在其中負責判讀與選路。它也可以判斷已有足夠資訊而直接回答，一次工作不要求湊足某個工具呼叫次數。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02、U-A", "passages": ["p-7"]}, {"number": 18, "type": "content", "title": "從選檔依據辨認預寫分支或模型決策", "chapter": "01", "unit": "C01", "body": "\u003cp data-passage=\"p-8\" data-block=\"9\">有個容易看錯的地方：程式也能寫出「如果多出一筆，就開啟比對標籤的檔案」這樣的條件。於是兩種系統都可能讀了同一份檔案。要判斷控制方式，請追到\u003cstrong>選檔的那一刻\u003c/strong>：是開發者早就把「這個條件 → 這個檔案」寫進程式，還是模型讀到本次錯誤後，才從獲准的操作中挑了這個檔案？如果手上只有檔名和最後的答案，兩種解釋都說得通。工具確實被用過，與模型確實做過這個選擇，分別需要證據。同一個 LLM 可以放進這兩種設計：在一處，它只負責寫報告；在另一處，系統把下一個調查動作也交給它選。要替這段工作分類，先看模型在其中負責什麼。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02、U-A", "passages": ["p-8"], "subtitle": "兩方都讀同一個檔案，誰選的？"}, {"number": 19, "type": "content", "title": "自我驗收：找出執行測試與選擇測試的紀錄", "chapter": "01", "unit": "C01", "body": "\u003cp data-passage=\"p-9\" data-block=\"10\">\u003cstrong>C01 自我驗收。\u003c/strong> 如果助手讀過你貼的報告，也準確說出多出來的那一筆，要證明它自己做過測試，還缺什麼？請找與本次委託相符的執行請求和工具回覆。要進一步確認誰選擇執行這項測試，再找觸發它的程式規則或模型決策紀錄。公開機制見 P01、P02；聊天與工程執行的使用背景見 U-A 中的 U02 歷史重建。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02、U-A", "passages": ["p-9"]}, {"number": 20, "type": "content", "title": "用固定測試資料推算選取與取消篩選的結果", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">即使你已知道測試確實跑過，若想把調查交給別人重做，還需要知道哪一步可以預先寫好，哪一步需要有人讀了結果再作判斷。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 下面是一個\u003cstrong>合成教學例\u003c/strong>。刻意只留下兩筆待辦，好讓你能自己算出預期結果。A 是「寄工作報表」，標籤是 \u003ccode>work\u003c/code>；B 是「買牛奶」，標籤是 \u003ccode>home\u003c/code>。規則是選一個標籤，只列出標籤相符的待辦。因此選 \u003ccode>work\u003c/code> 應只看到 A，取消篩選則應再看到 A、B。這組每次檢查都能重新載入的已知資料，在測試裡稱為 \u003cstrong>fixture（測試用固定資料）\u003c/strong>。有了它，「應該只剩一筆」就有了可以核對的依據。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-1", "p-2"]}, {"number": 21, "type": "content", "title": "分開觀察 API 回應與 UI 清單", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">一個網站上有兩個地方可以觀察這件事。畫面向伺服器索取清單時，雙方透過約定的軟體介面交換資料，這個介面稱為 \u003cstrong>API\u003c/strong>。例如 \u003ccode>GET /todos?tag=work\u003c/code> 是請伺服器傳回標籤為 \u003ccode>work\u003c/code> 的待辦。使用者按得到的標籤、看得到的清單，則屬於\u003cstrong>使用者介面（UI）\u003c/strong>。拿到正確資料和把正確資料畫出來是兩個步驟，所以同一個問題可以在兩處留下不同線索。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 把同一句委託交給兩方：「找出選 work 後畫面仍列出 B 的原因，回報可重現的證據。」兩方用同一版程式、同一組 A、B，可以讀 API 與 UI 程式及執行測試。兩方都先載入 fixture、操作標籤、核對同一次請求的參數，逐筆比對預期、回應及畫面。題設給的觀察也完全相同：請求帶 work，伺服器只回 A，畫面卻留下 A、B。這一步能縮小故障位置，但尚未查明根因。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-3", "p-4"]}, {"number": 22, "type": "content", "title": "固定流程如何選中清單更新測試", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">固定 Workflow 的作者預先規定：若 API 多回 B，就保存輸入與差異，轉做伺服器比對檢查；若回應正確而畫面仍有 B，就執行清單更新測試，記錄更新前後的資料。若連 fixture 都沒載入，回報缺少輸入，不能判定篩選對錯。本題走第二條分支。工作紀錄要列出觸發分支的觀察、已執行的檢查及其結果。預寫路徑用盡仍不能解釋故障時，把未定位的原因寫進回報。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-5"]}, {"number": 23, "type": "content", "title": "模型如何依 API 與畫面的落差決定查哪段程式", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-6\" data-block=\"7\">Agent 收到同一份回應與畫面紀錄。這次回應裡已經沒有 B，因此它有理由先讀「收到新清單之後，有沒有用它取代舊清單」的程式，再決定要觀察更新前後的資料，還是核對畫面繪製所讀的清單。假設兩方最後都執行了同一個清單更新測試，區別仍然存在：一方可出示事前寫好的分支，另一方可出示模型在看到差異後才提出的選擇。要斷定根因，兩方都還需要能重現差異、指出哪個更新步驟留下 B 的證據。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-6"]}, {"number": 24, "type": "content", "title": "比較預寫分支與模型選路要留下的紀錄", "chapter": "01", "unit": "C02", "body": "\u003cfigure data-block=\"8\">\u003cfigcaption>同一個觀察：服務只回 A，畫面仍有 A、B（合成案例）\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">追查哪個決定\u003c/th>\u003cth scope=\"col\">固定 Workflow\u003c/th>\u003cth scope=\"col\">Agent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">為什麼轉查畫面？\u003c/th>\u003ctd>執行前寫好的分支指定清單更新測試。\u003c/td>\u003ctd>模型讀到這次差異後，從許可的動作中選擇追查更新處。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">要保留什麼？\u003c/th>\u003ctd>分支條件與觸發分支的觀察。\u003c/td>\u003ctd>作出選擇時的觀察、所選動作與後續工具回覆。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "P01、P02", "passages": []}, {"number": 25, "type": "content", "title": "哪些條件足以把調查寫成固定流程？", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-7\" data-block=\"9\">何時固定流程已經足夠？當輸入、操作、成功條件和遇錯出口都穩定，能把委託所需的判斷完整預排。例如只受託驗 API，載入資料、送出請求、比對並回報即可；若受託解釋畫面，就還要涵蓋回應正確而畫面錯誤的路徑。一次 API 通過的範圍只到該查詢與這組資料。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-7"]}, {"number": 26, "type": "content", "title": "授權只到 API 時如何交接畫面問題", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-9\" data-block=\"11\">在這個例子裡，「值得查畫面」是根據證據作出的技術判斷；「可以讀畫面程式」取決於使用者授權和執行環境開放的操作。如果本次只准測 API，合理的回報是：「指定查詢回傳 A；你提供的畫面仍顯示 A、B。下一步想檢查清單更新邏輯，需要畫面程式的讀取權。」這樣接手的人能從分岔處繼續。如果調查需要改動「哪些待辦算相符」的產品規則，還得請有權決定需求的人確認。讓模型判斷查哪裡，並不會連帶授予讀取、寫入或改規則的權力。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-9"]}, {"number": 27, "type": "content", "title": "從可重跑的固定檢查接到動態調查", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-10\" data-block=\"12\">實務上可以把兩種方式接起來。如果這種畫面故障經常出現，團隊也可以事先規定「API 回 A 後，再檢查畫面是否只列 A」；連查兩處照樣可以是固定流程。另一種安排是把固定資料、API 查詢和比對寫成可重跑的檢查，讓每次調查有相同起點；碰到既定檢查解釋不了的觀察，再讓 Agent 在授權內選擇下一項調查。這樣既保有可比較的結果，也為未知原因留出探查空間。代價是每多查一次，就可能多用一次模型推理、工具時間或人工批准。選擇的依據應該是這次任務有多少步驟能預定，以及新觀察能否改變值得採取的動作。光看分支數量或一次成功示例，還無法判定哪種架構整體更快、更便宜。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-10"]}, {"number": 28, "type": "content", "title": "從執行紀錄查明誰決定開檔", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-12\" data-block=\"14\">\u003cstrong>只看見聊天視窗和「我測過了」，你能說背後有 Agent 嗎？\u003c/strong> 先指出還缺哪兩項資訊。第一項是這次操作及其結果，例如用哪組資料測出了什麼。第二項是選擇操作的依據，例如程式規則已經指定要跑這項測試，或模型在看到錯誤後才提出具體的下一步。只有聊天截圖時，兩項都待查。\u003c/p>\n\u003cp data-passage=\"p-13\" data-block=\"15\">\u003cstrong>甲、乙都在測試失敗後打開同一個檔案。哪一次是模型決定下一步？\u003c/strong> 甲的設定檔早已寫明失敗時開啟該檔；乙的紀錄顯示，模型拿到本次失敗輸出後，才選擇查看該檔並送出讀取請求。乙提供了模型選路的證據。甲即使隨後請模型解釋檔案，選檔這一步仍屬預定流程。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-12", "p-13"]}, {"number": 29, "type": "content", "title": "練習：哪一筆差異值得從 API 追到 UI？", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-14\" data-block=\"16\">\u003cstrong>如果明天要檢查同一組待辦，你會預先寫好哪些步驟？何時才需要改查畫面？\u003c/strong> 只要問題仍是「這個 API 是否回傳 A」，就能預排載入、查詢、比對與回報。若任務是解釋使用者看到 B，而且已核對同一次請求回 A、畫面卻顯示 A、B，此時才有具體理由從 API 轉向 UI。若手上的授權只到 API，先帶著這兩個觀察申請下一步的權限。\u003c/p>\n\u003cp data-passage=\"p-15\" data-block=\"17\">讀到這裡，你已經可以從工作紀錄分辨模型提出了什麼、環境做了什麼，以及哪一步容許模型選路。紀錄沒有涵蓋的事也可以說清楚，例如「這項檢查通過，畫面行為仍待確認」。想接著追一個工具請求怎麼變成執行結果，可以讀本機 Wiki 的延伸教學。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">從模型輸出追到停止條件\u003c/span>\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-14", "p-15"]}, {"number": 30, "type": "content", "title": "公開機制、合成案例與歷史研究的適用範圍", "chapter": "01", "unit": "C02", "body": "\u003cp data-passage=\"p-17\" data-block=\"19\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 固定流程與動態選路的區分採用 Anthropic 的 P01；工具請求、結果回傳以及一次執行可以直接結束，採用 OpenAI 的 P02。上面的兩筆待辦及對照路徑改編自 Wiki 合成工作紙，所有輸出均為題設。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P01 來源摘要\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P02 來源摘要\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">合成案例底稿\u003c/span>\u003c/p>\n\u003cp data-passage=\"p-18\" data-block=\"20\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> 使用者研究 U-A 中的 U02 以歷史摘要記下先透過對話討論目的，再把工作交到可測環境的做法。本單元借它說明兩種委託為何容易混淆；它的證據狀態是歷史重建，不能據此推算任何一種做法的成效。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-A 本機摘要\u003c/span>\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P02", "passages": ["p-17", "p-18"]}, {"number": 31, "type": "content", "title": "模型、runner 與工具各負責哪個動作？", "chapter": "01", "unit": "C03", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">有人在調查報告裡寫「已修正清單」。你想知道這句話指的是提出修改建議、真的寫入檔案，還是修改後的畫面也已通過檢查。追一次請求的去向，比數報告有幾行更容易回答。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> \u003cstrong>Model（模型）\u003c/strong> 讀取本輪輸入，可以產生文字，也可以產生帶參數的工具請求。\u003cstrong>Runtime（執行環境）\u003c/strong> 接住請求，其中驅動一次工作的程式可稱為 runner。Runner 辨認輸出類型，依環境的權限與設定，把獲准的請求送往相應的工具，再把工具回覆帶回模型。\u003cstrong>Tool（工具）\u003c/strong> 負責具體操作。Shell 可在工作目錄下啟動測試命令；Browser 可操作頁面、讀取可見清單。工具的輸出記錄了它所觀察的那一層。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、P17", "passages": ["p-1", "p-2"]}, {"number": 32, "type": "content", "title": "追蹤工具請求的許可、執行與回送", "chapter": "01", "unit": "C03", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>工具請求怎麼變成下一輪模型可讀的觀察？\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>模型提出動作與參數。\u003c/li>\u003cli>Runner 核對許可。拒絕轉送時，回報原因；獲准時，才交給對應工具。\u003c/li>\u003cli>Shell 啟動指定命令，或 Browser 操作頁面。各自回傳該次操作的觀察。\u003c/li>\u003cli>Runner 將回覆對回請求，模型據此選下一步。\u003c/li>\u003c/ol>\u003c/figure>", "layout": "figure", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、P17", "passages": []}, {"number": 33, "type": "content", "title": "用四欄分清寫入、測試與畫面觀察", "chapter": "01", "unit": "C03", "body": "\u003cp data-passage=\"p-3\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在紙上分四欄寫下「請求、執行者、作用、回傳」。假設模型要求修改清單更新函式，先把檔名與擬議修改放在第一欄。若 runtime 拒絕寫入，作用欄寫「此請求未寫入」，回傳欄記下拒絕原因。若獲准，實際寫檔的是編輯工具；回傳成功後，可以重讀檔案核對差異。再由 Shell 跑指定測試並保存實際輸出。若要回答畫面是否改好，還要用 Browser 選標籤，核對頁面到底顯示哪些資料。一次成功寫入，只能回答這張表裡的一個問題。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、P17", "passages": ["p-3"]}, {"number": 34, "type": "content", "title": "對照寫入遭拒與測試斷言失敗", "chapter": "01", "unit": "C03", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cstrong>把一個結果配回一個請求。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設工作區已有測試 \u003ccode>clear-filter\u003c/code>，固定資料是 A(work)、B(home)。下面每列都從同一份未修的版本出發，代號供讀者對帳。請先遮住最右欄，只看模型要求的動作和 runner 帶回的回覆，再判斷下一步。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"請求與參數表格\" data-passage=\"p-5\" data-block=\"7\" data-rows=\"1,2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">請求與參數\u003c/th>\n\u003cth scope=\"col\">runner 的處置\u003c/th>\n\u003cth scope=\"col\">模型下一輪收到的結果\u003c/th>\n\u003cth scope=\"col\">能核對什麼、接著查什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Q1：編輯工具將清除處理器改為省略 tag\u003c/td>\n\u003ctd>工作區僅准讀取，拒絕轉送\u003c/td>\n\u003ctd>Q1：拒絕寫入，目標超出本次許可\u003c/td>\n\u003ctd>本次沒有呼叫編輯工具。交回擬改位置與所需授權。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q2：Shell 在專案根目錄執行 \u003ccode>npm test -- clear-filter\u003c/code>\u003c/td>\n\u003ctd>允許，Shell 已啟動命令\u003c/td>\n\u003ctd>Q2：退出碼 1，測試報告「清除後預期 A、B，實得 A」\u003c/td>\n\u003ctd>有失敗斷言，可查清除時送出的參數與畫面更新。這次回覆只涵蓋該測試。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、P17", "passages": ["p-4", "p-5"]}, {"number": 35, "type": "content", "title": "區分測試未啟動與畫面清單不符預期", "chapter": "01", "unit": "C03", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"請求與參數表格\" data-passage=\"p-5\" data-block=\"7\" data-rows=\"3,4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">請求與參數\u003c/th>\n\u003cth scope=\"col\">runner 的處置\u003c/th>\n\u003cth scope=\"col\">模型下一輪收到的結果\u003c/th>\n\u003cth scope=\"col\">能核對什麼、接著查什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Q3：以相同參數請 Shell 跑同一測試\u003c/td>\n\u003ctd>允許，Shell 嘗試啟動命令\u003c/td>\n\u003ctd>Q3：找不到 npm，測試程序未啟動\u003c/td>\n\u003ctd>外部執行環境缺少入口。保留錯誤並核對安裝或路徑，產品結果仍待測。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q4：Browser 在該版本選 work 後按清除，讀取可見 ID\u003c/td>\n\u003ctd>允許，Browser 執行兩個操作\u003c/td>\n\u003ctd>Q4：選取後 [A]，清除後 [A]\u003c/td>\n\u003ctd>可見行為違反清除後應見 [A,B] 的契約；還要對照請求與回應才能歸因。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、P17", "passages": ["p-5"]}, {"number": 36, "type": "content", "title": "回覆缺失與部分寫入如何查證？", "chapter": "01", "unit": "C03", "body": "\u003cp data-passage=\"p-6\" data-block=\"8\">同樣一句「沒通過」，Q1 缺授權，Q3 缺可執行的測試入口，只有 Q2 提供跑到斷言的證據。若只剩 Q2 的請求與 Q4 的回覆，保留 Q4 的畫面觀察，把 Q2 的結果記為「回覆缺失，執行情形待核」。同樣地，若工具已開始寫入才報錯，應重讀目標與差異，確認有沒有留下部分改動；只有在轉送之前明確拒絕，才能就該請求判定沒有呼叫寫入工具。表中的 Q 編號與回覆文字是教學記號，各工具的實際欄位依環境而定。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、P17", "passages": ["p-6"]}, {"number": 37, "type": "content", "title": "Harness 如何提供權限限制與架構檢查回饋", "chapter": "01", "unit": "C03", "body": "\u003cp data-passage=\"p-7\" data-block=\"10\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 工具怎麼知道可以寫哪裡？專案指引可以說明規則，工具權限可以限制寫入範圍，自動檢查可以把違規位置送回。將這些規則、工具、權限與回饋組在一起的工程環境，在這裡稱為 \u003cstrong>Harness\u003c/strong>。它可以圍繞同一個模型運作，無須再加一個負責監看的模型。P17 描述一個團隊如何把架構限制做成執行時能取得的回饋；P02 說明的是一套 SDK 的 runner，兩者解答不同問題。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、P17", "passages": ["p-7"]}, {"number": 38, "type": "content", "title": "用故意越層的匯入檢驗依賴規則", "chapter": "01", "unit": "C03", "body": "\u003cp data-passage=\"p-8\" data-block=\"11\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 試把「畫面程式只能透過服務層存取資料」落到環境裡。在專案指引寫明允許的依賴方向，在檢查器設定禁止畫面模組直接匯入資料模組，再用一個含違規匯入的範例檢查它會不會報出兩端檔名。修正該依賴後應能再跑同一檢查。只把規則寫進文件，仍容許工具寫出違規程式；即使依賴檢查通過，也只保證所檢查的關係。\u003c/p>\n\u003cp data-passage=\"p-9\" data-block=\"12\">\u003cstrong>自己判讀。\u003c/strong> 紀錄只剩「請寫檔並跑測試」，模型直接改到了什麼？能保證架構維持嗎？此時僅能確認提出了請求。依序找寫檔工具回覆、修改後差異及對應架構檢查的輸出；缺哪一項，就保留哪一項待查。想追工具回覆如何影響下一個動作，可接 C04。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、P17", "passages": ["p-8", "p-9"]}, {"number": 39, "type": "content", "title": "用檔案差異與同版本畫面核對修復", "chapter": "01", "unit": "C03-01", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">待辦網站上有兩件事：回覆客戶（A，標籤 work）和買牛奶（B，標籤 home）。點選工作標籤後應該只見第一件，畫面卻還列著兩件。助手說「已修正清單」。要接手這次修復，你需要找到一份檔案差異，還要看那個版本的網站在同一次操作後顯示哪一件。\u003c/p>\n\u003cp data-passage=\"p-3\" data-block=\"3\">模型（Model）根據當輪輸入產生文字。它可以用一句答覆結束這一輪，也可以送出帶有工具名稱、目標與參數的請求。例如，要改動負責更新清單的函式，就得說明改哪個檔案、打算寫入什麼。執行環境（Runtime）中的 runner 辨認這兩種輸出；收到工具請求，先依權限核對操作，再把獲准的工作交給編輯工具。\u003cstrong>工具實際寫入\u003c/strong>才可能改變工作目錄。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": ["p-1", "p-3"], "subtitle": "「已修正清單」需要哪兩份觀察？"}, {"number": 40, "type": "content", "title": "沿同一識別碼追蹤寫檔請求與回覆", "chapter": "01", "unit": "C03-01", "body": "\u003cp data-passage=\"p-4\" data-block=\"4\">用一個紙上編號 q1 串起去程和回程。從上往下先認發送者，再看接收者此時能觀察到什麼。實際產品可用不同訊息格式。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"方向表格\" data-passage=\"p-5\" data-block=\"5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">方向\u003c/th>\n\u003cth scope=\"col\">發送者 → 接收者\u003c/th>\n\u003cth scope=\"col\">紙上訊息與可見作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>去程\u003c/td>\n\u003ctd>Model → runner\u003c/td>\n\u003ctd>q1：編輯 list-view 的清單更新函式；此時只有擬議修改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>去程\u003c/td>\n\u003ctd>runner → 編輯工具\u003c/td>\n\u003ctd>授權通過，轉交 q1 的目標與變更\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回程\u003c/td>\n\u003ctd>編輯工具 → runner\u003c/td>\n\u003ctd>q1：寫入成功；可重讀 list-view 核對差異\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回程\u003c/td>\n\u003ctd>runner → Model\u003c/td>\n\u003ctd>以 q1 的結果補入下一輪輸入，模型才有寫入回覆可參照\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": ["p-4", "p-5"]}, {"number": 41, "type": "content", "title": "從寫入回覆走到版本差異與畫面驗收", "chapter": "01", "unit": "C03-01", "body": "\u003cp data-passage=\"p-6\" data-block=\"6\">如果紀錄停在第一列，你能確認的是模型提出 q1。下一筆要找 runner 的許可決定，再找帶同一識別碼的工具回覆。回傳也可能是一個錯誤；把它配回原請求，下一輪模型才能依實際結果選擇行動。即使拿到表中第三列的成功回覆，簽收仍需要重讀對應版本的差異，再實際選 work，記下畫面的待辦編號。\u003c/p>\n\u003cp data-passage=\"p-7\" data-block=\"7\">OpenAI 的 P02 公開文件支持輸出分流與結果回送（\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"PUBLIC_DOC\">公開技術文件\u003c/span>）。T01 是教材的合成系統模型；上述待辦、q1 與成功寫入均為紙上示例（\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"SYNTHETIC_EXAMPLE\">合成教學案例\u003c/span>）。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": ["p-6", "p-7"]}, {"number": 42, "type": "content", "title": "工具呼叫的三方分工與執行紀錄", "chapter": "01", "unit": "C03-02", "body": "\u003cp data-block=\"1\">模型能提出「在這個目錄執行清單測試」的請求。讓測試程式真正啟動，還需要一個能辨認請求、決定是否放行的執行環境，以及一個能在工作目錄下執行命令的工具。這三個角色各自留下不同的紀錄。沿著一次工具呼叫（Tool Calling）讀這些紀錄，就能分辨「模型要求測試」「測試有跑到斷言」和「使用者看見正確清單」分別有哪些依據。\u003c/p>\n\u003cp data-block=\"3\">Model（模型）從當輪輸入產生輸出。輸出可以直接是文字；若要取得外部觀察，它可以提出工具名稱與參數。Runtime（執行環境）中的 runner 接住這個請求，依當輪可用的工具、工作範圍與權限決定是否轉送。Shell 可以啟動測試命令，Browser 可以操作畫面並讀取可見結果，編輯工具則可能改變檔案。工具完成或遇錯時，runner 將回覆對回原請求，讓模型在下一輪讀到發生了什麼。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": []}, {"number": 43, "type": "content", "title": "讀懂工具呼叫流程圖：放行、拒絕與回送", "chapter": "01", "unit": "C03-02", "body": "\u003cfigure data-block=\"4\">\u003cfigcaption>一次工具呼叫的訊息路徑\u003c/figcaption>\u003cdiv class=\"flow-node\">Model 輸出\u003c/div>\n        \u003cdiv class=\"fork\">\u003cdiv>\u003cb>最終文字\u003c/b>\u003cspan>↓ 結束本輪\u003c/span>\u003c/div>\n        \u003cdiv>\u003cb>工具請求\u003c/b>\u003cspan>識別碼、名稱、參數 ↓\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"flow-node\">runner 核對允許的工具、目標與操作\u003c/div>\n        \u003cdiv class=\"fork\">\u003cdiv>\u003cb>拒絕\u003c/b>\u003cspan>↓ 記錄原因\u003c/span>\u003c/div>\n        \u003cdiv>\u003cb>放行 → Tool 執行\u003c/b>\u003cspan>↓ 回傳觀察或錯誤\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"flow-node\">runner 配對請求與回覆\u003c/div>\n        \u003cdiv class=\"flow-end\">↓　Model 取得下一輪輸入\u003c/div>\u003cdetails>\u003csummary>讀取原稿文字圖\u003c/summary>\u003cpre>Model 輸出\n  ├─ 最終文字 → 結束本輪\n  └─ 工具請求（識別碼、名稱、參數）\n       ↓\n     runner 核對允許的工具、目標與操作\n       ├─ 拒絕 → 記錄原因 ──────────────────┐\n       └─ 放行 → Tool 執行 → 回傳觀察或錯誤 ──┤\n                                               ↓\n                              runner 配對請求與回覆\n                                               ↓\n                                  Model 取得下一輪輸入\u003c/pre>\u003c/details>\u003c/figure>", "layout": "figure", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": []}, {"number": 44, "type": "content", "title": "用請求識別碼配對工具回覆", "chapter": "01", "unit": "C03-02", "body": "\u003cp data-block=\"5\">圖中的識別碼是教學記號。例如 \u003ccode>q2\u003c/code> 指「請 Shell 在指定目錄執行測試」，\u003ccode>q3\u003c/code> 指「請 Browser 讀出畫面上的待辦編號」。若手上只有 q2 的請求和 q3 的回覆，仍可引用 q3 的畫面觀察；\u003cstrong>q2 的執行結果待查\u003c/strong>。下一輪收到文字回覆，只能依回覆記錄的範圍下判斷。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": []}, {"number": 45, "type": "content", "title": "判讀拒絕轉送與寫入途中報錯", "chapter": "01", "unit": "C03-02", "body": "\u003cp data-block=\"7\">以下是假設同一個待辦清單的四種紀錄。固定測試資料（fixture）有 A、B 兩筆，只有 A 帶 \u003ccode>work\u003c/code> 標籤。\u003c/p>\n\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"最後可定位的事件表格\" data-block=\"8\" data-rows=\"1,2\">\u003ctable class=\"cols-3\">\u003cthead>\u003ctr>\u003cth scope=\"col\">最後可定位的事件\u003c/th>\u003cth scope=\"col\">能從紀錄確認的事\u003c/th>\u003cth scope=\"col\">下一步\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"最後可定位的事件\">runner 在轉送前拒絕寫檔\u003c/td>\u003ctd data-label=\"能從紀錄確認的事\">本次請求沒有呼叫編輯工具。\u003c/td>\u003ctd data-label=\"下一步\">記下目標與拒絕原因，先做獲准的唯讀檢查；確需寫入時交具權者決定。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"最後可定位的事件\">編輯工具開始寫入才報錯\u003c/td>\u003ctd data-label=\"能從紀錄確認的事\">工具已執行，檔案可能只改了一部分。\u003c/td>\u003ctd data-label=\"下一步\">重讀目標並比對差異，確認已生效的部分，再決定是否重試。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": []}, {"number": 46, "type": "content", "title": "區分測試資料缺失與斷言失敗", "chapter": "01", "unit": "C03-02", "body": "\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"最後可定位的事件表格\" data-block=\"8\" data-rows=\"3,4\">\u003ctable class=\"cols-3\">\u003cthead>\u003ctr>\u003cth scope=\"col\">最後可定位的事件\u003c/th>\u003cth scope=\"col\">能從紀錄確認的事\u003c/th>\u003cth scope=\"col\">下一步\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"最後可定位的事件\">Shell 已啟動，測試程式找不到 fixture\u003c/td>\u003ctd data-label=\"能從紀錄確認的事\">工作環境未就緒，尚未跑到資料比對。\u003c/td>\u003ctd data-label=\"下一步\">核對工作目錄、測試入口及資料位置，補正後重跑。即使命令正常退出，若發現零個測項，行為仍待驗。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"最後可定位的事件\">測試跑到斷言，記下「期望 [A]，實得 [A,B]」\u003c/td>\u003ctd data-label=\"能從紀錄確認的事\">在這個版本、這組輸入與該測試層，兩個結果確實不同。\u003c/td>\u003ctd data-label=\"下一步\">留下測項、期望與實得值，再沿請求、回應和畫面定位第一個差異。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": []}, {"number": 47, "type": "content", "title": "練習：從工具回覆判讀故障位置", "chapter": "01", "unit": "C03-02", "body": "\u003csection id=\"paths\" class=\"practice\" data-block=\"9\">\u003c/section>", "layout": "practice", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": []}, {"number": 48, "type": "content", "title": "沿請求參數、API 回應與畫面定位篩選差異", "chapter": "01", "unit": "C03-02", "body": "\u003cp data-block=\"10\">把這項檢查用在真實操作路徑上：在 Browser 選 \u003ccode>work\u003c/code>，觀察送出的篩選參數 \u003ccode>tag\u003c/code>、資料介面（API）回傳的待辦編號（ID），以及畫面（UI）實際列出的 ID。若請求已帶 \u003ccode>tag=work\u003c/code>，服務回 \u003ccode>[A]\u003c/code> 而畫面仍是 \u003ccode>[A,B]\u003c/code>，先查畫面如何用回應更新清單。若選取後發出的請求漏了 tag，則先查前端組裝參數的地方。API 測試通過能支持資料介面的結果；要確認畫面也改對了，仍需要 Browser 的觀察。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P02、T01", "passages": []}, {"number": 49, "type": "content", "title": "將畫面經服務層讀取資料的約束寫成依賴規則", "chapter": "01", "unit": "C03-03", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">專案允許助手編輯清單畫面，也規定畫面只能透過服務層讀資料。假設助手在可寫的畫面檔直接匯入資料模組。寫入成功告訴你路徑權限已放行；架構是否守住，要看另一項檢查能否找出剛寫進檔案的那條依賴。\u003c/p>\n\u003cp data-passage=\"p-3\" data-block=\"3\">在專案指引寫下這個理由：畫面只依賴服務提供的讀取介面，由服務負責接觸資料。把允許的方向設成依賴檢查器的規則，以下用兩個版本驗它。箭頭從寫下匯入的模組指向被匯入的模組。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P17、P02、T01", "passages": ["p-1", "p-3"]}, {"number": 50, "type": "content", "title": "用違規與修正兩版設計依賴檢查", "chapter": "01", "unit": "C03-03", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"版本表格\" data-passage=\"p-4\" data-block=\"4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">版本\u003c/th>\n\u003cth scope=\"col\">順著匯入方向讀\u003c/th>\n\u003cth scope=\"col\">同一條規則應留下的回饋\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>故意越層\u003c/td>\n\u003ctd>畫面 list-view → 資料 todo-store\u003c/td>\n\u003ctd>拒絕這條邊；報告須能定位來源 list-view 與目標 todo-store。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>依規則修正\u003c/td>\n\u003ctd>畫面 list-view → 服務 todo-service → 資料 todo-store\u003c/td>\n\u003ctd>畫面改為匯入服務，由服務讀資料；重跑相同檢查，預期通過。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P17、P02、T01", "passages": ["p-4"]}, {"number": 51, "type": "content", "title": "把依賴檢查的結果送回模型", "chapter": "01", "unit": "C03-03", "body": "\u003cp data-passage=\"p-5\" data-block=\"5\">沿操作順序再看一次：指引 → 模型提出修改意圖 → 權限閘門 → 工具寫檔 → 檢查器檢視匯入 → runner 回送檢查結果。原來的模型就能依回饋定位並修正違規。這套\u003cstrong>指引、工具、權限與可重跑的回饋\u003c/strong>，合起來稱為 Harness。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P17、P02、T01", "passages": ["p-5"]}, {"number": 52, "type": "content", "title": "分別驗收架構與畫面功能", "chapter": "01", "unit": "C03-03", "body": "\u003cp data-passage=\"p-6\" data-block=\"6\">一張清單截圖加一份專案指引，只能讓你看見當時的畫面和寫下的規則。驗收架構要收上述違規與修正兩份輸出。驗收功能則要另開 Browser（瀏覽器工具），在含工作與居家兩筆待辦的頁面選 work，確認只顯示工作事項。若想追查這個操作如何成為新一輪模型輸入，可續讀 C04。\u003c/p>\n\u003cp data-passage=\"p-7\" data-block=\"7\">Ryan Lopopolo／OpenAI 的 P17 團隊案例支持可執行的架構約束，OpenAI 的 P02 說明 runner 如何回送觀察（\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"PUBLIC_DOC\">公開技術文件\u003c/span>）。此處模組、規則及預期報告是 T01 延伸的教學設計（\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"DESIGN\">工程設計／建議方法\u003c/span>），缺這個檢查器的實測輸出。\u003c/p>", "layout": "prose", "note": "故障路徑採合成案例，工具執行與權限須看當次紀錄。", "sources": "P17、P02、T01", "passages": ["p-6", "p-7"]}, {"number": 53, "type": "content", "title": "從零個測項看 Agent Loop 何時需要下一輪", "chapter": "01", "unit": "C04", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">拿到一段綠色的命令輸出，先看看上面列了哪些測項。如果工具找到零項測試，程式可能已經正常退出，你卻還不知道哪個產品行為符合規格。工作需要循環，正因為第一個結果有時只告訴你接著該查什麼。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> \u003cstrong>Agent Loop\u003c/strong> 是把一次操作的結果帶入下一次決策的循環。模型提出請求，環境核對權限後叫用工具；工具產生結果，runner 將結果作為觀察送回模型。接下來模型可以提出不同請求，或產生最終輸出（final output），結束這次執行。如果問題只需解釋已有文件，第一次輸出就可能是最終答案。\u003c/p>", "layout": "prose", "note": "", "sources": "P02、P01", "passages": ["p-1", "p-2"]}, {"number": 54, "type": "content", "title": "從缺測試資料、斷言失敗到補驗取消篩選", "chapter": "01", "unit": "C04", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 試著遮住以下每一列的右欄，先決定這次能從觀察推出什麼。委託是修正單標籤篩選，已准讀專案、修改比對邏輯及執行測試。已知資料包含工作項 A 和家庭項 B，選工作應只列 A。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"請求及工具回覆（題設）表格\" data-passage=\"p-4\" data-block=\"4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">請求及工具回覆（題設）\u003c/th>\n\u003cth scope=\"col\">下一步與理由\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>要求執行篩選測試；測試程式回報找不到固定資料檔。\u003c/td>\n\u003ctd>還沒進入比對。先讀專案列出的測試入口和工作目錄，找出資料路徑後才重試。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>從正確入口執行；預期 A，實際 A、B。\u003c/td>\n\u003ctd>這次真正執行了斷言，也就是拿預期值和實際值比對。讀取比對邏輯，找出讓 B 留下的條件，再於授權內修正。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>以相同資料重跑選工作案例，得到 A。\u003c/td>\n\u003ctd>再跑取消篩選的案例，預期恢復 A、B。若只驗第一項，把任何輸入一律縮成 A 的錯誤實作也可能通過。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P02、P01", "passages": ["p-3", "p-4"]}, {"number": 55, "type": "content", "title": "Agent Loop 的四種結束情況與簽收條件", "chapter": "01", "unit": "C04", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 回報出口取決於最後能證明什麼。指定檢查成功，記下版本、測項、結果及待驗收範圍；斷言仍失敗，保留預期與實際值；資料補不到，寫清哪一步未測及缺什麼；必須改產品規格，寫出待批准的選項。這四種情況都可以結束本輪。正式接受需求，要由具權者把交付版本及測試對回約定的行為；runner 沒有從一段最終文字得知這件事的依據。\u003c/p>", "layout": "prose", "note": "", "sources": "P02、P01", "passages": ["p-5"]}, {"number": 56, "type": "content", "title": "自我驗收：測試結果能否支持簽收？", "chapter": "01", "unit": "C04", "body": "\u003cp data-passage=\"p-6\" data-block=\"7\">\u003cstrong>自己判讀。\u003c/strong> 哪個節點能傳回實際測試結果？若模型已回答、指定測試卻未執行，能否簽收？測試工具產生輸出，由 runner 回送；模型只能解讀已取得的觀察。先確認指定測項被找到且在交付版本上執行，缺結果就記為未驗，等待補測或由具權者另行決定接受條件。\u003c/p>\n\u003cp data-passage=\"p-7\" data-block=\"8\">來源：P02（OpenAI）、P01（Anthropic）；Wiki 的 \u003ccode>concepts/agent-loop.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。四種出口是教學判斷，無意對應特定 SDK 的四個狀態值。\u003c/p>", "layout": "prose", "note": "", "sources": "P02、P01", "passages": ["p-6", "p-7"]}, {"number": 57, "type": "content", "title": "用五個工程角度診斷 Agent 改錯位置的原因", "chapter": "01", "unit": "C05", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">助手一直改錯地方，換個模型或許會得到不同建議。但若每次交給它的都是舊版測試資料，換誰來讀都會從錯的起點出發。先找造成錯誤的條件，才能決定是改指令、補資料，還是調整工作環境。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> 使用者研究 U01 的歷史摘要以 Prompt、Context、Harness、Loop、Graph 整理工程問題。這五個觀察角度可以同時用在一份紀錄上；摘要沒有提供作者逐字定義，也沒有建立全業界通用的演進順序。\u003c/p>", "layout": "prose", "note": "", "sources": "U-A、P01、P17", "passages": ["p-1", "p-2"]}, {"number": 58, "type": "content", "title": "核對任務指令、當輪可見資料與工具權限", "chapter": "01", "unit": "C05", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 設想在一個叫 B0 的起始版本上增修待辦清單的單標籤篩選。你可以拿同一張工作記錄，依下列問題各找一件能核對的東西。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"要查的工程問題表格\" data-passage=\"p-4\" data-block=\"4\" data-rows=\"1,2,3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">要查的工程問題\u003c/th>\n\u003cth scope=\"col\">在這次修復中找什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Prompt（指令）要求什麼？\u003c/td>\n\u003ctd>找委託的預期行為，如「選 work 後只顯示有該標籤的待辦」。若只寫「改善列表」，先釐清工作目標。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Context（當輪可見資料）有什麼？\u003c/td>\n\u003ctd>找已載入的規格和固定測試資料 A(work)、B(home)。磁碟上有檔案，也可能未送入本輪。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness（操作環境）允許、檢查什麼？\u003c/td>\n\u003ctd>找可寫目錄、可用工具及限制它們的設定。文字說請勿動某目錄，還應查工具能否阻止寫入。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "U-A、P01、P17", "passages": ["p-3", "p-4"]}, {"number": 59, "type": "content", "title": "用 Loop 看任務內重試，用 Graph 看任務間依賴", "chapter": "01", "unit": "C05", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"要查的工程問題表格\" data-passage=\"p-4\" data-block=\"4\" data-rows=\"4,5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">要查的工程問題\u003c/th>\n\u003cth scope=\"col\">在這次修復中找什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Loop（反覆觀察與決策）依什麼再走一步？\u003c/td>\n\u003ctd>先看 API 回哪幾筆，再看畫面列哪幾筆；若資料正確而顯示有誤，接著查顯示端。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Graph（工作依賴圖）哪件事得等別件事？\u003c/td>\n\u003ctd>畫出 API 工作 F1 與畫面工作 F2 各有一條箭頭指向整合 F3。等兩項交付可供核對，才放行整合。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "U-A、P01、P17", "passages": ["p-4"]}, {"number": 60, "type": "content", "title": "用 DAG 畫出整合工作的前置條件", "chapter": "01", "unit": "C05", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 這裡的工作圖是 DAG，即箭頭表示前置關係、沿箭頭走不會繞回原工作的一種圖。F2 裡反覆查看畫面和修正程式，屬於單項工作內的 Loop；F3 能否開始，取決於外層圖上 F1、F2 的交付狀態。一次動作可以改變內圈的觀察，卻未必改變外圈的就緒條件。反過來，F1 已交付只代表整合少了一項等待，不能拿來證明畫面正常。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"7\">\u003cstrong>自己判讀。\u003c/strong> 如果助手知道該做什麼，也看過正確資料，卻能寫進別人的工作區，該先查哪裡？先核對 Harness 的寫入限制；換 Prompt 可以提醒，限制是否生效仍須試查環境。再在紙上畫出 F1、F2 指向 F3 的兩個箭頭，把「觀察 API 後重試 UI」圈在 F2 裡。能解釋哪個條件會放行 F3，就能區分一次工具循環和工作圖。第三章再處理多人如何分派這些工作。\u003c/p>", "layout": "prose", "note": "", "sources": "U-A、P01、P17", "passages": ["p-5", "p-6"]}, {"number": 61, "type": "content", "title": "換工作階段時，如何辨認現行規格與有效任務？", "chapter": "01", "unit": "C06", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">舊對話記得「沿用最初的篩選提案」，專案紀錄卻顯示團隊昨天已接受新版本。把整段對話貼給下一個助手，只會讓它同時看到兩個答案。要恢復工作，得先弄清楚哪一份資料有決定當前工作的效力。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 一個 session（工作階段）承載一段互動。\u003cstrong>Context\u003c/strong> 是這一輪真正送入模型的內容；\u003cstrong>Memory\u003c/strong> 是跨回合或跨任務留下、日後可以再取用的知識。\u003cstrong>Project State（專案狀態）\u003c/strong> 記錄具權者已接受的版本、現行規格和未決事項。\u003cstrong>Task State（任務狀態）\u003c/strong> 則回答一項工作交給誰、哪一次嘗試有效、卡在哪裡，以及已經驗到什麼。一段舊文字可以被找出並放進 Context；這個動作只改變可見性，沒有更新任何核准紀錄。\u003c/p>", "layout": "prose", "note": "", "sources": "P03、S03、U-A", "passages": ["p-1", "p-2"]}, {"number": 62, "type": "content", "title": "從已接受的版本核對有效派工", "chapter": "01", "unit": "C06", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 現在要在已交付的待辦網站上接手後續工作。B0 是最初的程式基準；記憶帶出當時的一份草案。B1 是單標籤功能整合後由具權者驗收的版本。先到專案紀錄找到 B1 的版本定位、接受者與範圍；再到任務紀錄核對 Task（委託的工作）和 Dispatch（對該工作的一次派工嘗試）。比對責任人、基準及是否仍有效後，只將相關的 B1 規格段落、任務範圍、測試入口和未決事項連同位置送進新一輪。如此一來，接手者可以從段落回查原件，也知道哪些動作屬於自己。\u003c/p>", "layout": "prose", "note": "", "sources": "P03、S03、U-A", "passages": ["p-3"]}, {"number": 63, "type": "content", "title": "工作票指向舊版時如何確認修改權限？", "chapter": "01", "unit": "C06", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">舊草案若與 B1 衝突，保留它作為查找變更原因的線索，依已核准的 B1 辦理。若工作票仍要求從 B0 修改，先釐清是刻意維護舊版，還是派工尚未更新；版本較新也不能自動授予修改另一版本的權力。若找不到接受者或有效派工，把衝突記為待決，交給負責人核對。\u003c/p>", "layout": "prose", "note": "", "sources": "P03、S03、U-A", "passages": ["p-4"]}, {"number": 64, "type": "content", "title": "接手工作時，去哪裡查記憶、版本、派工與當輪資料？", "chapter": "01", "unit": "C06", "body": "\u003cfigure data-block=\"6\">\u003cfigcaption>換人接手時，去哪裡核對哪一個問題？\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">接手者的問題\u003c/th>\u003cth scope=\"col\">要找的材料\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">以前討論過哪些做法？\u003c/th>\u003ctd>Memory 提供查找舊草案的線索。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">目前哪一版有效？\u003c/th>\u003ctd>Project State 提供已接受的版本、範圍與接受者。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">這一項工作仍由誰負責？\u003c/th>\u003ctd>Task State 記下有效派工、基準與阻塞。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">助手這一輪能用哪些依據？\u003c/th>\u003ctd>核對後送入 Context 的規格片段、任務範圍與原件位置。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "P03、S03、U-A", "passages": []}, {"number": 65, "type": "content", "title": "練習：用核准版本與有效派工重建委託", "chapter": "01", "unit": "C06", "body": "\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cstrong>自己判讀。\u003c/strong> 換 session 時應優先讀哪個版本？過期草案與已核准 B1 衝突時怎麼辦？先指出 Project State 中 B1 的接受紀錄，再指出 Task State 中仍有效的嘗試。能交代基準、工作範圍和誰確認它，才能據此重建 Context。若只能找到相似的聊天內容，還缺一條可追到批准者的依據。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"8\">來源：S03（使用者私人補充研究的衍生摘要）、U-A；Wiki 的 \u003ccode>tutorials/context-knowledge-tools.md\u003c/code>、\u003ccode>concepts/supervision.md\u003c/code>。P03 僅支持外部連接機制，四種資訊的分工是教材採用的工程設計。\u003c/p>", "layout": "prose", "note": "", "sources": "P03、S03、U-A", "passages": ["p-5", "p-6"]}, {"number": 66, "type": "content", "title": "從 AGENTS.md 找專案命令，從 Skill 找可重用步驟", "chapter": "01", "unit": "C07", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">接手一個專案，你想查「沒有傳標籤時，應該顯示哪些待辦？」有時只差一頁規格，有時知道答案卻缺少執行測試的入口。先辨認缺的是規則、做法、連接還是資料，可以省下裝好工具卻仍答不出問題的工夫。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 專案慣例需要一個容易發現的位置。支援 \u003cstrong>AGENTS.md\u003c/strong> 的工具可以從專案或模組的指引讀到應在哪個目錄工作、採用哪個測試命令。若多個工作都需要同一套瀏覽器驗收步驟，可將做法包成 \u003cstrong>Skill\u003c/strong>，依名稱和說明選用後再讀操作指引，必要時取用附帶腳本。讀到命令或腳本只提供做法；能否執行仍取決於環境與授權。\u003c/p>", "layout": "prose", "note": "", "sources": "P03、P04、P05、P30", "passages": ["p-1", "p-2"]}, {"number": 67, "type": "content", "title": "MCP 如何連接服務，RAG 如何挑選片段", "chapter": "01", "unit": "C07", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 如果紀錄存在另一個服務，才需要考慮怎麼連過去。\u003cstrong>Model Context Protocol（MCP）\u003c/strong> 讓應用程式（host）經由 client 連到供應能力的 server，發現可讀資源或可呼叫的工具，再按配置發出請求。若困難在於許多文件裡只有一段相關，\u003cstrong>檢索增強生成（RAG）\u003c/strong> 則以問題搜尋有權存取的資料，把候選片段帶給模型組織答案。前者解決「用什麼介面取得」，後者解決「挑什麼材料讀」。返回片段的服務可以很準確地找到一份早已作廢的草案。\u003c/p>", "layout": "prose", "note": "", "sources": "P03、P04、P05、P30", "passages": ["p-3"]}, {"number": 68, "type": "content", "title": "把「省略 tag」的命中段落對回核准規格", "chapter": "01", "unit": "C07", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 試走一次資料流。從專案紀錄查明本次任務採用 B0 基準上獲准的單標籤需求，讀相關目錄的 AGENTS.md 找測試入口。若規格只有一頁，直接讀原件；若文件很多，再以「省略 tag」查找。對每個命中回查文件版本、批准者和適用條件，只把現行段落與來源位置帶入本輪。規格說省略 tag 時返回 A、B；舊草案說「空字串表示全部」，那是另一種輸入，且未獲採納。直接把舊句變成斷言會替產品擅定一個規則。\u003c/p>", "layout": "prose", "note": "", "sources": "P03、P04、P05、P30", "passages": ["p-4"]}, {"number": 69, "type": "content", "title": "用現行規格重做清除標籤的驗收", "chapter": "01", "unit": "C07", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">若要一致地驗畫面，可載入描述清除標籤步驟的 Skill；若測試紀錄在已授權的外部服務，可透過 MCP server 取回。只有本機環境時，仍可在規定的目錄執行專案指引列出的測試命令，保存實際命令、版本及輸出。依找到的現行規格核對「清除後請求省略 tag，畫面回到 A、B」。沒有合適片段，或沒有讀取權限，就記錄缺少的依據，不自行補出測試預期。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"7\">\u003cstrong>自己判讀。\u003c/strong> 沒有 MCP 是否一定不能做本機測試？哪個環節確認規格有效？只要有獲准的本機測試入口就能執行；確認有效性發生在把候選片段對回專案批准紀錄的時候。用一份短規格試做，可以跳過檢索、外部連接和 Skill，仍須對回版本與條件。\u003c/p>", "layout": "prose", "note": "", "sources": "P03、P04、P05、P30", "passages": ["p-5", "p-6"]}, {"number": 70, "type": "content", "title": "把技術選路與產品決策權寫進委託", "chapter": "01", "unit": "C08", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">修好單標籤篩選後，有人說「順手支援多個標籤吧」。寫程式的人也許知道怎麼做，卻還不知道使用者期待的結果。這一刻最值得交出的成果，可能是一組能讓產品負責人作選擇的資料。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者研究 U07 指出，未描述的細節可能被執行者自行補完，應辨認選擇是否改動已核准的產品或架構。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 此處把\u003cstrong>自主性\u003c/strong>界定為在工作範圍內選路的空間，把\u003cstrong>授權\u003c/strong>落在可操作的資源、可作的決定與可接受成果的人。工具能夠寫入檔案，只能證明有這項能力；能不能代表產品決定行為，要回到委託查核。\u003c/p>", "layout": "prose", "note": "", "sources": "P02、P05、P17、U-B", "passages": ["p-1", "p-2"]}, {"number": 71, "type": "content", "title": "用兩筆待辦比較多標籤的 AND 與 OR 規則", "chapter": "01", "unit": "C08", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在 B0 起始版本上，委託允許讀取、測試和修正單標籤比對。依這個契約修復「選 work 卻見到 home」可以繼續。待單標籤版整合、接受為 B1，若下一項需求允許同時選 work 和 home，先列出兩種預期：AND 要求同一筆同時具備兩個標籤，OR 接受其中任一個。給定 A 只有 work、B 只有 home，AND 會得到空清單，OR 會得到 A、B。這是使用者看得見的差異，兩種結果各能寫出通過自己的測試。在改動前將這組輸入、兩個輸出及影響交給具產品決策權的人；取得批准後更新契約，才把選中的預期納入驗收。\u003c/p>", "layout": "prose", "note": "", "sources": "P02、P05、P17、U-B", "passages": ["p-3"]}, {"number": 72, "type": "content", "title": "依最後一項證據回報未知、阻塞、失敗或完成", "chapter": "01", "unit": "C08", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 即使沒有答案也能妥善退出。把報告的動詞換成能對回證據的動詞，接手者就知道該找誰，而不會把所有停頓都拿去重跑。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"手上最後一項證據表格\" data-passage=\"p-5\" data-block=\"6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">手上最後一項證據\u003c/th>\n\u003cth scope=\"col\">可交回的判斷與下一步\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>沒有新回覆，最後一次嘗試狀態不明。\u003c/td>\n\u003ctd>標為未知。核對仍有效的派工、責任人、最後進度與產物，先確認原嘗試狀態及所有權。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>授權不足或產品語義待定。\u003c/td>\n\u003ctd>標為阻塞。寫出缺的輸入或決策、誰可解除，以及從哪一步繼續。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具已回傳啟動錯誤，或實際斷言不符。\u003c/td>\n\u003ctd>記下失敗發生在啟動還是產品檢查；附執行條件、命令與輸出，依原因安排下一次查證。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>指定版本、測項及結果齊備。\u003c/td>\n\u003ctd>可報指定工作完成並提交驗收。具權者核對後作出接受決定，再記為已接受。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P02、P05、P17、U-B", "passages": ["p-4", "p-5"]}, {"number": 73, "type": "content", "title": "分辨執行者失聯、操作受阻與本輪結束", "chapter": "01", "unit": "C08", "body": "\u003cp data-passage=\"p-6\" data-block=\"7\">\u003cstrong>自己判讀。\u003c/strong> 誰能批准 AND 或 OR？多久沒收到訊息可以認定執行這項工作的 Worker 已退出？先查委託指定的產品決策者，再拿 A、B 的不同輸出請其選擇。沉默只表示目前缺少觀察，不能由經過時間推出已退出、失敗或可重派。工具拒絕也只表示該操作受阻；模型給出 final 只表示本輪已結束。要判斷產品已接受，仍要看到對應版本的驗收決定。\u003c/p>\n\u003cp data-passage=\"p-8\" data-block=\"9\">下一步若要配置一位 Agent 的可用工具與檢查點，可跳讀第二章；若已碰到互斥需求或執行者失聯，第四章處理裁決與恢復，第五章處理交付的驗收與成本證據。\u003c/p>", "layout": "prose", "note": "", "sources": "P02、P05、P17、U-B", "passages": ["p-6", "p-8"]}, {"number": 74, "type": "chapter", "title": "單 Agent 開發｜委託方法、工具環境與工程交付", "chapter": "02", "unit": "", "body": "", "layout": "prose", "note": "", "sources": "", "passages": []}, {"number": 75, "type": "content", "title": "委託單一助手時，誰決定下一步？", "chapter": "02", "unit": "02-A01", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">當需求是「幫我看一下」，助手讀完後究竟要解釋、要交計畫，還是可以直接改檔？先約定由誰決定下一步。這裡的 Agent 指能根據觀察選下一步、由環境執行獲准操作的助手。「模式」指這次人與助手的分工，同一個聊天入口也可能拿得到工程工具。\u003c/p>", "layout": "prose", "note": "", "sources": "T04", "passages": ["p-1"]}, {"number": 76, "type": "content", "title": "何時答疑、協作、先規劃或自主執行？", "chapter": "02", "unit": "02-A01", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> \u003cstrong>答疑\u003c/strong>適合尚在探索規則的人。人提供資料，助手交回解釋和待查問題。\u003cstrong>逐步協作\u003c/strong>適合人正在編輯的檔案。讓助手讀出一處差異，等你決定後再進下一步。\u003cstrong>先規劃再執行\u003c/strong>適合改動可能跨檔的需求。先交步驟、依賴與可觀察的檢查點，核准範圍後才開始寫。\u003cstrong>授權自主執行\u003c/strong>適合行為清楚、修正可逆、測試可用的工作。助手可以自行查檔、局部修改與重測，到約定停點交回結果。這四種委託方式也能銜接；產品是否提供同名按鈕要另查。\u003c/p>", "layout": "prose", "note": "", "sources": "T04", "passages": ["p-2"]}, {"number": 77, "type": "content", "title": "把「看看匯出功能」寫成唯讀定位任務", "chapter": "02", "unit": "02-A01", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 試把「看看匯出功能」寫成「唯讀查出產生標頭的檔案，交回檔名與一個樣例」。即使助手找到可寫入的編輯工具，交付仍到定位為止。若你接著核准修復，明訂可動檔案、測項與變更格式時的停點。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"4\">\u003cstrong>判斷題\u003c/strong>　只看對話框，怎麼知道它可以自行修復？要找本次授權、實際可用的工具和成功條件。僅有解釋需求時，連開放寫入的環境也應交回解釋。來源為 T04（tutorials/single-agent-coding-cycle.md）、concepts/single-agent.md；四種分工是本章設計。\u003c/p>", "layout": "prose", "note": "", "sources": "T04", "passages": ["p-3", "p-4"]}, {"number": 78, "type": "content", "title": "替表單提示寫出例子、反例與排除項", "chapter": "02", "unit": "02-A02", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">「讓錯誤訊息好懂」足以表達動機，卻無法決定哪一個輸入要出現哪一句提示。任務契約是一份人和助手都能據以判定範圍與完成的約定。先讓需求者看一個具體結果，往往比繼續補形容詞更早發現歧義。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 目標是讓使用者找得到漏填的欄位。例示「名稱留空送出，在名稱下方看見提示，資料不寫入」，再給有效名稱仍能儲存的反例。範圍限表單的提示與對應測試，禁止修改儲存格式。只含空白的名稱算不算空值尚待決定。請助手先重述兩個樣例、排除項及未知；需求者接受後，才把它們列為測試預期。若無法啟動表單，交回啟動命令、錯誤與尚可檢查的部分。\u003c/p>", "layout": "prose", "note": "", "sources": "T04", "passages": ["p-1", "p-2"]}, {"number": 79, "type": "content", "title": "名稱必填的邊界案例：空白字串由誰決定？", "chapter": "02", "unit": "02-A02", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>把「名稱必填」翻成三個可以分開決定的輸入（合成表單練習）\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">輸入\u003c/th>\u003cth scope=\"col\">需求者要確認的結果\u003c/th>\u003cth scope=\"col\">助手如何處理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">沒有填名稱\u003c/th>\u003ctd>欄位下方提示，資料未寫入。\u003c/td>\u003ctd>列為拒絕案例。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">填入有效名稱\u003c/th>\u003ctd>資料仍可儲存。\u003c/td>\u003ctd>保留原有成功案例。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">只輸入空白\u003c/th>\u003ctd>是否合法仍待決定。\u003c/td>\u003ctd>交回選項，待確認後才寫預期。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cstrong>判斷題\u003c/strong>　需求寫得很長，卻沒提空白字串，助手能自行把它列為拒絕案例嗎？該案例會改變合法輸入集合，應先查現行契約，再把缺少的決定交回需求者。來源為 T04、concepts/harness.md；\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 上述委託格式適用於可以描述外顯行為的工作。\u003c/p>", "layout": "figure", "note": "", "sources": "T04", "passages": ["p-3"]}, {"number": 80, "type": "content", "title": "用可重現的觀察決定是否開始修改", "chapter": "02", "unit": "02-A03", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">只改一個已知拼字時，先寫長計畫沒有多少資訊價值。若一個錯誤可能分別出在讀取、轉換和顯示，直接列「修改三處」反而提前假定根因。檢查點是能決定是否繼續的觀察，例如在開始寫入前先取得能重現差異的輸入。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先唯讀調查規格、檔案和現有測試。將「找到受影響入口」寫成第一步輸出，第二步用它製作最小可重現檢查，第三步根據差異選修改點，再用同一檢查與既有成功案例複驗。每一步寫明前一步交給它什麼、過關依據、失敗交回什麼。重現失敗就回報輸入及環境差異；此時計畫應縮回調查。這份順序由同一位助手執行，無須設計跨人派工。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A、U04", "passages": ["p-1", "p-2"]}, {"number": 81, "type": "content", "title": "把規劃器的停止規則用在修復工作單", "chapter": "02", "unit": "02-A03", "body": "\u003cp data-passage=\"p-3\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 個人研究 U04 的 Planning Agent 規格提供一個更嚴格的對照。模型產生步驟，程式驗證結構後依序傳遞前一步成果。計畫格式不合即停；執行失敗要保留哪一步失敗並停止後續。這讓讀者能找出缺少輸入的步驟。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 規格及交底能核對預期控制流，缺少該作業實際執行輸出與停點觸發紀錄。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cstrong>把計畫交給下一步使用。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 委託是一位助手修復「清除後仍只見 A」。交出去的計畫首頁先填目標（清除後見 A、B）、基線（B0）、允許範圍（先唯讀，定位後才依授權改動）及排除項（多選）。每一步各填輸入、動作、可交付輸出與停點。讀者可以用下表逐步追問「下一步拿到哪件東西才開工？」\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A、U04", "passages": ["p-3", "p-4"]}, {"number": 82, "type": "content", "title": "用定位單重現故障，記下請求、回應與畫面的差異", "chapter": "02", "unit": "02-A03", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"步驟表格\" data-passage=\"p-5\" data-block=\"7\" data-rows=\"1,2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">步驟\u003c/th>\n\u003cth scope=\"col\">取用的輸入與動作\u003c/th>\n\u003cth scope=\"col\">交給下一步的輸出\u003c/th>\n\u003cth scope=\"col\">停點與回報\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1　定位\u003c/td>\n\u003ctd>在 B0 讀契約、清除按鈕處理器與測試入口\u003c/td>\n\u003ctd>一張定位單，列出處理器位置、啟動方式及 A(work)、B(home) 的資料設定\u003c/td>\n\u003ctd>無入口或無 B 時，交回缺項與待補條件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2　重現\u003c/td>\n\u003ctd>按定位單啟動，在同一份資料先選 work 再清除，記請求、回傳 ID、畫面 ID\u003c/td>\n\u003ctd>一張差異單；例如清除時已省略 tag、回應 [A,B]、畫面仍 [A]\u003c/td>\n\u003ctd>三處皆符合預期就停在調查，交回重現條件。若請求仍帶 work，改查組參數的位置。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A、U04", "passages": ["p-5"]}, {"number": 83, "type": "content", "title": "根據差異修訂，重跑原反例與成功案例", "chapter": "02", "unit": "02-A03", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"步驟表格\" data-passage=\"p-5\" data-block=\"7\" data-rows=\"3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">步驟\u003c/th>\n\u003cth scope=\"col\">取用的輸入與動作\u003c/th>\n\u003cth scope=\"col\">交給下一步的輸出\u003c/th>\n\u003cth scope=\"col\">停點與回報\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>3　修訂及複驗\u003c/td>\n\u003ctd>依差異單與寫入授權，在回應正確的例子查畫面更新處；做局部修改，重跑原操作及原本正常的 work 篩選\u003c/td>\n\u003ctd>版本與差異、修前／後觀察、實際測項、待測項；可逐一核對 work → [A]、清除 → [A,B]\u003c/td>\n\u003ctd>未獲寫入授權先交修改提案；重測失敗則附同一資料下的反例，保留未結案狀態。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A、U04", "passages": ["p-5"]}, {"number": 84, "type": "content", "title": "核對 Planner 與 Executor 的輸入輸出條件", "chapter": "02", "unit": "02-A03", "body": "\u003cp data-passage=\"p-6\" data-block=\"8\">\u003cstrong>估算一次規劃要幾次呼叫。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 上表是工程工作紙。U04 對另一個任務（生成冒險規劃書）約定了更窄的介面：Planner 回一個僅含 \u003ccode>goal\u003c/code>、\u003ccode>steps\u003c/code> 的物件。目標須非空、至多 120 字元；步驟須為 3～5 個互異的非空字串，各至多 100 字元。程式先解析及驗證，若只交兩步就停在 Planner。合法時，每個 Executor 輸入包含固定世界背景、原委託、目標、本步序號與文字，以及\u003cstrong>全部先前成功步驟的輸出\u003c/strong>。它只產生當步分析；程式檢查去空白後的文字非空、至多 1,800 字元。格式合格仍須另判內容是否合理。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A、U04", "passages": ["p-6"]}, {"number": 85, "type": "content", "title": "三步計畫的呼叫數：全部完成四次，第二步失敗三次", "chapter": "02", "unit": "02-A03", "body": "\u003cp data-passage=\"p-7\" data-block=\"9\">例如排三步，全程成功需一次規劃加三次逐步執行，一共四次；若第二步回空字串，至此只呼叫三次，保留第一步內容與第二步失敗原因，第三步未執行。完整路徑為 1+N 次、最多六次，程式用已有結果組成報告，沒有模型補寫、重規劃或自動重試。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 要把此設計升為實作觀察，至少要能在對應版本對上逐次輸入、輸出與狀態，並核對失敗後沒有第三步呼叫。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A、U04", "passages": ["p-7"]}, {"number": 86, "type": "content", "title": "未能重現故障時，先回報調查缺口", "chapter": "02", "unit": "02-A03", "body": "\u003cp data-passage=\"p-8\" data-block=\"10\">\u003cstrong>判斷題\u003c/strong>　助手完成計畫文字，卻無法重現原問題，要批准它同時修改三層嗎？先看檢查點的輸出；沒有具判別力的失敗，應要求回報調查結果及待補條件。來源為 T04、U04 的 CODEX_SPEC.md 與 CODEX_HANDOFF.md（定位見章內審查）。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A、U04", "passages": ["p-8"]}, {"number": 87, "type": "content", "title": "加入不同標籤的待辦，讓清除失敗顯現", "chapter": "02", "unit": "02-A03-01", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">若工單只要求改正一個已知位置的錯字，編輯後重讀該處，就有辦法判定這一步做完了。「清除篩選後少了一筆」的修復則需要先規劃。按鈕可能保留舊狀態，請求可能仍帶標籤，服務可能少回資料，畫面也可能沿用舊值。同時動手改這幾處，會把原本能區分原因的線索一起改掉。\u003c/p>\n\u003cp data-passage=\"p-3\" data-block=\"3\">先挑一件工作待辦 A(work) 和一件居家待辦 B(home)，作為每次測試都載入的固定資料（fixture）。選 work 應只見 A；清除時送給服務的請求應省略標籤參數 tag，回到未篩選的 A、B。這套有明確期望的操作，讓下一步能逐層比對。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A", "passages": ["p-1", "p-3"]}, {"number": 88, "type": "content", "title": "從起始版本追查按鈕、請求與測試入口", "chapter": "02", "unit": "02-A03-01", "body": "\u003cp data-passage=\"p-4\" data-block=\"4\">助手先唯讀調查。讀專案規則，記下這次起始提交（稱 B0）、工作目錄裡已有的差異及允許修改範圍。從按鈕處理器跟到組裝請求的程式、資料服務介面（API）和測試入口。留給下一步的是位置、固定資料與預期的待辦編號（ID），後續才有根據決定改哪裡。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A", "passages": ["p-4"]}, {"number": 89, "type": "content", "title": "只有一筆測試資料，無法判定清除是否失敗", "chapter": "02", "unit": "02-A03-01", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"沿著故障找入口表格\" data-passage=\"p-5\" data-block=\"5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">沿著故障找入口\u003c/th>\n\u003cth scope=\"col\">到了入口，讀什麼\u003c/th>\n\u003cth scope=\"col\">可以交給下一步的判斷\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>清除後少一筆 → 找到按鈕與請求入口\u003c/td>\n\u003ctd>固定兩筆資料，記下預期 ID，再核對未篩選回應與畫面\u003c/td>\n\u003ctd>有 B 可以觀察它是否重新出現，才有可追查的差異。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除前後皆見 A → 回查原始 fixture\u003c/td>\n\u003ctd>若原本只有 A，正常清除與壞掉的清除都可能只見 A\u003c/td>\n\u003ctd>停在重現準備，回報缺一筆不匹配的資料；補上 B 後再查，暫留未定位。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A", "passages": ["p-5"], "subtitle": "只看到 A 時，如何判斷是否已重現？"}, {"number": 90, "type": "content", "title": "缺少能分辨成敗的資料時，暫停故障定位", "chapter": "02", "unit": "02-A03-01", "body": "\u003cp data-passage=\"p-6\" data-block=\"6\">這一份計畫由同一位助手執行。它在得到新觀察後調整下一步；缺少可分辨好壞的資料時，尚無根據直接改畫面。\u003c/p>\n\u003cp data-passage=\"p-7\" data-block=\"7\">T04 的工程循環及 B0、檔案入口是合成教例（\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"SYNTHETIC_EXAMPLE\">合成教學案例\u003c/span>）。專案提供者在 U02 提及先討論目的、再交給可測環境的工作方式；U-A 是 Codex 整理的歷史摘要（\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"USER_RECONSTRUCTED\">歷史整理／轉述\u003c/span>），只可作背景引用。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04、U-A", "passages": ["p-6", "p-7"]}, {"number": 91, "type": "content", "title": "把篩選修復拆成可交付的調查與重現結果", "chapter": "02", "unit": "02-A03-02", "body": "\u003cp data-block=\"1\">把「修好清除篩選」拆成四個動詞，還不足以指導修改。清除按鈕、請求參數、伺服器回應與畫面更新都有可能出錯。在動手之前，一位助手可以把計畫寫成一連串\u003cstrong>可交付的產物\u003c/strong>：先找到能重播故障的入口，再取得能區分幾種原因的觀察，最後才決定改哪裡。下一步若拿不到這些產物，就有明確理由停下。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04", "passages": []}, {"number": 92, "type": "content", "title": "在計畫首頁約定接受條件、授權與例外", "chapter": "02", "unit": "02-A03-02", "body": "\u003cp data-block=\"2\">\u003cstrong>計畫首頁｜修復清除後少一筆待辦（合成工作單）\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"要先約定的事表格\" data-block=\"3\">\u003ctable class=\"cols-2\">\u003cthead>\u003ctr>\u003cth scope=\"col\">要先約定的事\u003c/th>\u003cth scope=\"col\">本次委託\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"要先約定的事\">目標與接受條件\u003c/td>\u003ctd data-label=\"本次委託\">選 \u003ccode>work\u003c/code> 只見 A；按清除時省略 tag，恢復 A、B；選未知標籤 \u003ccode>missing\u003c/code> 得到空清單。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"要先約定的事\">起點與輸入\u003c/td>\u003ctd data-label=\"本次委託\">記下起始提交 B0、工作目錄與已有改動。固定資料為 A(work)、B(home)，保留兩筆好讓清除前後可比較。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"要先約定的事\">範圍與授權\u003c/td>\u003ctd data-label=\"本次委託\">先唯讀調查；取得反例、定位修改點且有寫入授權後才改動。沿用既有單標籤契約，多選另案決定。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"要先約定的事\">交件與例外\u003c/td>\u003ctd data-label=\"本次委託\">交候驗版本、差異、實際操作與觀察、通過及未測項目。需要改契約或擴大授權時，向具權者回報。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04", "passages": []}, {"number": 93, "type": "content", "title": "比對請求、回應與畫面，定位清除故障", "chapter": "02", "unit": "02-A03-02", "body": "\u003cp data-block=\"5\">四列由同一位助手依序負責。每一列先找左側所需的輸入，再把右側的產物交給下一步。下面填入的是供練習的數值；實作時要換成該次實際量到的值。\u003c/p>\n\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"步驟表格\" data-block=\"6\" data-rows=\"1,2\">\u003ctable class=\"cols-4\">\u003cthead>\u003ctr>\u003cth scope=\"col\">步驟\u003c/th>\u003cth scope=\"col\">輸入與操作\u003c/th>\u003cth scope=\"col\">留給下一步的產物\u003c/th>\u003cth scope=\"col\">繼續或停止條件\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"步驟\">1　調查\u003c/td>\u003ctd data-label=\"輸入與操作\">在 B0 讀清除契約、按鈕處理器和既有測試，找出列表的讀取介面 \u003ccode>GET /todos\u003c/code>。\u003c/td>\u003ctd data-label=\"留給下一步的產物\">定位單：處理器位置、測試啟動方式、A 與 B 的資料設定。\u003c/td>\u003ctd data-label=\"繼續或停止條件\">缺版本或測試入口就交回缺項。只有 A 時，正確和錯誤的清除行為都可能只見 A，須先補足對照資料。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"步驟\">2　重現\u003c/td>\u003ctd data-label=\"輸入與操作\">依定位單先選 work，再按清除，依序記下請求參數、回應 ID、畫面 ID。\u003c/td>\u003ctd data-label=\"留給下一步的產物\">差異單：清除時已省略 tag；回應為 [A,B]；畫面仍是 [A]。\u003c/td>\u003ctd data-label=\"繼續或停止條件\">這組值將追查範圍縮到畫面更新。未重現時保留輸入、環境與實得值，停在調查。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04", "passages": []}, {"number": 94, "type": "content", "title": "局部修正後，複驗選取、清除與未知標籤", "chapter": "02", "unit": "02-A03-02", "body": "\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"步驟表格\" data-block=\"6\" data-rows=\"3,4\">\u003ctable class=\"cols-4\">\u003cthead>\u003ctr>\u003cth scope=\"col\">步驟\u003c/th>\u003cth scope=\"col\">輸入與操作\u003c/th>\u003cth scope=\"col\">留給下一步的產物\u003c/th>\u003cth scope=\"col\">繼續或停止條件\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"步驟\">3　修改\u003c/td>\u003ctd data-label=\"輸入與操作\">取差異單，在獲准範圍內追蹤畫面如何套用回應，對定位到的更新處做局部修正。\u003c/td>\u003ctd data-label=\"留給下一步的產物\">只涉及該處的程式差異，以及可供複驗的候驗版本。\u003c/td>\u003ctd data-label=\"繼續或停止條件\">缺寫入授權先交提案；若必須改變契約，說明原因與受影響的行為，等候決定。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"步驟\">4　複驗\u003c/td>\u003ctd data-label=\"輸入與操作\">在候驗版本用同一份資料，重播原來失敗的清除操作，再跑原本正常的選取及未知標籤。\u003c/td>\u003ctd data-label=\"留給下一步的產物\">逐項記錄期望、實得值與測試範圍。期望為 work → [A]、清除 → [A,B]、missing → []。\u003c/td>\u003ctd data-label=\"繼續或停止條件\">任一不符就帶反例回到定位；缺畫面觀察則將 UI 列為待驗。三條路徑符合約定且必要檢查完成後，交由驗收者簽收。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04", "passages": []}, {"number": 95, "type": "content", "title": "清除請求仍帶舊標籤時，改查按鈕與請求組裝", "chapter": "02", "unit": "02-A03-02", "body": "\u003cp data-block=\"8\">假設第二步換了一筆觀察：清除時仍送出 \u003ccode>tag=work\u003c/code>，服務回 \u003ccode>[A]\u003c/code>，畫面顯示 \u003ccode>[A]\u003c/code>。服務對這個請求給了合理的結果。此時應撤回「修改畫面更新處」的安排，回查清除按鈕與請求組裝，重新登記差異單，再決定局部修改。若三處都符合契約，就保存本次未重現的條件，請提供仍會失敗的版本或輸入。這就是重新規劃的停點：上一列可以改變下一列要做的工作，並保留判斷改變的依據。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "T04", "passages": []}, {"number": 96, "type": "content", "title": "Planner 列出目標與步驟，Executor 逐步撰稿", "chapter": "02", "unit": "02-A03-03", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">有人向公會說：「想為一次採集委託做準備。」在這個規劃作業裡，要交回的是事前規劃書。規劃者（Planner）讀固定的世界背景與原願望，提出目標與幾項分析工作；Python 先判定清單是否能交給逐步撰稿的執行者（Executor）。每次執行呼叫只寫其中一項的內容，全程無須出門採集或啟動外部工具。這是專案提供者的個人設計 U04。\u003c/p>\n\u003cpre tabindex=\"0\" data-passage=\"p-3\" data-block=\"3\">\u003ccode class=\"language-json\">{\"goal\":\"準備採集前的確認單\",\"steps\":[\"整理已知條件\",\"列出待確認的風險\",\"編製行前確認單\"]}\n\u003c/code>\u003c/pre>", "layout": "code", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A", "passages": ["p-1", "p-3"], "subtitle": "公會要的是採集前的規劃書"}, {"number": 97, "type": "content", "title": "逐欄核對 goal 與 steps 的 JSON 契約", "chapter": "02", "unit": "02-A03-03", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"程式讀取的位置表格\" data-passage=\"p-4\" data-block=\"4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">程式讀取的位置\u003c/th>\n\u003cth scope=\"col\">入口條件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>整份輸出\u003c/td>\n\u003ctd>須為單一 JSON 物件，欄位恰好只有 goal、steps。允許移除規定的外層 JSON 程式碼圍欄，再用 json.loads 解析；多出的說明文字、缺欄、錯欄或額外欄位都留下失敗資訊。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>goal\u003c/td>\n\u003ctd>非空字串，最多 120 字元。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>steps\u003c/td>\n\u003ctd>由 3～5 個字串構成的陣列；每項去空白後非空、至多 100 字元，各步不得重複。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A", "passages": ["p-4"]}, {"number": 98, "type": "content", "title": "計畫驗證：程式查步數與重複，人判讀內容", "chapter": "02", "unit": "02-A03-03", "body": "\u003cp data-passage=\"p-5\" data-block=\"5\">先沿「願望 → Planner → 解析與欄位檢查」讀，通過後才進 Executor 第一步。上例三項都在規劃如何準備；還要核讀它們是否與目標相關，是否確實描述規劃或分析工作。「去森林」這種實際動作即使包成合法字串，仍不符合這份委託。結構通過能保證下一步讀得到資料，內容合理性另由人判讀。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"6\">現在把第三項也寫成「列出待確認的風險」。三格仍然存在，重複檢查卻會失敗。若刪掉第三項，只剩兩個合法工作，也會在長度檢查停下。兩種失敗都保存 Planner 原始輸出、顯示計畫無效，並在此結束：已呼叫 Planner 一次，Executor 零次。補一個預設步驟會改掉受檢的原計畫。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A", "passages": ["p-5", "p-6"]}, {"number": 99, "type": "content", "title": "依規格推算呼叫上限：一次規劃，每步一次撰稿", "chapter": "02", "unit": "02-A03-03", "body": "\u003cp data-passage=\"p-7\" data-block=\"7\">若計畫有效且完成 N 步，模型呼叫共 1＋N 次：一次規劃，加上每步一次撰稿。三到五步對應四到六次呼叫；驗證和最後組稿都由程式完成。原設計沒有自動重試、重新規劃或另加評分模型的呼叫。\u003c/p>\n\u003cp data-passage=\"p-8\" data-block=\"8\">U04 原規格 §§3–5 與交底支持上述契約（\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"DESIGN\">工程設計／建議方法\u003c/span>）。三項採集工作是另擬的合成輸入；U-A 只能核對規格及交底存在，缺原作業逐次執行紀錄（\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"GAP\">證據待補／尚未驗證\u003c/span>）。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A", "passages": ["p-7", "p-8"]}, {"number": 100, "type": "content", "title": "每個執行步驟都要收到此前所有成功輸出", "chapter": "02", "unit": "02-A03-04", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">公會要的是採集前的確認單。假設一位規劃助手已把願望整理成三項工作：整理已知條件、列出待確認的風險、編製行前確認單。最後的確認單若只收到這三個標題，就不知道前兩步究竟查出了什麼。專案提供者的 U04 規格要求每一步都收到\u003cstrong>此前全部成功步驟的實際內容\u003c/strong>。\u003c/p>\n\u003cp data-passage=\"p-3\" data-block=\"3\">下表依時間往下讀。「共同輸入」在每一步都包括固定世界背景、原願望與 Planner 生成的目標；再加從 1 起算的序號、本步工作文字及此前成功內容。每次模型只產生當步的分析文字。以下把各步內容完整列出，方便直接追讀第三步拿到了什麼。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A、T04", "passages": ["p-1", "p-3"]}, {"number": 101, "type": "content", "title": "三步計畫推演：從規劃輸出到第一步分析", "chapter": "02", "unit": "02-A03-04", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"模型呼叫表格\" data-passage=\"p-4\" data-block=\"4\" data-rows=\"1,2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">模型呼叫\u003c/th>\n\u003cth scope=\"col\">本次讀到的工作與累積內容\u003c/th>\n\u003cth scope=\"col\">這次留下的產物\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1　Planner\u003c/td>\n\u003ctd>固定背景、原願望「想為一次採集委託做準備」\u003c/td>\n\u003ctd>目標「準備採集前的確認單」；依序列出上述三項工作，經 Python 解析驗證。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2　Executor ①\u003c/td>\n\u003ctd>共同輸入＋①整理已知條件；尚無前步結果\u003c/td>\n\u003ctd>「採集地點待確認」，存為 done。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A、T04", "passages": ["p-4"]}, {"number": 102, "type": "content", "title": "第三步如何用前兩步的輸出寫成確認單", "chapter": "02", "unit": "02-A03-04", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"模型呼叫表格\" data-passage=\"p-4\" data-block=\"4\" data-rows=\"3,4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">模型呼叫\u003c/th>\n\u003cth scope=\"col\">本次讀到的工作與累積內容\u003c/th>\n\u003cth scope=\"col\">這次留下的產物\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>3　Executor ②\u003c/td>\n\u003ctd>共同輸入＋②列出待確認的風險；讀入①「採集地點待確認」\u003c/td>\n\u003ctd>「出發前向公會核對路線」，存為 done。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4　Executor ③\u003c/td>\n\u003ctd>共同輸入＋③編製行前確認單；讀入①「採集地點待確認」與②「出發前向公會核對路線」\u003c/td>\n\u003ctd>「出發前請公會確認採集地點，並核對前往該地的路線。」，存為 done。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A、T04", "passages": ["p-4"]}, {"number": 103, "type": "content", "title": "用成功紀錄依序組成 Markdown 規劃書", "chapter": "02", "unit": "02-A03-04", "body": "\u003cp data-passage=\"p-5\" data-block=\"5\">每一步的成功紀錄存工作 step、實際文字 output 及狀態 done。三步都完成時，Python 按規劃順序合成 Markdown，標題為「冒險規劃：準備採集前的確認單」，下接表中三項工作及其原輸出，註明這是事前規劃、缺少的世界細節需向公會確認。組稿沿用既有結果，整條軌跡到第四次模型呼叫就結束。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A、T04", "passages": ["p-5"]}, {"number": 104, "type": "content", "title": "輸出空白或超長時，保留成功步驟並停止執行", "chapter": "02", "unit": "02-A03-04", "body": "\u003cp data-passage=\"p-7\" data-block=\"7\">Python 的門檻是純文字、去空白後非空且至多 1,800 字元。若第二步只回空白，①照原樣保存，②記下工作 step、空輸出 output、狀態 failed 與失敗原因「去空白後為空」，立即停止。③仍列在原計畫，但未執行。最終標示「規劃未完成」，讀者仍看得到成功的前綴。把②換成 1,801 字元也到同一停點，原因改為超長；靜默截短會讓後續誤以為接到完整輸出。兩條早停路徑都已發起三次呼叫（規劃、①、②），第三步的呼叫數為零。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A、T04", "passages": ["p-7"]}, {"number": 105, "type": "content", "title": "如何判讀成功、失敗與尚未執行的步驟", "chapter": "02", "unit": "02-A03-04", "body": "\u003cp data-passage=\"p-8\" data-block=\"8\">沿完整軌跡和這兩條早停路徑對讀，先找最後成功產物，再找第一個失敗與尚未開始的工作。這種紀錄也適合一位工程助手回報進度。格式檢查通過只說明有文字可以續傳；內容是否解答願望、工程結果是否經驗收，各自還要有依據。\u003c/p>\n\u003cp data-passage=\"p-9\" data-block=\"9\">U04 §§5–6 是個人規格的預期控制流程（\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"DESIGN\">工程設計／建議方法\u003c/span>）；表內文字及兩種早停是合成推演。T04 只用來連回工程工作回報。原作業仍缺能對上版本、逐次輸入、輸出與停點的成功及失敗 trace（\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"GAP\">證據待補／尚未驗證\u003c/span>）。\u003c/p>", "layout": "prose", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A、T04", "passages": ["p-8", "p-9"]}, {"number": 106, "type": "content", "title": "練習：比較三步完成與第二步失敗的呼叫數", "chapter": "02", "unit": "02-A03-04", "body": "\u003csection class=\"practice\" id=\"plan-trace\" data-block=\"10\">\u003c/section>", "layout": "practice", "note": "工作單與停止條件用於教學；U04 的規劃器行為依設計推演。", "sources": "U04、U-A、T04", "passages": []}, {"number": 107, "type": "content", "title": "把版本、核准範圍與原件位置放進工作摘要", "chapter": "02", "unit": "02-A04", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">工作階段越長，越容易把「曾經討論」記成「目前核准」。Context 是助手這一輪能使用的材料。材料即使相關，也要回答它屬於哪一版、適用哪個目錄、誰核准。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 說明專案指引的可發現位置，P04 說明可依需要載入的 Skill（重複操作的說明）。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先記目前工作目錄、版本、既有未提交修改，再讀適用的 AGENTS.md、現行規格、測試與所需 Skill。用一份短摘要保留「本次目標、有效版本、規格段落、工作狀態、下一個問題」；大份日誌留下原件定位，需要時回讀。測試若反映舊規則，先標出測試與新規格各自的版本，請有權者釐清適用範圍。\u003c/p>", "layout": "prose", "note": "", "sources": "T02、T04、P04、P05", "passages": ["p-1", "p-2"]}, {"number": 108, "type": "content", "title": "名稱是否必填？用批准紀錄處理摘要衝突", "chapter": "02", "unit": "02-A04", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 舊對話說可略過名稱，現行表單契約要求必填。助手若只抽到較像提問的舊句子，就會替錯誤行為寫測試。讓它在回答前交出核准版本與可查回的段落；記憶裡的快捷答案僅當尋找線索。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"4\">\u003cstrong>判斷題\u003c/strong>　摘要與檔案互相衝突，先刪哪一份？保留兩個定位，核對批准紀錄與工作版本，必要時暫停受影響的步驟。來源為 T02（tutorials/context-knowledge-tools.md）、T04、P04、P05。\u003c/p>", "layout": "prose", "note": "", "sources": "T02、T04、P04、P05", "passages": ["p-3", "p-4"]}, {"number": 109, "type": "content", "title": "依不確定性、等待與測試成本配置推理預算", "chapter": "02", "unit": "02-A05", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">一份委託可能耗時在理解依賴，也可能大半時間都在等瀏覽器啟動。模型指產生判讀與建議的元件，推理強度指某些環境讓模型投入較多或較少推理的設定。可用設定要看當時帳戶與執行環境。換一個模型不會自動取得缺少的測試資料。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先列要判斷的不確定性與判斷錯誤的代價，再盤點可用模型、推理選項、容許等待、呼叫或資源上限與一次測試的成本。機械性的文字修正可在現有設定下跑局部檢查；跨層原因未明時，若有授權與預算，可先投入一次較深入的分析，要求交出能區分原因的實驗。把執行時間、模型等待、測試等待、重試及人工批准分欄記錄。在預算耗盡前交回最可靠的觀察與剩餘選項。\u003c/p>", "layout": "prose", "note": "", "sources": "T03、S01、U04", "passages": ["p-1", "p-2"]}, {"number": 110, "type": "content", "title": "規劃器的成本約束：依規格最多呼叫六次", "chapter": "02", "unit": "02-A05", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> U04 原規格固定模型，規定一次規劃加每步一次執行，三至五步，最多六次呼叫，服務失敗即停。這是一份可審的成本約束。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 未取得同題、同模型版本、僅改推理強度的延遲、消耗與驗收配對資料，無從推定哪個設定較划算。\u003c/p>", "layout": "prose", "note": "", "sources": "T03、S01、U04", "passages": ["p-3"]}, {"number": 111, "type": "content", "title": "測試服務未啟動，先查啟動記錄", "chapter": "02", "unit": "02-A05", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstrong>判斷題\u003c/strong>　測試服務無法啟動，再加推理預算能驗收嗎？先確認故障屬於環境或理解；服務未恢復前可查啟動記錄，產品結果仍待測。來源為 U04 的 CODEX_SPEC.md、S01、T03（tutorials/coding-agent-tool-selection.md）。策略選擇是教學設計。\u003c/p>", "layout": "prose", "note": "", "sources": "T03、S01、U04", "passages": ["p-4"]}, {"number": 112, "type": "content", "title": "分清環境寫入權限與本次任務授權", "chapter": "02", "unit": "02-A06", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">自主是把某些決定委託出去。例如允許助手在表單模組選擇如何顯示提示，需求者仍保有決定資料是否合法的權力。環境允許寫入的路徑，和這次任務授權的修改範圍要分別核對。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先列可讀、可改、可執行及必須批准的操作，標出會改契約、影響共享資料或難以回復的界線。局部可逆修正且有測試時可繼續；需要變更資料格式或新增權限時，保存目前差異，回報「目標、觀察、想做的動作、影響、可替代方案」，在該動作前等決定。權限未知時先求證。這些界線由當次專案設定。\u003c/p>", "layout": "prose", "note": "", "sources": "T04、U-B", "passages": ["p-1", "p-2"]}, {"number": 113, "type": "content", "title": "只准修改提示時，如何回報資料庫約束？", "chapter": "02", "unit": "02-A06", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 只准修改提示，助手發現資料庫已允許空值。它可用唯讀樣例呈現差異，若要修改資料庫約束須先取得決策。\u003cstrong>判斷題\u003c/strong>　即使程式能寫資料庫，下一步該做什麼？回報既有行為、建議與相容性影響，等負責人決定是否開新範圍。來源為 T04、concepts/harness.md、U-B（U07）。\u003c/p>", "layout": "prose", "note": "", "sources": "T04、U-B", "passages": ["p-3"]}, {"number": 114, "type": "content", "title": "測試失敗先分辨環境、斷言預期與實作缺陷", "chapter": "02", "unit": "02-A07", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">紅色的測試結果只告訴你某個檢查沒順利結束。診斷從「停在哪一層」開始。斷言是把實際輸出和預期比較的判定；測試程式可能根本還沒跑到斷言。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 執行器找不到套件時，先查命令、目錄與鎖定依賴版本；修復啟動條件後才測產品。斷言已執行但預期與核准規格不同時，先對齊解讀及測試。只有在輸入受控、預期有效、可穩定看到實際差異時，才沿資料流定位實作缺陷。保留失敗樣例，改一個已定位的環節，重跑該例和相鄰的既有行為，分別記錄結果。\u003c/p>", "layout": "prose", "note": "", "sources": "T04、P17", "passages": ["p-1", "p-2"]}, {"number": 115, "type": "content", "title": "重試無新線索時，回報已排除的原因與缺項", "chapter": "02", "unit": "02-A07", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 同一錯誤重現而沒有新線索，就寫明已排除的原因與需要的資料，或在權限停點結束。\u003cstrong>判斷題\u003c/strong>　補齊依賴後一個測項變綠，可以宣告所有表單都正常嗎？能確認的是該環境、輸入及斷言，上線路徑或其他輸入仍須各自驗證。來源為 T04、P17、concepts/quality.md。\u003c/p>", "layout": "prose", "note": "", "sources": "T04、P17", "passages": ["p-3"]}, {"number": 116, "type": "content", "title": "用續接單保存版本、差異與重跑入口", "chapter": "02", "unit": "02-A08", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">Session 是一次互動的工作階段。下次還能讀到對話，只代表訊息可以找回；檔案、測試環境與獲准範圍都可能已經改變。續接要回答「從哪個版本、哪一個尚待完成的檢查開始」。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 描述個人偏好文件式交接。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 可在離開時記一張續接單：目標與規格版本、工作目錄、起始和當前 commit（可查回的版本快照）、尚未提交的 diff（檔案差異）與新增檔、測試命令及實際輸出、阻塞、未測範圍、下一步。若沒有提交，明寫改動仍在哪個工作目錄。恢復時逐項比對目前版本及差異，再重跑最後一項可重現檢查；版本不同先找出哪段結果失效。\u003c/p>", "layout": "prose", "note": "", "sources": "T04、U-B、U04、U07", "passages": ["p-1", "p-2"]}, {"number": 117, "type": "content", "title": "驗證函式變更後，重測失敗與成功兩種輸入", "chapter": "02", "unit": "02-A08", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 昨天已修提示、測過有效輸入，今天有人改了驗證函式。即使舊對話寫「完成」，接手者仍應核對新舊差異，重測失敗與成功兩個輸入，更新結果再請人驗收。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> U04 交底列有交回產物、測試、未驗事項的要求，U07 有交接偏好；缺少同一工作中斷前後兩份狀態與復測輸出的配對紀錄。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstr
