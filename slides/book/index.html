03ctd>唯一刻意變動\u003c/td>\n\u003ctd>單組由同一助手實作並整合；多組由協調者將 API、UI 分給不同 Agent 再整合；兩組均計入規劃與整合，人類核准與簽收權相同\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C", "passages": ["p-4"]}, {"number": 348, "type": "content", "title": "三對試次交替開跑，分別記錄簽收、拒收或截止", "chapter": "05", "unit": "C52-01", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"控制項表格\" data-passage=\"p-4\" data-block=\"4\" data-rows=\"5,6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">控制項\u003c/th>\n\u003cth scope=\"col\">單組與多組共同約定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>次數／順序\u003c/td>\n\u003ctd>假設各 3 次，配對順序單多、多單、單多；每次重置 B0、資料、快取和工作脈絡，不帶前次解法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>時鐘／終止\u003c/td>\n\u003ctd>收到同一需求起計，簽收才記成功時間；滿 30 分或全組達 16,000 token 就截止，兩個預算內可返工；最終交驗被拒且結案記失敗；截止仍開放記未完成\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C", "passages": ["p-4"]}, {"number": 349, "type": "content", "title": "把示意代號換成可查核的版本、事件與偏差", "chapter": "05", "unit": "C52-01", "body": "\u003cp data-passage=\"p-5\" data-block=\"5\">逐列橫讀兩組共同承諾的條件。每回收到需求時記開始，在終局拒收或預算先到時記終止，只有具權者簽收才記接受。用於真實工作時，把表中的示意代號換成可回查的版本識別、設定及證據位置。並行配額、帳戶限制或快取若有差異，也要記下偏差及可能影響，才能判斷要不要在可比條件下重做。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C", "passages": ["p-5"]}, {"number": 350, "type": "content", "title": "保留漏驗畫面的試次，兩組紙上算例分開計算", "chapter": "05", "unit": "C52-01", "body": "\u003cp data-passage=\"p-6\" data-block=\"6\">如果多組只查 API 就提前交卷，該列保留原來的終局和偏差，明記欠 UI 與共同簽收。要回答原來的問題，需以相同品質門檻重做。此處及本組故事板安排三對紙上試次；正式教材 C52 用另一份兩對試次解說，兩份資料各自計算。\u003c/p>\n\u003cp data-passage=\"p-7\" data-block=\"7\">OpenAI P20 提供以明確準則反覆評估的公開方法。T09 與控制表是設計中的合成方案，U-C 是專案提供者品質與成本研究的私人摘要；以上來源沒有這項對照的實測結果。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C", "passages": ["p-6", "p-7"]}, {"number": 351, "type": "content", "title": "六筆合成紀錄要回答哪些分工成本問題？", "chapter": "05", "unit": "C52-02", "body": "\u003cblockquote data-block=\"1\">一個團隊想替待辦網站加上標籤篩選。可以讓一位 Agent 做完整項修改，也可以讓幾位 Agent 分頭做，最後再把成果接起來。怎麼知道哪種安排較有效率？以下用六次虛構的工作紀錄來練習比較。所有數字都是教學用的合成資料。\u003c/blockquote>\n\u003cp data-block=\"2\">假設分工的那組最早把可用的網站交到你手上。這回答了「這次等了多久」，卻還不足以幫你安排下次工作。那次交付可能要人花更多時間協調；同一組接下來也可能有兩次都來不及交。要把這些代價看清楚，先約定什麼算「做好」，再決定從哪一刻開始記帳。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 352, "type": "content", "title": "兩組共用同一驗收門檻：選取、清除與查無結果", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"4\">兩組接相同的需求，用同樣的方式簽收。測試用的清單只有工作事項 A 和生活事項 B。把網站畫面連上實際的資料服務後，選工作標籤 \u003ccode>work\u003c/code> 應只看見 A；清除時，畫面送出的請求要省略標籤參數 \u003ccode>tag\u003c/code>，並重新顯示 A、B。選沒有對應事項的標籤 \u003ccode>missing\u003c/code>，服務要回 HTTP 200（已成功處理請求）和空清單，畫面也要顯示空清單。最後還要通過共同的架構檢查與既有功能的回歸測試。若一組測到資料介面就停、另一組還得修好畫面，即使兩邊都寫「完成」，耗時也無法直接比較。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 353, "type": "content", "title": "每回重設起始版本、快取與工作脈絡，固定執行環境", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"5\">每回開始前，都還原相同的乾淨程式版本，這個起點記為 \u003cstrong>B0\u003c/strong>。兩組使用相同的模型設定，記為 \u003cstrong>M1\u003c/strong>；可用工具、軟體依賴和執行環境也固定，記為 \u003cstrong>E1\u003c/strong>。兩組用同一份資料、權限和機器配額，由相同角色簽收。每回都重置快取與工作脈絡，以免後做的一方帶著上一回的修正或答案開工。若條件真的變了，在該列寫明偏差，留給讀表的人判斷。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 354, "type": "content", "title": "每次獨立試驗的時間上限與全組用量配額", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"6\">一次獨立接下需求、從頭做到簽收、拒收或截止，稱為一次\u003cstrong>試次\u003c/strong>。過程中的重跑仍算在這一次。此例安排三對，每對讓兩種做法各跑一次，並保留實際先後順序；重複測量才看得到一次順利、另一次受阻的差異。從收到需求起計，包括規劃、等待、重試、整合和簽收。每次最多 \u003cstrong>30 分鐘\u003c/strong>，並給全組所有模型呼叫合計 \u003cstrong>16,000 token\u003c/strong> 的用量額度。token 是模型處理文字等內容時所計的單位。兩個上限哪個先到，就在那裡停止觀察。即使派出多位 Agent，它們也共用這一次試次的額度。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 355, "type": "content", "title": "按簽收、終局拒收與截止分類，重試留在原試次", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"8\">先判定結果。通過全部門檻且獲簽收，記為\u003cstrong>成功\u003c/strong>。最後一次驗收明確拒收、這回也結案了，記為\u003cstrong>失敗\u003c/strong>。到截止仍在等工具或返工，記為\u003cstrong>未完成\u003c/strong>。中途測出錯而繼續修，仍屬原試次；依實際發生的事分別登記重試、整合返工及原因。算簽收比例時，已經啟動的三次都要進分母。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 356, "type": "content", "title": "區分簽收耗時、觀察時長、Agent 工時與人工投入", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"9\">\u003cstrong>牆鐘時間\u003c/strong>是人看著時鐘實際等了多久。「接受分」只在簽收時填，表示從領到需求到簽收的分鐘數；「終止分」是從領到需求到停止觀察的分鐘數，每次都要填。把每位 Agent 實際工作的分鐘分別相加，得到\u003cstrong>累計 Agent·分\u003c/strong>。例如兩位同時工作，各做 10 分鐘，時鐘只走過 10 分鐘，卻用了 20 Agent·分。若人另外花 3 分鐘檢查交件，人工投入就記 3 人分；這 3 分鐘也可能和 Agent 的工作重疊。六筆紀錄沒有各 Agent 的起訖明細，無法從牆鐘時間反算累計 Agent·分。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 357, "type": "content", "title": "把全組 token、人工、重試與整合返工分欄", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"10\">\u003cstrong>Token\u003c/strong> 欄加總全組呼叫，人工欄加總人實際投入的時間；兩欄回答的資源問題不同。重試指再嘗試一次操作，整合返工指把產物接起來發現問題而回頭修改。分開記次、寫下原因，才能分辨時間花在恢復工具還是修正兩份成果之間的配合。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 358, "type": "content", "title": "讀試次表：簽收時間、人分、模型用量與重試", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"12\">表中的「單」是一位 Agent，「多」是多位分工。依序號配對：甲是第 1、2 列，乙是第 3、4 列，丙是第 5、6 列；乙這一對是多組先做。先讀第 1 列：這次獲得簽收，「24／24」表示第 24 分鐘簽收並停止觀察；「4／8000」記下 4 人分和 8,000 token；「1／0」表示重試一次、整合返工零次。最後一欄解釋為什麼要重跑。其他列也按這個順序讀。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 359, "type": "content", "title": "甲對合成試次：比較兩次簽收的耗時與投入", "chapter": "05", "unit": "C52-02", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"序／組表格\" data-block=\"13\" data-rows=\"1,2\">\u003ctable class=\"cols-6\">\u003cthead>\u003ctr>\u003cth scope=\"col\">序／組\u003c/th>\u003cth scope=\"col\">契約與狀態\u003c/th>\u003cth scope=\"col\">接受分／終止分\u003c/th>\u003cth scope=\"col\">人分／token\u003c/th>\u003cth scope=\"col\">重試／整合返工次\u003c/th>\u003cth scope=\"col\">模擬觀察與限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"序／組\">1 單\u003c/td>\u003ctd data-label=\"契約與狀態\">全門檻通過，成功\u003c/td>\u003ctd data-label=\"接受分／終止分\">24／24\u003c/td>\u003ctd data-label=\"人分／token\">4／8000\u003c/td>\u003ctd data-label=\"重試／整合返工次\">1／0\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">首次測試資料路徑錯，重跑後簽收\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"序／組\">2 多\u003c/td>\u003ctd data-label=\"契約與狀態\">全門檻通過，成功\u003c/td>\u003ctd data-label=\"接受分／終止分\">16／16\u003c/td>\u003ctd data-label=\"人分／token\">5／11000\u003c/td>\u003ctd data-label=\"重試／整合返工次\">0／0\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">兩份產物整合後簽收\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 360, "type": "content", "title": "乙對合成試次：多 Agent 組清除失敗，單 Agent 組簽收", "chapter": "05", "unit": "C52-02", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"序／組表格\" data-block=\"13\" data-rows=\"3,4\">\u003ctable class=\"cols-6\">\u003cthead>\u003ctr>\u003cth scope=\"col\">序／組\u003c/th>\u003cth scope=\"col\">契約與狀態\u003c/th>\u003cth scope=\"col\">接受分／終止分\u003c/th>\u003cth scope=\"col\">人分／token\u003c/th>\u003cth scope=\"col\">重試／整合返工次\u003c/th>\u003cth scope=\"col\">模擬觀察與限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"序／組\">3 多\u003c/td>\u003ctd data-label=\"契約與狀態\">終局驗收拒絕，失敗\u003c/td>\u003ctd data-label=\"接受分／終止分\">無／18\u003c/td>\u003ctd data-label=\"人分／token\">6／9000\u003c/td>\u003ctd data-label=\"重試／整合返工次\">1／1\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">清除仍見 A，該回結案\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"序／組\">4 單\u003c/td>\u003ctd data-label=\"契約與狀態\">全門檻通過，成功\u003c/td>\u003ctd data-label=\"接受分／終止分\">20／20\u003c/td>\u003ctd data-label=\"人分／token\">3／7000\u003c/td>\u003ctd data-label=\"重試／整合返工次\">0／0\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">三種 UI 路徑及回歸通過\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 361, "type": "content", "title": "丙對合成試次：兩組均未完成，一筆用量缺報", "chapter": "05", "unit": "C52-02", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"序／組表格\" data-block=\"13\" data-rows=\"5,6\">\u003ctable class=\"cols-6\">\u003cthead>\u003ctr>\u003cth scope=\"col\">序／組\u003c/th>\u003cth scope=\"col\">契約與狀態\u003c/th>\u003cth scope=\"col\">接受分／終止分\u003c/th>\u003cth scope=\"col\">人分／token\u003c/th>\u003cth scope=\"col\">重試／整合返工次\u003c/th>\u003cth scope=\"col\">模擬觀察與限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"序／組\">5 單\u003c/td>\u003ctd data-label=\"契約與狀態\">截止，未完成\u003c/td>\u003ctd data-label=\"接受分／終止分\">無／30\u003c/td>\u003ctd data-label=\"人分／token\">4／缺值：報表未取得\u003c/td>\u003ctd data-label=\"重試／整合返工次\">0／0\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">Browser 入口仍待恢復\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"序／組\">6 多\u003c/td>\u003ctd data-label=\"契約與狀態\">截止，未完成\u003c/td>\u003ctd data-label=\"接受分／終止分\">無／30\u003c/td>\u003ctd data-label=\"人分／token\">7／13500\u003c/td>\u003ctd data-label=\"重試／整合返工次\">2／2\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">整合版本仍在返工\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 362, "type": "content", "title": "拒收與截止沒有接受分，缺報表也不能填零", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"14\">第 3 列到第 18 分鐘確定拒收，沒有簽收時刻。第 5 列則等到第 30 分鐘，瀏覽器的驗收入口還沒恢復，事情仍未做完。這兩列的接受分都填「無」，真正觀察到的時間分別是 18 和 30 分鐘。第 5 列的 token「缺值」表示報表沒拿到，而重試欄的 0 表示已知一次也沒有。把缺值填成零會低估成本，把 30 填作接受分則會憑空多算一次交付。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 363, "type": "content", "title": "每組三次試次的簽收率與唯一可比的成對耗時", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"16\">先數交付。單組啟動三次，在第 1、4 列簽收兩次，簽收比例是 \u003cstrong>2/3\u003c/strong>。多組也啟動三次，只有第 2 列簽收，比例是 \u003cstrong>1/3\u003c/strong>。再比兩邊都交出同等成果的情形。只有甲符合，單組花 24 分鐘，多組花 16 分鐘，這一對多組早了 \u003cstrong>24 − 16＝8 分鐘\u003c/strong>。乙的多組已拒收，丙的兩組都未完成，這兩對沒有可相減的簽收時間。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 364, "type": "content", "title": "合成試次的人工總計、已知 Token 用量與推論限制", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"17\">再把所有已開跑的列加起來，包含失敗與截止的投入。單組用了 \u003cstrong>4＋3＋4＝11 人分\u003c/strong>，多組用了 \u003cstrong>5＋6＋7＝18 人分\u003c/strong>。多組 token 合計 \u003cstrong>11,000＋9,000＋13,500＝33,500\u003c/strong>；單組只有 \u003cstrong>8,000＋7,000＝15,000\u003c/strong> 的已知小計，第 5 列仍缺值。用量上限是給每一次獨立試次，這裡的加總則橫跨三次。只挑最快那列，會同時漏掉其他試次消耗的人力和未能交件的結果。\u003c/p>\n\u003cp data-block=\"18\">這份表能教我們把「某一次交得快」「幾次能交成」「總共花掉多少資源」分開報告。每組只有三次、僅一對雙方都成功，還缺一筆用量；更重要的是，六列來自紙上設計。要判斷真實團隊是否值得採用分工，需要相同條件下實際開跑的完整紀錄。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 365, "type": "content", "title": "換成自己的任務，從空白試次表記起訖與未測項", "chapter": "05", "unit": "C52-02", "body": "\u003cp data-block=\"20\">每次真正開始才新增一列，尚未開跑的排程另記。起訖用同一時區。若提前拒收，記下終止時刻和拒收原因，接受耗時填「無」。保留測試輸出或阻塞紀錄的位置，寫明哪些檢查沒做；遇到工具或版本偏差，也跟著該列保存。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"試次／組／順序表格\" data-block=\"21\">\u003ctable class=\"cols-8\">\u003cthead>\u003ctr>\u003cth scope=\"col\">試次／組／順序\u003c/th>\u003cth scope=\"col\">基線／條件／偏差\u003c/th>\u003cth scope=\"col\">起始／接受或截止\u003c/th>\u003cth scope=\"col\">契約結果／狀態／原因\u003c/th>\u003cth scope=\"col\">接受耗時／已觀察耗時\u003c/th>\u003cth scope=\"col\">人分／token／累計 Agent·分\u003c/th>\u003cth scope=\"col\">阻塞／重試／整合返工\u003c/th>\u003cth scope=\"col\">證據位置／未測與限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"試次／組／順序\">\u003ctextarea aria-label=\"試次／組／順序\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"基線／條件／偏差\">\u003ctextarea aria-label=\"基線／條件／偏差\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"起始／接受或截止\">\u003ctextarea aria-label=\"起始／接受或截止\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"契約結果／狀態／原因\">\u003ctextarea aria-label=\"契約結果／狀態／原因\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"接受耗時／已觀察耗時\">\u003ctextarea aria-label=\"接受耗時／已觀察耗時\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"人分／token／累計 Agent·分\">\u003ctextarea aria-label=\"人分／token／累計 Agent·分\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"阻塞／重試／整合返工\">\u003ctextarea aria-label=\"阻塞／重試／整合返工\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"證據位置／未測與限制\">\u003ctextarea aria-label=\"證據位置／未測與限制\" rows=\"3\">\u003c/textarea>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "T09、P20、U-C", "passages": []}, {"number": 366, "type": "content", "title": "從最快紀錄回到三對合成試次的完整結果", "chapter": "05", "unit": "C52-03", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">假設團隊做了六次待辦篩選任務，多人分工有一次只花 16 分鐘就交付。一位助手獨力完成的最快紀錄是 20 分鐘。若你要決定下次怎樣分工，還得知道其餘幾次有沒有交成，人花了多少時間，又有多少成本沒量到。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">下面是三對獨立啟動的\u003cstrong>合成資料\u003c/strong>。兩組從相同乾淨版本開始，使用相同模型、工具、資料與權限。驗收都要在連接真實服務的畫面選工作標籤看見 A、清除篩選恢復 A 和 B、查未知標籤得空清單及 HTTP 200，通過架構檢查與既有回歸，再由相同角色簽收。每回最多 30 分鐘或全組 16,000 token，先達者截止；原地重試或整合返工仍屬同一回。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-1", "p-2"]}, {"number": 367, "type": "content", "title": "甲對合成資料：重試與整合後各自簽收", "chapter": "05", "unit": "C52-03", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"序／組表格\" data-passage=\"p-3\" data-block=\"3\" data-rows=\"1,2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">序／組\u003c/th>\n\u003cth scope=\"col\">契約與狀態\u003c/th>\n\u003cth scope=\"col\">接受分／終止分\u003c/th>\n\u003cth scope=\"col\">人分／token\u003c/th>\n\u003cth scope=\"col\">重試／整合返工次\u003c/th>\n\u003cth scope=\"col\">模擬觀察與限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1 單\u003c/td>\n\u003ctd>全門檻通過，成功\u003c/td>\n\u003ctd>24／24\u003c/td>\n\u003ctd>4／8000\u003c/td>\n\u003ctd>1／0\u003c/td>\n\u003ctd>首次測試資料路徑錯，重跑後簽收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 多\u003c/td>\n\u003ctd>全門檻通過，成功\u003c/td>\n\u003ctd>16／16\u003c/td>\n\u003ctd>5／11000\u003c/td>\n\u003ctd>0／0\u003c/td>\n\u003ctd>兩份產物整合後簽收\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-3"]}, {"number": 368, "type": "content", "title": "乙對合成資料：終局拒收與簽收分別記錄", "chapter": "05", "unit": "C52-03", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"序／組表格\" data-passage=\"p-3\" data-block=\"3\" data-rows=\"3,4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">序／組\u003c/th>\n\u003cth scope=\"col\">契約與狀態\u003c/th>\n\u003cth scope=\"col\">接受分／終止分\u003c/th>\n\u003cth scope=\"col\">人分／token\u003c/th>\n\u003cth scope=\"col\">重試／整合返工次\u003c/th>\n\u003cth scope=\"col\">模擬觀察與限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>3 多\u003c/td>\n\u003ctd>終局驗收拒絕，失敗\u003c/td>\n\u003ctd>無／18\u003c/td>\n\u003ctd>6／9000\u003c/td>\n\u003ctd>1／1\u003c/td>\n\u003ctd>清除仍見 A，該回結案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 單\u003c/td>\n\u003ctd>全門檻通過，成功\u003c/td>\n\u003ctd>20／20\u003c/td>\n\u003ctd>3／7000\u003c/td>\n\u003ctd>0／0\u003c/td>\n\u003ctd>三種 UI 路徑及回歸通過\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-3"]}, {"number": 369, "type": "content", "title": "丙對合成資料：兩組截止，單 Agent 組用量缺值", "chapter": "05", "unit": "C52-03", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"序／組表格\" data-passage=\"p-3\" data-block=\"3\" data-rows=\"5,6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">序／組\u003c/th>\n\u003cth scope=\"col\">契約與狀態\u003c/th>\n\u003cth scope=\"col\">接受分／終止分\u003c/th>\n\u003cth scope=\"col\">人分／token\u003c/th>\n\u003cth scope=\"col\">重試／整合返工次\u003c/th>\n\u003cth scope=\"col\">模擬觀察與限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>5 單\u003c/td>\n\u003ctd>截止，未完成\u003c/td>\n\u003ctd>無／30\u003c/td>\n\u003ctd>4／缺值：報表未取得\u003c/td>\n\u003ctd>0／0\u003c/td>\n\u003ctd>Browser 入口仍待恢復\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6 多\u003c/td>\n\u003ctd>截止，未完成\u003c/td>\n\u003ctd>無／30\u003c/td>\n\u003ctd>7／13500\u003c/td>\n\u003ctd>2／2\u003c/td>\n\u003ctd>整合版本仍在返工\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-3"]}, {"number": 370, "type": "content", "title": "計算簽收比例時，拒收與截止仍計入分母", "chapter": "05", "unit": "C52-03", "body": "\u003cp data-passage=\"p-5\" data-block=\"5\">接受分只在產品簽收時才有，終止分記實際觀察到何時。第 3 列在 18 分鐘終局拒收；第 5、6 列到 30 分鐘仍開放，屬未完成。三列都算進啟動分母，均無接受時刻。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-5"]}, {"number": 371, "type": "content", "title": "以全部試次算簽收比例，以成功試次看耗時分布", "chapter": "05", "unit": "C52-03", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"以全部試次計數表格\" data-passage=\"p-6\" data-block=\"6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">以全部試次計數\u003c/th>\n\u003cth scope=\"col\">成功＋失敗＋未完成\u003c/th>\n\u003cth scope=\"col\">簽收比例\u003c/th>\n\u003cth scope=\"col\">僅取成功子集的簽收分鐘\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>單組\u003c/td>\n\u003ctd>2＋0＋1＝3\u003c/td>\n\u003ctd>2/3\u003c/td>\n\u003ctd>[20,24]，中位數 (20＋24)／2＝22 分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多組\u003c/td>\n\u003ctd>1＋1＋1＝3\u003c/td>\n\u003ctd>1/3\u003c/td>\n\u003ctd>[16]，只有一個成功值，無法觀察變動範圍\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-6"]}, {"number": 372, "type": "content", "title": "保留配對關係：為什麼只能從甲對算出 8 分鐘？", "chapter": "05", "unit": "C52-03", "body": "\u003cp data-passage=\"p-7\" data-block=\"7\">甲配第 1、2 列，都是同門檻下交成的版本，多組早了 24－16＝8 分鐘。乙配第 3、4 列，多組缺簽收；丙配第 5、6 列，兩組都截止。乙、丙無法計算成對簽收差，仍留在兩組的結果分母。若用兩組成功子集的中位數相減，會拿不同試次相互抵銷，所得數字無法代替甲的 8 分鐘。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-7"]}, {"number": 373, "type": "content", "title": "從全部六列核算人工、token 已知小計與缺值", "chapter": "05", "unit": "C52-03", "body": "\u003cp data-passage=\"p-9\" data-block=\"9\">人工是人實際投入的分鐘。單組三回 4＋3＋4＝11 人分，多組 5＋6＋7＝18 人分，包括拒收與截止的投入。除以成功回數會改成「每次簽收分攤多少人分」，報告須明列分母。全組各模型呼叫的用量以 token 記，單組已知 8,000＋7,000＝15,000，第 5 列報表未取得，單組總量未知；多組 11,000＋9,000＋13,500＝33,500，為三回加總。第 5 列兩個 0 表示已知零次重試、零次整合返工。逐列留原因，才能追到工具路徑、清除反例、Browser 入口與整合返工各自花在哪裡。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-9"]}, {"number": 374, "type": "content", "title": "用重疊時段區分牆鐘、人分與累計 Agent·分", "chapter": "05", "unit": "C52-03", "body": "\u003cp data-passage=\"p-10\" data-block=\"10\">牆鐘時間量從開始到接受或終止的經過時間。累計 Agent·分則要把每位助手實際執行的時段相加：兩位同時各做 10 分鐘是 10 分鐘牆鐘、20 Agent·分。人工若另投入 3 分鐘，另記 3 人分。六列缺各助手起訖，無法從終止分反算累計執行量。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-10"]}, {"number": 375, "type": "content", "title": "效率推論的證據界線：合成算例、功能實測與待驗假設", "chapter": "05", "unit": "C52-03", "body": "\u003cp data-passage=\"p-12\" data-block=\"12\">這一對早了 8 分鐘，同一表中多組交成 1/3、單組 2/3。這些都是從紙上數字得到的判讀。若要檢驗「這項任務適合並行」，需在同條件下實跑，逐次填寫\u003ca href=\"#C52-02\">八欄試次工作表\u003c/a>，保留失敗與截止、限制和缺值，再把結論限定於所測任務、環境、品質門檻與樣本。\u003c/p>\n\u003cp data-passage=\"p-13\" data-block=\"13\">專案提供者的 Dungeon Lab 原紀錄 U05 與 U06 分屬兩輪、不同版本：第一輪 8/8、第二輪 12/12 單元測試，第二輪另有 58 項定時整合檢查（\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"TESTED\">有紀錄的實際測試\u003c/span>，限原作者原版本，本輪僅核對文本）。兩輪均缺另一組從相同基線完成相同需求的成本列。U10 的個人時間公式缺原文、符號與前提（\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"GAP\">證據待補／尚未驗證\u003c/span>）；上面各式只用來核算這張練習表。架構收益仍是假設（\u003cspan class=\"evidence-label\" data-evidence=\"HYPOTHESIS\" data-original=\"HYPOTHESIS\">待驗證假設\u003c/span>）。OpenAI P20 與 T09 支持評估方法，六列皆屬 \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"SYNTHETIC_EXAMPLE\">合成教學案例\u003c/span>。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C、U05、U06、U10", "passages": ["p-12", "p-13"]}, {"number": 376, "type": "content", "title": "區分功能產出與使用者效益的驗證指標", "chapter": "05", "unit": "C53", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 提出應依專案目的評估成果。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把「交付什麼」和「誰的工作因此改變」各寫一句。前者是產出（output），可用產品契約簽收；後者是效益（outcome），需要看目標使用者做事的結果。若目的只是找對待辦，查使用者能否選中正確項目就有意義；若目的是更快找對，還需要時間及比較基線。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、S05", "passages": ["p-1"]}, {"number": 377, "type": "content", "title": "設計新舊介面對照，記錄耗時、錯選與未找到", "chapter": "05", "unit": "C53", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> \u003cstrong>只做出標籤按鈕就能證明使用者找東西更快嗎？\u003c/strong> 先說明要服務哪一群人，給他們難度相當的待辦清單與指定目標。分別在原介面及新介面，從看見同類指令計到正確選取，保存耗時、錯選和到時仍找不到的次數。交替操作順序或換等難度的題目，避免第二次只是記住答案。在同樣的正確性條件下看時間分布，並一併報告找不到的比例。三個功能測項只驗回傳與顯示，\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 現有材料沒有這項使用者量測，尚無實現效益的結果。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、S05", "passages": ["p-2"]}, {"number": 378, "type": "content", "title": "讀試辦設計：哪種觀察才能支持「更快找對」？", "chapter": "05", "unit": "C53", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>合成試辦｜怎樣驗證「更快找到正確待辦」\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>\u003cstrong>訂出目標\u003c/strong>　找對指定待辦，並能比較花了多久。\u003c/li>\u003cli>\u003cstrong>收兩組觀察\u003c/strong>　給目標使用者難度相當的題目，在原介面和新介面各記正確選取時間、錯選與找不到的次數。\u003c/li>\u003cli>\u003cstrong>判讀效益\u003c/strong>　在同樣正確性條件下比時間分布，一併呈現找不到的比例。現有待辦範例仍缺這項量測。\u003c/li>\u003c/ol>\u003c/figure>", "layout": "figure", "note": "", "sources": "U-C、S05", "passages": []}, {"number": 379, "type": "content", "title": "把硬限制、待量指標與可權衡成本寫入決策卡", "chapter": "05", "unit": "C53", "body": "\u003cp data-passage=\"p-3\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在啟動試辦前，由有權決定目標的人做一張決策卡，逐欄寫「硬限制、觀察指標、可權衡項」。逾期或漏過一條必過契約，照硬限制處理；找對待辦所需時間列為待量的效益指標；返工先記錄供診斷。對可以權衡的項目寫明優先序與理由，例如守住品質與截止日後，才在可行方案中優先選人工負擔較低的一個。若另一案將無未計畫重派也訂為硬限制，就要另立判準。缺少紀錄及不相容的單位都不能靠任意權重補成總分。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、S05", "passages": ["p-3"]}, {"number": 380, "type": "content", "title": "試辦判讀：分列達標契約、返工與待測效益", "chapter": "05", "unit": "C53", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cstrong>試辦案準時且契約全過，但返工兩次、沒有使用者量測。哪些門檻已達？能說效益已實現嗎？\u003c/strong> 截止日與三條產品契約都達標，兩次返工登記為過程觀察，效益欄標待測。由專案目的決定是否追加使用者試驗、誰收資料及何時再評。這張卡與課堂優先序是編輯示例，U07 支持的是提問方向。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"7\">來源：U-C（U07）、S05、T09、\u003ccode>concepts/quality.md\u003c/code>、\u003ccode>examples/scenario.md\u003c/code>。如果效益有機會在下一案重現，可讀 \u003ca href=\"#C54\">5.08\u003c/a>。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、S05", "passages": ["p-4", "p-5"]}, {"number": 381, "type": "content", "title": "從重複追問測試版本，找出交接遺漏的原因", "chapter": "05", "unit": "C54", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">一張工作票如期簽收，交接時卻要回頭追問測試用的版本。下一次又發生同樣的事，你就有了可檢查的重複問題。\u003cstrong>工程資產\u003c/strong>指後續任務可使用、可驗證、有人維護的規範、操作程序或檢查。先保留本次條件、做法、結果及失敗例；再問遺漏是因為沒有約定、忘了一步，還是執行後沒有人檢查。原因不同，留下來的東西也應不同。\u003c/p>", "layout": "prose", "note": "", "sources": "S05、P05、P17、U-C", "passages": ["p-1"]}, {"number": 382, "type": "content", "title": "何時把教訓寫進專案指引、Skill、模板或回歸測試？", "chapter": "05", "unit": "C54", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 若多張票都不得修改核心資料格式，把這個穩定約束及適用模組寫入專案指引 AGENTS.md；若每次都要準備同版資料、跑真實介面、保存輸出，可把輸入、步驟、失敗出口整理成供執行者重用的程序（Skill）。若反覆缺的是交接用的基準提交與輸出位置，先試用含兩欄的交接模板。若清除待辦篩選後本應恢復顯示居家待辦 B，卻已兩次漏驗，把先選再清除寫成有預期輸出的回歸測試。為何採用這個資料介面的取捨則保留於決策紀錄，讓下次修改的人能查適用前提。\u003c/p>", "layout": "prose", "note": "", "sources": "S05、P05、P17、U-C", "passages": ["p-2"]}, {"number": 383, "type": "content", "title": "換一張工作票，檢查成功的提示能否獨立重用", "chapter": "05", "unit": "C54", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>一次碰巧成功的 Prompt 可直接變成通用 Skill 嗎？\u003c/strong> 當次指令可能依賴當時對話才有的檔名、權限或工具版本。換一張相近的工作票，讓接手者只拿模板或程序去找提交、重跑驗證；如果少了原作者補充就找不到產物，補寫前提並重試。通過才將已驗範圍發布給適用的團隊，模組特有的規則留在模組裡。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 說明以專案指引提供建置與測試入口，P17 示範把架構檢查保存在專案內。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> U09 的歷史摘要涉及保留管理資產；上述升級流程是編輯設計，沒有把摘要當作逐字研究或實測結論。\u003c/p>", "layout": "prose", "note": "", "sources": "S05、P05、P17、U-C", "passages": ["p-3"]}, {"number": 384, "type": "content", "title": "用重用、返工與維護人時決定資產是否值得保留", "chapter": "05", "unit": "C54", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 讓資產經過發現問題、換票驗證、發布、更新及淘汰。發布時列適用條件、版本、維護者、成功與失敗案例、觸發重驗的變更及停用條件。追蹤適用任務數、實際重用次數、首次成功與返工情形，記設計、教學、修訂、重驗各花多少人時。對近似任務在同一品質門檻下觀察重用前後的人工及返工，把節省的同單位投入與一次性設計、後續維護一起核對。使用次數高，也可能每次都要人工補修。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 目前無可用來填寫固定收益的同條件紀錄。\u003c/p>", "layout": "prose", "note": "", "sources": "S05、P05、P17、U-C", "passages": ["p-4"]}, {"number": 385, "type": "content", "title": "工具改版後，用成功與失敗例重驗或淘汰舊程序", "chapter": "05", "unit": "C54", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cstrong>工具改版後能繼續無條件使用舊 Skill 嗎？\u003c/strong> 先查版本前提，在新版本以代表性的成功與失敗例重驗。若入口已失效，暫停推薦、指定維護者修訂並重測；若需求已消失或維護代價超過可觀察的收益，記錄淘汰理由、日期與替代入口，避免下一張票繼續引用。這時能確認的是這個版本的適用範圍，跨案效益仍待新的觀察。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"7\">來源：S05、P05、P17、U-C、T09、\u003ccode>concepts/cost.md\u003c/code>、\u003ccode>concepts/harness.md\u003c/code>。U10 個人時間公式原文仍缺；朋友的 RBS v3 屬朋友資料，本章的成本表、決策卡及維護流程均未引用它作為使用者研究。\u003c/p>", "layout": "prose", "note": "", "sources": "S05、P05、P17、U-C", "passages": ["p-5", "p-6"]}, {"number": 386, "type": "chapter", "title": "總結｜從需求與交付證據檢驗工程效益", "chapter": "99", "unit": "", "body": "", "layout": "prose", "note": "", "sources": "", "passages": []}, {"number": 387, "type": "content", "title": "從使用者目的推導驗收規格與工具需求", "chapter": "99", "unit": "Z01", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">有人交來一句「標籤篩選已完成」，另附一張只看得到工作待辦的截圖。你可以先把問題往回推一步。當初要的是畫面上多一個按鈕，還是希望使用者更容易找對待辦？如果是後者，按鈕需要符合哪些行為，怎樣才有機會改善找尋結果？先定目的，再把「選取、清除、無匹配」寫成可觀察的規格。這一步會改變之後怎麼選工具：只會截圖的環境能留下外觀；要把服務回應與畫面顯示對上，還要有取得同一次請求、回應與操作結果的辦法。\u003c/p>", "layout": "prose", "note": "", "sources": "U-A、U-B、U-C", "passages": ["p-1"]}, {"number": 388, "type": "content", "title": "分工交付、需求裁決與交接模板的重用條件", "chapter": "99", "unit": "Z01", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">接著才決定誰來做。若一位助手能從需求走到驗收，給它清楚的授權、測項與停點便能起步。若分成資料與畫面兩張票，兩方就得先拿到相同規格，分別交回自己的版本和局部測試，再由整合者查共同版本。有人提出改變篩選語義時，保存候選結果與受影響工作，找具權者裁決；這是執行途中維持共同目標的治理工作。最後把實際產物、測試和接受決定留在可追查的位置。若下次交件又缺相同的定位，便有一個具體理由試用交接模板；能經另一張票驗證並有人維護，才值得繼續保留。\u003c/p>", "layout": "prose", "note": "", "sources": "U-A、U-B、U-C", "passages": ["p-2"]}, {"number": 389, "type": "content", "title": "區分任務交件、產品簽收與使用者效益", "chapter": "99", "unit": "Z01", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>任務完成、產品接受、效益實現是不是同一件事？\u003c/strong> 拿同一個例子作三次判讀。執行者交出畫面修改與對應測試，可以確認該票交件；整合者用同一版資料與程式重驗，並取得具權者簽收，才能把功能列入已接受基準。即使三個產品測項都通過，也還沒有量到使用者找對待辦所需的時間。要判斷效益，得在可比較的工作情境下觀察正確選取、耗時與找不到的比例。若只收到最初那張截圖，最好的回覆就是指明缺哪一層證據、誰能補、應在哪個版本補。\u003c/p>", "layout": "prose", "note": "", "sources": "U-A、U-B、U-C", "passages": ["p-3"], "subtitle": "同一項功能，怎麼分別判讀交件、接受與效益？"}, {"number": 390, "type": "content", "title": "交付證據對照：局部測試、版本簽收與使用者觀察", "chapter": "99", "unit": "Z01", "body": "\u003cfigure data-block=\"4\">\u003cfigcaption>從同一張回報追查三種結論\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">你想知道什麼\u003c/th>\u003cth scope=\"col\">應找到誰留下的哪份記錄\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">畫面修改是否已交件？\u003c/th>\u003ctd>執行者在當前工作票交付的版本與局部測試。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">這個版本能列入已接受的基準嗎？\u003c/th>\u003ctd>整合者對共同版本的驗證，以及具權者指向該版本的簽收。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">使用者是否更快找到正確待辦？\u003c/th>\u003ctd>原介面與新介面在可比較任務下的正確選取、耗時及找不到的比例。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "U-A、U-B、U-C", "passages": []}, {"number": 391, "type": "content", "title": "依工程問題回查教材練習與 Wiki 來源", "chapter": "99", "unit": "Z01", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"若你下次遇到這個問題表格\" data-passage=\"p-4\" data-block=\"5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">若你下次遇到這個問題\u003c/th>\n\u003cth scope=\"col\">可重做的教材練習\u003c/th>\n\u003cth scope=\"col\">回 Wiki 查核\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>怎麼看出助手有動手，誰選了下一步？\u003c/td>\n\u003ctd>\u003ca href=\"#C02\">第一章：同一故障的兩條路徑\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">模型與工具\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎麼讓一個人從需求交到可測結果？\u003c/td>\n\u003ctd>\u003ca href=\"#C20\">第二章：從失敗觀察到交件\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">單 Agent 開發循環\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上游已交件，整合能否開始？\u003c/td>\n\u003ctd>\u003ca href=\"#C31\">第三章：判讀每一條前置邊\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">協調與派工\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收到舊訊息，責任應交給誰？\u003c/td>\n\u003ctd>\u003ca href=\"#C44\">第四章：失聯後的安全接手\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">監督與交接\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>團隊更早回報，如何判斷是否更有效率？\u003c/td>\n\u003ctd>\u003ca href=\"#C52\">第五章：設計同條件對照\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">驗證、效率與重用\u003c/span>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "U-A、U-B、U-C", "passages": ["p-4"]}, {"number": 392, "type": "content", "title": "時間公式、持續自治與分工效率的證據缺口", "chapter": "99", "unit": "Z01", "body": "\u003cp data-passage=\"p-5\" data-block=\"7\">讀完仍有三條證據界線要帶走。使用者提過的個人時間公式缺少可確認的原文、符號與前提，書中的量測欄位屬教材設計。持續自治的設計能說明要保存哪些狀態，但使用者既有研究缺少一條能驗明人工介入情況、一路追到最終簽收的運行紀錄。單 Agent 與多 Agent 的效率優劣，也還缺同需求、同品質門檻下的比較試次。這三處適合提出下一個要收集的證據；現有材料無法替讀者預告結果。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-A\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-B\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-C\u003c/span>\u003c/p>", "layout": "prose", "note": "", "sources": "U-A、U-B、U-C", "passages": ["p-5"]}]};</script>
  <script>(() => {
'use strict';

const main = document.querySelector('main');
const bookTitle = document.title;
const { chapters, units } = BOOK;
const deck = BOOK.deck || [];
const byId = new Map(units.map(unit => [unit.id, unit]));
const chapterSlides = new Map(deck.filter(s => s.type === 'chapter').map(s => [s.chapter, s.number]));
const chapterCounts = new Map(chapters.map(ch => [ch.id, deck.filter(s => s.chapter === ch.id).length]));
const ledgerValues = new Map();
const contentsSlide = deck.find(s => s.type === 'contents')?.number;
let activeSlide;
const cores = units.filter(unit => unit.role === 'core');
const lessons = units.filter(unit => unit.role === 'lesson');
const trackNames = { A: '工作方法', B: '工具與環境', C: '完整工程實踐' };
const chapterNames = { '00':'導論', '01':'第一章', '02':'第二章', '03':'第三章', '04':'第四章', '05':'第五章', '99':'總結' };
const jumpRoutes = [
  ['C01', '判讀助手的執行紀錄'],
  ['02-A01', '交代一項可驗收的委託'],
  ['C22', '將工作分給多位 Agent'],
  ['C38', '處理執行中的規格歧異'],
  ['C47', '判斷交付品質與效率']
];
let pageKey;
let current;

function escapeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'})[ch]);
}

function title(unit) {
  const name = unit.title.trim();
  return escapeText(name.startsWith(unit.id + '　') || name.startsWith(unit.id + ' ') ? name.slice(unit.id.length).trim() : name);
}

function subtitle(item) {
  return item.subtitle ? '<p class="title-subtitle">' + escapeText(item.subtitle) + '</p>' : '';
}

function chapterTitle(chapter) {
  const label = chapterNames[chapter.id];
  return escapeText(chapter.title.replace(new RegExp('^' + label + '[\\s　｜|·：:—-]*'), '') || label);
}

function chapterLink(chapter) {
  return `#chapter-${chapter.id}`;
}

function chapterLabel(chapter) {
  if (chapter.title.startsWith(chapterNames[chapter.id] + "｜")) return escapeText(chapter.title);
  const name = chapterTitle(chapter);
  return name === chapterNames[chapter.id] ? name : chapterNames[chapter.id] + ' · ' + name;
}

function chapterUnits(chapter) {
  return cores.filter(unit => unit.chapter === chapter.id);
}

function childrenOf(id) {
  return lessons.filter(unit => unit.parent === id);
}

function unitLink(unit) {
  return `<a href="#${unit.id}"><small>${escapeText(unit.number)}</small><span>${title(unit)}</span></a>`;
}

function indexList(items) {
  return `<ul class="index-list">${items.map(unit => `<li>${unitLink(unit)}</li>`).join('')}</ul>`;
}

function chapterIndex(chapter) {
  const items = chapterUnits(chapter);
  if (chapter.id !== '02') return indexList(items);
  return Object.entries(trackNames).map(([track, name]) => `<section class="track">
    <h3>${track} 線　${name}</h3>${indexList(items.filter(unit => unit.track === track))}</section>`).join('');
}

function chapterRail() {
  return chapters.map(ch => `<a href="${chapterLink(ch)}">${chapterLabel(ch)}</a>`).join('');
}

function contents() {
  const routes = jumpRoutes.filter(([id]) => cores.some(unit => unit.id === id));
  return `<div class="catalogue"><div class="cover">
    <div class="cover-title"><p class="edition">五章自學教材</p><h1 tabindex="-1">多 Agent<br>軟體開發實踐指南</h1>
    <a class="start" href="#I01">從導論開始閱讀 <span aria-hidden="true">→</span></a></div>
    <nav class="routes" aria-label="讀者路徑"><h2>依手上的工作選讀</h2>
      ${routes.map(([id, label]) => `<a href="#${id}">${byId.get(id).number}　${label}<span aria-hidden="true">↗</span></a>`).join('')}</nav></div>
    <div class="catalogue-heading"><h2>全書目錄</h2><span>${cores.length} 個核心單元 · ${lessons.length} 篇深入閱讀</span></div>
    <div class="catalogue-grid"><aside><nav class="rail" aria-label="章節入口">${chapterRail()}</nav></aside><div>
    ${chapters.map(ch => `<section class="chapter-entry"><h3><a href="${chapterLink(ch)}">${chapterLabel(ch)} <span aria-hidden="true">→</span></a></h3>
      ${chapterIndex(ch)}</section>`).join('')}</div></div></div>`;
}

function lessonGroup(unit) {
  const children = childrenOf(unit.id);
  if (!children.length) return '';
  return `<section class="deeper"><h3>${escapeText(unit.number)}　${title(unit)} · 深入閱讀</h3>${indexList(children)}</section>`;
}

function chapterPage(chapter) {
  const items = chapterUnits(chapter);
  const notes = chapter.body ? `<details class="chapter-notes"><summary>本章閱讀提示</summary><div class="reading">${chapter.body}</div></details>` : '';
  return `<div class="spread"><aside><nav class="rail" aria-label="全書各章">${chapterRail()}</nav></aside><article>
    <header class="opening"><a href="#contents">← 全書目錄</a><p class="kicker">${chapterNames[chapter.id]}　/　${items.length} 個核心單元</p>
    <h1 tabindex="-1">${escapeText(chapter.title)}</h1><p>${escapeText(chapter.description)}</p></header>${notes}
    <h2>本章目錄</h2>${chapterIndex(chapter)}${items.map(lessonGroup).join('')}</article></div>`;
}

function sequence(unit) {
  return unit.role === 'lesson' ? childrenOf(unit.parent) : cores;
}

function turnLink(unit, direction) {
  const order = sequence(unit);
  const neighbor = order[order.indexOf(unit) + direction];
  if (!neighbor) return '';
  const label = direction < 0 ? '← 上一' : '下一';
  const kind = unit.role === 'lesson' ? '篇深入閱讀' : '個核心單元';
  return `<a class="turn" href="#${neighbor.id}"><small>${label}${kind}${direction > 0 ? ' →' : ''}</small>${escapeText(neighbor.number)}　${title(neighbor)}</a>`;
}

function unitPage(unit, ch) {
  const order = sequence(unit);
  const parent = cores.find(item => item.id === unit.parent);
  const group = parent ? '深入閱讀' : '全書核心單元';
  const progress = `${group} ${order.indexOf(unit) + 1} / ${order.length}`;
  const scope = unit.track ? ` · ${unit.track} 線 ${trackNames[unit.track]}` : '';
  const up = parent ? `<a href="#${parent.id}">返回親單元 · ${escapeText(parent.number)}　${title(parent)}</a>` : `<a href="${chapterLink(ch)}">返回本章目錄</a>`;
  return `<div class="spread"><aside><div class="rail"><a href="${chapterLink(ch)}">← 本章目錄</a><div class="local-outline"></div></div></aside>
    <article><header class="opening"><div class="breadcrumbs"><a href="#contents">全書目錄</a> ／ <a href="${chapterLink(ch)}">${chapterLabel(ch)}</a>${scope} ／ <span aria-current="page">${escapeText(unit.number)}</span></div>
    <div class="kicker"><small>${escapeText(unit.number)}</small><span>${progress}</span></div><h1 tabindex="-1">${title(unit)}</h1>${subtitle(unit)}
    ${unit.lead ? `<p class="lead">${escapeText(unit.lead)}</p>` : ''}${parent ? `<p>${up}</p>` : ''}</header>
    <div class="reading" id="unit-body">${unit.body}</div>${lessonGroup(unit)}
    <footer><div class="turns">${turnLink(unit, -1)}${turnLink(unit, 1)}</div>${up}<p class="source-id">資料 ID　${unit.id}</p></footer></article></div>`;
}

function mountUnit(unit) {
  const body = main.querySelector('#unit-body');
  const headings = [...body.querySelectorAll('[data-section],h2,h3,h4,h5,h6')];
  const links = headings.map((heading, i) => {
    heading.dataset.outline = 'section-' + (i + 1);
    if (!heading.id) heading.id = heading.dataset.outline;
    heading.tabIndex = -1;
    return `<a href="#${unit.id}/${heading.dataset.outline}">${escapeText(heading.textContent)}</a>`;
  }).join('');
  if (links) {
    const nav = `<nav aria-label="本頁段落">${links}</nav>`;
    main.querySelector('.local-outline').innerHTML = `<p class="rail-title">本頁段落</p>${nav}`;
    main.querySelector('.opening').insertAdjacentHTML('afterend', `<details class="compact-nav"><summary>本頁段落</summary>${nav}</details>`);
  }
  mountActivities(body, unit);
}

function mountActivities(body, unit) {
  if (unit.id === 'C52-02') body.querySelectorAll('textarea[aria-label]').forEach(field => {
    const key = field.getAttribute('aria-label');
    if (ledgerValues.has(key)) field.value = ledgerValues.get(key);
    field.addEventListener('input', () => ledgerValues.set(key, field.value));
  });
  if (unit.id === 'C03-02' && body.querySelector('#paths')) mountPaths(body);
  if (unit.id === 'C31-03' && body.querySelector('#diagnose')) {
    const source = document.createElement('template');
    source.innerHTML = unit.body;
    mountDiagnosis(body, source.content);
  }
  if (unit.id === '02-A03-04' && body.querySelector('#plan-trace')) mountPlan(body.querySelector('#plan-trace'));
}

function fitTables() {
  main.querySelectorAll('.reading table').forEach(table => {
    if (table.closest('.table-scroll')) return;
    const region = document.createElement('div');
    region.className = 'table-scroll';
    region.tabIndex = 0;
    region.setAttribute('role','region');
    region.setAttribute('aria-label', table.caption?.textContent || (table.querySelector('th')?.textContent || '') + '表格');
    table.before(region);
    region.append(table);
  });
}

function render() {
  const [id, section = '', ...extra] = location.hash.slice(1).split('/');
  if (deck.length && (!id || id === 'deck')) {
    const number = /^\d+$/.test(section) ? Math.max(1, Math.min(deck.length, Number(section))) : 1;
    if (id && location.hash !== '#deck/' + number) history.replaceState(null, '', '#deck/' + number);
    renderSlide(deck[number - 1]);
    return;
  }
  const unit = units.find(row => row.id === id.toUpperCase());
  const chapter = chapters.find(ch => chapterLink(ch) === '#' + id);
  const key = unit?.id || (chapter ? id : 'contents');
  if (activeSlide && !history.state?.returnSlide) {
    history.replaceState({ ...history.state, returnSlide:activeSlide.number }, '');
  }
  if (activeSlide && document.fullscreenElement) exitFullscreen();
  activeSlide = null;
  document.body.classList.remove('in-deck');
  document.querySelector('#to-deck').href = '#deck/' + (history.state?.returnSlide || unit?.firstSlide || chapterSlides.get(chapter?.id) || contentsSlide || 1);
  if (pageKey !== key) {
    current = unit;
    pageKey = key;
    if (unit) {
      main.innerHTML = unitPage(unit, chapters.find(ch => ch.id === unit.chapter));
      mountUnit(unit);
    } else {
      main.innerHTML = chapter ? chapterPage(chapter) : contents();
    }
    fitTables();
    document.title = key === 'contents' ? bookTitle : main.querySelector('h1').textContent + ' · ' + bookTitle;
  }
  let target;
  if (unit && !extra.length) {
    if (/^section-\d+$/.test(section)) target = main.querySelector(`[data-outline="${section}"]`);
    if (/^p-\d+$/.test(section)) target = main.querySelector(`[data-passage="${section}"]`);
  }
  // Replace invalid fragments in place so browser Back reaches the prior valid page.
  const canonical = key + (target ? '/' + section : '');
  if (id && location.hash !== '#' + canonical) history.replaceState(null, '', '#' + canonical);
  main.querySelectorAll('.compact-nav[open]').forEach(el => el.open = false);
  if (target) {
    for (let ancestor = target.parentElement; ancestor; ancestor = ancestor.parentElement) {
      if (ancestor.tagName === 'DETAILS') ancestor.open = true;
    }
    target.tabIndex = -1;
    target.focus({preventScroll:true});
    target.scrollIntoView({block:'start'});
  } else {
    main.querySelector('h1').focus({preventScroll:true});
    window.scrollTo(0, 0);
  }
}

document.querySelector('.skip').addEventListener('click', event => {
  event.preventDefault();
  const target = main.querySelector('#unit-body') || main.querySelector('article') || main;
  target.tabIndex = -1;
  target.focus({preventScroll:true});
  target.scrollIntoView();
});

document.addEventListener('click', event => {
  const link = event.target.closest('a[href^="#"]');
  if (link && link.hash === location.hash && !event.defaultPrevented && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey) {
    event.preventDefault();
    render();
  }
});

document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.isComposing || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      event.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  if (activeSlide) {
    if (event.key === 'Escape') {
      event.preventDefault();
      if (document.fullscreenElement) exitFullscreen();
      else location.hash = readerRoute(activeSlide);
    } else if (['ArrowLeft','ArrowRight','PageUp','PageDown'].includes(event.key) &&
        !event.target.closest('.slide-body button,summary,pre,.table-scroll,.ledger')) {
      event.preventDefault();
      advance(['ArrowLeft','PageUp'].includes(event.key) ? -1 : 1);
    }
    return;
  }
  if (event.key === 'Escape' && pageKey !== 'contents') {
    event.preventDefault();
    location.hash = 'contents';
    return;
  }
  if (!current || event.target.closest('button,summary,.table-scroll,pre')) return;
  const direction = { ArrowLeft:-1, ArrowRight:1 }[event.key];
  if (!direction) return;
  const order = sequence(current);
  const neighbor = order[order.indexOf(current) + direction];
  if (neighbor) {
    event.preventDefault();
    location.hash = neighbor.id;
  }
});

function buttons(labels, action) {
  return labels.map((label, index) => `<button type="button" data-${action}="${index}">${label}</button>`).join('');
}

function mountPaths(body) {
  const panel = body.querySelector('#paths');
  const start = '請求尚未送出';
  const outcomes = ['轉送前拒絕，工具未啟動。', 'Shell 已啟動，比對尚未發生。',
    '期望 [A]，實得 [A,B]。', 'API 回 [A]；Browser 仍顯示 [A,B]，差異出在畫面路徑。'];
  panel.innerHTML = `<h3>沿故障路徑讀紀錄</h3><div class="controls">${buttons(['寫入被拒','缺 fixture','斷言失敗','API 通過'],'path')}
    <button data-reset>重設</button></div><p role="status">${start}</p>`;
  panel.onclick = event => {
    const button = event.target.closest('button');
    if (!button) return;
    panel.querySelectorAll('[data-path]').forEach(el => el.setAttribute('aria-pressed', el === button));
    panel.querySelector('[role=status]').textContent = outcomes[button.dataset.path] || start;
  };
}

function mountDiagnosis(body, source) {
  const panel = body.querySelector('#diagnose');
  const caseTable = [...source.querySelectorAll('table')].find(table =>
    table.querySelector('th')?.textContent.trim() === '清除時前端送了什麼');
  if (!caseTable) return;
  const observations = [...caseTable.tBodies[0].rows].map(row => [...row.cells].map(cell => cell.textContent));
  const responsible = ['F2','F1','F2'];
  let active = -1;
  panel.innerHTML = `<h3>清除篩選後，畫面只見 A</h3>
    <p>共同起點 B0，單標籤約定 K1。F3 使用 api-a 與 ui-a，先選工作，再清除。</p>
    <button data-open>查看本次請求與回應</button>
    <div data-cases hidden class="controls">${buttons(['觀察一','觀察二','觀察三'],'case')}</div>
    <dl hidden></dl><div data-tickets hidden class="controls">${buttons(['F1 後端','F2 前端'],'ticket')}</div>
    <p role="status"></p><div class="controls"><button hidden data-dispatch>看重派</button>
    <button hidden data-late>d1 晚到</button><button hidden data-new>d2 交 ui-b</button><button hidden data-reset>重設</button></div>`;
  const find = selector => panel.querySelector(selector);
  const show = (key, visible = true) => { find('[data-' + key + ']').hidden = !visible; };
  const tell = message => { find('[role=status]').textContent = message; };
  function clearDispatch() {
    ['dispatch','late','new'].forEach(key => show(key, false));
  }
  panel.onclick = event => {
    const button = event.target.closest('button');
    if (!button || button.disabled || !button.getClientRects().length) return;
    const data = button.dataset;
    if ('open' in data) {
      show('open', false); show('cases'); show('reset'); find('[data-case]').focus();
    } else if ('case' in data) {
      active = Number(data.case);
      panel.querySelectorAll('[data-case]').forEach(el => el.setAttribute('aria-pressed', el === button));
      find('dl').innerHTML = ['前端請求','後端回應','畫面'].map((label,i) =>
        `<div><dt>${label}</dt><dd>${escapeText(observations[active][i])}</dd></div>`).join('');
      find('dl').hidden = false; show('tickets'); clearDispatch(); tell('哪一張票負責第一個偏差？');
    } else if ('ticket' in data) {
      clearDispatch();
      const correct = ['F1','F2'][Number(data.ticket)] === responsible[active];
      tell((correct ? '判讀正確。' : '再查第一個偏差，可重新選票。') + observations[active][3]);
      show('dispatch', correct);
    } else if ('dispatch' in data) {
      const api = responsible[active] === 'F1';
      panel.querySelectorAll('[data-case],[data-ticket],[data-dispatch]').forEach(el => { el.disabled = true; });
      tell(api ? 'F1 的 API 格待補；保留有效的 UI 提交，待新 API 到齊再重驗。' :
        'F2 的 UI 格待補；撤回 ui-a，保存第一次失敗。api-a 仍有效，F3 等候新提交。');
      show('late', active === 0); show('new', false);
      find(active === 0 ? '[data-late]' : '[data-reset]').focus();
    } else if ('late' in data) {
      button.disabled = true;
      tell('d1 的通過仍附 ui-a，歸入歷史紀錄。api-a 仍有效，UI 格仍待補，F3 無法放行。');
      show('new'); find('[data-new]').focus();
    } else if ('new' in data) {
      button.disabled = true;
      tell('d2 交 ui-b，局部測試顯示清除已省略 tag。重核 B0、K1、派工及局部證據後，F3 的有效配對為 api-a + ui-b。以此配對重播故障，再做回歸與簽收。');
      find('[data-reset]').focus();
    } else if ('reset' in data) {
      mountDiagnosis(body, source); panel.querySelector('[data-open]').focus();
    }
  };
}


function mountPlan(panel) {
  const steps = ['整理已知條件', '列出待確認的風險', '編製行前確認單'];
  const outputs = ['採集地點待確認', '出發前向公會核對路線', '出發前請公會確認採集地點，並核對前往該地的路線。'];
  panel.innerHTML = `<h3>採集委託的三步計畫</h3><p>依 U04 規格推演三種輸出。選擇路徑後，可展開成功步驟查看內容。</p><div class="controls">
    ${buttons(['完整路徑','第二步空白','第二步 1,801 字元'],'trace')}<button type="button" data-reset>重設</button>
    </div><p role="status"></p><ol class="trace-results"></ol><div class="assembled"></div>`;
  function display(path) {
    const ready = path === -1;
    const full = path === 0;
    const failure = path === 1 ? '去空白後為空' : '1,801 字元超過 1,800 字元上限';
    panel.querySelectorAll('[data-trace]').forEach(button => button.setAttribute('aria-pressed', Number(button.dataset.trace) === path));
    panel.querySelector('[role=status]').textContent = ready ? '三步待執行' :
      full ? '三步 done，共 4 次模型呼叫（含 Planner）。' : '規劃未完成，共 3 次模型呼叫（含 Planner）。';
    panel.querySelector('ol').innerHTML = steps.map((step, i) => {
      const done = !ready && (full || i === 0);
      if (done) {
        const prior = i ? '讀入先前輸出：' + outputs.slice(0,i).join('；') : '尚無前步結果。';
        return `<li><details${full ? '' : ' open'}><summary>${step} · done</summary><p>${prior}</p><p>留下的輸出：${outputs[i]}</p></details></li>`;
      }
      return `<li>${step} · ${ready ? '待執行' : i === 1 ? 'failed（' + failure + '）' : '未呼叫'}</li>`;
    }).join('');
    panel.querySelector('.assembled').innerHTML = full ? `<details><summary>讀合成稿</summary><h4>冒險規劃：準備採集前的確認單</h4>
      ${steps.map((step, i) => `<p><b>${step}</b><br>${outputs[i]}</p>`).join('')}<p>這是事前規劃，缺少的世界細節需向公會確認。</p></details>` : '';
  }
  panel.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (button) display('reset' in button.dataset ? -1 : Number(button.dataset.trace));
  });
  display(-1);
}

function readerRoute(slide) {
  if (slide.unit) {
    const passage = main.querySelector('.slide-body [data-passage]')?.dataset.passage;
    return '#' + slide.unit + (passage ? '/' + passage : '');
  }
  return slide.chapter ? '#chapter-' + slide.chapter : '#contents';
}

function advance(offset) {
  const next = deck[activeSlide.number - 1 + offset];
  if (next) location.hash = 'deck/' + next.number;
}

function slideMarkup(slide) {
  const chapter = chapters.find(ch => ch.id === slide.chapter);
  const unit = byId.get(slide.unit);
  const pageTitle = escapeText(slide.title);
  let contents;
  if (slide.type === 'cover') {
    contents = `<div class="front-copy"><p class="slide-eyebrow">五章自學教材</p>
      <h1 tabindex="-1">${pageTitle}</h1><p class="front-route"><a href="#deck/${contentsSlide}">展開簡報目錄　→</a></p></div>
      <div class="book-art" aria-hidden="true"><i></i><i></i><i></i></div>`;
  } else if (slide.type === 'contents') {
    contents = `<header><h1 tabindex="-1">${pageTitle}</h1></header><nav class="deck-index slide-body" aria-label="投影片各章">
      ${chapters.map(ch => `<a href="#deck/${chapterSlides.get(ch.id)}"><b>${chapterNames[ch.id]}</b>
      ${ch.title === chapterNames[ch.id] ? '' : `<span>${chapterTitle(ch)}</span>`}<i aria-hidden="true">↗</i></a>`).join('')}</nav>`;
  } else if (slide.type === 'chapter') {
    contents = `<div class="chapter-copy">${chapter.title !== chapterNames[chapter.id] ? `<p class="slide-eyebrow">${chapterNames[chapter.id]}</p>` : ''}
      <h1 tabindex="-1">${escapeText(chapter.title)}</h1><p class="chapter-intro">${escapeText(chapter.description)}</p></div>`;
  } else {
    contents = `<header><p class="slide-eyebrow">${chapterNames[slide.chapter]}　／　${escapeText(unit.number)}　${title(unit)}</p>
      <h1 tabindex="-1">${pageTitle}</h1>${subtitle(slide)}</header><div class="slide-body" role="region" aria-label="投影片內容" tabindex="0">${slide.body}</div>`;
  }
  const start = chapterSlides.get(slide.chapter);
  const count = chapterCounts.get(slide.chapter);
  const progress = start ? `章內 ${slide.number - start + 1} / ${count}` : '';
  return `<article class="slide-sheet type-${slide.type} layout-${slide.layout}" data-slide="${slide.number}">${contents}
    <div class="slide-folio"><span>${[slide.note,slide.sources && '來源 ' + slide.sources].filter(Boolean).map(escapeText).join('　·　')}</span>
      <span>${unit ? `單元 ${slide.number - unit.firstSlide + 1} / ${unit.lastSlide - unit.firstSlide + 1}　·　` : ''}${progress}</span>
      <b>${String(slide.number).padStart(2,'0')}</b></div></article>`;
}

function reportFullscreen(message) {
  const status = document.querySelector('#deck-notice');
  if (status) status.textContent = message;
}

async function exitFullscreen() {
  try { await document.exitFullscreen(); }
  catch { reportFullscreen('請使用瀏覽器的全螢幕控制或 Esc 離開。'); }
}

function syncFullscreen() {
  const button = main.querySelector('#fullscreen');
  if (!button) return;
  button.textContent = document.fullscreenElement ? '離開全螢幕' : '全螢幕';
  button.setAttribute('aria-pressed', String(Boolean(document.fullscreenElement)));
}

function setupPlayer() {
  main.replaceChildren(document.querySelector('#player').content.cloneNode(true));
  main.querySelector('#slide-prev').onclick = () => advance(-1);
  main.querySelector('#slide-next').onclick = () => advance(1);
  const chapterMenu = main.querySelector('#jump-chapter');
  const unitMenu = main.querySelector('#jump-unit');
  chapterMenu.innerHTML = '<option value="" disabled>選擇章節</option><option value="1">封面</option>' + `<option value="${contentsSlide}">目錄</option>` +
    chapters.map(ch => `<option value="${chapterSlides.get(ch.id)}">${chapterLabel(ch)}</option>`).join('');
  unitMenu.innerHTML = '<option value="" disabled>選擇單元</option>' + chapters.map(ch => `<optgroup label="${chapterLabel(ch)}">
    ${units.filter(u => u.chapter === ch.id).map(u => `<option value="${u.firstSlide}">${escapeText(u.number)}　${title(u)}</option>`).join('')}</optgroup>`).join('');
  [chapterMenu,unitMenu].forEach(menu => menu.onchange = () => {
    if (menu.value) location.hash = 'deck/' + menu.value;
  });
  main.querySelector('#fullscreen').onclick = async () => {
    if (document.fullscreenElement) return exitFullscreen();
    try {
      await document.documentElement.requestFullscreen();
      reportFullscreen('');
    } catch {
      reportFullscreen('此環境無法開啟全螢幕，可使用瀏覽器的全螢幕功能。');
    }
  };
  syncFullscreen();
}

function renderSlide(slide) {
  if (activeSlide === slide) return;
  const entering = !activeSlide;
  current = null;
  pageKey = 'deck';
  activeSlide = slide;
  document.body.classList.add('in-deck');
  if (entering) setupPlayer();
  const stage = main.querySelector('#slide');
  const focusHeading = entering || stage.contains(document.activeElement);
  stage.innerHTML = slideMarkup(slide);
  const unit = byId.get(slide.unit);
  if (unit) mountActivities(stage, unit);
  main.querySelector('#jump-chapter').value = unit ? '' : slide.number;
  main.querySelector('#jump-unit').value = slide.number === unit?.firstSlide ? unit.firstSlide : '';
  for (const [selector, step, label] of [['#slide-prev', -1, '上一張'], ['#slide-next', 1, '下一張']]) {
    const button = main.querySelector(selector);
    const neighbor = deck[slide.number - 1 + step];
    button.disabled = !neighbor;
    button.title = neighbor ? label + ' · ' + neighbor.title : label;
    button.setAttribute('aria-label', button.title);
  }
  main.querySelector('#slide-counter').textContent = `第 ${slide.number} / ${deck.length} 張`;
  main.querySelector('#to-reader').href = readerRoute(slide);
  document.title = slide.title + ' · ' + bookTitle;
  fitSlide();
  if (focusHeading || document.activeElement === document.body) stage.querySelector('h1').focus({preventScroll:true});
}

function fitSlide() {
  const body = main.querySelector('.type-content .slide-body');
  if (!body) return;
  body.classList.remove('compact');
  if (body.scrollHeight > body.clientHeight + 1) body.classList.add('compact');
}

window.addEventListener('resize', fitSlide);

window.addEventListener('beforeprint', () => {
  if (!activeSlide || document.querySelector('#printed-deck')) return;
  const printed = document.createElement('div');
  printed.id = 'printed-deck';
  printed.innerHTML = deck.map(slideMarkup).join('');
  printed.querySelectorAll('.layout-practice, .slide-sheet:has(textarea)').forEach(sheet => {
    const unit = byId.get(deck[Number(sheet.dataset.slide) - 1].unit);
    mountActivities(sheet, unit);
  });
  printed.querySelectorAll('[id]').forEach(item => item.removeAttribute('id'));
  printed.querySelectorAll('details').forEach(item => item.open = !item.closest('figure'));
  document.body.append(printed);
});
window.addEventListener('afterprint', () => document.querySelector('#printed-deck')?.remove());
document.addEventListener('fullscreenchange', syncFullscreen);
window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
</html>
