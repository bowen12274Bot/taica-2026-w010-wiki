用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 234, "type": "content", "title": "整合退修時保留失敗配對，在原票登記新派工", "chapter": "03", "unit": "C31-03", "body": "\u003cp data-block=\"14\">沿表中第一種情況繼續。後端交來的程式版本暫稱 \u003ccode>api-a\u003c/code>，前端第一次交來的版本稱 \u003ccode>ui-a\u003c/code>。整合者把 \u003ccode>api-a + ui-a\u003c/code> 這個組合和失敗紀錄留在 F3，協調者將「按清除還送 work」的請求交回前端。前端仍在完成同一張 F2 票，但現在要能分辨是哪一次執行交回的結果。一次具體派工叫 \u003cstrong>Dispatch\u003c/strong>；把原來那次叫 \u003cstrong>d1\u003c/strong>，新派的修正叫 \u003cstrong>d2\u003c/strong>。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 235, "type": "content", "title": "Dispatch 過期回報的歸檔與有效版本配對", "chapter": "03", "unit": "C31-03", "body": "\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"接著發生的事表格\" data-block=\"15\">\u003ctable class=\"cols-4\">\u003cthead>\u003ctr>\u003cth scope=\"col\">接著發生的事\u003c/th>\u003cth scope=\"col\">整合者手上的後端版本\u003c/th>\u003cth scope=\"col\">整合者手上的前端版本\u003c/th>\u003cth scope=\"col\">此刻的處置\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"接著發生的事\">F2 退修並派出 d2\u003c/td>\u003ctd data-label=\"整合者手上的後端版本\">api-a 仍有效\u003c/td>\u003ctd data-label=\"整合者手上的前端版本\">原 ui-a 已退回，待補\u003c/td>\u003ctd data-label=\"此刻的處置\">撤回原配對的放行，保存第一次失敗，不急著重跑。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"接著發生的事\">d1 這才傳來「通過」，附的仍是 ui-a\u003c/td>\u003ctd data-label=\"整合者手上的後端版本\">api-a\u003c/td>\u003ctd data-label=\"整合者手上的前端版本\">仍待補\u003c/td>\u003ctd data-label=\"此刻的處置\">將回報歸入 d1 的歷史。它無法證明這次的修正已經完成。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"接著發生的事\">d2 交來新版本 ui-b，附上清除請求已省略 tag 的局部測試\u003c/td>\u003ctd data-label=\"整合者手上的後端版本\">重核 api-a\u003c/td>\u003ctd data-label=\"整合者手上的前端版本\">重核 ui-b\u003c/td>\u003ctd data-label=\"此刻的處置\">重新確認兩份提交的起點、約定、有效派工及局部證據，再登記新的配對。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": [], "subtitle": "d1 遲到、d2 補件，哪些版本可重新配對？"}, {"number": 236, "type": "content", "title": "判讀練習：遲到的通過通知能補前端缺件嗎？", "chapter": "03", "unit": "C31-03", "body": "\u003cp data-block=\"16\">也可以遮住處置欄再讀一次：如果只有 d1 的通知到了，前端那一格該填什麼？把通知上的版本和現在等候的派工對起來，就知道那一格還得留空。\u003c/p>\n\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"接著發生的事表格\" data-block=\"15\" data-rows=\"2\">\u003ctable class=\"cols-4\">\u003cthead>\u003ctr>\u003cth scope=\"col\">接著發生的事\u003c/th>\u003cth scope=\"col\">整合者手上的後端版本\u003c/th>\u003cth scope=\"col\">整合者手上的前端版本\u003c/th>\u003cth scope=\"col\">此刻的處置\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"接著發生的事\">d1 這才傳來「通過」，附的仍是 ui-a\u003c/td>\u003ctd data-label=\"整合者手上的後端版本\">api-a\u003c/td>\u003ctd data-label=\"整合者手上的前端版本\">仍待補\u003c/td>\u003ctd data-label=\"此刻的處置\">將回報歸入 d1 的歷史。它無法證明這次的修正已經完成。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 237, "type": "content", "title": "以新版本配對重播故障、做回歸再送簽收", "chapter": "03", "unit": "C31-03", "body": "\u003cp data-block=\"17\">整合者用 \u003ccode>api-a + ui-b\u003c/code> 先重播那個曾經失敗的操作，查看買牛奶是否回來；再測選工作仍只見 A、未知標籤仍是空清單，並重跑既有測試，檢查這次修改有沒有弄壞原本正常的功能。這就是回歸測試。如果退回的是後端 F1，就改取新接受的 API 提交，搭配仍然有效的 UI 提交。若修正連 API、UI 都改了，兩份新提交都要重新核對。最後由具簽收權的人依共同版本的證據決定接受，\u003cstrong>獲接受的新程式提交才記為 B1\u003c/strong>。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 238, "type": "content", "title": "區分退修重驗的時序與需求待裁決的阻塞", "chapter": "03", "unit": "C31-03", "body": "\u003cp data-block=\"18\">這串退修事件是時間上的先後：F3 發現問題，F2 開了新嘗試，F3 再驗一次。畫依賴圖時，前端與後端的產物仍然都流向整合票；把退修畫成 F2、F3 互相等對方完成，反而會讓兩張票都不能開工。\u003c/p>\n\u003cp data-block=\"19\">還有一種情形需要停在產品決定上。若有人提議同時勾「工作」和「生活」，究竟應列出符合\u003cstrong>任一項\u003c/strong>的兩件待辦，還是只列出\u003cstrong>兩項都有\u003c/strong>的待辦，因而在這份資料中顯示空清單？K1 只核准單一標籤，這兩種結果都無法從既有約定選出。協調者應將受影響的票記為「待裁決」（BLOCKED），寫下兩種預期和有權決定的人；收到決議後更新對應約定，再重查前置條件。多派一次工作，不能替使用者選擇產品行為。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 239, "type": "content", "title": "整合診斷練習：判讀清除後少一筆的責任與重驗條件", "chapter": "03", "unit": "C31-03", "body": "\u003csection id=\"diagnose\" class=\"practice\" data-block=\"20\">\u003c/section>", "layout": "practice", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 240, "type": "content", "title": "用兩筆待辦比較多標籤篩選的 OR 與 AND", "chapter": "03", "unit": "C31-04", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">第一輪的待辦篩選還沒簽收。設計畫面的開發者提議讓使用者一次選「工作」和「居家」。清單裡，回覆客戶（A）只有 work 標籤，買牛奶（B）只有 home 標籤。同樣兩個勾選動作，有兩種說得通的結果。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"產品規則候選表格\" data-passage=\"p-2\" data-block=\"2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">產品規則候選\u003c/th>\n\u003cth scope=\"col\">逐件套用在這份資料\u003c/th>\n\u003cth scope=\"col\">預期畫面 ID\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>符合任一標籤（OR）\u003c/td>\n\u003ctd>A 符合 work，B 符合 home，各收一件\u003c/td>\n\u003ctd>[A,B]\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同時具有兩個標籤（AND）\u003c/td>\n\u003ctd>A 缺 home，B 缺 work，兩件都排除\u003c/td>\n\u003ctd>[]\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": ["p-1", "p-2"]}, {"number": 241, "type": "content", "title": "多選語義待裁決時，只阻擋相依工作", "chapter": "03", "unit": "C31-04", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">兩位開發者可以各寫一個測試，測出各自期待的結果。再執行幾遍，仍然選不出產品該採用哪條規則。這件事發生在首輪簽收\u003cstrong>之前\u003c/strong>；它是缺決策的分支，與已知驗收值但實作違約的退修情形分開處理。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"5\">團隊把首輪核准的單標籤契約稱為 K1。第一輪契約票的全號是 R1-F0，簡稱 F0；F1 提供 API，F2 提供 UI，F3 需要兩份版本才能整合。F2 提出多選時，協調者把依賴該語義的工作標成 BLOCKED（待裁決），登記待決問題、受影響的票、所需決議與批准者。未受影響且已有授權的工作可繼續。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": ["p-3", "p-5"]}, {"number": 242, "type": "content", "title": "產品裁決入案後，仍須逐票核對有效產物", "chapter": "03", "unit": "C31-04", "body": "\u003cp data-passage=\"p-6\" data-block=\"6\">假設產品負責人決定首輪維持 K1，多選留待下一輪。沿時間讀：BLOCKED → 留存具權者可定位的裁定 → 按 K1 重查逐票的上游、版本及整合的兩個輸入格。即使新 Worker 到場或裁定已到，缺 UI 提交的 F3 仍不能開工。要補的分別是決策與有效產物；若拿到的是一個違反已核定契約的技術反例，則要回到責任票，取修正產物、重驗，再重查受影響的依賴。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": ["p-6"]}, {"number": 243, "type": "content", "title": "首輪簽收後，另立契約核准多選語義", "chapter": "03", "unit": "C31-04", "body": "\u003cp data-passage=\"p-7\" data-block=\"7\">等第一輪的整合真的通過並被簽收，才把已接受的版本記為 B1。第二輪從 B1 另開契約票 R2-F0，核定 AND／OR 與相應樣例。跨輪保存票號和契約版本，就能從每項測試追到當時的規則；第一輪的 accepted 只適用於首輪。\u003c/p>\n\u003cp data-passage=\"p-8\" data-block=\"8\">T06 與上述產品裁定、狀態名均屬合成教學情境。Orca P13 的實驗性文件記載待決工作可被擋下，產品語義仍須具權者決定。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": ["p-7", "p-8"]}, {"number": 244, "type": "content", "title": "人工派工先指定唯一承辦者與回報位置", "chapter": "03", "unit": "C32", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 只要有兩張可開始的票，就會出現一個實際問題：誰確定每張只有一個有效的承辦者？用人工派工時，人可以直接交付，不必先建自動調度器。先確認已批准的交付契約，在任務記錄寫下票號、目前狀態與責任人，再把目標、基準、工作目錄、權限、預期及回報位置一併交出去。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、P16、S02", "passages": ["p-1"]}, {"number": 245, "type": "content", "title": "人工派工由指定人員維護有效任務狀態", "chapter": "03", "unit": "C32", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 待辦網站的資料介面票 F1 交給 API Worker，附起點 B0、wt-api、定版契約與三條查詢預期；畫面票 F2 交給 UI Worker，附同一基準、wt-ui、模擬回應與選取、清除的操作預期。兩人都要回報提交及未測項。只貼一句「把篩選做好」會讓兩位各選一個起點，之後即使收到兩條完成訊息，也無法知道能否合在一起。\u003c/p>\n\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>自我驗收\u003c/strong>　誰負責維護目前有效的 Task 狀態？在人工路線，應由指定的派工人或明確移交給的狀態維護者登記；每次重派都讓原票可查到當前有效的嘗試。不能讓兩位執行者各自把自己的看板當權威。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、P16、S02", "passages": ["p-2", "p-3"]}, {"number": 246, "type": "content", "title": "協調者從 ready 選票、登記 Dispatch，再依回件重排", "chapter": "03", "unit": "C32", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把派工責任委給 Coordinator 時，仍需指定它能派哪些工作、遇到什麼需回報人類。協調者先查前置，從 ready 票選出可開工項，確認 owner 有權且工作區可用，登記本次 Dispatch，送出工作包。等收到回報，先比對票與有效嘗試、再查產物，更新狀態後重算哪張票已能開始。發現產品語義未決時，保存問題與受影響票，等具權者裁決。每一輪的輸出既是當前記錄，也是下一輪的輸入。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、P16、S02", "passages": ["p-4"]}, {"number": 247, "type": "content", "title": "派出後先記待收，核件、整合與簽收後才結案", "chapter": "03", "unit": "C32", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cstrong>自我驗收\u003c/strong>　派出任務後 Coordinator 可以直接宣稱結束嗎？若 F1 還沒回件，就只能留下「已派、待收」與恢復入口。待審核產物、確認整合及權責範圍內的簽收後，才有結案依據。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13 記述收件匣與派工識別，P16 描述管理者收回局部結果；兩者都無法證明本例曾無人監督地跑完。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、P16、S02", "passages": ["p-5"]}, {"number": 248, "type": "content", "title": "審查程式差異前，先核對有效派工與起點", "chapter": "03", "unit": "C33", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把「這是誰交的」和「它證明了什麼」分兩步檢查。接到回報先在票上找當前有效的派工嘗試與起點，再查該嘗試交來的版本、修改差異及其測試。否則可能花時間審查一個已撤換的版本，或把在別的版本上跑的測試算給它。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 設 API 票 F1 已從 d1 重派為 d2。假如遲到的 d1 帶著 diff 並宣稱成功，先把附件存到 d1 的歷史項，保持 d2 的狀態。收到 d2 時按下列交件單核對；沒有執行過的欄位留待填，不能拿題目的預期充當輸出。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S04、S03", "passages": ["p-1", "p-2"]}, {"number": 249, "type": "content", "title": "用交件單核對提交、測試輸出、失敗與未測項", "chapter": "03", "unit": "C33", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"F1 局部交件單表格\" data-passage=\"p-3\" data-block=\"4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">F1 局部交件單\u003c/th>\n\u003cth scope=\"col\">收件時實際查什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Task F1、有效 Dispatch ___、base B0 的實際提交 ___\u003c/td>\n\u003ctd>與權威任務記錄核對票、嘗試及起點\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>產物提交 ___、diff 定位 ___\u003c/td>\n\u003ctd>查看從起點到提交的變更，有無跨出票的限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>命令 ___、環境 ___、結束碼 ___、輸出位置 ___\u003c/td>\n\u003ctd>在該版本對讀單標籤、未知值及省略的實際回應與預期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已知失敗 ___、未測 ___、阻塞與下一位接手者 ___\u003c/td>\n\u003ctd>只測了介面時，把真實畫面串接留給整合者\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P13、S04、S03", "passages": ["p-3"]}, {"number": 250, "type": "content", "title": "用交件摘要追查原始提交與測試輸出", "chapter": "03", "unit": "C33", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者 U07 偏好用文件交接。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> S03 對 U01、U08、U09 的歷史研究只支持摘要層次的資訊與管理背景。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 給協調者一份短摘要，保留可追查的原始輸出定位，是這裡採用的編輯設計。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cstrong>自我驗收\u003c/strong>　沒有 commit 的摘要能否支持程式已改好？這張票要求可取用的程式版本，摘要只能讓人知道有人聲稱完成，應請承辦者補產物。哪一次回報應被 Coordinator 接受？d2 是可進入本票審核的嘗試；還要核對基準、diff 和測試才能接受局部交件。舊嘗試附有差異，也不能覆蓋新指派。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S04、S03", "passages": ["p-4", "p-5"]}, {"number": 251, "type": "content", "title": "在整合工作樹核對基線並記下前後端提交", "chapter": "03", "unit": "C34", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在各自的目錄中，伺服器能回傳正確資料，畫面也能處理模擬回應；真實使用者走的卻是一條連起來的路。整合者要能指出「這個畫面配上哪個伺服器、在什麼起點上驗過」。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P14 支持 Git 的多工作樹機制；哪個版本具有接受成果的權威，取決於專案記下的決定。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 對照兩張票登記的起始提交 B0、核准的介面契約與樣本版本。把 wt-api、wt-ui 各自交出的輸入提交逐一填進整合票 F3，在面向權威分支 main 的整合目錄 wt-int 核對起點，再套入兩份變更並記錄整合提交。若有人從別的起點修改、缺少其中一份提交或擅改契約，先退回釐清。這樣即使兩個分支之後繼續前進，也知道本次實際驗的是哪個組合。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、P17、S04", "passages": ["p-1", "p-2"]}, {"number": 252, "type": "content", "title": "用同一個整合提交重驗選取、清除與未知值", "chapter": "03", "unit": "C34", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>自我驗收\u003c/strong>　兩個局部測試全綠能否直接採納 B1？局部各自通過只讓兩份產物具備送整合的條件。F3 還缺共同版本的行為證據，也缺具權者的簽收。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在整合提交啟動真實的 API 和 UI，使用 A(work)、B(home) 這組資料。選 work，查畫面送出 tag=work，伺服器只回 A，畫面只見 A；清除，查請求確實省略 tag，回應及畫面都恢復 A、B；再送未知標籤，查真實服務回 200 與空清單，UI 能顯示空結果。若畫面使用模擬服務，即使清單正確，也沒有觀察到這個整合版的伺服器處理請求。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、P17、S04", "passages": ["p-3", "p-4"]}, {"number": 253, "type": "content", "title": "整合簽收須附版本、回歸結果與未測項", "chapter": "03", "unit": "C34", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在 F3 各列填入實際值、測試命令或操作、環境和輸出定位，列出未測項。結果尚空就維持待驗，有落差時用請求、回應及畫面資料退回責任票。通過後把範圍、兩份輸入提交、整合提交、回歸輸出及例外送給被授權簽收的人。本例由產品負責人記錄接受或退回、姓名與日期；接受後才把該提交登記為 B1。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"7\">\u003cstrong>自我驗收\u003c/strong>　只有 UI mock 測試能否證明系統端到端正確？它最多顯示畫面如何處理給定回應。要簽收，還需看到同一整合提交上的真實請求、回應與畫面，以及批准記錄。\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 在本章僅用於確有實際觀察且標出範圍的核查，見章內編審；上述三例的產品結果皆待實跑。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、P17、S04", "passages": ["p-5", "p-6"]}, {"number": 254, "type": "content", "title": "從已簽收基線另開多選需求，交產品方裁決", "chapter": "03", "unit": "C35", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設已從原版 B0 完成單標籤篩選並簽收 B1，產品方又問：「可以同時選 work 和 home 嗎？」在 A 只帶 work、B 只帶 home 的資料裡，若要求兩個標籤都符合（AND），結果是空；若其中一個符合即可（OR），結果是 A、B。同一句新需求導出不同畫面，原來的單標籤契約無法替產品方選擇。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先定位 B1 的簽收與提交，以它為第二輪起點，在工作票索引登記新契約票 \u003ccode>R2-F0\u003c/code>，列兩種預期與對既有單標籤測試的影響，請有權者選擇，再凍結樣本、拆新的實作票。索引內的 \u003ccode>R1-F0\u003c/code> 仍指第一輪單標籤契約，\u003ccode>R2-F0\u003c/code> 指從 B1 提出的多選需求。原票保留當時的起點、規則與結果，才能追查為何當時接受 B1。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02、U-B、P05、P12", "passages": ["p-1", "p-2"]}, {"number": 255, "type": "content", "title": "比對兩輪契約的起點、預期與接受範圍", "chapter": "03", "unit": "C35", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>合成案例｜在兩張契約票上分別記起點與決定\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">核對欄位\u003c/th>\u003cth scope=\"col\">第一輪 R1-F0\u003c/th>\u003cth scope=\"col\">第二輪 R2-F0\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">承接的版本\u003c/th>\u003ctd>原待辦清單 B0\u003c/td>\u003ctd>具權者已接受的單選版 B1\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">這張票要決定什麼\u003c/th>\u003ctd>選 work 得 A，清除得 A、B，未知標籤得空清單\u003c/td>\u003ctd>同選 work、home 要求全部符合，還是任一符合？\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">下一步的依據\u003c/th>\u003ctd>按核准的單選契約做局部與整合驗證\u003c/td>\u003ctd>記下具權者對多選的決議，才可按新契約拆票\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cstrong>自我驗收\u003c/strong>　新需求可直接沿用 F1 的已完成狀態嗎？舊票證明的範圍只到先前核准的單標籤交付。即使指派原班人馬，雙標籤的輸入與接受條件都要重新確認。\u003c/p>", "layout": "figure", "note": "", "sources": "P13、S02、U-B、P05、P12", "passages": ["p-3"]}, {"number": 256, "type": "content", "title": "下一輪沿用角色和回歸測試，重核版本與授權", "chapter": "03", "unit": "C35", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 接續需求時可用兩列交底。第一列填「沿用」：既有角色與責任邊界、版本庫、單標籤回歸測試、規範與治理記錄；這些資產讓下一位執行者能從已知狀態出發。第二列填「重核」：已接受的 B1 具體提交、當輪授權、待辦 Task 的新編號及其前置，每次派出才登記新 Dispatch。若舊 Session 已關，新的承辦者仍可從這兩列還原工作。若沿用目錄，還要查它檢出的版本是否已對上 B1。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cstrong>自我驗收\u003c/strong>　哪項資料是下次需求的權威起點？查已接受的 B1 提交和對應的批准記錄。第二項需求需要全部重新建立角色嗎？可沿用 API 責任和原負責人；把舊票的成功狀態抄到他的新票上，卻會跳過雙標籤的決策與驗收。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02、U-B、P05、P12", "passages": ["p-4", "p-5"]}, {"number": 257, "type": "content", "title": "Run、Task 與 Dispatch 如何支援暫停後恢復？", "chapter": "03", "unit": "C36", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 按 Orca P13 收錄的 Experimental 文件，Run 提供一輪協作的命名空間與收件匣，Task 記規格、依賴和狀態，Dispatch 辨認某次嘗試，決策門可阻擋待裁決工作。Run 本身不會挑選或放置 Worker。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 使用者的 U03／S02 探討持續監督；要把它具體化，就得交代協調者暫停時狀態存在哪裡，又靠哪個事件回來。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02、U-B", "passages": ["p-1"]}, {"number": 258, "type": "content", "title": "收到通知後重讀任務，依有效派工核件", "chapter": "03", "unit": "C36", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在專案可持續讀取的任務記錄保存票、前置、責任人、基準、有效派工及最近的證據定位。協調者掃描 ready 票，在授權內派出，寫回嘗試後進入等待。收到通知是恢復入口：重讀任務記錄與收件匣，核對訊息屬於目前有效的派工，檢查產物，更新狀態，再掃描可開工的後續票。若過期訊息被再次送達，沿用已存的嘗試歷史，不得重複放行下游。這樣換一個工作階段，也能回答「我在等什麼、什麼條件到齊才繼續」。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02、U-B", "passages": ["p-2"]}, {"number": 259, "type": "content", "title": "用任務記錄交接派工、等待、核件與重排", "chapter": "03", "unit": "C36", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>監督流程設計｜換一個工作階段，也能從任務記錄接續\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>\u003cstrong>派出\u003c/strong>　查授權與前置條件，把這次派工登記在可接手的任務記錄。\u003c/li>\u003cli>\u003cstrong>等待\u003c/strong>　記下期待的回件與證據位置，收到通知時重讀票和收件匣。\u003c/li>\u003cli>\u003cstrong>核件\u003c/strong>　核對有效派工、版本與產物。過期回報歸入原嘗試。\u003c/li>\u003cli>\u003cstrong>重排\u003c/strong>　依更新後的前置條件選下一票；若欠產品決議，記明誰能裁決。\u003c/li>\u003c/ol>\u003c/figure>", "layout": "figure", "note": "", "sources": "P13、S02、U-B", "passages": []}, {"number": 260, "type": "content", "title": "依決策、測試與簽收狀態選擇等待、退修或結案", "chapter": "03", "unit": "C36", "body": "\u003cp data-passage=\"p-3\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假如收到的是「兩標籤要取聯集或交集？」而票上沒有授權，登記為待裁決，通知具權者並停住相依工作。等決議入案才重查依賴；測試失敗則附反例退回，缺失的測項保留待驗。工作票已全交回時仍要查驗收與簽收，才能結束這輪。由此可分辨該等待通知、該交還決策，或已能進行下一次派工。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02、U-B", "passages": ["p-3"]}, {"number": 261, "type": "content", "title": "驗證無人監督交付所需的同輪執行記錄", "chapter": "03", "unit": "C36", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cstrong>自我驗收\u003c/strong>　文檔中的實驗性能力能否當作使用者完整實測？要主張某次無人端到端完成，至少要能沿同一輪的記錄追到派工、等待、喚回、有效回件、重新放行及最終接受，並標明中間有無人工介入。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 現有來源沒有這條完整的個人執行軌跡；可以檢查設計所需的狀態與出口，持續自治和加速效果仍是待驗假設。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"8\">若要處理兩份互斥版本、權限不足或阻塞時要等多久，接讀第四章的執行決策。若要決定這樣分工是否划算，接讀第五章的驗證與量測，帶上本章留下的版本、退回、等待與接受記錄。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02、U-B", "passages": ["p-4", "p-6"]}, {"number": 262, "type": "chapter", "title": "多 Agent 工程決策｜需求歧義、授權、衝突與阻塞", "chapter": "04", "unit": "", "body": "", "layout": "prose", "note": "", "sources": "", "passages": []}, {"number": 263, "type": "content", "title": "從可見輸出的差異辨認需求歧義", "chapter": "04", "unit": "C37", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者研究 U07 提出一個實際困難：需求省略的選擇，執行者仍得設法處理。讀一張規格時，可以圈出那些一換寫法就會改變使用者所得結果的字。若有兩種輸出都符合文字，產品仍留有選擇。至於用迴圈或查表，只要行為、效能及架構約束都滿足，專案可以把這部分自由度留給實作者。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-B", "passages": ["p-1"]}, {"number": 264, "type": "content", "title": "把標籤需求寫成可重跑的識別碼比對測試", "chapter": "04", "unit": "C37", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 「讓我按標籤找待辦」給了目的。加入契約「選一個標籤，列出精確相符的待辦；清除時顯示全部」，才縮小可接受的結果。再給固定資料 A 只有 work、B 只有 home，讀者便能算出選 work 應只見 A。把這組資料載入，呼叫清單介面並比較回傳識別碼與 \u003ccode>expected_ids=[A]\u003c/code>，才有一個可重跑的測試。參考程式也能示範怎樣計算結果；採用前仍要查它示範的版本和情境，尤其要確認其偶然行為有無被批准。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-B", "passages": ["p-2"]}, {"number": 265, "type": "content", "title": "用雙選測例區分交集與聯集", "chapter": "04", "unit": "C37", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">現在假定上述單選已驗收，稱這個共同起點為 B1。新需求要求同時選 work、home。舊測試只選 work，兩種多選演算法都能過；把它照抄一份，仍無法區分兩者。把相同的 A、B 餵給「每個標籤都符合」和「至少一個符合」兩個候選，預期識別碼分別是空清單與 A、B。先把兩份預期並列交給決策者，批准後才採用其中一份作新契約。這一步讓缺的產品決定浮現，也保留了原本單選的測例。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-B", "passages": ["p-3"]}, {"number": 266, "type": "content", "title": "驗收規格時，哪個輸入能區分兩種合理規則？", "chapter": "04", "unit": "C37", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstrong>驗收練習。\u003c/strong> 詳細文件是否必然比不完整文件更正確？即使寫清楚按鈕大小與字體，仍可漏掉「全部符合或任一符合」。試著指出一項仍由實作者選擇的可見行為。範例有一個輸入就足以定義所有情況嗎？只給單選時無法排除任一多選規則，應再給能讓兩條規則產生不同結果的輸入。文件長度無法換算為需求正確率。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05（AGENTS.md 專案）支持把專案指引做成可找到的入口；P17（Ryan Lopopolo／OpenAI）描述把約束做成檢查的一個團隊案例。需求自由度的討論取自 U-B／U07。算例見 Wiki \u003ccode>examples/scenario.md\u003c/code>、\u003ccode>tutorials/uncertainty-conflict-governance.md\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-B", "passages": ["p-4", "p-5"]}, {"number": 267, "type": "content", "title": "從畫面結果回查意圖、規格與比對條件", "chapter": "04", "unit": "C38", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 除錯先找行為在哪一次轉換中分開。人想「找相關待辦」，文件寫成「可選兩個標籤」，實作者再把文字譯成比對條件，最後畫面呈現符合條件的資料。請分別保存意圖、規格原句、比對條件、畫面上預期的識別碼。從結果倒查，就看得見哪個推論原先缺了根據。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、P17", "passages": ["p-1"]}, {"number": 268, "type": "content", "title": "在兩張待辦紙卡上手算 AND 與 OR", "chapter": "04", "unit": "C38", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 用兩張紙代表兩筆待辦：A 只有 work，B 只有 home。同時勾 work 和 home。若採 AND（交集），先找出有 work 的 A，再看 A 是否也有 home；A 被排除，B 原來就缺 work，結果是空清單。若採 OR（聯集），逐筆問是否至少中一個，結果是 A、B。只勾 work 時兩條規則卻都傳回 A。用每一方自己選定的預期去測自己的程式，只能得知它有沒有照自己的解讀實作。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、P17", "passages": ["p-2"]}, {"number": 269, "type": "content", "title": "逐筆比對雙選標籤的交集與聯集", "chapter": "04", "unit": "C38", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>紙上演算｜A 只有 work，B 只有 home，同時勾選兩個標籤\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">候選規則\u003c/th>\u003cth scope=\"col\">A 會留下嗎？\u003c/th>\u003cth scope=\"col\">B 會留下嗎？\u003c/th>\u003cth scope=\"col\">候選畫面\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">全部符合（AND）\u003c/th>\u003ctd>缺 home\u003c/td>\u003ctd>缺 work\u003c/td>\u003ctd>空清單\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">任一符合（OR）\u003c/th>\u003ctd>符合 work\u003c/td>\u003ctd>符合 home\u003c/td>\u003ctd>A、B\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "U-B、P17", "passages": []}, {"number": 270, "type": "content", "title": "把產品負責人選定的多選結果寫入契約", "chapter": "04", "unit": "C38", "body": "\u003cp data-passage=\"p-3\" data-block=\"5\">把「希望更準」換成一個能回答的問題：「在這兩筆資料下，同時勾選時，你要看到空清單，還是兩筆都看到？」若回答希望縮小清單，請他對照空清單確認；若希望擴大檢索，同樣確認 A、B。將批准人、適用的需求版本、這組輸入及獲選的輸出存入契約，再讓兩個實作對同一份預期重測。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、P17", "passages": ["p-3"]}, {"number": 271, "type": "content", "title": "追查測試的預期結果是否獲得批准", "chapter": "04", "unit": "C38", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cstrong>驗收練習。\u003c/strong> 為什麼雙方測試都通過仍可能衝突？找兩份測試各自拿什麼當正確答案；它們可以在同一份模糊文字下採取相反規則。未批准時哪個輸出可以記成正式答案？兩個輸出都可登記為候選，正式答案欄仍待有權者確認。這個手算示範沒有提供實際程式執行結果。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提供越過產品決策邊界時回交的觀點。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P17 支持將已知規則回饋到工程環境。四段追查及手算依 Wiki \u003ccode>tutorials/uncertainty-conflict-governance.md\u003c/code>、\u003ccode>examples/decision-cases.md\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、P17", "passages": ["p-4", "p-5"], "subtitle": "兩份測試都綠燈，怎麼查正確答案從哪裡來？"}, {"number": 272, "type": "content", "title": "改動 API 型別前先核對規格授權", "chapter": "04", "unit": "C39", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> F0 是這個待辦案例的規格核准票。有人準備把篩選參數 tag 從一個字串改成一串值，理由是日後容易加多選。這會改變其他程式呼叫清單介面（API）的方式。請先按下表核對 F0，再決定這項「順手改善」是否在票內。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"F0 允許表格\" data-passage=\"p-2\" data-block=\"2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">F0 允許\u003c/th>\n\u003cth scope=\"col\">F0 禁止\u003c/th>\n\u003cth scope=\"col\">F0 待決\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>在指定模組實作唯讀單標籤精確比對；清除時省略 tag；未知標籤回成功與空清單。\u003c/td>\n\u003ctd>新增標籤、寫入待辦資料、引入多選或擅改既有 API 型別。\u003c/td>\n\u003ctd>空字串與大小寫的解釋；未來多值規則須另案決定。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P17、P05、U-B", "passages": ["p-1", "p-2"]}, {"number": 273, "type": "content", "title": "用 Schema、固定樣本、回歸與架構 Lint 分別核對限制", "chapter": "04", "unit": "C39", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把允許和禁止的邊界交給不同檢查。Schema 是資料形狀的約定，可在既有單選介面的檢查中攔下意外的型別變更。fixture 是每次測試都能重建的固定資料；以 A(work)、B(home) 呼叫 API，核對 work 得 A、省略參數得 A/B、未知標籤得空且狀態碼 200。回歸測試保存先前已允諾的行為，供日後改版重跑。架構 Lint 則讀程式結構，例如發現畫面模組直接匯入受限的資料寫入模組時，報出違規檔案。測清單正確與檢查依賴方向，各有自己的失敗訊號。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、P05、U-B", "passages": ["p-3"]}, {"number": 274, "type": "content", "title": "批准多選規則後新增測例，保留單選回歸測試", "chapter": "04", "unit": "C39", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">若日後需求二由有權者選定 OR，才加入雙選的 expected_ids 為 A、B，並保留選 work 只見 A 的相容測試。若批准前就寫 OR 為唯一正解，檢查器會拒絕仍合理的 AND，反而把作者的猜測固化。越過停點時，保存輸入和兩個方案，停下受影響的修改。其他已授權、與待決規則無關的測項仍可進行。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、P05、U-B", "passages": ["p-4"]}, {"number": 275, "type": "content", "title": "從 tag 型別變更找出受影響的呼叫端與測試缺口", "chapter": "04", "unit": "C39", "body": "\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cstrong>驗收練習。\u003c/strong> 未授權 Worker 可否自行變更 API 的 tag 型別？應指出受影響的呼叫端與既有契約，將變更交給具權者。測試通過能否保證所有未列情境？只測 work 與省略 tag，便沒有覆蓋傳空字串的路徑。人類可把逐行審查集中在權限、資料遷移或未測相容性；審查投入和程式品質須各自以具體改動與結果判讀。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"8\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 支持記錄專案操作指引，P17 支持以工具檢查架構限制。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> U-B 中 U04 提供規格停點的設計背景；上述檢查為案例設計。Wiki \u003ccode>concepts/harness.md\u003c/code>、\u003ccode>examples/scenario.md\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、P05、U-B", "passages": ["p-5", "p-6"]}, {"number": 276, "type": "content", "title": "用授權矩陣找出誰能變更產品約定", "chapter": "04", "unit": "C40", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 工作交到誰手上，和誰可以改變約定，是兩個不同問題。授權矩陣把每一類決定對應到獲准的人。假定 F0 是核准待辦清單單選行為的工作票，本案如此分工：\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、S02、P13", "passages": ["p-1"]}, {"number": 277, "type": "content", "title": "四種角色的決策權與交付責任", "chapter": "04", "unit": "C40", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"角色表格\" data-passage=\"p-2\" data-block=\"2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">角色\u003c/th>\n\u003cth scope=\"col\">本案獲准的決定\u003c/th>\n\u003cth scope=\"col\">遇到界線時的交付\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Worker（執行者）\u003c/td>\n\u003ctd>在指定模組修正符合既有契約的程式。\u003c/td>\n\u003ctd>交差異、測項及仍不明的輸出。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Coordinator（協調者）\u003c/td>\n\u003ctd>調整已批准工作的人手、相依順序及等待安排。\u003c/td>\n\u003ctd>把影響產品的選項送給產品負責人。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integrator（整合者）\u003c/td>\n\u003ctd>合併維持行為的變更，在共同版本重測。\u003c/td>\n\u003ctd>遇互斥結果時保留兩邊及重現資料。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>具權的人類\u003c/td>\n\u003ctd>本案由產品負責人批產品語義，重大架構另向具相應授權者確認。\u003c/td>\n\u003ctd>留下適用版本、選擇、理由與生效範圍。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "U-B、S02、P13", "passages": ["p-2"]}, {"number": 278, "type": "content", "title": "用兩份候選清單和影響範圍寫出多選決策包", "chapter": "04", "unit": "C40", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 一份可直接裁決的決策包可以這樣寫：「單選版本已驗收。新需求要同時勾 work、home，A 只有 work，B 只有 home。選 AND 顯示空清單，適合縮小結果；選 OR 顯示 A、B，適合擴大結果。兩案都要同步更新 API、畫面說明與相容測試。先等可避免依錯誤語義開發；若需要試用，可授權做兩個唯讀原型，代價是額外實作與比較。請產品負責人確認期望清單。答覆前，雙選實作待決。」收到答案後由協調者更新票、通知受影響者，整合者持同一預期重測。沒收到答覆時仍可維護既有單選檢查。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、S02、P13", "passages": ["p-3"]}, {"number": 279, "type": "content", "title": "協調者如何呈報多選方案與等待成本", "chapter": "04", "unit": "C40", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstrong>驗收練習。\u003c/strong> Coordinator 若無產品決策權能否擅自決定 OR？查票上「改產品語義」那一列的批准權，只有排程授權就只能整理選項。人類應收到哪兩種輸出才能裁決？對同一輸入給出 AND 的空清單與 OR 的 A、B，附上受影響介面、等待或原型的成本與待回覆者。其他專案可明文授權給另一角色；換一個職稱無法自行取得這項權力。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07、S02 記錄使用者對分工與越權停點的觀點。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Orca 的 P13 記述實驗性 Orchestration 的派工與決策閘門。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 角色權限取自案例 T07，非產品預設值。Wiki \u003ccode>concepts/coordination.md\u003c/code>、\u003ccode>examples/decision-cases.md\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、S02、P13", "passages": ["p-4", "p-5"]}, {"number": 280, "type": "content", "title": "Git 工作樹能隔離修改，介面仍須核對型別與語義", "chapter": "04", "unit": "C41", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Git 的 worktree 讓同一個程式庫掛接不同工作目錄，各自檢出分支、暫存改動，也共用版本物件。兩人改不同檔案，Git 可能直接合併文字。這解決了檔案如何放在一起的問題。若資料型別不同，接收端可能讀不懂；即使型別相同，雙方仍可能賦予同一值相反的意思。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、U-B", "passages": ["p-1"]}, {"number": 281, "type": "content", "title": "空字串查詢：後端回應與前端畫面的預期分歧", "chapter": "04", "unit": "C41", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在紙上重現這個衝突。起始清單有 A、B，單選規格只說清除時「省略」查詢參數。現在刻意傳入有參數、值卻為空字串的請求。服務端在目錄 \u003ccode>worktrees/wt-api\u003c/code> 檢出分支 \u003ccode>feature/api-filter\u003c/code>，該分支的測試認定空字串等同無篩選，預期回 A、B；畫面端在目錄 \u003ccode>worktrees/wt-ui\u003c/code> 檢出分支 \u003ccode>feature/ui-filter\u003c/code>，該分支的測試認定空字串表示沒有結果，預期顯示空清單。兩個分支各用自己的預期，都可能亮綠燈。把假定的服務回應 A、B 接上畫面判斷，即使改動在不同檔案、合併乾淨，使用者仍可能看不到任何項目。分別寫下「送出什麼、服務回什麼、畫面顯示什麼」，就能定位第一次出現差異的地方。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、U-B", "passages": ["p-2"]}, {"number": 282, "type": "content", "title": "保存互斥版本，回查 main 已核准的清除行為", "chapter": "04", "unit": "C41", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 整合者先記錄兩個分支的起點、提交與輸出，保存分支原件。回查目前 main 上批准的單選規格；它明定清除時省略參數，空字串仍待決。保持清除遵循舊約定，另把空字串的兩份候選交具權者決定；若批准了額外行為，就更新目標契約，在同一個整合提交重跑服務與畫面的測例。等整合合格並被接受後，才能把目標版本登記為 B1。若 B1 已登記，後來的新需求從它出發，另立契約。最後合併的分支、最新時間戳或其中一方的綠燈均不能取代這項記錄。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、U-B", "passages": ["p-3"]}, {"number": 283, "type": "content", "title": "由採納記錄確認契約與主線提交", "chapter": "04", "unit": "C41", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstrong>驗收練習。\u003c/strong> 乾淨合併是否等於語義一致？用空字串走過服務和畫面，就可得到兩個相反預期。哪個版本是正式採納的基準？查具權者的採納記錄、適用契約與其指向的 main 提交；只有兩份分支測試時，仍沿用先前已批准的基線。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P14（Git 專案）支持工作目錄與分支機制。\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 支持保存互斥成果後交具權者裁決。Wiki \u003ccode>concepts/worktree.md\u003c/code>、\u003ccode>concepts/conflict.md\u003c/code>、\u003ccode>examples/decision-cases.md\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、U-B", "passages": ["p-4", "p-5"]}, {"number": 284, "type": "content", "title": "沿依賴箭頭標出裁決延後會引起的返工", "chapter": "04", "unit": "C42", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把決定往後延，哪些人會繼續按同一個猜測工作？把工作打斷，哪些人又必須重新讀資料、重建環境？先畫依賴：一張票的結果成為另一張票的輸入，就從前者畫箭頭到後者。沿箭頭標出「這份工作若換一個答案會重做哪部分」。比較兩條路時，同時看剩多少工作、改動能否撤回，以及把兩種成果整合與重測的代價。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、P14", "passages": ["p-1"]}, {"number": 285, "type": "content", "title": "暫停依賴待決規則的工作票", "chapter": "04", "unit": "C42", "body": "\u003cp data-passage=\"p-2\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 空字串要顯示全部還是空清單尚待決，而清單、匯出與統計都將沿用這個結果。每放行一張相依票，就可能多做一組建立在同一猜測上的測試。此時暫停受影響的票，保留各自的 commit（可回查的提交）與測試輸出，列出能獨立繼續的工作，再請具權者選擇行為。這條路付出等待、重新排程及恢復工作的時間，換取下游暫時不必跟著猜。收到裁決後，把同一條新預期傳給受影響者，逐項恢復。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、P14", "passages": ["p-2"]}, {"number": 286, "type": "content", "title": "用相同條件比較隔離的唯讀原型", "chapter": "04", "unit": "C42", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">再把條件改成兩個唯讀原型已接近完成，各在獨立分支，也沒有下游依賴原型。此時可讓兩方在原授權內收尾，保留可比較的輸出；比較時固定資料、起始版本與驗收條件。選定行為後，整合者從保留下來的成果挑出符合契約的改動並重測。這樣能看到具體差異，也可能浪費其中一方的收尾工夫。若某版會搬移共用資料，就失去了「可逆且能獨立完成」的前提，須先停在具權者能審查的地方。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、P14", "passages": ["p-3"]}, {"number": 287, "type": "content", "title": "比較凍結相依工作與保留可逆原型的條件", "chapter": "04", "unit": "C42", "body": "\u003cfigure data-block=\"5\">\u003cfigcaption>排程練習｜兩種情境各要保存什麼\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">要查的條件\u003c/th>\u003cth scope=\"col\">清單、匯出與統計共用待決結果\u003c/th>\u003cth scope=\"col\">兩個隔離的唯讀原型已近完成\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">再做下去的代價\u003c/th>\u003ctd>每張下游票都可能依錯誤預期返工\u003c/td>\u003ctd>下游尚未依賴原型，仍需投入比較與整合\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">交給裁決者的材料\u003c/th>\u003ctd>受影響票、候選行為、已做的提交\u003c/td>\u003ctd>同起點、同資料與驗收條件下的兩份輸出\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">授權內的處置\u003c/th>\u003ctd>凍結相依工作並保存現場\u003c/td>\u003ctd>保留可比較的版本，等具權者決定採用範圍\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "U-B、P14", "passages": []}, {"number": 288, "type": "content", "title": "停工保存提交，比較策略仍需同條件成本紀錄", "chapter": "04", "unit": "C42", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cstrong>驗收練習。\u003c/strong> 中斷是否一定代表刪掉已做的 commit？保留起點與提交，凍結的只是會繼續擴大影響的工作。若 Coordinator 沒有權限，能直接採用一版嗎？可以安排比較、估算返工與保存原件；改架構或改行為仍由獲授相應權限者批准。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 缺少同條件下兩種安排的成本紀錄，不能推算哪條路一定更快。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提出停工重排及保留分支兩種策略。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P14 說明保存獨立工作目錄的機制。比較條件見 Wiki \u003ccode>concepts/task-graph.md\u003c/code>、\u003ccode>examples/decision-cases.md\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、P14", "passages": ["p-4", "p-5"]}, {"number": 289, "type": "content", "title": "從有效派工查明阻塞的解除條件", "chapter": "04", "unit": "C43", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> BLOCKED 表示工作受到前置條件阻擋。看到這個字，接手排程的人要能說出「哪個條件、由誰解除、看到什麼可以繼續」。Task 是有目標和依賴的工作票，Dispatch 是執行這張票的一次派工。先對上目前有效的派工再查以下線索，舊嘗試留下的錯誤未必還在阻擋這張票。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、U-B", "passages": ["p-1"]}, {"number": 290, "type": "content", "title": "依實際線索分辨缺資料、等批准、工具錯誤與沉默", "chapter": "04", "unit": "C43", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"目前的線索表格\" data-passage=\"p-2\" data-block=\"2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">目前的線索\u003c/th>\n\u003cth scope=\"col\">要查的原件\u003c/th>\n\u003cth scope=\"col\">解除條件或下一次觀察\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>缺上游資料\u003c/td>\n\u003ctd>票上指定的輸入、上游責任人及版本。\u003c/td>\n\u003ctd>具名產物到達，核對版本與格式後放行。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等需求授權\u003c/td>\n\u003ctd>專案記錄中仍開放的問題，以及有權回覆者。\u003c/td>\n\u003ctd>取得可定位的批准及適用版本。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具還在跑或已報錯\u003c/td>\n\u003ctd>同次操作最近事件、實際錯誤及是否有新進展。\u003c/td>\n\u003ctd>等完成或查明錯誤原因，保留輸出再決定如何重試。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只有一段沉默\u003c/td>\n\u003ctd>查不到與有效派工相符的活動或退出證據。\u003c/td>\n\u003ctd>維持未知，先查原負責人與狀態，依 C44 決定可否接手。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P13、U-B", "passages": ["p-2"]}, {"number": 291, "type": "content", "title": "分辨阻塞源自規格待批或缺少樣本", "chapter": "04", "unit": "C43", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設 F2 是畫面工作票，正等有權者確認上游介面規格。專案記錄只有草案，上游票也尚未獲批；即使手上已有樣本資料，缺的仍是生效的規格。給 Worker 更多執行時間不會產生批准。若規格已核准，只缺依約輸出的樣本，解除者就換成上游產物的負責人。不要單看「還沒好」猜是哪一種。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、U-B", "passages": ["p-3"]}, {"number": 292, "type": "content", "title": "等待、旁路、介入與轉案，各在什麼條件下可行？", "chapter": "04", "unit": "C43", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提出等待、旁路工作、介入及轉案四個選項。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 上游仍有進展且快要交付，可以保留上下文，約定收到產物時續做。若有獨立工作，可先準備在舊基線仍有效的單選測例；依賴草案的預期另標假設，避免把猜測傳給下一票。若多次嘗試都卡在同一未決問題，介入的具體動作是彙整差異送交能解阻者，代價是佔用協調及審查時間。若本案再無可做的事，可保存交接後改做已授權的獨立專案；返回時要重新讀取狀態。工具耗時隨環境與工作而變，沒有固定的故障分鐘數。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、U-B", "passages": ["p-4"]}, {"number": 293, "type": "content", "title": "用解除條件與返回成本檢查一次轉案決定", "chapter": "04", "unit": "C43", "body": "\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cstrong>驗收練習。\u003c/strong> F2 等的是資料、授權還是執行時間？題設給的是未批准規格，須等授權；若只有票名 F2，答案仍未知。為什麼不能把切換其他專案說成必然最優？寫下另一案可獨立推進的成果，再列離開與返回的成本；若原案即將解阻，等待可能省去兩次重讀。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"8\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13（Orca，Experimental）支持工作票、依賴及派工的區分；上述分類是排程設計。Wiki \u003ccode>tutorials/scheduling-supervision-handoff.md\u003c/code>、\u003ccode>concepts/cost.md\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、U-B", "passages": ["p-5", "p-6"]}, {"number": 294, "type": "content", "title": "分開核對派工的執行狀態、寫入權與驗收", "chapter": "04", "unit": "C44", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 「這次工作是否還在跑」、「誰有權寫」、「成果能否驗收」需要三種證據。先查工作票（Task）現在對應的派工嘗試（Dispatch）和負責人（owner）。執行軌跡（trace）把一次流程的事件串起來；最後一筆工具讀檔事件只能說明當時發生了什麼。若拿到另一個 Dispatch 的退出紀錄，即使票名相同，也回答不了這一次是否退出。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、P28、U-B", "passages": ["p-1"]}, {"number": 295, "type": "content", "title": "用同次派工的活動與退出記錄判讀失聯", "chapter": "04", "unit": "C44", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假定有效派工為甲。若能核對甲持續有新的執行活動，可判為「可確認仍在執行」；若只剩十分鐘前的軌跡且聯絡不上，記「未知」；若收到可對回甲的明確退出記錄，才記「已確認退出」。這三項是教學用的觀察分類。等待批准時也可能長時間安靜；看見程序退出則可能是成功、錯誤或被中止，還要另外查產物。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、P28、U-B", "passages": ["p-2"]}, {"number": 296, "type": "content", "title": "依執行狀態選擇接手前的查核項目", "chapter": "04", "unit": "C44", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>監督練習｜依同一次派工的證據決定如何接手\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">觀察到的事\u003c/th>\u003cth scope=\"col\">現在能確認什麼\u003c/th>\u003cth scope=\"col\">還要查什麼\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">同一嘗試持續產生新活動\u003c/th>\u003ctd>仍在執行\u003c/td>\u003ctd>查現任負責人與工作進度\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">只剩舊事件，暫時聯絡不上\u003c/th>\u003ctd>執行狀態未知\u003c/td>\u003ctd>查目前活動和寫入權，保留現場\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">有可對回本次派工的退出記錄\u003c/th>\u003ctd>這次執行已退出\u003c/td>\u003ctd>查最後產物、未提交改動與對外操作，再決定移交或驗收\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "P13、P28、U-B", "passages": []}, {"number": 297, "type": "content", "title": "移交前核對最後提交、未提交改動與通知回執", "chapter": "04", "unit": "C44", "body": "\u003cp data-passage=\"p-3\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 恢復時，從票取出有效嘗試、原 owner、起始版本、最後提交及尚未提交的改動。對照測試究竟跑在哪個版本、哪些未跑，再查外部副作用，例如上次嘗試是否已送出一次通知。通知若可能已送達，整段工作重跑會造成重複發送，先核對回執或升級處理。在舊嘗試仍可能寫入時，保留現場並請具權者查明或收回其寫入權。只有確認原嘗試已停止寫入、所有權已明確移交，才把新的有效 Dispatch、承接版本與新 owner 一起登記。從最後可驗證的產物續做，並把原嘗試回報保留在原編號下。若任何一項副作用還無法確認，先隔離那個步驟，報明未知範圍。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、P28、U-B", "passages": ["p-3"]}, {"number": 298, "type": "content", "title": "移交唯一寫入權，避免同一工作票遭到雙寫", "chapter": "04", "unit": "C44", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cstrong>驗收練習。\u003c/strong> 十分鐘沒回報、只剩舊 trace，應歸哪類？未知。補上同次 Dispatch 的明確退出記錄後，哪項判斷能改？可確認這次執行已退出，任務是否驗收仍需另證。如何避免兩個 Worker 同時修改相同任務？先確認舊寫入已停止或其權限已被有效收回，核對副作用與最後產物，再移交唯一有效的派工與所有權；另開一個會話本身解決不了雙寫。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13（Orca，Experimental）支持 Task／Dispatch，P28（OpenAI Agents SDK）支持 trace 的事件定位。\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提供監督與文件交接觀點。Wiki \u003ccode>concepts/supervision.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、P28、U-B", "passages": ["p-4", "p-5"], "subtitle": "十分鐘未回報，何時才可換人寫同一張票？"}, {"number": 299, "type": "content", "title": "用唯讀角色驗證清單的讀寫權限", "chapter": "04", "unit": "C45", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設需求是讓唯讀成員能看清單，仍不能修改清單。人類收到一句「權限已改好」。倘若上次測試只用管理者登入，畫面正常也無法回答唯讀成員能做什麼。這時可以從摘要沿四層往回查，再沿同一條路把結果帶回具權者。\u003c/p>", "layout": "prose", "note": "", "sources": "S03、S04、P28、U-C", "passages": ["p-1"]}, {"number": 300, "type": "content", "title": "從需求審查者沿有效派工追到整合版本的讀寫測試", "chapter": "04", "unit": "C45", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"誰在讀或提供資料表格\" data-passage=\"p-2\" data-block=\"2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">誰在讀或提供資料\u003c/th>\n\u003cth scope=\"col\">針對同一筆權限變更要找什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Human（具權的需求或安全審查者）\u003c/td>\n\u003ctd>先讀進度、風險、尚待決定的角色範圍；要求釐清誰可以讀、誰仍應被拒絕寫入。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Coordinator（協調者）\u003c/td>\n\u003ctd>用工作票 Task 查到當前有效的派工 Dispatch、負責人與證據位置；排除舊嘗試的回報。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Worker（執行者）\u003c/td>\n\u003ctd>交版本提交 commit、逐檔變動 diff，以及在該版本用唯讀成員讀取成功、寫入遭拒的測試命令、環境、實際輸出與未測項。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integrator（整合者）\u003c/td>\n\u003ctd>標出共同基準、投入的提交和整合後的提交；在整合版重跑讀與寫兩條路，檢查畫面與實際服務是否一致。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "S03、S04、P28、U-C", "passages": ["p-2"]}, {"number": 301, "type": "content", "title": "查唯讀成員在服務端遭拒寫入的證據", "chapter": "04", "unit": "C45", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 若只測了按鈕隱藏，仍缺服務端拒絕寫入的證據。若測試記錄來自整合前的版本，就把原結果保留並要求補測共同基準。權限屬高風險變更，把缺證的路徑、對應 diff 與整合記錄交給有權審查存取控制的人；由具簽收權者依需求決定接受或退回。摘要讓人知道先查哪裡，每一層的版本指標才使這次追查走得通。\u003c/p>", "layout": "prose", "note": "", "sources": "S03、S04、P28、U-C", "passages": ["p-3"]}, {"number": 302, "type": "content", "title": "用 handoff.md 找回基準、契約、未測項與下一位承辦者", "chapter": "04", "unit": "C45", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 交接文件可從下列空白的 \u003ccode>handoff.md\u003c/code> 起稿。先寫預期，實際結果待有原件再填；缺測時填「未測」及負責人。請接任者試著只憑文件找到同一個提交，說出下一步可以做什麼。\u003c/p>\n\u003cpre tabindex=\"0\" data-passage=\"p-5\" data-block=\"7\">\u003ccode class=\"language-text\">任務／有效派工／目前 owner：\n起始版本 base／本次提交／diff 路徑：\n工作範圍／已改動的位置：\n預期行為／契約版本：\n已驗證的範圍／環境／命令／結果／輸出路徑：\n未測項／已知失敗／可能的副作用：\n阻塞／解除條件／待回覆者：\n下一步／接任者／決策或簽收原件位置：\n\u003c/code>\u003c/pre>", "layout": "code", "note": "", "sources": "S03、S04、P28、U-C", "passages": ["p-4", "p-5"]}, {"number": 303, "type": "content", "title": "區分專案權限契約與單票派工記錄", "chapter": "04", "unit": "C45", "body": "\u003cp data-passage=\"p-6\" data-block=\"8\">\u003cstrong>驗收練習。\u003c/strong> 摘要稱權限變更已完成，要追到哪些原件，何時交誰深入審查？從有效派工找到同版變更與測試，再確認整合提交；高風險權限或未測的服務端路徑交給具權審查者。哪項狀態應存成 Project State，而不是聊天記憶？專案採納的基準、適用的權限契約與未解的決策應進有版本與所有者的專案記錄；單票當前派工與未測項存入任務記錄，用指標連回專案。聊天裡的「昨天好像通過」缺少這些定位，無法讓接任者重建當時狀態。\u003c/p>\n\u003cp data-passage=\"p-7\" data-block=\"9\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-C／U07 支持對高風險改動保持審查，S03 中 U07 支持文件交接。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> S03、S04 的分層與欄位是編輯提案。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P28 支持查執行事件，產品簽收另查授權紀錄。Wiki \u003ccode>examples/handoff-and-evidence.md\u003c/code>、\u003ccode>concepts/quality.md\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "S03、S04、P28、U-C", "passages": ["p-6", "p-7"]}, {"number": 304, "type": "content", "title": "專案 A 受阻時，先確認 B 能獨立交付", "chapter": "04", "unit": "C46", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提出在前置受阻時轉做其他已授權工作的策略。其前提是另一案可以獨立產生成果。若 B 也要讀取 A 尚待決的介面，換資料夾只會把同一個阻塞搬過去。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> U09 關於外部專案與私人管理資產分開的想法來自歷史重建；下列做法是依此設計的交接練習。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、S03", "passages": ["p-1"]}, {"number": 305, "type": "content", "title": "離開 A 前登記待批准欄位、喚回條件與通知責任", "chapter": "04", "unit": "C46", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設 A 正等上游批准一個資料欄位，B 則有一項獨立、已授權的文件索引修正。離開前把 A 的 owner、有效 Dispatch（這一次派工）、base（起始版本）、最後 commit（提交）寫回任務記錄，列出尚未測的呼叫端、上游欄位的待決版本、何人回覆，以及「收到批准及對應版本」這個喚回條件。指定誰接收事件、誰通知原負責人；若責任並未移交，保留原 owner。再核對 B 的授權人、可改範圍與索引來源，確認它不消耗 A 尚缺的輸入，才切換工作。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、S03", "passages": ["p-2"]}, {"number": 306, "type": "content", "title": "讓私人索引指回正式規格的採納版本", "chapter": "04", "unit": "C46", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 管理外部專案時，私人管理檔可以記「哪個專案、最後看過哪版、哪張票等誰」，共享產品規格則回到該案指定的權威位置。私人筆記若保留舊欄位名稱，下次打開它時應循連結核對上游採納的版本；再比對下游仍使用哪一版、哪些測項需重跑。維持一份帶指標的索引，可以避免兩套互相競爭的正式規格，也把私人研究與交給外部維護者的資訊分開。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、S03", "passages": ["p-3"]}, {"number": 307, "type": "content", "title": "返回專案前核對基準、派工歸屬與上游交付", "chapter": "04", "unit": "C46", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">返回 A 前，先確認基準、有效派工與所有權，再核對上游是否已按喚回條件交付。若基準前進，列出與自己最後提交間的差異；若已換 owner，先交接；若上游只給草案，仍保留阻塞。三者都核實後，才估算重讀規格、重建上下文與重跑測項的成本，再決定現在續做或重新排程。這也解釋了為何一次順利切換無法得出普遍適用的排程規則。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、S03", "passages": ["p-4"]}, {"number": 308, "type": "content", "title": "用核准版本確認下游能否復工", "chapter": "04", "unit": "C46", "body": "\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cstrong>驗收練習。\u003c/strong> 返回 A 前要先確認什麼？請交出權威基準、有效 owner 與派工、上游交付版本三個定位，再從交接單指出最後提交、未測項及恢復條件。若只有私人筆記稱「上游好了」而找不到批准版本，就還不能依該欄位恢復下游開發。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 現有來源未驗證跨案平台能自動完成這些步驟，也無切換速度的對照資料。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"8\">來源為 U-B／U07、U09 及 S03，分別支持直接觀點、歷史背景與資訊管理設計。Wiki \u003ccode>tutorials/scheduling-supervision-handoff.md\u003c/code>、\u003ccode>concepts/supervision.md\u003c/code>、\u003ccode>concepts/cost.md\u003c/code>。若要設計相依票與整合基準，可回第三章；若要判斷切換是否值得其成本，可接第五章的量測方法。\u003c/p>", "layout": "prose", "note": "", "sources": "U-B、S03", "passages": ["p-5", "p-6"], "subtitle": "只有「上游好了」的私人筆記時，還要補哪份證據？"}, {"number": 309, "type": "chapter", "title": "品質與效率｜驗收證據、交付成本與工程資產", "chapter": "05", "unit": "", "body": "", "layout": "prose", "note": "", "sources": "", "passages": []}, {"number": 310, "type": "content", "title": "接到「已修好」後，沿五級證據鏈追問交件", "chapter": "05", "unit": "C47", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">假設你在下一班接手維護。有人告訴你某個故障已修好。你得先找得到那份改動，才知道要測哪一版；你還得知道修的是哪項需求，才知道要觀察什麼。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 私人補充研究摘要 S04 提供一套編輯整理的五級證據鏈。可以把它當作追問順序，每往上一級，就多回答一個接手者無法靠前一份材料解決的問題。\u003c/p>", "layout": "prose", "note": "", "sources": "S04、P17、P20、P28", "passages": ["p-1"]}, {"number": 311, "type": "content", "title": "第一、二級證據：從完成聲明定位版本與差異", "chapter": "05", "unit": "C47", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cstrong>第一級是聲明，第二級是可定位的產物。\u003c/strong> 先記下誰對哪張工作票、哪一次派工回報。請執行該票的人（Worker）指出起始版本與交付版本，沿 Git 的提交識別碼（commit）找到檔案，用版本差異（diff）看實際新增或刪掉哪些行。如果回報指向上次已撤回的嘗試，要重新核對本次交付。即使找到新增的篩選按鈕，也只能確認程式變了。\u003cstrong>Agent 說「已完成」能證明功能正確嗎？\u003c/strong> 這句話可登記為回報；要判定功能，還要操作它並比對預期結果。\u003c/p>", "layout": "prose", "note": "", "sources": "S04、P17、P20、P28", "passages": ["p-2"]}, {"number": 312, "type": "content", "title": "第三級：從測試啟動追到指定版本的實際輸出", "chapter": "05", "unit": "C47", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>第三級是某一版本上的指定檢查。\u003c/strong> 向執行者要版本、執行環境、測試入口與實際命令、可重新載入的固定測試資料（fixture）、預期值、實際值、程序退出碼及原始輸出位置。退出碼是程序結束時回傳的狀態。若工具因找不到資料而中止，應登記「未測得行為」，補齊資料再跑。若工具順利結束，仍要讀輸出，查指定測項是否真的執行、比對了什麼。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> OpenAI 的 P28 用 trace 串接一次流程，span 可定位一次工具操作的起訖；P20 以事先定的準則評估可觀察行為。找到啟動測試的事件，接下來仍要找該測項的輸出。\u003cstrong>找不到測試結果，只剩摘要時能否說通過？\u003c/strong> 可轉述執行者的說法並標「輸出待補」，待取回紀錄或在可識別版本重跑後更新。\u003c/p>", "layout": "prose", "note": "", "sources": "S04、P17、P20、P28", "passages": ["p-3"]}, {"number": 313, "type": "content", "title": "第四級證據：在整合版重測選取、清除與未知標籤", "chapter": "05", "unit": "C47", "body": "\u003cp data-passage=\"p-4\" data-block=\"4\">\u003cstrong>第四級檢查共同版本，第五級記誰接受。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 以工作票 F3 代表一次整合驗收。這張票要求選工作標籤時只見工作待辦、清除後恢復全清單、查未知標籤時得到空清單。後端提供待辦清單，前端負責顯示，兩位作者都可能用各自模擬的對端通過局部測試。整合者（Integrator）記下兩份輸入提交和共同目標提交，在合併後的版本操作真實介面，重跑跨模組案例和回歸測試（檢查原先可用的行為是否被改壞）。若前端清除時仍帶舊參數，退回該差異，保留重現方式並在修正版本重測。\u003cstrong>\u003c/strong>\u003c/p>", "layout": "prose", "note": "", "sources": "S04、P17、P20、P28", "passages": ["p-4"]}, {"number": 314, "type": "content", "title": "第五級：具權者依行為結果接受或退回", "chapter": "05", "unit": "C47", "body": "\u003cp data-passage=\"p-4\" data-block=\"4\">\u003cstrong>\u003c/strong>三條行為均有結果後，具權者才可逐條對需求判讀，記錄版本、接受或退回、例外、簽收者與日期。案例把正式接受的新基線稱為 B1。\u003cstrong>Worker 全綠但 Integrator 未跑回歸能否交付？\u003c/strong> 局部改動可交給整合者，F3 的整合門檻仍待測，B1 尚無簽收依據。就算整合測項全過，也得另查授權與接受紀錄。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"5\">來源：T09、S04、P17、P20、P28；Wiki 的 \u003ccode>concepts/quality.md\u003c/code>、\u003ccode>concepts/supervision.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。要自己設計第三、四級的檢查，可讀 \u003ca href=\"#C48\">5.02\u003c/a>。\u003c/p>", "layout": "prose", "note": "", "sources": "S04、P17、P20、P28", "passages": ["p-4", "p-5"]}, {"number": 315, "type": "content", "title": "在測試資料加入反例，讓錯誤篩選無法過關", "chapter": "05", "unit": "C48", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 待辦網站要新增單一標籤篩選。產品負責人想知道「選工作後是否只看見工作待辦」。若清單只有一項工作待辦 A，永遠顯示全部的錯誤程式也會給你 A。\u003cstrong>只在資料中放 A 能證明 work 篩選正確嗎？\u003c/strong> 加入應被排除的居家待辦 B，讓「全部回傳」與「確實篩選」產生可分辨的輸出。這就是 fixture 要同時放入相符與不相符資料的理由。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">先把 A 標成 work、B 標成 home，固定資料及版本。API 是前端向後端查資料的介面，UI 是使用者操作及看結果的畫面。在同一個整合版本留下以下三組預期，實際欄等執行後才填。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、P20、U-C", "passages": ["p-1", "p-2"]}, {"number": 316, "type": "content", "title": "逐列核對選取、清除與查無結果的 API 和 UI", "chapter": "05", "unit": "C48", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"操作表格\" data-passage=\"p-3\" data-block=\"3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">操作\u003c/th>\n\u003cth scope=\"col\">讀取當次網路請求與真實 API 回應\u003c/th>\n\u003cth scope=\"col\">在畫面核對\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>選 work\u003c/td>\n\u003ctd>\u003ccode>GET /todos?tag=work\u003c/code>，只回 A\u003c/td>\n\u003ctd>清單有 A 且無 B\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接著清除篩選\u003c/td>\n\u003ctd>\u003ccode>GET /todos\u003c/code> 省略 tag，回 A、B\u003c/td>\n\u003ctd>B 重新出現，A 仍在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查詢不存在的 missing\u003c/td>\n\u003ctd>\u003ccode>GET /todos?tag=missing\u003c/code>，狀態 200，空清單\u003c/td>\n\u003ctd>呈現有效的空結果，仍可清除\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P17、P20、U-C", "passages": ["p-3"]}, {"number": 317, "type": "content", "title": "先建立已篩選狀態，再從畫面追查真實資料路徑", "chapter": "05", "unit": "C48", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">先用單元測試單獨驗標籤比對，再從畫面一路查到真實資料路徑。若後端回 A 而畫面還有 B，至少能把調查縮小到回應之後的顯示步驟。若測試用預寫的回應取代後端，即使顯示正確，也還要查真實請求是否帶對參數。清除的驗收須先建立已篩選狀態；直接開啟預設清單會錯過舊狀態殘留。大小寫、多選及空字串的語義在本題尚未定義，應請需求所有者釐清，再寫預期。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、P20、U-C", "passages": ["p-4"]}, {"number": 318, "type": "content", "title": "把功能、整合、架構與風險分列在驗收面板", "chapter": "05", "unit": "C48", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 做一張最小驗收面板，每列放需求、版本、檢查層次、預期、實際與證據位置，分列功能、整合、架構限制及剩餘風險。功能列記選取與清除；整合列核對同一次請求、回應和畫面；架構列檢查資料存取是否經指定介面。若專案要求回應時間或可近用性，另訂使用情境及可觀察門檻，未執行就留待測。\u003cstrong>同一測試通過 100 次能證明未測功能正確嗎？\u003c/strong> 重跑累積的是該條件下的觀察。先查哪一列仍空白，再決定要加哪個測項。一個總分無法代替個別專案對安全、效能或使用情境的要求。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、P20、U-C", "passages": ["p-5"]}, {"number": 319, "type": "content", "title": "讀驗收面板：哪列待測、哪列還在等規格？", "chapter": "05", "unit": "C48", "body": "\u003cfigure data-block=\"7\">\u003cfigcaption>合成練習｜先填驗收面板，再到同一整合版本補實際結果\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">檢查層次\u003c/th>\u003cth scope=\"col\">本次要對讀的證據\u003c/th>\u003cth scope=\"col\">實際結果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">功能\u003c/th>\u003ctd>先選 work 再清除，清單中的 B 應重新出現。\u003c/td>\u003ctd>待測\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">整合\u003c/th>\u003ctd>同一次清除的請求省略 tag，服務回 A、B，畫面也顯示 A、B。\u003c/td>\u003ctd>待測\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">架構\u003c/th>\u003ctd>由變更與架構檢查核對資料是否經指定介面存取。\u003c/td>\u003ctd>待查\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">剩餘範圍\u003c/th>\u003ctd>空字串行為尚待需求所有者釐清，先記錄未決規格。\u003c/td>\u003ctd>待決\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "P17、P20、U-C", "passages": []}, {"number": 320, "type": "content", "title": "Dungeon Lab 實測：窄視窗溢出與滑牆卡住", "chapter": "05", "unit": "C48", "body": "\u003cp data-passage=\"p-6\" data-block=\"9\">\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 使用者的 Dungeon Lab 原工程紀錄提供兩種檢查分工的例子。第一輪報告 8/8 單元測試，實際瀏覽器仍發現窄視窗溢出，調整版面後才得到修正後的觀察。第二輪報告 12/12 單元測試及 58 項定時整合檢查通過；滑牆測試曾發現玩家卡在牆格接縫，修正碰撞矩形後另加測試，再重跑整合檢查。正式建置成功回答的是程式能產生可載入的成品，卡牆問題則需要讓角色實際抵牆移動。原案的瀏覽器、版本和操作限定了結論，這些數目也不能拿來當待辦網站的測試結果。\u003c/p>\n\u003cp data-passage=\"p-7\" data-block=\"10\">來源：T09、P17、P20、U-C（U05、U06）、\u003ccode>examples/scenario.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。想判斷哪些風險需人檢查，可讀 \u003ca href=\"#C50\">5.03\u003c/a>。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、P20、U-C", "passages": ["p-6", "p-7"]}, {"number": 321, "type": "content", "title": "用架構檢查和測試指出人應深入追查的差異", "chapter": "05", "unit": "C50", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者在 U07 提出把人力集中於架構限制、整合驗收、高風險改動和未覆蓋的路徑。困難在於，人要如何發現哪些地方需要他深入閱讀？\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Ryan Lopopolo 在 OpenAI 的 P17 案例將架構依賴限制做成可執行檢查。這提供了一種找出違規位置的方法；其效果取決於本案寫了哪些規則及測試。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先列出不容改變的架構約定，例如畫面只能透過指定的資料層讀取資料。若變更直接跨層存取，讓架構檢查指出違規檔案。接著跑單元測試，獨立比對某段邏輯的輸出，再跑整合測試，查模組組合後及目標版本上的實際行為。最後由審查者對照本次差異、已覆蓋的行為和失敗時的後果，逐項決定要深入追哪條路。若規則還沒寫成檢查，該項要交人核對，不能從綠燈推定架構合規。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、P17、S04", "passages": ["p-1", "p-2"]}, {"number": 322, "type": "content", "title": "同一品質門檻下，如何量到審查、補測與返工投入？", "chapter": "05", "unit": "C50", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>為什麼減少閱讀量不等於降低品質門檻？\u003c/strong> 全部逐行讀的方式把人工投入分散到每個檔案；風險優先的方式讓重複且可判定的規則先由工具核對，人再檢查高代價的失敗、架構例外及測試盲點。兩案都要達到同一套產品及整合門檻。要主張少花人工，需要量審查、補測和返工的時間；僅知道讀了幾行還不足以判定節省多少。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、P17、S04", "passages": ["p-3"]}, {"number": 323, "type": "content", "title": "用舊資料補驗遷移路徑，找出需要人工批准的改動", "chapter": "05", "unit": "C50", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 更新資料欄位後，新建的待辦仍可正確篩選。測試若只建新資料，完全沒走過舊資料遷移。審查者應找出遷移前後的對應、抽取具代表性的舊版資料驗證、確認失敗時如何恢復，再把證據交給授權者。\u003cstrong>哪類修改應強制人工批准？\u003c/strong> 在本例的專案契約中，權限變更、可能遺失資料的遷移及安全邊界變動須經具權者批准。對架構例外或測試未覆蓋的高風險路徑，先要求深入審查，釐清後果並補驗，依專案授權決定是否接受例外。測試通過只能解除它實際檢查過的疑問。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"6\">來源：U-C（U07）、P17、S04、T09、\u003ccode>concepts/harness.md\u003c/code>、\u003ccode>concepts/quality.md\u003c/code>。若產品已可接受，仍想了解交付是否順暢，可讀 \u003ca href=\"#C49\">5.04\u003c/a>。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、P17、S04", "passages": ["p-4", "p-5"]}, {"number": 324, "type": "content", "title": "事先分訂產品合格與未計畫重派的判準", "chapter": "05", "unit": "C49", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 提醒我們分開問交付物是否達標，以及取得它的過程是否順利。前者可以看驗收輸出，後者可能得翻派工與人工支援紀錄。若到事後才挑最顯眼的事件來定義「不順」，同一份紀錄很容易被解讀成相反結論。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在工作開始前訂兩條課堂規則。產品合格須選 work 只見工作待辦、清除恢復全清單、未知標籤顯示空清單，三條契約全過。交付順利須本輪沒有未計畫重派，即原本安排之外把同一項工作另交一次。兩軸的紀錄都齊全時，才能把交付放入下表的四種結果之一。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、S04、S05", "passages": ["p-1", "p-2"]}, {"number": 325, "type": "content", "title": "用產品結果與派工記錄判讀四種交付情況", "chapter": "05", "unit": "C49", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"兩軸均有完整紀錄表格\" data-passage=\"p-3\" data-block=\"3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">兩軸均有完整紀錄\u003c/th>\n\u003cth scope=\"col\">無未計畫重派（順）\u003c/th>\n\u003cth scope=\"col\">有未計畫重派（不順）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>三條全過（合格）\u003c/td>\n\u003ctd>合格／順\u003c/td>\n\u003ctd>合格／不順\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>至少一條確知未過（不合格）\u003c/td>\n\u003ctd>不合格／順\u003c/td>\n\u003ctd>不合格／不順\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "U-C、S04、S05", "passages": ["p-3"]}, {"number": 326, "type": "content", "title": "返工次數無法代替重派紀錄", "chapter": "05", "unit": "C49", "body": "\u003cp data-passage=\"p-4\" data-block=\"4\">\u003cstrong>三條契約全過、返工兩次，能判哪一軸？若另有一次未計畫重派的記錄，結果如何？\u003c/strong> 前半題能判產品合格，過程資訊不足，留在矩陣外。返工是修正先前的工作，同一人也能返工，所以無從據此推斷重派。補得重派紀錄後才落在「合格／不順」。若另一隊交出相同品質的產品，且完整派工紀錄顯示全程按原安排執行，它落在「合格／順」。兩份紀錄沒有工時或費用，就只比較分類。這是編者為教學設定的門檻，其他專案若在意等待時間，應事前另定規則。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、S04、S05", "passages": ["p-4"]}, {"number": 327, "type": "content", "title": "保留阻塞、重派與人工救援事件，辨別零次與缺值", "chapter": "05", "unit": "C49", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 實作時每筆事件寫明工作票、嘗試識別、起訖、原因、處置及原件位置。遇到前置工作未就緒，從不能推進記到解除阻塞；重派沿派工紀錄逐次計數；人工救援記誰何時介入及花多少時間。分開記衝突檔案與解決方式、回歸失敗的測項、因退回而重做的工作及其重測結果。同一失敗引發重派與返工時，兩筆引用同一事件以便追查。\u003cstrong>沒有原始紀錄可否直接填 0 次返工？\u003c/strong> 缺值表示尚無足夠觀察；只有紀錄涵蓋整個約定期間並能辨認這類事件，才有理由填零。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"7\">來源：U-C（U07）、S04、S05、T09、\u003ccode>concepts/quality.md\u003c/code>、\u003ccode>concepts/cost.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。量化同一段交付可接 \u003ca href=\"#C51\">5.05\u003c/a>。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C、S04、S05", "passages": ["p-5", "p-6"]}, {"number": 328, "type": "content", "title": "從需求獲准到簽收，怎樣定義牆鐘與累計工時？", "chapter": "05", "unit": "C51", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">團隊想知道增派人手能否趕上交付。提早拿到結果，與兩位執行者合計少做了多少工作，是兩個需要不同資料的問題。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 牆鐘時間指外部觀察者從共同起點到終點實際經過的時間。本章選擇需求獲准開始到具權者接受，期間等待授權、測試、整合與返工都會讓時鐘前進。若截止時仍未接受，就記「未完成」與已觀察到的時長。累計 Worker 工時則把每位執行者按同一口徑記錄的工作區間長度相加；先約定工作區間是否含工具等待，才能比較。\u003c/p>", "layout": "prose", "note": "", "sources": "P20、U-C、S05", "passages": ["p-1"]}, {"number": 329, "type": "content", "title": "並行工作的累計工時與交付耗時", "chapter": "05", "unit": "C51", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> \u003cstrong>A、B 並行各十分鐘，牆鐘必然二十分鐘嗎？\u003c/strong> 在紙上畫三行，上面兩行各放一條十分鐘的工作帶。若兩條同時開始又同時結束，累計執行者時間是二十分鐘，兩條所覆蓋的共同時段只有十分鐘。第三行從獲准開始畫到簽收，若最後還等整合者重測或等人批准，第三行會比共同工作時段長。僅知道兩條帶的長度，既不知道重疊多少，也不知道何時接受。這是題設演算，並無本案計時樣本。\u003c/p>", "layout": "prose", "note": "", "sources": "P20、U-C、S05", "passages": ["p-2"], "subtitle": "兩位各做十分鐘，何時才能算出交付耗時？"}, {"number": 330, "type": "content", "title": "沿三條時間帶區分重疊工作、整合等待與簽收", "chapter": "05", "unit": "C51", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>合成時間軸｜同時開始的兩段工作\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">時間帶\u003c/th>\u003cth scope=\"col\">第 0 至 5 分\u003c/th>\u003cth scope=\"col\">第 5 至 10 分\u003c/th>\u003cth scope=\"col\">第 10 分之後\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">執行者 A\u003c/th>\u003ctd colspan=\"2\">起點 ━━━━━━━━━ 停手（10 Agent·分）\u003c/td>\u003ctd>後續工時未知\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">執行者 B\u003c/th>\u003ctd colspan=\"2\">起點 ━━━━━━━━━ 停手（10 Agent·分）\u003c/td>\u003ctd>後續工時未知\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">外部時鐘\u003c/th>\u003ctd colspan=\"2\">起點 ━━━━━━━━━ 經過 10 分鐘\u003c/td>\u003ctd>等待整合、批准 → 簽收時刻未知\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>重疊時段合計用了 20 Agent·分。要算整輪交付時間，另找需求獲准與具權者簽收的時刻。\u003c/p>\u003c/figure>", "layout": "figure", "note": "", "sources": "P20、U-C、S05", "passages": []}, {"number": 331, "type": "content", "title": "用事件編號串起重測耗時與人力、工具投入", "chapter": "05", "unit": "C51", "body": "\u003cp data-passage=\"p-3\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 用一張票串起下列資料。一次重測既會占用牆鐘，也可能占用工具和人工，保留各欄單位及共同事件編號，就能解釋延遲發生在哪裡，避免把互相重疊的分鐘加成總耗時。\u003c/p>", "layout": "prose", "note": "", "sources": "P20、U-C、S05", "passages": ["p-3"]}, {"number": 332, "type": "content", "title": "分欄記錄牆鐘時間、執行者工時與人工介入", "chapter": "05", "unit": "C51", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"要問的量表格\" data-passage=\"p-4\" data-block=\"6\" data-rows=\"1,2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">要問的量\u003c/th>\n\u003cth scope=\"col\">可重查的記法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>牆鐘、累計執行者時間\u003c/td>\n\u003ctd>用同一時基的開始與接受事件算經過時間。另逐人記各次嘗試的開始、結束與等待口徑，保留失敗嘗試。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人類介入\u003c/td>\n\u003ctd>逐次記審查、答疑、救援的開始及結束，按人加總人分鐘。等待回覆可另計阻塞，與人實際處理時間分列。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P20、U-C、S05", "passages": ["p-4"]}, {"number": 333, "type": "content", "title": "逐次記下模型用量、工具重試、整合返工與維護", "chapter": "05", "unit": "C51", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"要問的量表格\" data-passage=\"p-4\" data-block=\"6\" data-rows=\"3,4,5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">要問的量\u003c/th>\n\u003cth scope=\"col\">可重查的記法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>模型用量\u003c/td>\n\u003ctd>Token 是模型處理文字等輸入輸出的計量單位。依模型及呼叫記實際回報的輸入、輸出用量和重試，缺報表就標缺值。不同單位不能直接相加當金額。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具、阻塞、重試\u003c/td>\n\u003ctd>記每次工具或測試起訖、退出狀態，保留未通過的嘗試。另記等待原因、解除時點，以及同一操作額外再做幾次。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>整合返工、維護\u003c/td>\n\u003ctd>從被退回的差異追到修正、重測與接受，記處理者、時間及原因。往後修改共用規範或測試的維護投入，另列觀察期間。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P20、U-C、S05", "passages": ["p-4"]}, {"number": 334, "type": "content", "title": "模型用量無法補出漏記的人工工時", "chapter": "05", "unit": "C51", "body": "\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cstrong>沒有人工介入記錄能宣稱沒有人介入嗎？\u003c/strong> 查工時紀錄涵蓋哪些人與時段；若只有模型用量報表，人工欄只能填未知。少用 Token 也可能伴隨較多人工救援。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> U10 所提個人時間公式的原文、符號及適用前提尚缺。上述時段的計算是教材的量測定義，沒有重建該式，亦無法據此填入使用者的節省比例。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"8\">來源：T09、P20、U-C（U07、U10）、S05、\u003ccode>concepts/cost.md\u003c/code>。若要用這張表比較兩組工作方式，可讀 \u003ca href=\"#C52\">5.06\u003c/a>。\u003c/p>", "layout": "prose", "note": "", "sources": "P20、U-C、S05", "passages": ["p-5", "p-6"]}, {"number": 335, "type": "content", "title": "兩組都說「完成」，先確認計時終點是否相同", "chapter": "05", "unit": "C52", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">假設一位 Agent 從頭做到尾，另一組把後端和畫面分給兩位 Agent。第二組先報完成。若一方計到自己寫完，另一方計到產品簽收，即使兩個時鐘都準確，也無從回答哪種分工能更早交付相同品質的功能。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> OpenAI 在 P20 說明以代表性案例和明確準則反覆評估流程；\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把這個思路用在本題，可在任何試次開始前寫下對照方案。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、U-C", "passages": ["p-1"]}, {"number": 336, "type": "content", "title": "統一需求、環境與驗收門檻，記錄試次順序", "chapter": "05", "unit": "C52", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"固定項表格\" data-passage=\"p-2\" data-block=\"2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">固定項\u003c/th>\n\u003cth scope=\"col\">兩組共同的起點與門檻\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>需求及產物\u003c/td>\n\u003ctd>同一份已核准的單標籤需求，排除多選與寫入。每次從同一個乾淨的起始提交（此處稱 B0）獨立開始。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>環境及許可\u003c/td>\n\u003ctd>相同模型設定、工具與依賴版本、可用操作、權限及資源限制。記錄兩組不可避免的差異，例如並行執行的配額。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料及驗收\u003c/td>\n\u003ctd>同一組固定資料 A(work)、B(home)，真實介面測選取、清除及未知標籤，採用相同架構與回歸檢查、簽收條件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>試次與計時\u003c/td>\n\u003ctd>兩組事先約定相同的重複次數、超時及失敗規則、起點與終點。每次重設資料，記執行順序、快取狀態與人工介入，避免一方直接沿用上次答案。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、U-C", "passages": ["p-2"]}, {"number": 337, "type": "content", "title": "比較交付速度前，先對齊前後端驗收範圍", "chapter": "05", "unit": "C52", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> \u003cstrong>如果多 Agent 放寬驗收，時間更短能稱贏嗎？\u003c/strong> 若多 Agent 組只查後端，單 Agent 組還查使用者畫面，先記兩組實際測到什麼。放寬門檻已改變待比較的工作；要回答原問題，兩組需按原門檻補做相同條件的試次。改模型或換工具也應列為條件變動，否則無法把差距歸給分工。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、U-C", "passages": ["p-3"]}, {"number": 338, "type": "content", "title": "每次獨立啟動占一列，留下截止與缺值的原因", "chapter": "05", "unit": "C52", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 每次獨立嘗試填一列。欄位留白表示尚未執行；試跑後，凡未取得的欄位寫明缺值原因。未完成的試次仍占一列，記觀察截止時間、停在哪裡，不能把它算成在截止時完成。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"試次、組別與順序表格\" data-passage=\"p-5\" data-block=\"6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">試次、組別與順序\u003c/th>\n\u003cth scope=\"col\">基線、條件偏差\u003c/th>\n\u003cth scope=\"col\">契約結果、成功／失敗／未完成\u003c/th>\n\u003cth scope=\"col\">至接受時間或觀察截止\u003c/th>\n\u003cth scope=\"col\">人工、Token、重試與整合返工\u003c/th>\n\u003cth scope=\"col\">證據與限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、U-C", "passages": ["p-4", "p-5"]}, {"number": 339, "type": "content", "title": "先報告全部試次的結果，再比較合格交付的耗時", "chapter": "05", "unit": "C52", "body": "\u003cp data-passage=\"p-6\" data-block=\"7\">先以全部試次為分母報告合格、失敗與未完成數，再對同門檻下達標的交付報告時間分布與人工、用量。保留個別值及樣本數，讓讀者看出極端等待或少數成功樣本的影響。若大量試次逾時，只報成功者的交付時間會讓較常失敗的方式看似很快。即使有差異，結論也只能限定在測過的任務、條件與樣本。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、U-C", "passages": ["p-6"]}, {"number": 340, "type": "content", "title": "紙上演練：為兩對試次訂 30 分鐘與 12,000 token 上限", "chapter": "05", "unit": "C52", "body": "\u003cp data-passage=\"p-7\" data-block=\"8\">\u003cstrong>試著填兩對資料。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 開跑前編好配對號，每對從 B0 重設，採上表相同契約、資料與驗收；一組由一位 Agent 執行，另一組由兩位 Agent 分工。兩組都在需求獲准時發出同一委託並開始計時，至具權者簽收才記交付時間。此練習預先訂每試次最多 30 分鐘、全組合計 12,000 token，任一上限先到就停止。返工和等待占用同一份預算；確認無法繼續的錯誤列失敗，到截止仍在做列未完成。某個觀察欄取不到就註明原因，不用零代替。\u003c/p>\n\u003cp data-passage=\"p-8\" data-block=\"9\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 下表是已填的紙上練習；上面的空表留給實際試次。假設兩對的工具、版本與權限相同，每對重置資料與快取，第二對交換先後。時間皆自該次發出委託起算，並行組的 token 與人工按整組記。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、U-C", "passages": ["p-7", "p-8"]}, {"number": 341, "type": "content", "title": "從四筆合成紀錄區分簽收、未完成與失敗", "chapter": "05", "unit": "C52", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"配對／組別（順序）表格\" data-passage=\"p-9\" data-block=\"10\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">配對／組別（順序）\u003c/th>\n\u003cth scope=\"col\">契約結果與依據\u003c/th>\n\u003cth style=\"text-align:right\" scope=\"col\">至簽收（分）\u003c/th>\n\u003cth style=\"text-align:right\" scope=\"col\">結束觀察（分）\u003c/th>\n\u003cth scope=\"col\">人工（分）／token／重試次數\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>甲／單（先）\u003c/td>\n\u003ctd>三個行為與回歸均過，有簽收\u003c/td>\n\u003ctd style=\"text-align:right\">24\u003c/td>\n\u003ctd style=\"text-align:right\">24\u003c/td>\n\u003ctd>3／8,000／0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>甲／多（後）\u003c/td>\n\u003ctd>同門檻簽收，含一次整合退修\u003c/td>\n\u003ctd style=\"text-align:right\">18\u003c/td>\n\u003ctd style=\"text-align:right\">18\u003c/td>\n\u003ctd>5／10,000／1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>乙／多（先）\u003c/td>\n\u003ctd>兩人用量合計先到上限，清除路徑仍待複驗，未完成\u003c/td>\n\u003ctd style=\"text-align:right\">—\u003c/td>\n\u003ctd style=\"text-align:right\">20\u003c/td>\n\u003ctd>6／12,000／1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>乙／單（後）\u003c/td>\n\u003ctd>確認執行環境故障，無法繼續，列失敗；畫面缺測\u003c/td>\n\u003ctd style=\"text-align:right\">—\u003c/td>\n\u003ctd style=\"text-align:right\">9\u003c/td>\n\u003ctd>缺測（人工計時漏記）／3,000／0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、U-C", "passages": ["p-9"]}, {"number": 342, "type": "content", "title": "兩對合成試次的簽收比例與可比較成本", "chapter": "05", "unit": "C52", "body": "\u003cp data-passage=\"p-10\" data-block=\"12\">兩組各自啟動了兩次，分母都取 2。若另有排定但尚未開跑的試次，應另列排程缺口。就這四筆已啟動的紀錄來算，單組簽收 1/2、失敗 1/2、未完成 0/2；多組簽收 1/2、失敗 0/2、未完成 1/2。表內可作同對交付時間比較的只有甲，多組在這個例子早 6 分鐘簽收，也多用 2 分鐘人工及 2,000 token。乙的 20 與 9 都是停止觀察的時間，沒有可相減的簽收時間；人工漏記也無從算出兩對完整的人力差。這些數值只示範讀表，實際效率差異仍須用同條件資料檢驗。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> U10 缺個人時間公式的原文與前提，這裡的截止值只是練習設定。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、U-C", "passages": ["p-10"]}, {"number": 343, "type": "content", "title": "Dungeon Lab 功能測試缺少效率比較的對照組", "chapter": "05", "unit": "C52", "body": "\u003cp data-passage=\"p-11\" data-block=\"13\">\u003cstrong>Dungeon Lab 有測試，能證明多 Agent 一定更快嗎？\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> U05、U06 記錄的是單 Agent 工程案例中兩輪不同版本的功能檢查。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 缺少從相同版本完成同一需求的另一組，也缺成對的成本觀察，不能把兩輪測項數的差異當加速成績。「可並行的工作也許能縮短交付」可提出為待驗假設，應依本單元的試次表收集能推翻它的結果。\u003c/p>\n\u003cp data-passage=\"p-12\" data-block=\"14\">來源：P20、U-C（U05、U06）、T09、\u003ccode>concepts/cost.md\u003c/code>、\u003ccode>concepts/quality.md\u003c/code>、\u003ccode>examples/scenario.md\u003c/code>。要比較使用者取得的價值，可轉 \u003ca href=\"#C53\">5.07\u003c/a>。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、U-C", "passages": ["p-11", "p-12"]}, {"number": 344, "type": "content", "title": "計時起點與交付範圍如何影響效率比較", "chapter": "05", "unit": "C52-01", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">要替待辦網站增加按標籤篩選的功能，可以讓一位助手從頭做到簽收，也可以讓幾位助手分頭寫資料服務和畫面，再整合。假設第二組先喊完成：它從分工完成才開始計時，交的又只有資料服務；第一組從領票就計時，還必須讓使用者在畫面上操作清除。這兩個分鐘數混入不同的準備時間與驗收工作，無法回答哪種分工較早交出同等品質的產品。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C", "passages": ["p-1"]}, {"number": 345, "type": "content", "title": "固定版本、樣本與環境，讓分工成為比較變項", "chapter": "05", "unit": "C52-01", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">先定義完整產品。清單裡的 A 是工作事項、B 是生活事項；使用者篩選和清除後，資料服務（API）的回應和畫面（UI）都要合乎同一規則。再把每次重新開始的乾淨版本記作 B0、固定測試資料稱為 fixture。把模型設定和執行環境分別登記為 M1、E1，將分工方式留作唯一刻意改動的一項。\u003c/p>", "layout": "prose", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C", "passages": ["p-3"]}, {"number": 346, "type": "content", "title": "共同驗收門檻：基線、三條篩選行為與簽收者", "chapter": "05", "unit": "C52-01", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"控制項表格\" data-passage=\"p-4\" data-block=\"4\" data-rows=\"1,2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">控制項\u003c/th>\n\u003cth scope=\"col\">單組與多組共同約定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>需求／基線\u003c/td>\n\u003ctd>每次從乾淨 B0 開始，單標籤精確比對，排除多選及資料寫入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料／產品門檻\u003c/td>\n\u003ctd>A(work)、B(home)；真實 API 與 UI 驗 work→[A]、清除省略 tag→[A,B]、missing→[] 且 HTTP 200；架構與既有回歸皆通過，交同一簽收角色\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成試次供練習計量，架構效率仍缺同條件實測。", "sources": "P20、T09、U-C", "passages": ["p-4"]}, {"number": 347, "type": "content", "title": "共同資源：固定模型工具與配額，只改變分工方式", "chapter": "05", "unit": "C52-01", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"控制項表格\" data-passage=\"p-4\" data-block=\"4\" data-rows=\"3,4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">控制項\u003c/th>\n\u003cth scope=\"col\">單組與多組共同約定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>模型／工具／資源\u003c/td>\n\u003ctd>全部使用同一 M1 模型快照及推理設定；E1 固定依賴、Shell、Browser 與編輯工具版本；同一可寫範圍、每組每試次全部呼叫合計最多 16,000 token（模型處理的文字單位），機器配額相同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u0
