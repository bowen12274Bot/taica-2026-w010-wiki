-cases.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P13、S02、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/authority.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/decision-cases.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s02-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/uncertainty-conflict-governance.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.04", "firstSlide": 276, "lastSlide": 279, "subtitle": "誰能決定多選的意思？"}, {"id": "C41", "chapter": "04", "title": "Git 合併後的語義衝突與整合驗收", "track": "", "role": "core", "parent": "", "lead": "這裡回到第一輪單選功能簽收前。使用者按清除後應恢復完整清單。整合者要追查畫面送出什麼、伺服器回了什麼，才能知道兩邊是否遵守同一約定。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Git 的 worktree 讓同一個程式庫掛接不同工作目錄，各自檢出分支、暫存改動，也共用版本物件。兩人改不同檔案，Git 可能直接合併文字。這解決了檔案如何放在一起的問題。若資料型別不同，接收端可能讀不懂；即使型別相同，雙方仍可能賦予同一值相反的意思。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在紙上重現這個衝突。起始清單有 A、B，單選規格只說清除時「省略」查詢參數。現在刻意傳入有參數、值卻為空字串的請求。服務端在目錄 \u003ccode>worktrees/wt-api\u003c/code> 檢出分支 \u003ccode>feature/api-filter\u003c/code>，該分支的測試認定空字串等同無篩選，預期回 A、B；畫面端在目錄 \u003ccode>worktrees/wt-ui\u003c/code> 檢出分支 \u003ccode>feature/ui-filter\u003c/code>，該分支的測試認定空字串表示沒有結果，預期顯示空清單。兩個分支各用自己的預期，都可能亮綠燈。把假定的服務回應 A、B 接上畫面判斷，即使改動在不同檔案、合併乾淨，使用者仍可能看不到任何項目。分別寫下「送出什麼、服務回什麼、畫面顯示什麼」，就能定位第一次出現差異的地方。\u003c/p>\n\u003ch2 data-section>保存互斥的結果，回查已批准的行為\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 整合者先記錄兩個分支的起點、提交與輸出，保存分支原件。回查目前 main 上批准的單選規格；它明定清除時省略參數，空字串仍待決。保持清除遵循舊約定，另把空字串的兩份候選交具權者決定；若批准了額外行為，就更新目標契約，在同一個整合提交重跑服務與畫面的測例。等整合合格並被接受後，才能把目標版本登記為 B1。若 B1 已登記，後來的新需求從它出發，另立契約。最後合併的分支、最新時間戳或其中一方的綠燈均不能取代這項記錄。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>驗收練習。\u003c/strong> 乾淨合併是否等於語義一致？用空字串走過服務和畫面，就可得到兩個相反預期。哪個版本是正式採納的基準？查具權者的採納記錄、適用契約與其指向的 main 提交；只有兩份分支測試時，仍沿用先前已批准的基線。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P14（Git 專案）支持工作目錄與分支機制。\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 支持保存互斥成果後交具權者裁決。Wiki \u003ccode>concepts/worktree.md\u003c/code>、\u003ccode>concepts/conflict.md\u003c/code>、\u003ccode>examples/decision-cases.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P14、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://git-scm.com/docs/git-worktree\" rel=\"noopener noreferrer\" target=\"_blank\">P14 · Git · git-worktree\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/conflict.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/worktree.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/decision-cases.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p14-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/uncertainty-conflict-governance.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.05", "firstSlide": 280, "lastSlide": 283, "subtitle": "合併乾淨，畫面為什麼仍然錯？"}, {"id": "C42", "chapter": "04", "title": "衝突處理：何時暫停相依工作，何時保留原型比較", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把決定往後延，哪些人會繼續按同一個猜測工作？把工作打斷，哪些人又必須重新讀資料、重建環境？先畫依賴：一張票的結果成為另一張票的輸入，就從前者畫箭頭到後者。沿箭頭標出「這份工作若換一個答案會重做哪部分」。比較兩條路時，同時看剩多少工作、改動能否撤回，以及把兩種成果整合與重測的代價。\u003c/p>\n\u003ch2 data-section>依賴越多，延後裁決會影響哪些工作\u003c/h2>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 空字串要顯示全部還是空清單尚待決，而清單、匯出與統計都將沿用這個結果。每放行一張相依票，就可能多做一組建立在同一猜測上的測試。此時暫停受影響的票，保留各自的 commit（可回查的提交）與測試輸出，列出能獨立繼續的工作，再請具權者選擇行為。這條路付出等待、重新排程及恢復工作的時間，換取下游暫時不必跟著猜。收到裁決後，把同一條新預期傳給受影響者，逐項恢復。\u003c/p>\n\u003cp data-passage=\"p-3\">再把條件改成兩個唯讀原型已接近完成，各在獨立分支，也沒有下游依賴原型。此時可讓兩方在原授權內收尾，保留可比較的輸出；比較時固定資料、起始版本與驗收條件。選定行為後，整合者從保留下來的成果挑出符合契約的改動並重測。這樣能看到具體差異，也可能浪費其中一方的收尾工夫。若某版會搬移共用資料，就失去了「可逆且能獨立完成」的前提，須先停在具權者能審查的地方。\u003c/p>\n\u003cfigure>\u003cfigcaption>排程練習｜兩種情境各要保存什麼\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">要查的條件\u003c/th>\u003cth scope=\"col\">清單、匯出與統計共用待決結果\u003c/th>\u003cth scope=\"col\">兩個隔離的唯讀原型已近完成\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">再做下去的代價\u003c/th>\u003ctd>每張下游票都可能依錯誤預期返工\u003c/td>\u003ctd>下游尚未依賴原型，仍需投入比較與整合\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">交給裁決者的材料\u003c/th>\u003ctd>受影響票、候選行為、已做的提交\u003c/td>\u003ctd>同起點、同資料與驗收條件下的兩份輸出\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">授權內的處置\u003c/th>\u003ctd>凍結相依工作並保存現場\u003c/td>\u003ctd>保留可比較的版本，等具權者決定採用範圍\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cp data-passage=\"p-4\">\u003cstrong>驗收練習。\u003c/strong> 中斷是否一定代表刪掉已做的 commit？保留起點與提交，凍結的只是會繼續擴大影響的工作。若 Coordinator 沒有權限，能直接採用一版嗎？可以安排比較、估算返工與保存原件；改架構或改行為仍由獲授相應權限者批准。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 缺少同條件下兩種安排的成本紀錄，不能推算哪條路一定更快。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提出停工重排及保留分支兩種策略。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P14 說明保存獨立工作目錄的機制。比較條件見 Wiki \u003ccode>concepts/task-graph.md\u003c/code>、\u003ccode>examples/decision-cases.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、合成教學案例、個人直接觀點的轉述。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P14、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://git-scm.com/docs/git-worktree\" rel=\"noopener noreferrer\" target=\"_blank\">P14 · Git · git-worktree\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/conflict.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/task-graph.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/decision-cases.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p14-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/uncertainty-conflict-governance.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.06", "firstSlide": 284, "lastSlide": 288}, {"id": "C43", "chapter": "04", "title": "依賴阻塞：找出解除條件，選擇等待或轉工", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> BLOCKED 表示工作受到前置條件阻擋。看到這個字，接手排程的人要能說出「哪個條件、由誰解除、看到什麼可以繼續」。Task 是有目標和依賴的工作票，Dispatch 是執行這張票的一次派工。先對上目前有效的派工再查以下線索，舊嘗試留下的錯誤未必還在阻擋這張票。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"目前的線索表格\" data-passage=\"p-2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">目前的線索\u003c/th>\n\u003cth scope=\"col\">要查的原件\u003c/th>\n\u003cth scope=\"col\">解除條件或下一次觀察\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>缺上游資料\u003c/td>\n\u003ctd>票上指定的輸入、上游責任人及版本。\u003c/td>\n\u003ctd>具名產物到達，核對版本與格式後放行。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>等需求授權\u003c/td>\n\u003ctd>專案記錄中仍開放的問題，以及有權回覆者。\u003c/td>\n\u003ctd>取得可定位的批准及適用版本。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具還在跑或已報錯\u003c/td>\n\u003ctd>同次操作最近事件、實際錯誤及是否有新進展。\u003c/td>\n\u003ctd>等完成或查明錯誤原因，保留輸出再決定如何重試。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只有一段沉默\u003c/td>\n\u003ctd>查不到與有效派工相符的活動或退出證據。\u003c/td>\n\u003ctd>維持未知，先查原負責人與狀態，依 C44 決定可否接手。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>從上游原件辨認缺的是批准還是資料\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設 F2 是畫面工作票，正等有權者確認上游介面規格。專案記錄只有草案，上游票也尚未獲批；即使手上已有樣本資料，缺的仍是生效的規格。給 Worker 更多執行時間不會產生批准。若規格已核准，只缺依約輸出的樣本，解除者就換成上游產物的負責人。不要單看「還沒好」猜是哪一種。\u003c/p>\n\u003ch2 data-section>選擇等待、旁路、介入或轉案\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提出等待、旁路工作、介入及轉案四個選項。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 上游仍有進展且快要交付，可以保留上下文，約定收到產物時續做。若有獨立工作，可先準備在舊基線仍有效的單選測例；依賴草案的預期另標假設，避免把猜測傳給下一票。若多次嘗試都卡在同一未決問題，介入的具體動作是彙整差異送交能解阻者，代價是佔用協調及審查時間。若本案再無可做的事，可保存交接後改做已授權的獨立專案；返回時要重新讀取狀態。工具耗時隨環境與工作而變，沒有固定的故障分鐘數。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>驗收練習。\u003c/strong> F2 等的是資料、授權還是執行時間？題設給的是未批准規格，須等授權；若只有票名 F2，答案仍未知。為什麼不能把切換其他專案說成必然最優？寫下另一案可獨立推進的成果，再列離開與返回的成本；若原案即將解阻，等待可能省去兩次重讀。\u003c/p>\n\u003cp data-passage=\"p-6\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13（Orca，Experimental）支持工作票、依賴及派工的區分；上述分類是排程設計。Wiki \u003ccode>tutorials/scheduling-supervision-handoff.md\u003c/code>、\u003ccode>concepts/cost.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、教學編排、個人直接觀點的轉述。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P13、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/task-graph.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/decision-cases.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/scheduling-supervision-handoff.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.07", "firstSlide": 289, "lastSlide": 293, "subtitle": "一張票說「卡住」，要等什麼才放行？"}, {"id": "C44", "chapter": "04", "title": "Agent 失聯時的狀態查證與寫入權移交", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 「這次工作是否還在跑」、「誰有權寫」、「成果能否驗收」需要三種證據。先查工作票（Task）現在對應的派工嘗試（Dispatch）和負責人（owner）。執行軌跡（trace）把一次流程的事件串起來；最後一筆工具讀檔事件只能說明當時發生了什麼。若拿到另一個 Dispatch 的退出紀錄，即使票名相同，也回答不了這一次是否退出。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假定有效派工為甲。若能核對甲持續有新的執行活動，可判為「可確認仍在執行」；若只剩十分鐘前的軌跡且聯絡不上，記「未知」；若收到可對回甲的明確退出記錄，才記「已確認退出」。這三項是教學用的觀察分類。等待批准時也可能長時間安靜；看見程序退出則可能是成功、錯誤或被中止，還要另外查產物。\u003c/p>\n\u003cfigure>\u003cfigcaption>監督練習｜依同一次派工的證據決定如何接手\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">觀察到的事\u003c/th>\u003cth scope=\"col\">現在能確認什麼\u003c/th>\u003cth scope=\"col\">還要查什麼\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">同一嘗試持續產生新活動\u003c/th>\u003ctd>仍在執行\u003c/td>\u003ctd>查現任負責人與工作進度\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">只剩舊事件，暫時聯絡不上\u003c/th>\u003ctd>執行狀態未知\u003c/td>\u003ctd>查目前活動和寫入權，保留現場\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">有可對回本次派工的退出記錄\u003c/th>\u003ctd>這次執行已退出\u003c/td>\u003ctd>查最後產物、未提交改動與對外操作，再決定移交或驗收\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003ch2 data-section>移交前核對寫入權、最後產物與副作用\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 恢復時，從票取出有效嘗試、原 owner、起始版本、最後提交及尚未提交的改動。對照測試究竟跑在哪個版本、哪些未跑，再查外部副作用，例如上次嘗試是否已送出一次通知。通知若可能已送達，整段工作重跑會造成重複發送，先核對回執或升級處理。在舊嘗試仍可能寫入時，保留現場並請具權者查明或收回其寫入權。只有確認原嘗試已停止寫入、所有權已明確移交，才把新的有效 Dispatch、承接版本與新 owner 一起登記。從最後可驗證的產物續做，並把原嘗試回報保留在原編號下。若任何一項副作用還無法確認，先隔離那個步驟，報明未知範圍。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>驗收練習。\u003c/strong> 十分鐘沒回報、只剩舊 trace，應歸哪類？未知。補上同次 Dispatch 的明確退出記錄後，哪項判斷能改？可確認這次執行已退出，任務是否驗收仍需另證。如何避免兩個 Worker 同時修改相同任務？先確認舊寫入已停止或其權限已被有效收回，核對副作用與最後產物，再移交唯一有效的派工與所有權；另開一個會話本身解決不了雙寫。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13（Orca，Experimental）支持 Task／Dispatch，P28（OpenAI Agents SDK）支持 trace 的事件定位。\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提供監督與文件交接觀點。Wiki \u003ccode>concepts/supervision.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、教學編排、公開技術文件、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P13、P28、U-B\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://orca.dev/docs/cli/orchestration\" rel=\"noopener noreferrer\" target=\"_blank\">P13 · Orca · Orchestration\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.github.io/openai-agents-python/tracing/\" rel=\"noopener noreferrer\" target=\"_blank\">P28 · OpenAI Agents SDK · Tracing\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/supervision.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p13-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p28-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/scheduling-supervision-handoff.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.08", "firstSlide": 294, "lastSlide": 298, "subtitle": "十分鐘沒有回報，誰還能寫這張票？"}, {"id": "C45", "chapter": "04", "title": "工程證據追蹤：從完成回報查到整合版權限測試", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設需求是讓唯讀成員能看清單，仍不能修改清單。人類收到一句「權限已改好」。倘若上次測試只用管理者登入，畫面正常也無法回答唯讀成員能做什麼。這時可以從摘要沿四層往回查，再沿同一條路把結果帶回具權者。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"誰在讀或提供資料表格\" data-passage=\"p-2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">誰在讀或提供資料\u003c/th>\n\u003cth scope=\"col\">針對同一筆權限變更要找什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Human（具權的需求或安全審查者）\u003c/td>\n\u003ctd>先讀進度、風險、尚待決定的角色範圍；要求釐清誰可以讀、誰仍應被拒絕寫入。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Coordinator（協調者）\u003c/td>\n\u003ctd>用工作票 Task 查到當前有效的派工 Dispatch、負責人與證據位置；排除舊嘗試的回報。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Worker（執行者）\u003c/td>\n\u003ctd>交版本提交 commit、逐檔變動 diff，以及在該版本用唯讀成員讀取成功、寫入遭拒的測試命令、環境、實際輸出與未測項。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integrator（整合者）\u003c/td>\n\u003ctd>標出共同基準、投入的提交和整合後的提交；在整合版重跑讀與寫兩條路，檢查畫面與實際服務是否一致。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>從隱藏按鈕追到服務端的權限\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 若只測了按鈕隱藏，仍缺服務端拒絕寫入的證據。若測試記錄來自整合前的版本，就把原結果保留並要求補測共同基準。權限屬高風險變更，把缺證的路徑、對應 diff 與整合記錄交給有權審查存取控制的人；由具簽收權者依需求決定接受或退回。摘要讓人知道先查哪裡，每一層的版本指標才使這次追查走得通。\u003c/p>\n\u003ch2 data-section>讓接手者能憑文件找回同一份提交\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 交接文件可從下列空白的 \u003ccode>handoff.md\u003c/code> 起稿。先寫預期，實際結果待有原件再填；缺測時填「未測」及負責人。請接任者試著只憑文件找到同一個提交，說出下一步可以做什麼。\u003c/p>\n\u003cpre tabindex=\"0\" data-passage=\"p-5\">\u003ccode class=\"language-text\">任務／有效派工／目前 owner：\n起始版本 base／本次提交／diff 路徑：\n工作範圍／已改動的位置：\n預期行為／契約版本：\n已驗證的範圍／環境／命令／結果／輸出路徑：\n未測項／已知失敗／可能的副作用：\n阻塞／解除條件／待回覆者：\n下一步／接任者／決策或簽收原件位置：\n\u003c/code>\u003c/pre>\n\u003cp data-passage=\"p-6\">\u003cstrong>驗收練習。\u003c/strong> 摘要稱權限變更已完成，要追到哪些原件，何時交誰深入審查？從有效派工找到同版變更與測試，再確認整合提交；高風險權限或未測的服務端路徑交給具權審查者。哪項狀態應存成 Project State，而不是聊天記憶？專案採納的基準、適用的權限契約與未解的決策應進有版本與所有者的專案記錄；單票當前派工與未測項存入任務記錄，用指標連回專案。聊天裡的「昨天好像通過」缺少這些定位，無法讓接任者重建當時狀態。\u003c/p>\n\u003cp data-passage=\"p-7\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-C／U07 支持對高風險改動保持審查，S03 中 U07 支持文件交接。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> S03、S04 的分層與欄位是編輯提案。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P28 支持查執行事件，產品簽收另查授權紀錄。Wiki \u003ccode>examples/handoff-and-evidence.md\u003c/code>、\u003ccode>concepts/quality.md\u003c/code>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、合成教學案例、個人直接觀點的轉述。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P28、S03、S04、U-C\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://openai.github.io/openai-agents-python/tracing/\" rel=\"noopener noreferrer\" target=\"_blank\">P28 · OpenAI Agents SDK · Tracing\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/supervision.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p28-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s03-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s04-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/scheduling-supervision-handoff.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.09", "firstSlide": 299, "lastSlide": 303, "subtitle": "「權限變更已完成」要追到哪一份證據？"}, {"id": "C46", "chapter": "04", "title": "跨專案切換：記錄喚回條件與復工基準", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U-B／U07 提出在前置受阻時轉做其他已授權工作的策略。其前提是另一案可以獨立產生成果。若 B 也要讀取 A 尚待決的介面，換資料夾只會把同一個阻塞搬過去。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> U09 關於外部專案與私人管理資產分開的想法來自歷史重建；下列做法是依此設計的交接練習。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設 A 正等上游批准一個資料欄位，B 則有一項獨立、已授權的文件索引修正。離開前把 A 的 owner、有效 Dispatch（這一次派工）、base（起始版本）、最後 commit（提交）寫回任務記錄，列出尚未測的呼叫端、上游欄位的待決版本、何人回覆，以及「收到批准及對應版本」這個喚回條件。指定誰接收事件、誰通知原負責人；若責任並未移交，保留原 owner。再核對 B 的授權人、可改範圍與索引來源，確認它不消耗 A 尚缺的輸入，才切換工作。\u003c/p>\n\u003ch2 data-section>讓私人索引指回正式規格\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 管理外部專案時，私人管理檔可以記「哪個專案、最後看過哪版、哪張票等誰」，共享產品規格則回到該案指定的權威位置。私人筆記若保留舊欄位名稱，下次打開它時應循連結核對上游採納的版本；再比對下游仍使用哪一版、哪些測項需重跑。維持一份帶指標的索引，可以避免兩套互相競爭的正式規格，也把私人研究與交給外部維護者的資訊分開。\u003c/p>\n\u003ch2 data-section>重新開工前核對三個位置\u003c/h2>\n\u003cp data-passage=\"p-4\">返回 A 前，先確認基準、有效派工與所有權，再核對上游是否已按喚回條件交付。若基準前進，列出與自己最後提交間的差異；若已換 owner，先交接；若上游只給草案，仍保留阻塞。三者都核實後，才估算重讀規格、重建上下文與重跑測項的成本，再決定現在續做或重新排程。這也解釋了為何一次順利切換無法得出普遍適用的排程規則。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>驗收練習。\u003c/strong> 返回 A 前要先確認什麼？請交出權威基準、有效 owner 與派工、上游交付版本三個定位，再從交接單指出最後提交、未測項及恢復條件。若只有私人筆記稱「上游好了」而找不到批准版本，就還不能依該欄位恢復下游開發。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 現有來源未驗證跨案平台能自動完成這些步驟，也無切換速度的對照資料。\u003c/p>\n\u003cp data-passage=\"p-6\">來源為 U-B／U07、U09 及 S03，分別支持直接觀點、歷史背景與資訊管理設計。Wiki \u003ccode>tutorials/scheduling-supervision-handoff.md\u003c/code>、\u003ccode>concepts/supervision.md\u003c/code>、\u003ccode>concepts/cost.md\u003c/code>。若要設計相依票與整合基準，可回第三章；若要判斷切換是否值得其成本，可接第五章的量測方法。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、個人直接觀點的轉述、歷史研究重建。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　S03、U-B\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/supervision.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s03-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/scheduling-supervision-handoff.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "4.10", "firstSlide": 304, "lastSlide": 308, "subtitle": "離開專案 A 去做 B，怎樣才能回得來？"}, {"id": "C47", "chapter": "05", "title": "完成證據的五個層級：從回報到授權簽收", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">假設你在下一班接手維護。有人告訴你某個故障已修好。你得先找得到那份改動，才知道要測哪一版；你還得知道修的是哪項需求，才知道要觀察什麼。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 私人補充研究摘要 S04 提供一套編輯整理的五級證據鏈。可以把它當作追問順序，每往上一級，就多回答一個接手者無法靠前一份材料解決的問題。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cstrong>第一級是聲明，第二級是可定位的產物。\u003c/strong> 先記下誰對哪張工作票、哪一次派工回報。請執行該票的人（Worker）指出起始版本與交付版本，沿 Git 的提交識別碼（commit）找到檔案，用版本差異（diff）看實際新增或刪掉哪些行。如果回報指向上次已撤回的嘗試，要重新核對本次交付。即使找到新增的篩選按鈕，也只能確認程式變了。\u003cstrong>Agent 說「已完成」能證明功能正確嗎？\u003c/strong> 這句話可登記為回報；要判定功能，還要操作它並比對預期結果。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>第三級是某一版本上的指定檢查。\u003c/strong> 向執行者要版本、執行環境、測試入口與實際命令、可重新載入的固定測試資料（fixture）、預期值、實際值、程序退出碼及原始輸出位置。退出碼是程序結束時回傳的狀態。若工具因找不到資料而中止，應登記「未測得行為」，補齊資料再跑。若工具順利結束，仍要讀輸出，查指定測項是否真的執行、比對了什麼。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> OpenAI 的 P28 用 trace 串接一次流程，span 可定位一次工具操作的起訖；P20 以事先定的準則評估可觀察行為。找到啟動測試的事件，接下來仍要找該測項的輸出。\u003cstrong>找不到測試結果，只剩摘要時能否說通過？\u003c/strong> 可轉述執行者的說法並標「輸出待補」，待取回紀錄或在可識別版本重跑後更新。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>第四級檢查共同版本，第五級記誰接受。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 以工作票 F3 代表一次整合驗收。這張票要求選工作標籤時只見工作待辦、清除後恢復全清單、查未知標籤時得到空清單。後端提供待辦清單，前端負責顯示，兩位作者都可能用各自模擬的對端通過局部測試。整合者（Integrator）記下兩份輸入提交和共同目標提交，在合併後的版本操作真實介面，重跑跨模組案例和回歸測試（檢查原先可用的行為是否被改壞）。若前端清除時仍帶舊參數，退回該差異，保留重現方式並在修正版本重測。三條行為均有結果後，具權者才可逐條對需求判讀，記錄版本、接受或退回、例外、簽收者與日期。案例把正式接受的新基線稱為 B1。\u003cstrong>Worker 全綠但 Integrator 未跑回歸能否交付？\u003c/strong> 局部改動可交給整合者，F3 的整合門檻仍待測，B1 尚無簽收依據。就算整合測項全過，也得另查授權與接受紀錄。\u003c/p>\n\u003cp data-passage=\"p-5\">來源：T09、S04、P17、P20、P28；Wiki 的 \u003ccode>concepts/quality.md\u003c/code>、\u003ccode>concepts/supervision.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。要自己設計第三、四級的檢查，可讀 \u003ca href=\"#C48\">5.02\u003c/a>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P17、P20、P28、S04\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agent-evals\" rel=\"noopener noreferrer\" target=\"_blank\">P20 · OpenAI · Agent evals\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.github.io/openai-agents-python/tracing/\" rel=\"noopener noreferrer\" target=\"_blank\">P28 · OpenAI Agents SDK · Tracing\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/supervision.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p20-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p28-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s04-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.01", "firstSlide": 310, "lastSlide": 314, "subtitle": "從「已完成」到「可以簽收」，中間還缺什麼？"}, {"id": "C48", "chapter": "05", "title": "驗收測試設計：用反例與整合檢查揭露錯誤", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 待辦網站要新增單一標籤篩選。產品負責人想知道「選工作後是否只看見工作待辦」。若清單只有一項工作待辦 A，永遠顯示全部的錯誤程式也會給你 A。\u003cstrong>只在資料中放 A 能證明 work 篩選正確嗎？\u003c/strong> 加入應被排除的居家待辦 B，讓「全部回傳」與「確實篩選」產生可分辨的輸出。這就是 fixture 要同時放入相符與不相符資料的理由。\u003c/p>\n\u003cp data-passage=\"p-2\">先把 A 標成 work、B 標成 home，固定資料及版本。API 是前端向後端查資料的介面，UI 是使用者操作及看結果的畫面。在同一個整合版本留下以下三組預期，實際欄等執行後才填。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"操作表格\" data-passage=\"p-3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">操作\u003c/th>\n\u003cth scope=\"col\">讀取當次網路請求與真實 API 回應\u003c/th>\n\u003cth scope=\"col\">在畫面核對\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>選 work\u003c/td>\n\u003ctd>\u003ccode>GET /todos?tag=work\u003c/code>，只回 A\u003c/td>\n\u003ctd>清單有 A 且無 B\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接著清除篩選\u003c/td>\n\u003ctd>\u003ccode>GET /todos\u003c/code> 省略 tag，回 A、B\u003c/td>\n\u003ctd>B 重新出現，A 仍在\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查詢不存在的 missing\u003c/td>\n\u003ctd>\u003ccode>GET /todos?tag=missing\u003c/code>，狀態 200，空清單\u003c/td>\n\u003ctd>呈現有效的空結果，仍可清除\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>從畫面差異追查哪一步出錯\u003c/h2>\n\u003cp data-passage=\"p-4\">先用單元測試單獨驗標籤比對，再從畫面一路查到真實資料路徑。若後端回 A 而畫面還有 B，至少能把調查縮小到回應之後的顯示步驟。若測試用預寫的回應取代後端，即使顯示正確，也還要查真實請求是否帶對參數。清除的驗收須先建立已篩選狀態；直接開啟預設清單會錯過舊狀態殘留。大小寫、多選及空字串的語義在本題尚未定義，應請需求所有者釐清，再寫預期。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 做一張最小驗收面板，每列放需求、版本、檢查層次、預期、實際與證據位置，分列功能、整合、架構限制及剩餘風險。功能列記選取與清除；整合列核對同一次請求、回應和畫面；架構列檢查資料存取是否經指定介面。若專案要求回應時間或可近用性，另訂使用情境及可觀察門檻，未執行就留待測。\u003cstrong>同一測試通過 100 次能證明未測功能正確嗎？\u003c/strong> 重跑累積的是該條件下的觀察。先查哪一列仍空白，再決定要加哪個測項。一個總分無法代替個別專案對安全、效能或使用情境的要求。\u003c/p>\n\u003cfigure>\u003cfigcaption>合成練習｜先填驗收面板，再到同一整合版本補實際結果\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">檢查層次\u003c/th>\u003cth scope=\"col\">本次要對讀的證據\u003c/th>\u003cth scope=\"col\">實際結果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">功能\u003c/th>\u003ctd>先選 work 再清除，清單中的 B 應重新出現。\u003c/td>\u003ctd>待測\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">整合\u003c/th>\u003ctd>同一次清除的請求省略 tag，服務回 A、B，畫面也顯示 A、B。\u003c/td>\u003ctd>待測\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">架構\u003c/th>\u003ctd>由變更與架構檢查核對資料是否經指定介面存取。\u003c/td>\u003ctd>待查\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">剩餘範圍\u003c/th>\u003ctd>空字串行為尚待需求所有者釐清，先記錄未決規格。\u003c/td>\u003ctd>待決\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003ch2 data-section>Dungeon Lab 的單元測試漏看了什麼\u003c/h2>\n\u003cp data-passage=\"p-6\">\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 使用者的 Dungeon Lab 原工程紀錄提供兩種檢查分工的例子。第一輪報告 8/8 單元測試，實際瀏覽器仍發現窄視窗溢出，調整版面後才得到修正後的觀察。第二輪報告 12/12 單元測試及 58 項定時整合檢查通過；滑牆測試曾發現玩家卡在牆格接縫，修正碰撞矩形後另加測試，再重跑整合檢查。正式建置成功回答的是程式能產生可載入的成品，卡牆問題則需要讓角色實際抵牆移動。原案的瀏覽器、版本和操作限定了結論，這些數目也不能拿來當待辦網站的測試結果。\u003c/p>\n\u003cp data-passage=\"p-7\">來源：T09、P17、P20、U-C（U05、U06）、\u003ccode>examples/scenario.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。想判斷哪些風險需人檢查，可讀 \u003ca href=\"#C50\">5.03\u003c/a>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P17、P20、U-C\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agent-evals\" rel=\"noopener noreferrer\" target=\"_blank\">P20 · OpenAI · Agent evals\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p20-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.02", "firstSlide": 315, "lastSlide": 320}, {"id": "C50", "chapter": "05", "title": "風險導向程式碼審查：依測試證據決定審查深度", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者在 U07 提出把人力集中於架構限制、整合驗收、高風險改動和未覆蓋的路徑。困難在於，人要如何發現哪些地方需要他深入閱讀？\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Ryan Lopopolo 在 OpenAI 的 P17 案例將架構依賴限制做成可執行檢查。這提供了一種找出違規位置的方法；其效果取決於本案寫了哪些規則及測試。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先列出不容改變的架構約定，例如畫面只能透過指定的資料層讀取資料。若變更直接跨層存取，讓架構檢查指出違規檔案。接著跑單元測試，獨立比對某段邏輯的輸出，再跑整合測試，查模組組合後及目標版本上的實際行為。最後由審查者對照本次差異、已覆蓋的行為和失敗時的後果，逐項決定要深入追哪條路。若規則還沒寫成檢查，該項要交人核對，不能從綠燈推定架構合規。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>為什麼減少閱讀量不等於降低品質門檻？\u003c/strong> 全部逐行讀的方式把人工投入分散到每個檔案；風險優先的方式讓重複且可判定的規則先由工具核對，人再檢查高代價的失敗、架構例外及測試盲點。兩案都要達到同一套產品及整合門檻。要主張少花人工，需要量審查、補測和返工的時間；僅知道讀了幾行還不足以判定節省多少。\u003c/p>\n\u003ch2 data-section>用舊資料查出測試沒走過的路\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 更新資料欄位後，新建的待辦仍可正確篩選。測試若只建新資料，完全沒走過舊資料遷移。審查者應找出遷移前後的對應、抽取具代表性的舊版資料驗證、確認失敗時如何恢復，再把證據交給授權者。\u003cstrong>哪類修改應強制人工批准？\u003c/strong> 在本例的專案契約中，權限變更、可能遺失資料的遷移及安全邊界變動須經具權者批准。對架構例外或測試未覆蓋的高風險路徑，先要求深入審查，釐清後果並補驗，依專案授權決定是否接受例外。測試通過只能解除它實際檢查過的疑問。\u003c/p>\n\u003cp data-passage=\"p-5\">來源：U-C（U07）、P17、S04、T09、\u003ccode>concepts/harness.md\u003c/code>、\u003ccode>concepts/quality.md\u003c/code>。若產品已可接受，仍想了解交付是否順暢，可讀 \u003ca href=\"#C49\">5.04\u003c/a>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、個人直接觀點的轉述。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P17、S04、U-C\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s04-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.03", "firstSlide": 321, "lastSlide": 323, "subtitle": "少讀一些程式碼，怎樣仍對驗收負責？"}, {"id": "C49", "chapter": "05", "title": "分開評估產品品質與交付過程", "track": "", "role": "core", "parent": "", "lead": "假設你要評一項待辦網站改動。驗收者能從畫面確認工作標籤是否只列工作待辦，協調者則能從派工記錄查出中途有沒有換人。兩人手上的材料各回答一個問題。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 提醒我們分開問交付物是否達標，以及取得它的過程是否順利。前者可以看驗收輸出，後者可能得翻派工與人工支援紀錄。若到事後才挑最顯眼的事件來定義「不順」，同一份紀錄很容易被解讀成相反結論。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在工作開始前訂兩條課堂規則。產品合格須選 work 只見工作待辦、清除恢復全清單、未知標籤顯示空清單，三條契約全過。交付順利須本輪沒有未計畫重派，即原本安排之外把同一項工作另交一次。兩軸的紀錄都齊全時，才能把交付放入下表的四種結果之一。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"兩軸均有完整紀錄表格\" data-passage=\"p-3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">兩軸均有完整紀錄\u003c/th>\n\u003cth scope=\"col\">無未計畫重派（順）\u003c/th>\n\u003cth scope=\"col\">有未計畫重派（不順）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>三條全過（合格）\u003c/td>\n\u003ctd>合格／順\u003c/td>\n\u003ctd>合格／不順\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>至少一條確知未過（不合格）\u003c/td>\n\u003ctd>不合格／順\u003c/td>\n\u003ctd>不合格／不順\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-4\">\u003cstrong>三條契約全過、返工兩次，能判哪一軸？若另有一次未計畫重派的記錄，結果如何？\u003c/strong> 前半題能判產品合格，過程資訊不足，留在矩陣外。返工是修正先前的工作，同一人也能返工，所以無從據此推斷重派。補得重派紀錄後才落在「合格／不順」。若另一隊交出相同品質的產品，且完整派工紀錄顯示全程按原安排執行，它落在「合格／順」。兩份紀錄沒有工時或費用，就只比較分類。這是編者為教學設定的門檻，其他專案若在意等待時間，應事前另定規則。\u003c/p>\n\u003ch2 data-section>怎樣留下足以判斷交付過程的紀錄\u003c/h2>\n\u003cp data-passage=\"p-5\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 實作時每筆事件寫明工作票、嘗試識別、起訖、原因、處置及原件位置。遇到前置工作未就緒，從不能推進記到解除阻塞；重派沿派工紀錄逐次計數；人工救援記誰何時介入及花多少時間。分開記衝突檔案與解決方式、回歸失敗的測項、因退回而重做的工作及其重測結果。同一失敗引發重派與返工時，兩筆引用同一事件以便追查。\u003cstrong>沒有原始紀錄可否直接填 0 次返工？\u003c/strong> 缺值表示尚無足夠觀察；只有紀錄涵蓋整個約定期間並能辨認這類事件，才有理由填零。\u003c/p>\n\u003cp data-passage=\"p-6\">來源：U-C（U07）、S04、S05、T09、\u003ccode>concepts/quality.md\u003c/code>、\u003ccode>concepts/cost.md\u003c/code>、\u003ccode>examples/handoff-and-evidence.md\u003c/code>。量化同一段交付可接 \u003ca href=\"#C51\">5.05\u003c/a>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、合成教學案例、個人直接觀點的轉述。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　S04、S05、U-C\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s04-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.04", "firstSlide": 324, "lastSlide": 327, "subtitle": "產品合格，這次交付就算順利嗎？"}, {"id": "C51", "chapter": "05", "title": "工程時間計量：牆鐘時間、Agent 工時與人工投入", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">團隊想知道增派人手能否趕上交付。提早拿到結果，與兩位執行者合計少做了多少工作，是兩個需要不同資料的問題。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 牆鐘時間指外部觀察者從共同起點到終點實際經過的時間。本章選擇需求獲准開始到具權者接受，期間等待授權、測試、整合與返工都會讓時鐘前進。若截止時仍未接受，就記「未完成」與已觀察到的時長。累計 Worker 工時則把每位執行者按同一口徑記錄的工作區間長度相加；先約定工作區間是否含工具等待，才能比較。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> \u003cstrong>A、B 並行各十分鐘，牆鐘必然二十分鐘嗎？\u003c/strong> 在紙上畫三行，上面兩行各放一條十分鐘的工作帶。若兩條同時開始又同時結束，累計執行者時間是二十分鐘，兩條所覆蓋的共同時段只有十分鐘。第三行從獲准開始畫到簽收，若最後還等整合者重測或等人批准，第三行會比共同工作時段長。僅知道兩條帶的長度，既不知道重疊多少，也不知道何時接受。這是題設演算，並無本案計時樣本。\u003c/p>\n\u003cfigure>\u003cfigcaption>合成時間軸｜同時開始的兩段工作\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">時間帶\u003c/th>\u003cth scope=\"col\">第 0 至 5 分\u003c/th>\u003cth scope=\"col\">第 5 至 10 分\u003c/th>\u003cth scope=\"col\">第 10 分之後\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">執行者 A\u003c/th>\u003ctd colspan=\"2\">起點 ━━━━━━━━━ 停手（10 Agent·分）\u003c/td>\u003ctd>後續工時未知\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">執行者 B\u003c/th>\u003ctd colspan=\"2\">起點 ━━━━━━━━━ 停手（10 Agent·分）\u003c/td>\u003ctd>後續工時未知\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">外部時鐘\u003c/th>\u003ctd colspan=\"2\">起點 ━━━━━━━━━ 經過 10 分鐘\u003c/td>\u003ctd>等待整合、批准 → 簽收時刻未知\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>重疊時段合計用了 20 Agent·分。要算整輪交付時間，另找需求獲准與具權者簽收的時刻。\u003c/p>\u003c/figure>\n\u003ch2 data-section>讓人工、工具和用量回到同一張票\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 用一張票串起下列資料。一次重測既會占用牆鐘，也可能占用工具和人工，保留各欄單位及共同事件編號，就能解釋延遲發生在哪裡，避免把互相重疊的分鐘加成總耗時。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"要問的量表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">要問的量\u003c/th>\n\u003cth scope=\"col\">可重查的記法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>牆鐘、累計執行者時間\u003c/td>\n\u003ctd>用同一時基的開始與接受事件算經過時間。另逐人記各次嘗試的開始、結束與等待口徑，保留失敗嘗試。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人類介入\u003c/td>\n\u003ctd>逐次記審查、答疑、救援的開始及結束，按人加總人分鐘。等待回覆可另計阻塞，與人實際處理時間分列。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型用量\u003c/td>\n\u003ctd>Token 是模型處理文字等輸入輸出的計量單位。依模型及呼叫記實際回報的輸入、輸出用量和重試，缺報表就標缺值。不同單位不能直接相加當金額。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具、阻塞、重試\u003c/td>\n\u003ctd>記每次工具或測試起訖、退出狀態，保留未通過的嘗試。另記等待原因、解除時點，以及同一操作額外再做幾次。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>整合返工、維護\u003c/td>\n\u003ctd>從被退回的差異追到修正、重測與接受，記處理者、時間及原因。往後修改共用規範或測試的維護投入，另列觀察期間。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-5\">\u003cstrong>沒有人工介入記錄能宣稱沒有人介入嗎？\u003c/strong> 查工時紀錄涵蓋哪些人與時段；若只有模型用量報表，人工欄只能填未知。少用 Token 也可能伴隨較多人工救援。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> U10 所提個人時間公式的原文、符號及適用前提尚缺。上述時段的計算是教材的量測定義，沒有重建該式，亦無法據此填入使用者的節省比例。\u003c/p>\n\u003cp data-passage=\"p-6\">來源：T09、P20、U-C（U07、U10）、S05、\u003ccode>concepts/cost.md\u003c/code>。若要用這張表比較兩組工作方式，可讀 \u003ca href=\"#C52\">5.06\u003c/a>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P20、S05、U-C\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agent-evals\" rel=\"noopener noreferrer\" target=\"_blank\">P20 · OpenAI · Agent evals\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p20-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.05", "firstSlide": 328, "lastSlide": 334, "subtitle": "兩位執行者同時工作，時間該記在哪一欄？"}, {"id": "C52", "chapter": "05", "title": "單 Agent 與多 Agent 的效率比較：對齊條件與試次", "track": "", "role": "core", "parent": "", "lead": "這一頁用兩對紙上試次練習讀表。兩組要交出相同的待辦篩選功能，經同樣的驗收才算交付。後面的深入練習另給三對合成試次，各題的預算和結果請對照該題的表。", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">假設一位 Agent 從頭做到尾，另一組把後端和畫面分給兩位 Agent。第二組先報完成。若一方計到自己寫完，另一方計到產品簽收，即使兩個時鐘都準確，也無從回答哪種分工能更早交付相同品質的功能。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> OpenAI 在 P20 說明以代表性案例和明確準則反覆評估流程；\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把這個思路用在本題，可在任何試次開始前寫下對照方案。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"固定項表格\" data-passage=\"p-2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">固定項\u003c/th>\n\u003cth scope=\"col\">兩組共同的起點與門檻\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>需求及產物\u003c/td>\n\u003ctd>同一份已核准的單標籤需求，排除多選與寫入。每次從同一個乾淨的起始提交（此處稱 B0）獨立開始。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>環境及許可\u003c/td>\n\u003ctd>相同模型設定、工具與依賴版本、可用操作、權限及資源限制。記錄兩組不可避免的差異，例如並行執行的配額。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料及驗收\u003c/td>\n\u003ctd>同一組固定資料 A(work)、B(home)，真實介面測選取、清除及未知標籤，採用相同架構與回歸檢查、簽收條件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>試次與計時\u003c/td>\n\u003ctd>兩組事先約定相同的重複次數、超時及失敗規則、起點與終點。每次重設資料，記執行順序、快取狀態與人工介入，避免一方直接沿用上次答案。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> \u003cstrong>如果多 Agent 放寬驗收，時間更短能稱贏嗎？\u003c/strong> 若多 Agent 組只查後端，單 Agent 組還查使用者畫面，先記兩組實際測到什麼。放寬門檻已改變待比較的工作；要回答原問題，兩組需按原門檻補做相同條件的試次。改模型或換工具也應列為條件變動，否則無法把差距歸給分工。\u003c/p>\n\u003ch2 data-section>每次開跑都占一列\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 每次獨立嘗試填一列。欄位留白表示尚未執行；試跑後，凡未取得的欄位寫明缺值原因。未完成的試次仍占一列，記觀察截止時間、停在哪裡，不能把它算成在截止時完成。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"試次、組別與順序表格\" data-passage=\"p-5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">試次、組別與順序\u003c/th>\n\u003cth scope=\"col\">基線、條件偏差\u003c/th>\n\u003cth scope=\"col\">契約結果、成功／失敗／未完成\u003c/th>\n\u003cth scope=\"col\">至接受時間或觀察截止\u003c/th>\n\u003cth scope=\"col\">人工、Token、重試與整合返工\u003c/th>\n\u003cth scope=\"col\">證據與限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-6\">先以全部試次為分母報告合格、失敗與未完成數，再對同門檻下達標的交付報告時間分布與人工、用量。保留個別值及樣本數，讓讀者看出極端等待或少數成功樣本的影響。若大量試次逾時，只報成功者的交付時間會讓較常失敗的方式看似很快。即使有差異，結論也只能限定在測過的任務、條件與樣本。\u003c/p>\n\u003cp data-passage=\"p-7\">\u003cstrong>試著填兩對資料。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 開跑前編好配對號，每對從 B0 重設，採上表相同契約、資料與驗收；一組由一位 Agent 執行，另一組由兩位 Agent 分工。兩組都在需求獲准時發出同一委託並開始計時，至具權者簽收才記交付時間。此練習預先訂每試次最多 30 分鐘、全組合計 12,000 token，任一上限先到就停止。返工和等待占用同一份預算；確認無法繼續的錯誤列失敗，到截止仍在做列未完成。某個觀察欄取不到就註明原因，不用零代替。\u003c/p>\n\u003cp data-passage=\"p-8\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 下表是已填的紙上練習；上面的空表留給實際試次。假設兩對的工具、版本與權限相同，每對重置資料與快取，第二對交換先後。時間皆自該次發出委託起算，並行組的 token 與人工按整組記。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"配對／組別（順序）表格\" data-passage=\"p-9\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">配對／組別（順序）\u003c/th>\n\u003cth scope=\"col\">契約結果與依據\u003c/th>\n\u003cth style=\"text-align:right\" scope=\"col\">至簽收（分）\u003c/th>\n\u003cth style=\"text-align:right\" scope=\"col\">結束觀察（分）\u003c/th>\n\u003cth scope=\"col\">人工（分）／token／重試次數\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>甲／單（先）\u003c/td>\n\u003ctd>三個行為與回歸均過，有簽收\u003c/td>\n\u003ctd style=\"text-align:right\">24\u003c/td>\n\u003ctd style=\"text-align:right\">24\u003c/td>\n\u003ctd>3／8,000／0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>甲／多（後）\u003c/td>\n\u003ctd>同門檻簽收，含一次整合退修\u003c/td>\n\u003ctd style=\"text-align:right\">18\u003c/td>\n\u003ctd style=\"text-align:right\">18\u003c/td>\n\u003ctd>5／10,000／1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>乙／多（先）\u003c/td>\n\u003ctd>兩人用量合計先到上限，清除路徑仍待複驗，未完成\u003c/td>\n\u003ctd style=\"text-align:right\">—\u003c/td>\n\u003ctd style=\"text-align:right\">20\u003c/td>\n\u003ctd>6／12,000／1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>乙／單（後）\u003c/td>\n\u003ctd>確認執行環境故障，無法繼續，列失敗；畫面缺測\u003c/td>\n\u003ctd style=\"text-align:right\">—\u003c/td>\n\u003ctd style=\"text-align:right\">9\u003c/td>\n\u003ctd>缺測（人工計時漏記）／3,000／0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>從四筆紀錄算交付比例與成對成本\u003c/h2>\n\u003cp data-passage=\"p-10\">兩組各自啟動了兩次，分母都取 2。若另有排定但尚未開跑的試次，應另列排程缺口。就這四筆已啟動的紀錄來算，單組簽收 1/2、失敗 1/2、未完成 0/2；多組簽收 1/2、失敗 0/2、未完成 1/2。表內可作同對交付時間比較的只有甲，多組在這個例子早 6 分鐘簽收，也多用 2 分鐘人工及 2,000 token。乙的 20 與 9 都是停止觀察的時間，沒有可相減的簽收時間；人工漏記也無從算出兩對完整的人力差。這些數值只示範讀表，實際效率差異仍須用同條件資料檢驗。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> U10 缺個人時間公式的原文與前提，這裡的截止值只是練習設定。\u003c/p>\n\u003cp data-passage=\"p-11\">\u003cstrong>Dungeon Lab 有測試，能證明多 Agent 一定更快嗎？\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> U05、U06 記錄的是單 Agent 工程案例中兩輪不同版本的功能檢查。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 缺少從相同版本完成同一需求的另一組，也缺成對的成本觀察，不能把兩輪測項數的差異當加速成績。「可並行的工作也許能縮短交付」可提出為待驗假設，應依本單元的試次表收集能推翻它的結果。\u003c/p>\n\u003cp data-passage=\"p-12\">來源：P20、U-C（U05、U06）、T09、\u003ccode>concepts/cost.md\u003c/code>、\u003ccode>concepts/quality.md\u003c/code>、\u003ccode>examples/scenario.md\u003c/code>。要比較使用者取得的價值，可轉 \u003ca href=\"#C53\">5.07\u003c/a>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、教學編排、待比較的假設、合成教學案例。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P20、U-C\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agent-evals\" rel=\"noopener noreferrer\" target=\"_blank\">P20 · OpenAI · Agent evals\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p20-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.06", "firstSlide": 335, "lastSlide": 343}, {"id": "C52-01", "chapter": "05", "title": "效率試驗設計：固定基線、資源與驗收門檻", "track": "", "role": "lesson", "parent": "C52", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">要替待辦網站增加按標籤篩選的功能，可以讓一位助手從頭做到簽收，也可以讓幾位助手分頭寫資料服務和畫面，再整合。假設第二組先喊完成：它從分工完成才開始計時，交的又只有資料服務；第一組從領票就計時，還必須讓使用者在畫面上操作清除。這兩個分鐘數混入不同的準備時間與驗收工作，無法回答哪種分工較早交出同等品質的產品。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-2\">一次獨立領票算一次試次\u003c/h2>\n\u003cp data-passage=\"p-3\">先定義完整產品。清單裡的 A 是工作事項、B 是生活事項；使用者篩選和清除後，資料服務（API）的回應和畫面（UI）都要合乎同一規則。再把每次重新開始的乾淨版本記作 B0、固定測試資料稱為 fixture。把模型設定和執行環境分別登記為 M1、E1，將分工方式留作唯一刻意改動的一項。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"控制項表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">控制項\u003c/th>\n\u003cth scope=\"col\">單組與多組共同約定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>需求／基線\u003c/td>\n\u003ctd>每次從乾淨 B0 開始，單標籤精確比對，排除多選及資料寫入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料／產品門檻\u003c/td>\n\u003ctd>A(work)、B(home)；真實 API 與 UI 驗 work→[A]、清除省略 tag→[A,B]、missing→[] 且 HTTP 200；架構與既有回歸皆通過，交同一簽收角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型／工具／資源\u003c/td>\n\u003ctd>全部使用同一 M1 模型快照及推理設定；E1 固定依賴、Shell、Browser 與編輯工具版本；同一可寫範圍、每組每試次全部呼叫合計最多 16,000 token（模型處理的文字單位），機器配額相同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>唯一刻意變動\u003c/td>\n\u003ctd>單組由同一助手實作並整合；多組由協調者將 API、UI 分給不同 Agent 再整合；兩組均計入規劃與整合，人類核准與簽收權相同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>次數／順序\u003c/td>\n\u003ctd>假設各 3 次，配對順序單多、多單、單多；每次重置 B0、資料、快取和工作脈絡，不帶前次解法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>時鐘／終止\u003c/td>\n\u003ctd>收到同一需求起計，簽收才記成功時間；滿 30 分或全組達 16,000 token 就截止，兩個預算內可返工；最終交驗被拒且結案記失敗；截止仍開放記未完成\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-5\">逐列橫讀兩組共同承諾的條件。每回收到需求時記開始，在終局拒收或預算先到時記終止，只有具權者簽收才記接受。用於真實工作時，把表中的示意代號換成可回查的版本識別、設定及證據位置。並行配額、帳戶限制或快取若有差異，也要記下偏差及可能影響，才能判斷要不要在可比條件下重做。\u003c/p>\n\u003cp data-passage=\"p-6\">如果多組只查 API 就提前交卷，該列保留原來的終局和偏差，明記欠 UI 與共同簽收。要回答原來的問題，需以相同品質門檻重做。此處及本組故事板安排三對紙上試次；正式教材 C52 用另一份兩對試次解說，兩份資料各自計算。\u003c/p>\n\u003cp data-passage=\"p-7\">OpenAI P20 提供以明確準則反覆評估的公開方法。T09 與控制表是設計中的合成方案，U-C 是專案提供者品質與成本研究的私人摘要；以上來源沒有這項對照的實測結果。\u003c/p>\n\u003cp data-passage=\"p-8\">\u003ca href=\"#C52\">5.06 正文\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T09 驗證與效率\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">成本\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">品質\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P20\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-C 摘要\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003chr data-passage=\"p-9\">\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　P20、T09、U-C\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agent-evals\" rel=\"noopener noreferrer\" target=\"_blank\">P20 · OpenAI · Agent evals\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p20-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.06.01", "firstSlide": 344, "lastSlide": 350, "subtitle": "開跑前，把兩組要交的產品寫在同一張表上"}, {"id": "C52-02", "chapter": "05", "title": "用六筆合成試次比較單 Agent 與多 Agent 的交付與成本", "track": "", "role": "lesson", "parent": "C52", "lead": "", "kind": "試次比較", "body": "\u003cblockquote>一個團隊想替待辦網站加上標籤篩選。可以讓一位 Agent 做完整項修改，也可以讓幾位 Agent 分頭做，最後再把成果接起來。怎麼知道哪種安排較有效率？以下用六次虛構的工作紀錄來練習比較。所有數字都是教學用的合成資料。\u003c/blockquote>\n\u003cp>假設分工的那組最早把可用的網站交到你手上。這回答了「這次等了多久」，卻還不足以幫你安排下次工作。那次交付可能要人花更多時間協調；同一組接下來也可能有兩次都來不及交。要把這些代價看清楚，先約定什麼算「做好」，再決定從哪一刻開始記帳。\u003c/p>\n\u003ch2 data-section>把兩種做法放回同一條起跑線\u003c/h2>\n\u003cp>兩組接相同的需求，用同樣的方式簽收。測試用的清單只有工作事項 A 和生活事項 B。把網站畫面連上實際的資料服務後，選工作標籤 \u003ccode>work\u003c/code> 應只看見 A；清除時，畫面送出的請求要省略標籤參數 \u003ccode>tag\u003c/code>，並重新顯示 A、B。選沒有對應事項的標籤 \u003ccode>missing\u003c/code>，服務要回 HTTP 200（已成功處理請求）和空清單，畫面也要顯示空清單。最後還要通過共同的架構檢查與既有功能的回歸測試。若一組測到資料介面就停、另一組還得修好畫面，即使兩邊都寫「完成」，耗時也無法直接比較。\u003c/p>\n\u003cp>每回開始前，都還原相同的乾淨程式版本，這個起點記為 \u003cstrong>B0\u003c/strong>。兩組使用相同的模型設定，記為 \u003cstrong>M1\u003c/strong>；可用工具、軟體依賴和執行環境也固定，記為 \u003cstrong>E1\u003c/strong>。兩組用同一份資料、權限和機器配額，由相同角色簽收。每回都重置快取與工作脈絡，以免後做的一方帶著上一回的修正或答案開工。若條件真的變了，在該列寫明偏差，留給讀表的人判斷。\u003c/p>\n\u003cp>一次獨立接下需求、從頭做到簽收、拒收或截止，稱為一次\u003cstrong>試次\u003c/strong>。過程中的重跑仍算在這一次。此例安排三對，每對讓兩種做法各跑一次，並保留實際先後順序；重複測量才看得到一次順利、另一次受阻的差異。從收到需求起計，包括規劃、等待、重試、整合和簽收。每次最多 \u003cstrong>30 分鐘\u003c/strong>，並給全組所有模型呼叫合計 \u003cstrong>16,000 token\u003c/strong> 的用量額度。token 是模型處理文字等內容時所計的單位。兩個上限哪個先到，就在那裡停止觀察。即使派出多位 Agent，它們也共用這一次試次的額度。\u003c/p>\n\u003ch2 data-section>同一列工作，有幾種不同的時間\u003c/h2>\n\u003cp>先判定結果。通過全部門檻且獲簽收，記為\u003cstrong>成功\u003c/strong>。最後一次驗收明確拒收、這回也結案了，記為\u003cstrong>失敗\u003c/strong>。到截止仍在等工具或返工，記為\u003cstrong>未完成\u003c/strong>。中途測出錯而繼續修，仍屬原試次；依實際發生的事分別登記重試、整合返工及原因。算簽收比例時，已經啟動的三次都要進分母。\u003c/p>\n\u003cp>\u003cstrong>牆鐘時間\u003c/strong>是人看著時鐘實際等了多久。「接受分」只在簽收時填，表示從領到需求到簽收的分鐘數；「終止分」是從領到需求到停止觀察的分鐘數，每次都要填。把每位 Agent 實際工作的分鐘分別相加，得到\u003cstrong>累計 Agent·分\u003c/strong>。例如兩位同時工作，各做 10 分鐘，時鐘只走過 10 分鐘，卻用了 20 Agent·分。若人另外花 3 分鐘檢查交件，人工投入就記 3 人分；這 3 分鐘也可能和 Agent 的工作重疊。六筆紀錄沒有各 Agent 的起訖明細，無法從牆鐘時間反算累計 Agent·分。\u003c/p>\n\u003cp>\u003cstrong>Token\u003c/strong> 欄加總全組呼叫，人工欄加總人實際投入的時間；兩欄回答的資源問題不同。重試指再嘗試一次操作，整合返工指把產物接起來發現問題而回頭修改。分開記次、寫下原因，才能分辨時間花在恢復工具還是修正兩份成果之間的配合。\u003c/p>\n\u003ch2 data-section>先橫讀一列，再找能成對比較的兩列\u003c/h2>\n\u003cp>表中的「單」是一位 Agent，「多」是多位分工。依序號配對：甲是第 1、2 列，乙是第 3、4 列，丙是第 5、6 列；乙這一對是多組先做。先讀第 1 列：這次獲得簽收，「24／24」表示第 24 分鐘簽收並停止觀察；「4／8000」記下 4 人分和 8,000 token；「1／0」表示重試一次、整合返工零次。最後一欄解釋為什麼要重跑。其他列也按這個順序讀。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"序／組表格\">\u003ctable class=\"cols-6\">\u003cthead>\u003ctr>\u003cth scope=\"col\">序／組\u003c/th>\u003cth scope=\"col\">契約與狀態\u003c/th>\u003cth scope=\"col\">接受分／終止分\u003c/th>\u003cth scope=\"col\">人分／token\u003c/th>\u003cth scope=\"col\">重試／整合返工次\u003c/th>\u003cth scope=\"col\">模擬觀察與限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"序／組\">1 單\u003c/td>\u003ctd data-label=\"契約與狀態\">全門檻通過，成功\u003c/td>\u003ctd data-label=\"接受分／終止分\">24／24\u003c/td>\u003ctd data-label=\"人分／token\">4／8000\u003c/td>\u003ctd data-label=\"重試／整合返工次\">1／0\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">首次測試資料路徑錯，重跑後簽收\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"序／組\">2 多\u003c/td>\u003ctd data-label=\"契約與狀態\">全門檻通過，成功\u003c/td>\u003ctd data-label=\"接受分／終止分\">16／16\u003c/td>\u003ctd data-label=\"人分／token\">5／11000\u003c/td>\u003ctd data-label=\"重試／整合返工次\">0／0\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">兩份產物整合後簽收\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"序／組\">3 多\u003c/td>\u003ctd data-label=\"契約與狀態\">終局驗收拒絕，失敗\u003c/td>\u003ctd data-label=\"接受分／終止分\">無／18\u003c/td>\u003ctd data-label=\"人分／token\">6／9000\u003c/td>\u003ctd data-label=\"重試／整合返工次\">1／1\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">清除仍見 A，該回結案\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"序／組\">4 單\u003c/td>\u003ctd data-label=\"契約與狀態\">全門檻通過，成功\u003c/td>\u003ctd data-label=\"接受分／終止分\">20／20\u003c/td>\u003ctd data-label=\"人分／token\">3／7000\u003c/td>\u003ctd data-label=\"重試／整合返工次\">0／0\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">三種 UI 路徑及回歸通過\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"序／組\">5 單\u003c/td>\u003ctd data-label=\"契約與狀態\">截止，未完成\u003c/td>\u003ctd data-label=\"接受分／終止分\">無／30\u003c/td>\u003ctd data-label=\"人分／token\">4／缺值：報表未取得\u003c/td>\u003ctd data-label=\"重試／整合返工次\">0／0\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">Browser 入口仍待恢復\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"序／組\">6 多\u003c/td>\u003ctd data-label=\"契約與狀態\">截止，未完成\u003c/td>\u003ctd data-label=\"接受分／終止分\">無／30\u003c/td>\u003ctd data-label=\"人分／token\">7／13500\u003c/td>\u003ctd data-label=\"重試／整合返工次\">2／2\u003c/td>\u003ctd data-label=\"模擬觀察與限制\">整合版本仍在返工\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第 3 列到第 18 分鐘確定拒收，沒有簽收時刻。第 5 列則等到第 30 分鐘，瀏覽器的驗收入口還沒恢復，事情仍未做完。這兩列的接受分都填「無」，真正觀察到的時間分別是 18 和 30 分鐘。第 5 列的 token「缺值」表示報表沒拿到，而重試欄的 0 表示已知一次也沒有。把缺值填成零會低估成本，把 30 填作接受分則會憑空多算一次交付。\u003c/p>\n\u003ch2 data-section>最快的 16 分鐘能支持多大的結論？\u003c/h2>\n\u003cp>先數交付。單組啟動三次，在第 1、4 列簽收兩次，簽收比例是 \u003cstrong>2/3\u003c/strong>。多組也啟動三次，只有第 2 列簽收，比例是 \u003cstrong>1/3\u003c/strong>。再比兩邊都交出同等成果的情形。只有甲符合，單組花 24 分鐘，多組花 16 分鐘，這一對多組早了 \u003cstrong>24 − 16＝8 分鐘\u003c/strong>。乙的多組已拒收，丙的兩組都未完成，這兩對沒有可相減的簽收時間。\u003c/p>\n\u003cp>再把所有已開跑的列加起來，包含失敗與截止的投入。單組用了 \u003cstrong>4＋3＋4＝11 人分\u003c/strong>，多組用了 \u003cstrong>5＋6＋7＝18 人分\u003c/strong>。多組 token 合計 \u003cstrong>11,000＋9,000＋13,500＝33,500\u003c/strong>；單組只有 \u003cstrong>8,000＋7,000＝15,000\u003c/strong> 的已知小計，第 5 列仍缺值。用量上限是給每一次獨立試次，這裡的加總則橫跨三次。只挑最快那列，會同時漏掉其他試次消耗的人力和未能交件的結果。\u003c/p>\n\u003cp>這份表能教我們把「某一次交得快」「幾次能交成」「總共花掉多少資源」分開報告。每組只有三次、僅一對雙方都成功，還缺一筆用量；更重要的是，六列來自紙上設計。要判斷真實團隊是否值得採用分工，需要相同條件下實際開跑的完整紀錄。\u003c/p>\n\u003ch2 data-section>換成自己的任務時，從一張空表開始\u003c/h2>\n\u003cp>每次真正開始才新增一列，尚未開跑的排程另記。起訖用同一時區。若提前拒收，記下終止時刻和拒收原因，接受耗時填「無」。保留測試輸出或阻塞紀錄的位置，寫明哪些檢查沒做；遇到工具或版本偏差，也跟著該列保存。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"試次／組／順序表格\">\u003ctable class=\"cols-8\">\u003cthead>\u003ctr>\u003cth scope=\"col\">試次／組／順序\u003c/th>\u003cth scope=\"col\">基線／條件／偏差\u003c/th>\u003cth scope=\"col\">起始／接受或截止\u003c/th>\u003cth scope=\"col\">契約結果／狀態／原因\u003c/th>\u003cth scope=\"col\">接受耗時／已觀察耗時\u003c/th>\u003cth scope=\"col\">人分／token／累計 Agent·分\u003c/th>\u003cth scope=\"col\">阻塞／重試／整合返工\u003c/th>\u003cth scope=\"col\">證據位置／未測與限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"試次／組／順序\">\u003ctextarea aria-label=\"試次／組／順序\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"基線／條件／偏差\">\u003ctextarea aria-label=\"基線／條件／偏差\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"起始／接受或截止\">\u003ctextarea aria-label=\"起始／接受或截止\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"契約結果／狀態／原因\">\u003ctextarea aria-label=\"契約結果／狀態／原因\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"接受耗時／已觀察耗時\">\u003ctextarea aria-label=\"接受耗時／已觀察耗時\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"人分／token／累計 Agent·分\">\u003ctextarea aria-label=\"人分／token／累計 Agent·分\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"阻塞／重試／整合返工\">\u003ctextarea aria-label=\"阻塞／重試／整合返工\" rows=\"3\">\u003c/textarea>\u003c/td>\u003ctd data-label=\"證據位置／未測與限制\">\u003ctextarea aria-label=\"證據位置／未測與限制\" rows=\"3\">\u003c/textarea>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源與案例性質：P20 提供以明確準則反覆評估工作流程的方法；T09 與個人研究彙整 U-C 提供品質、耗時和成本的判讀背景。Dungeon Lab 的既有紀錄支持原版的功能檢查，沒有同條件的單／多 Agent 效率對照。U10 所述個人時間公式缺原文，本例的算式僅用於讀表。\u003c/p>\u003ch3>公開技術文件\u003c/h3>\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://developers.openai.com/api/docs/guides/agent-evals\">P20 · OpenAI · Agent evals ↗\u003c/a>\u003ch3>本機 Wiki 與教材定位\u003c/h3>\u003cul>\u003cli>P20 來源摘要\u003csamp>.wiki/wiki/sources/p20-summary.md\u003c/samp>\u003c/li>\u003cli>T09 驗證與效率\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003cli>U-C 證據界線\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>C52 正式教材\u003csamp>docs/textbook/ch05/C47-C54.md#c52\u003c/samp>\u003c/li>\u003c/ul>\u003c/section>", "number": "5.06.02", "firstSlide": 351, "lastSlide": 365, "subtitle": "同一項功能交給一位或多位 Agent，怎麼比較效率？"}, {"id": "C52-03", "chapter": "05", "title": "合成試次分析：簽收率、成對耗時與總投入", "track": "", "role": "lesson", "parent": "C52", "lead": "", "kind": "深入教學", "body": "\u003cp data-passage=\"p-1\">假設團隊做了六次待辦篩選任務，多人分工有一次只花 16 分鐘就交付。一位助手獨力完成的最快紀錄是 20 分鐘。若你要決定下次怎樣分工，還得知道其餘幾次有沒有交成，人花了多少時間，又有多少成本沒量到。\u003c/p>\n\u003cp data-passage=\"p-2\">下面是三對獨立啟動的\u003cstrong>合成資料\u003c/strong>。兩組從相同乾淨版本開始，使用相同模型、工具、資料與權限。驗收都要在連接真實服務的畫面選工作標籤看見 A、清除篩選恢復 A 和 B、查未知標籤得空清單及 HTTP 200，通過架構檢查與既有回歸，再由相同角色簽收。每回最多 30 分鐘或全組 16,000 token，先達者截止；原地重試或整合返工仍屬同一回。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"序／組表格\" data-passage=\"p-3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">序／組\u003c/th>\n\u003cth scope=\"col\">契約與狀態\u003c/th>\n\u003cth scope=\"col\">接受分／終止分\u003c/th>\n\u003cth scope=\"col\">人分／token\u003c/th>\n\u003cth scope=\"col\">重試／整合返工次\u003c/th>\n\u003cth scope=\"col\">模擬觀察與限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1 單\u003c/td>\n\u003ctd>全門檻通過，成功\u003c/td>\n\u003ctd>24／24\u003c/td>\n\u003ctd>4／8000\u003c/td>\n\u003ctd>1／0\u003c/td>\n\u003ctd>首次測試資料路徑錯，重跑後簽收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 多\u003c/td>\n\u003ctd>全門檻通過，成功\u003c/td>\n\u003ctd>16／16\u003c/td>\n\u003ctd>5／11000\u003c/td>\n\u003ctd>0／0\u003c/td>\n\u003ctd>兩份產物整合後簽收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3 多\u003c/td>\n\u003ctd>終局驗收拒絕，失敗\u003c/td>\n\u003ctd>無／18\u003c/td>\n\u003ctd>6／9000\u003c/td>\n\u003ctd>1／1\u003c/td>\n\u003ctd>清除仍見 A，該回結案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 單\u003c/td>\n\u003ctd>全門檻通過，成功\u003c/td>\n\u003ctd>20／20\u003c/td>\n\u003ctd>3／7000\u003c/td>\n\u003ctd>0／0\u003c/td>\n\u003ctd>三種 UI 路徑及回歸通過\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5 單\u003c/td>\n\u003ctd>截止，未完成\u003c/td>\n\u003ctd>無／30\u003c/td>\n\u003ctd>4／缺值：報表未取得\u003c/td>\n\u003ctd>0／0\u003c/td>\n\u003ctd>Browser 入口仍待恢復\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6 多\u003c/td>\n\u003ctd>截止，未完成\u003c/td>\n\u003ctd>無／30\u003c/td>\n\u003ctd>7／13500\u003c/td>\n\u003ctd>2／2\u003c/td>\n\u003ctd>整合版本仍在返工\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section=\"\" data-passage=\"p-4\">先數三種終局，再在同一對裡減時間\u003c/h2>\n\u003cp data-passage=\"p-5\">接受分只在產品簽收時才有，終止分記實際觀察到何時。第 3 列在 18 分鐘終局拒收；第 5、6 列到 30 分鐘仍開放，屬未完成。三列都算進啟動分母，均無接受時刻。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"以全部試次計數表格\" data-passage=\"p-6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">以全部試次計數\u003c/th>\n\u003cth scope=\"col\">成功＋失敗＋未完成\u003c/th>\n\u003cth scope=\"col\">簽收比例\u003c/th>\n\u003cth scope=\"col\">僅取成功子集的簽收分鐘\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>單組\u003c/td>\n\u003ctd>2＋0＋1＝3\u003c/td>\n\u003ctd>2/3\u003c/td>\n\u003ctd>[20,24]，中位數 (20＋24)／2＝22 分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多組\u003c/td>\n\u003ctd>1＋1＋1＝3\u003c/td>\n\u003ctd>1/3\u003c/td>\n\u003ctd>[16]，只有一個成功值，無法觀察變動範圍\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-7\">甲配第 1、2 列，都是同門檻下交成的版本，多組早了 24－16＝8 分鐘。乙配第 3、4 列，多組缺簽收；丙配第 5、6 列，兩組都截止。乙、丙無法計算成對簽收差，仍留在兩組的結果分母。若用兩組成功子集的中位數相減，會拿不同試次相互抵銷，所得數字無法代替甲的 8 分鐘。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-8\">回到六列計投入\u003c/h2>\n\u003cp data-passage=\"p-9\">人工是人實際投入的分鐘。單組三回 4＋3＋4＝11 人分，多組 5＋6＋7＝18 人分，包括拒收與截止的投入。除以成功回數會改成「每次簽收分攤多少人分」，報告須明列分母。全組各模型呼叫的用量以 token 記，單組已知 8,000＋7,000＝15,000，第 5 列報表未取得，單組總量未知；多組 11,000＋9,000＋13,500＝33,500，為三回加總。第 5 列兩個 0 表示已知零次重試、零次整合返工。逐列留原因，才能追到工具路徑、清除反例、Browser 入口與整合返工各自花在哪裡。\u003c/p>\n\u003cp data-passage=\"p-10\">牆鐘時間量從開始到接受或終止的經過時間。累計 Agent·分則要把每位助手實際執行的時段相加：兩位同時各做 10 分鐘是 10 分鐘牆鐘、20 Agent·分。人工若另投入 3 分鐘，另記 3 人分。六列缺各助手起訖，無法從終止分反算累計執行量。\u003c/p>\n\u003ch2 data-section=\"\" data-passage=\"p-11\">哪些結論還需要另一種證據\u003c/h2>\n\u003cp data-passage=\"p-12\">這一對早了 8 分鐘，同一表中多組交成 1/3、單組 2/3。這些都是從紙上數字得到的判讀。若要檢驗「這項任務適合並行」，需在同條件下實跑，逐次填寫\u003ca href=\"#C52-02\">八欄試次工作表\u003c/a>，保留失敗與截止、限制和缺值，再把結論限定於所測任務、環境、品質門檻與樣本。\u003c/p>\n\u003cp data-passage=\"p-13\">專案提供者的 Dungeon Lab 原紀錄 U05 與 U06 分屬兩輪、不同版本：第一輪 8/8、第二輪 12/12 單元測試，第二輪另有 58 項定時整合檢查（\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"TESTED\">有紀錄的實際測試\u003c/span>，限原作者原版本，本輪僅核對文本）。兩輪均缺另一組從相同基線完成相同需求的成本列。U10 的個人時間公式缺原文、符號與前提（\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"GAP\">證據待補／尚未驗證\u003c/span>）；上面各式只用來核算這張練習表。架構收益仍是假設（\u003cspan class=\"evidence-label\" data-evidence=\"HYPOTHESIS\" data-original=\"HYPOTHESIS\">待驗證假設\u003c/span>）。OpenAI P20 與 T09 支持評估方法，六列皆屬 \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"SYNTHETIC_EXAMPLE\">合成教學案例\u003c/span>。\u003c/p>\n\u003cp data-passage=\"p-14\">\u003ca href=\"#C52\">5.06 正文\u003c/a> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">T09 驗證與效率\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">成本\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">品質\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">P20\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-C 摘要\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原版本試驗索引（本機）\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">原故事板\u003c/span>\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>來源識別　P20、T09、U-C、U05、U06、U10\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/agent-evals\" rel=\"noopener noreferrer\" target=\"_blank\">P20 · OpenAI · Agent evals\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p20-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.06.03", "firstSlide": 366, "lastSlide": 375, "subtitle": "把最快的一回放回所有已啟動的試次"}, {"id": "C53", "chapter": "05", "title": "從功能交付到使用者效益：設計對照試辦", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 提出應依專案目的評估成果。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把「交付什麼」和「誰的工作因此改變」各寫一句。前者是產出（output），可用產品契約簽收；後者是效益（outcome），需要看目標使用者做事的結果。若目的只是找對待辦，查使用者能否選中正確項目就有意義；若目的是更快找對，還需要時間及比較基線。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> \u003cstrong>只做出標籤按鈕就能證明使用者找東西更快嗎？\u003c/strong> 先說明要服務哪一群人，給他們難度相當的待辦清單與指定目標。分別在原介面及新介面，從看見同類指令計到正確選取，保存耗時、錯選和到時仍找不到的次數。交替操作順序或換等難度的題目，避免第二次只是記住答案。在同樣的正確性條件下看時間分布，並一併報告找不到的比例。三個功能測項只驗回傳與顯示，\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 現有材料沒有這項使用者量測，尚無實現效益的結果。\u003c/p>\n\u003cfigure>\u003cfigcaption>合成試辦｜怎樣驗證「更快找到正確待辦」\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>\u003cstrong>訂出目標\u003c/strong>　找對指定待辦，並能比較花了多久。\u003c/li>\u003cli>\u003cstrong>收兩組觀察\u003c/strong>　給目標使用者難度相當的題目，在原介面和新介面各記正確選取時間、錯選與找不到的次數。\u003c/li>\u003cli>\u003cstrong>判讀效益\u003c/strong>　在同樣正確性條件下比時間分布，一併呈現找不到的比例。現有待辦範例仍缺這項量測。\u003c/li>\u003c/ol>\u003c/figure>\n\u003ch2 data-section>讓專案目的決定試辦的取捨\u003c/h2>\n\u003cp data-passage=\"p-3\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在啟動試辦前，由有權決定目標的人做一張決策卡，逐欄寫「硬限制、觀察指標、可權衡項」。逾期或漏過一條必過契約，照硬限制處理；找對待辦所需時間列為待量的效益指標；返工先記錄供診斷。對可以權衡的項目寫明優先序與理由，例如守住品質與截止日後，才在可行方案中優先選人工負擔較低的一個。若另一案將無未計畫重派也訂為硬限制，就要另立判準。缺少紀錄及不相容的單位都不能靠任意權重補成總分。\u003c/p>\n\u003cp data-passage=\"p-4\">\u003cstrong>試辦案準時且契約全過，但返工兩次、沒有使用者量測。哪些門檻已達？能說效益已實現嗎？\u003c/strong> 截止日與三條產品契約都達標，兩次返工登記為過程觀察，效益欄標待測。由專案目的決定是否追加使用者試驗、誰收資料及何時再評。這張卡與課堂優先序是編輯示例，U07 支持的是提問方向。\u003c/p>\n\u003cp data-passage=\"p-5\">來源：U-C（U07）、S05、T09、\u003ccode>concepts/quality.md\u003c/code>、\u003ccode>examples/scenario.md\u003c/code>。如果效益有機會在下一案重現，可讀 \u003ca href=\"#C54\">5.08\u003c/a>。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排、合成教學案例、個人直接觀點的轉述。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　S05、U-C\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.07", "firstSlide": 376, "lastSlide": 380, "subtitle": "準時做出標籤按鈕，誰的哪件事變好了？"}, {"id": "C54", "chapter": "05", "title": "可重用工程資產：選擇形式、換票驗證與維護", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">一張工作票如期簽收，交接時卻要回頭追問測試用的版本。下一次又發生同樣的事，你就有了可檢查的重複問題。\u003cstrong>工程資產\u003c/strong>指後續任務可使用、可驗證、有人維護的規範、操作程序或檢查。先保留本次條件、做法、結果及失敗例；再問遺漏是因為沒有約定、忘了一步，還是執行後沒有人檢查。原因不同，留下來的東西也應不同。\u003c/p>\n\u003cp data-passage=\"p-2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 若多張票都不得修改核心資料格式，把這個穩定約束及適用模組寫入專案指引 AGENTS.md；若每次都要準備同版資料、跑真實介面、保存輸出，可把輸入、步驟、失敗出口整理成供執行者重用的程序（Skill）。若反覆缺的是交接用的基準提交與輸出位置，先試用含兩欄的交接模板。若清除待辦篩選後本應恢復顯示居家待辦 B，卻已兩次漏驗，把先選再清除寫成有預期輸出的回歸測試。為何採用這個資料介面的取捨則保留於決策紀錄，讓下次修改的人能查適用前提。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>一次碰巧成功的 Prompt 可直接變成通用 Skill 嗎？\u003c/strong> 當次指令可能依賴當時對話才有的檔名、權限或工具版本。換一張相近的工作票，讓接手者只拿模板或程序去找提交、重跑驗證；如果少了原作者補充就找不到產物，補寫前提並重試。通過才將已驗範圍發布給適用的團隊，模組特有的規則留在模組裡。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 說明以專案指引提供建置與測試入口，P17 示範把架構檢查保存在專案內。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> U09 的歷史摘要涉及保留管理資產；上述升級流程是編輯設計，沒有把摘要當作逐字研究或實測結論。\u003c/p>\n\u003ch2 data-section>如何決定繼續維護或淘汰\u003c/h2>\n\u003cp data-passage=\"p-4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 讓資產經過發現問題、換票驗證、發布、更新及淘汰。發布時列適用條件、版本、維護者、成功與失敗案例、觸發重驗的變更及停用條件。追蹤適用任務數、實際重用次數、首次成功與返工情形，記設計、教學、修訂、重驗各花多少人時。對近似任務在同一品質門檻下觀察重用前後的人工及返工，把節省的同單位投入與一次性設計、後續維護一起核對。使用次數高，也可能每次都要人工補修。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 目前無可用來填寫固定收益的同條件紀錄。\u003c/p>\n\u003cp data-passage=\"p-5\">\u003cstrong>工具改版後能繼續無條件使用舊 Skill 嗎？\u003c/strong> 先查版本前提，在新版本以代表性的成功與失敗例重驗。若入口已失效，暫停推薦、指定維護者修訂並重測；若需求已消失或維護代價超過可觀察的收益，記錄淘汰理由、日期與替代入口，避免下一張票繼續引用。這時能確認的是這個版本的適用範圍，跨案效益仍待新的觀察。\u003c/p>\n\u003cp data-passage=\"p-6\">來源：S05、P05、P17、U-C、T09、\u003ccode>concepts/cost.md\u003c/code>、\u003ccode>concepts/harness.md\u003c/code>。U10 個人時間公式原文仍缺；朋友的 RBS v3 屬朋友資料，本章的成本表、決策卡及維護流程均未引用它作為使用者研究。\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋工程設計、待比較的假設。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　P05、P17、S05、U-C\u003c/p>\u003cdetails>\u003csummary>公開技術文件\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://agents.md/\" rel=\"noopener noreferrer\" target=\"_blank\">P05 · AGENTS.md · Project instructions\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener noreferrer\" target=\"_blank\">P17 · OpenAI · Harness engineering\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/harness.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/handoff-and-evidence.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/p17-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/s05-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "5.08", "firstSlide": 381, "lastSlide": 385, "subtitle": "下一張票還會遇到這個問題嗎？"}, {"id": "Z01", "chapter": "99", "title": "工程成果的判讀：需求、交件、簽收與效益", "track": "", "role": "core", "parent": "", "lead": "", "kind": "閱讀單元", "body": "\u003cp data-passage=\"p-1\">有人交來一句「標籤篩選已完成」，另附一張只看得到工作待辦的截圖。你可以先把問題往回推一步。當初要的是畫面上多一個按鈕，還是希望使用者更容易找對待辦？如果是後者，按鈕需要符合哪些行為，怎樣才有機會改善找尋結果？先定目的，再把「選取、清除、無匹配」寫成可觀察的規格。這一步會改變之後怎麼選工具：只會截圖的環境能留下外觀；要把服務回應與畫面顯示對上，還要有取得同一次請求、回應與操作結果的辦法。\u003c/p>\n\u003cp data-passage=\"p-2\">接著才決定誰來做。若一位助手能從需求走到驗收，給它清楚的授權、測項與停點便能起步。若分成資料與畫面兩張票，兩方就得先拿到相同規格，分別交回自己的版本和局部測試，再由整合者查共同版本。有人提出改變篩選語義時，保存候選結果與受影響工作，找具權者裁決；這是執行途中維持共同目標的治理工作。最後把實際產物、測試和接受決定留在可追查的位置。若下次交件又缺相同的定位，便有一個具體理由試用交接模板；能經另一張票驗證並有人維護，才值得繼續保留。\u003c/p>\n\u003cp data-passage=\"p-3\">\u003cstrong>任務完成、產品接受、效益實現是不是同一件事？\u003c/strong> 拿同一個例子作三次判讀。執行者交出畫面修改與對應測試，可以確認該票交件；整合者用同一版資料與程式重驗，並取得具權者簽收，才能把功能列入已接受基準。即使三個產品測項都通過，也還沒有量到使用者找對待辦所需的時間。要判斷效益，得在可比較的工作情境下觀察正確選取、耗時與找不到的比例。若只收到最初那張截圖，最好的回覆就是指明缺哪一層證據、誰能補、應在哪個版本補。\u003c/p>\n\u003cfigure>\u003cfigcaption>從同一張回報追查三種結論\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">你想知道什麼\u003c/th>\u003cth scope=\"col\">應找到誰留下的哪份記錄\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">畫面修改是否已交件？\u003c/th>\u003ctd>執行者在當前工作票交付的版本與局部測試。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">這個版本能列入已接受的基準嗎？\u003c/th>\u003ctd>整合者對共同版本的驗證，以及具權者指向該版本的簽收。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">使用者是否更快找到正確待辦？\u003c/th>\u003ctd>原介面與新介面在可比較任務下的正確選取、耗時及找不到的比例。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"若你下次遇到這個問題表格\" data-passage=\"p-4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">若你下次遇到這個問題\u003c/th>\n\u003cth scope=\"col\">可重做的教材練習\u003c/th>\n\u003cth scope=\"col\">回 Wiki 查核\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>怎麼看出助手有動手，誰選了下一步？\u003c/td>\n\u003ctd>\u003ca href=\"#C02\">第一章：同一故障的兩條路徑\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">模型與工具\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎麼讓一個人從需求交到可測結果？\u003c/td>\n\u003ctd>\u003ca href=\"#C20\">第二章：從失敗觀察到交件\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">單 Agent 開發循環\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上游已交件，整合能否開始？\u003c/td>\n\u003ctd>\u003ca href=\"#C31\">第三章：判讀每一條前置邊\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">協調與派工\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收到舊訊息，責任應交給誰？\u003c/td>\n\u003ctd>\u003ca href=\"#C44\">第四章：失聯後的安全接手\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">監督與交接\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>團隊更早回報，如何判斷是否更有效率？\u003c/td>\n\u003ctd>\u003ca href=\"#C52\">第五章：設計同條件對照\u003c/a>\u003c/td>\n\u003ctd>\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">驗證、效率與重用\u003c/span>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 data-section>下一輪研究還要取得哪些原始紀錄\u003c/h2>\n\u003cp data-passage=\"p-5\">讀完仍有三條證據界線要帶走。使用者提過的個人時間公式缺少可確認的原文、符號與前提，書中的量測欄位屬教材設計。持續自治的設計能說明要保存哪些狀態，但使用者既有研究缺少一條能驗明人工介入情況、一路追到最終簽收的運行紀錄。單 Agent 與多 Agent 的效率優劣，也還缺同需求、同品質門檻下的比較試次。這三處適合提出下一個要收集的證據；現有材料無法替讀者預告結果。\u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-A\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-B\u003c/span> · \u003cspan class=\"local-reference\" title=\"專案內來源定位；可在本單元的來源說明查核\">U-C\u003c/span>\u003c/p>\n\u003csection class=\"sources\">\u003ch2 data-section>來源與證據範圍\u003c/h2>\u003cp>本單元涵蓋教學編排。各段標記說明該項主張或案例的依據。\u003c/p>\u003cp>來源識別　U-A、U-B、U-C\u003c/p>\u003cdetails>\u003csummary>專案內 Wiki 定位\u003c/summary>\u003cul>\u003cli>\u003csamp>.wiki/wiki/concepts/coordination.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/cost.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/concepts/quality.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/examples/scenario.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/guides/chapter-05.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-a-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-b-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/sources/u-c-summary.md\u003c/samp>\u003c/li>\u003cli>\u003csamp>.wiki/wiki/tutorials/verification-efficiency-reuse.md\u003c/samp>\u003c/li>\u003c/ul>\u003c/details>\u003c/section>", "number": "總結 · 01", "firstSlide": 387, "lastSlide": 392, "subtitle": "把工程結果送回當初想解決的問題"}], "deck": [{"number": 1, "type": "cover", "title": "多 Agent 軟體開發實踐指南", "chapter": "", "unit": "", "body": "", "layout": "prose", "note": "", "sources": "", "passages": []}, {"number": 2, "type": "contents", "title": "全書目錄", "chapter": "", "unit": "", "body": "", "layout": "prose", "note": "", "sources": "", "passages": []}, {"number": 3, "type": "chapter", "title": "導論｜五章閱讀路線與案例驗收", "chapter": "00", "unit": "", "body": "", "layout": "prose", "note": "", "sources": "", "passages": []}, {"number": 4, "type": "content", "title": "需求驗收：依承諾的行為判定交付", "chapter": "00", "unit": "I01", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">想像同事把一個新按鈕交給你，請你同意讓大家使用。你看得到按鈕，也看過助手寫的程式。試著按一下之後，畫面變了。現在還差哪一項資料，才足以說「可以接受」？得先知道這個按鈕原先答應使用者什麼，再找一個能區分做對和做錯的操作。寫出程式、跑過操作、依需求接受成果，是可以由不同人完成的三件事。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、U-A", "passages": ["p-1"], "subtitle": "誰能決定按鈕符合承諾？"}, {"number": 5, "type": "content", "title": "Agent 委託與分工需要哪些交接資訊", "chapter": "00", "unit": "I01", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">開發助手若能根據觀察選擇下一步，並請環境執行獲准操作，本書稱這樣的系統為 Agent。把工作交給一位 Agent，第一個難題是讓它收到能做、能驗的委託。分給多位 Agent，還要讓各方知道共用哪份規格、能改什麼、交回哪一版。負責監督的人則要能從一句「完成」追回那次工作的產物與測試，辨認哪些問題應由人決定。每多
