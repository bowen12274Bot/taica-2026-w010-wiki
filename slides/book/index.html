ong>判斷題\u003c/strong>　對話結束時只有測試摘要，要交給誰做什麼？由續接者先找工作區、版本、未提交差異與原命令；無法定位就標未知，不能用摘要補造證據。來源為 U-B、U07、U04 的 CODEX_HANDOFF.md、concepts/supervision.md、T04。若要把一次續接放回整件需求，可讀 \u003ca href=\"#C20\">C 線交付\u003c/a>。\u003c/p>", "layout": "prose", "note": "", "sources": "T04、U-B、U04、U07", "passages": ["p-3", "p-4"]}, {"number": 118, "type": "content", "title": "依親手編輯或管理工作階段選入口", "chapter": "02", "unit": "C09", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cstrong>IDE\u003c/strong> 是把檔案、編輯器和執行工具放在一起的開發環境。若你一邊寫、一邊請助手解釋局部差異，眼前的檔案就是工作的中心。若你要離開一陣子再回來看成果，首要問題變成「剛才交給哪個工作階段？它改到哪裡？」專門管理多個工作階段（session）的視窗強調定位各自的任務。以 Agent 為中心的開發工作台（ADE）則可按專案和工作區呈現活動。視窗長相相似，檔案位置及可操作範圍仍可能不同。\u003c/p>", "layout": "prose", "note": "", "sources": "P06、P08、P24、P25、S01", "passages": ["p-1"]}, {"number": 119, "type": "content", "title": "固定起始版本，比較各入口能查到哪些交付證據", "chapter": "02", "unit": "C09", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先固定起始版本，稱為 B0，也就是尚未進行本次修改的同一份程式快照。各入口都拿同一項工作、同一測試資料、同一可讀寫範圍和同一組驗收條件。試著在每個入口回答「哪個目錄、哪些修改、哪裡看測試結果、由誰採納」。若其中之一根本看不到終端機，把缺少的觀測記下，改由獲准的人查，避免拿介面印象補成測試紀錄。\u003c/p>\n\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>判斷題\u003c/strong>　你要親寫程式，或要同時管理多件工作，各看哪些能力？前者試著從錯誤跳到原始檔、修改並讀變更；後者試著離開再回到同一 session，找回版本、等待中的問題及差異。下一節教你如何在任何入口核對位置，也可直接跳到 \u003ca href=\"#C15\">各入口比較表\u003c/a>。來源為 T03、P06、P08、P24、P25、S01。\u003c/p>", "layout": "prose", "note": "", "sources": "P06、P08、P24、P25、S01", "passages": ["p-2", "p-3"]}, {"number": 120, "type": "content", "title": "在測試終端機核對工作目錄、分支與提交版本", "chapter": "02", "unit": "C18", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">測試會讀取實際執行目錄裡的檔案。編輯器顯示的檔名，可能也存在隔壁的另一份檢出裡。\u003cstrong>Shell\u003c/strong> 是接受命令的程式，\u003cstrong>cwd\u003c/strong> 是該次命令的工作目錄，Git 分支是可移動的版本參照，HEAD 表示當前檢出的版本。先釘住這些位置，測試輸出才有對象。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在將要跑測試的同一個終端機依序查看以下結果。這些命令是供練習的入口，本節沒有在案例程式上執行。\u003c/p>\n\u003cpre tabindex=\"0\" data-passage=\"p-3\" data-block=\"3\">\u003ccode class=\"language-powershell\">Get-Location\ngit status -sb\ngit rev-parse HEAD\ngit diff\ngit diff --cached\n\u003c/code>\u003c/pre>", "layout": "code", "note": "", "sources": "P05、P17", "passages": ["p-1", "p-2", "p-3"]}, {"number": 121, "type": "content", "title": "用 Git 區分已暫存、未暫存與未追蹤的改動", "chapter": "02", "unit": "C18", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">第一行在其他 shell 也可用 \u003ccode>pwd\u003c/code>。用檔案樹找到規格、測試入口與 fixture（能重複使用的固定測試資料），核對它們來自所記基準。第二、三行分別查分支及工作狀態、提交識別碼；末兩行分別查看尚未暫存、已暫存的追蹤檔差異。新增的未追蹤檔要從 status 另查。若一開始已有別人的修改，記下路徑與狀態，避免把它當作本次產物。檢查依賴及安裝版本符合專案指引，再執行該專案的測試命令，記輸出和 exit code（程式結束狀態碼）。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17", "passages": ["p-4"]}, {"number": 122, "type": "content", "title": "同一個 HEAD 能否證明測到同一份檔案？", "chapter": "02", "unit": "C18", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cstrong>判斷題\u003c/strong>　如何證明測試跑在要交付的基準上？並列當時的目錄、分支、HEAD、未提交差異、fixture 識別和命令輸出，交付時再比一次。兩個目錄即使 HEAD 相同，未提交檔案也可能不同；沒有這部分資料時只能證明跑過某次命令。來源為 T03、T04、P05、P17。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17", "passages": ["p-5"]}, {"number": 123, "type": "content", "title": "在同一次操作中追查請求、回應與畫面", "chapter": "02", "unit": "C19", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">瀏覽器裡的使用者介面稱為 UI，程式向服務索取資料的約定稱為 API。看見所需項目，只回答了「當時畫面上有它」；要判斷篩選，還得知道有沒有另一個理應被排除的項目。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 固定資料包含 A（標籤 work）、B（標籤 home）。用 Browser 執行操作，在 Network 找同一次操作的請求與回應，再回到 UI 核對顯示。Console 是執行時的訊息及錯誤線索，截圖是當下的外觀。以下是預期，可在不同環境沿用作驗收尺。\u003c/p>", "layout": "prose", "note": "", "sources": "P07、U-C", "passages": ["p-1", "p-2"]}, {"number": 124, "type": "content", "title": "篩選驗收表：選取、清除與未知標籤的資料及畫面", "chapter": "02", "unit": "C19", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"操作表格\" data-passage=\"p-3\" data-block=\"3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">操作\u003c/th>\n\u003cth scope=\"col\">Network 應看到的資料\u003c/th>\n\u003cth scope=\"col\">UI 應看到的結果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>選 work\u003c/td>\n\u003ctd>查詢帶 tag=work，回應只有 A\u003c/td>\n\u003ctd>顯示 A，B 消失\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除\u003c/td>\n\u003ctd>省略 tag，回應 A、B\u003c/td>\n\u003ctd>A、B 都恢復\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查未收錄的 missing\u003c/td>\n\u003ctd>tag=missing，HTTP 200，空清單\u003c/td>\n\u003ctd>有效的空結果畫面\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P07、U-C", "passages": ["p-3"]}, {"number": 125, "type": "content", "title": "用回應與畫面的第一處差異定位篩選故障", "chapter": "02", "unit": "C19", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">回傳 HTTP 200 只表示請求獲得成功回應。若選 work 的回應仍含 B，查請求參數及服務比對規則；若只回 A 而畫面還有 B，查 UI 狀態更新與 Console。Console 沒有錯誤訊息也可能有邏輯錯誤。缺 Network 權限時，可由獲准的人用瀏覽器開發工具或同次服務記錄補查；只有終端機則先驗 API，畫面另列未測。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P07 支持畫面與 Console 的觀測界線，Network 的操作路徑見 T03／T04。\u003c/p>", "layout": "prose", "note": "", "sources": "P07、U-C", "passages": ["p-4"]}, {"number": 126, "type": "content", "title": "證明篩選排除了資料，需要清除前後的對照", "chapter": "02", "unit": "C19", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cstrong>判斷題\u003c/strong>　只有一張 A 的截圖，能判斷 B 曾被正確排除嗎？若資料原來就只有 A，畫面也會完全相同。先驗固定資料與清除的兩筆，再對上篩選請求、回應與畫面。來源為 P07、U-C、examples/scenario.md、T03、T04。\u003c/p>", "layout": "prose", "note": "", "sources": "P07、U-C", "passages": ["p-5"]}, {"number": 127, "type": "content", "title": "從 VS Code 主視窗對照檔案與助手的改動", "chapter": "02", "unit": "C10", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P06 區分主視窗的 OpenAI Codex 擴充功能和 Agents Window 的實驗性 Codex 整合。當人想親自閱讀或改一段程式，主視窗可讓人對照原始檔、終端機和版本控制的變更檢視。助手實際可取得的證據取決於本次工具及授權。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> U02 的整理把規劃和工程執行分開，可用來理解為什麼從討論切入能跑測試的環境。\u003c/p>", "layout": "prose", "note": "", "sources": "P06、U-A", "passages": ["p-1"]}, {"number": 128, "type": "content", "title": "在 VS Code 核對測試版本，逐段審查修改範圍", "chapter": "02", "unit": "C10", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在檔案樹選 B0 的專案資料夾，讀規格並定位對應檔。在主視窗終端機核對 cwd、HEAD、分支；讓 Codex 透過可用工具跑指定測試，保留命令和輸出。打開變更檢視逐段讀 diff，確認與委託範圍一致。人工也在編輯時，先檢查已有差異，避免同一處互相覆寫。適合親手編輯的時機是要根據差異立即決定要保留哪一段，或要和助手共同定位錯誤。\u003c/p>", "layout": "prose", "note": "", "sources": "P06、U-A", "passages": ["p-2"]}, {"number": 129, "type": "content", "title": "缺瀏覽器權限時如何交接畫面驗證", "chapter": "02", "unit": "C10", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>判斷題\u003c/strong>　若 Codex 沒開瀏覽器權限，下一個驗證方法是什麼？先用獲准的終端機驗資料，再由有權的人在同版瀏覽器實際操作並留結果；做不到就標 UI 未測。助手說已完成，無法補齊畫面證據。來源為 P06、U-A、T03。\u003c/p>", "layout": "prose", "note": "", "sources": "P06、U-A", "passages": ["p-3"]}, {"number": 130, "type": "content", "title": "依工作階段定位分支、Worktree 或容器目錄", "chapter": "02", "unit": "C11", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 在一個視窗管理數個 session 時，先選該次工作，再看 Files（檔案）、Changes（變更）與 Browser（瀏覽器）。切換 session 後，要重新確認工作區路徑及分支，否則另一項工作的正確畫面也可能被誤用。Git 工作區可依條件選 Branch 或 New Worktree。Worktree 是同一個儲存庫的另一份檢出，有自己的工作檔；Dev Container 的 session 直接編輯容器工作區，沒有該 New Worktree 選項。\u003c/p>", "layout": "prose", "note": "", "sources": "P06、S01、S02", "passages": ["p-1"]}, {"number": 131, "type": "content", "title": "用 Files、Changes、Browser 對回同一項工作", "chapter": "02", "unit": "C11", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 先開 Files 找規格，在 Changes 指認該 session 的 diff，核對其 branch 和目前 commit，再用 Browser 核對該工作區啟動的頁面。若兩個 session 共用目錄，兩者可能看見同一份未提交修改；同一 repo 也能有多份 worktree，各自檢出不同分支。Session、分支和目錄名稱無法彼此推算。追到路徑後還要查誰負責、誰可採納。\u003c/p>", "layout": "prose", "note": "", "sources": "P06、S01、S02", "passages": ["p-2"]}, {"number": 132, "type": "content", "title": "合併 Worktree 的改動前，確認目標分支與採納者", "chapter": "02", "unit": "C11", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>判斷題\u003c/strong>　新建 Worktree 就有權合併 main 嗎？工具顯示檔案、變更與執行位置。協調者（Coordinator，負責確認分工與追蹤的人或 Agent）還要確認有效委託、目標分支與採納者，具權者才可決定合併。來源為 P06、S01、S02、concepts/worktree.md。\u003c/p>", "layout": "prose", "note": "", "sources": "P06、S01、S02", "passages": ["p-3"]}, {"number": 133, "type": "content", "title": "Antigravity 的兩個入口：Editor View 與 Manager Surface", "chapter": "02", "unit": "C12", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Google 發表文件使用 Editor View 與 Manager Surface 兩個名稱。前者適合邊看程式邊和助手工作；後者可跨工作區派任、稍後回來查看 Artifacts，也就是工作產生、可供審閱的材料。查閱時的文件另區分 App 與 IDE。教學沿用發表名稱，使用者需記下自己開的是哪個入口。\u003c/p>", "layout": "prose", "note": "", "sources": "P08、P10、S01", "passages": ["p-1"]}, {"number": 134, "type": "content", "title": "何時同步審差異，何時等產物交回再審？", "chapter": "02", "unit": "C12", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 一處修改可能改變使用者看見的措辭時，在 Editor 打開原始檔、看建議差異，現場決定後再繼續。若目標已確定，人可以離開，便在 Manager 指定工作區與交付條件，回來選該工作、對照產物與原任務，再追到實際版本及測試。缺版本定位的產物適合發問，仍不足以決定採納。\u003cstrong>判斷題\u003c/strong>　何時要同步介入？當下一步取決於人的規格選擇時就設停點；具體且可驗的工作可等產物回來再審。\u003c/p>", "layout": "prose", "note": "", "sources": "P08、P10、S01", "passages": ["p-2"]}, {"number": 135, "type": "content", "title": "分列文件支援、帳戶可見與尚未測試的模型", "chapter": "02", "unit": "C12", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P10 的模型資料含非 Gemini 選項，適用方案與帳戶會影響清單。\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 描述使用當時覺得檔案狀態較難掌握，也對模型體驗有自己的判斷。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 尚無同版本、同模型及相同權限的品質或管理成本試驗。實作比較時分三欄寫下文件可用項目、自己的可見項目與未測項。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstrong>判斷題\u003c/strong>　某帳戶當下只看到 Gemini，可以寫成整個產品只支援 Gemini 嗎？保留帳戶方案、日期及入口為觀察條件，產品範圍另依 P10。來源為 P08、P10、S01（U07）、T03。\u003c/p>", "layout": "prose", "note": "", "sources": "P08、P10、S01", "passages": ["p-3", "p-4"]}, {"number": 136, "type": "content", "title": "從 Chat、Work 與 Codex 找到工程工作區", "chapter": "02", "unit": "C13", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P25 的新版桌面說明在 ChatGPT 下區分 Chat 與 Work，另有獨立 Codex 視圖及歷史。Chat 可用來討論需求，Work 是工作入口；要知道某次工程修改寫到哪裡，要繼續追到執行工作區。P24 的 Codex app 發表文件介紹依 project（專案）整理 thread（工作討論串）、檢閱及評論 diff，並可用 worktree 隔離改動。\u003c/p>", "layout": "prose", "note": "", "sources": "P24、P25、S01", "passages": ["p-1"]}, {"number": 137, "type": "content", "title": "從專案討論串核對同一工作區的版本與測試", "chapter": "02", "unit": "C13", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 從專案中找到受託的 thread，打開其工作區，核對目錄、基準 commit 與這次的 diff，最後檢查測試是否對應同一工作區。若只在 Chat 或 Work 看見「完成」文字，請回報者補實際位置、版本及差異；可能有人貼上另一個工作區的摘要。平台、版本與方案要記在觀察旁，舊版入口不宜套用新版名稱。\u003c/p>", "layout": "prose", "note": "", "sources": "P24、P25、S01", "passages": ["p-2"]}, {"number": 138, "type": "content", "title": "用基準提交核對桌面回報的修改與測試", "chapter": "02", "unit": "C13", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>從桌面的完成訊息追到可重查的變更\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>找出受託的 project 與 thread。\u003c/li>\u003cli>進入該次工作的目錄，核對起始提交。\u003c/li>\u003cli>打開相對該基準的 diff，辨認改了哪些檔案。\u003c/li>\u003cli>用同一工作區的測試紀錄核對結果。\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cstrong>判斷題\u003c/strong>　能從聊天介面確認本機 worktree 嗎？為何還要驗收基線？聊天內容缺少檔案定位，孤立的 diff 也缺少它相對的起點。只有把交付與核准基準對上，才能知道該修改能否在預定版本接受檢查。來源為 P24、P25、S01、T03。\u003c/p>", "layout": "figure", "note": "", "sources": "P24、P25、S01", "passages": ["p-3"], "subtitle": "從一句「完成」找回哪份程式？"}, {"number": 139, "type": "content", "title": "從 Orca 側欄追到實際提交與測項", "chapter": "02", "unit": "C14", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P12 說明可指定起始 ref（分支或提交等版本參照）建立 worktree，再由專案側欄辨認工作區及活動。先展開專案、選工作區、找該處 Agent 的活動或終端機，再追實際 diff 與測試。子工作區在側欄的位置有助查找；Git 的提交親緣要看歷史本身。\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> U07 偏好這種把專案、工作區與 Agent 對上的方式，曾在其他入口人工管理分工。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 此項偏好缺少足以推廣到其他使用者的對照樣本。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cstrong>判斷題\u003c/strong>　側欄顯示 Agent 已結束，可以驗收嗎？工作區告訴你去哪找產物。還要看提交、測項、未測範圍與接受決定，才能說哪項需求已成立。\u003c/p>", "layout": "prose", "note": "", "sources": "P12、P13、S01、U-A", "passages": ["p-1", "p-2"]}, {"number": 140, "type": "content", "title": "用 Run、Task 與 Dispatch 辨認有效嘗試", "chapter": "02", "unit": "C14", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13 的 Orchestration 標為 Experimental。Worktree 隔開工作檔；監督另有 Run（這批工作的收件與識別範圍）、Task（要辦之事及依賴、狀態）與 Dispatch（一次派工嘗試）。即使在同一工作區重試，兩次嘗試也須分得開。查看回報時，先找 Task 和有效 Dispatch，再把結果與該工作區的改動比對。這讓監督者能辨認過期回報；何時派出與採納仍需明確責任人。\u003c/p>", "layout": "prose", "note": "", "sources": "P12、P13、S01、U-A", "passages": ["p-3"]}, {"number": 141, "type": "content", "title": "建立 Run 後，還要另建任務並啟動執行者", "chapter": "02", "unit": "C14", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstrong>判斷題\u003c/strong>　建立 Run 是否會自動建立所有 Worker？Run 只提供集合與收件位置，建立 Task、啟動執行者及處理回報還需相應操作。來源為 P12、P13、S01、U-A、concepts/coordination.md。第三章再討論怎樣安排各項責任。\u003c/p>", "layout": "prose", "note": "", "sources": "P12、P13、S01、U-A", "passages": ["p-4"]}, {"number": 142, "type": "content", "title": "比較 VS Code 主視窗與 Agents Window 的查核入口", "chapter": "02", "unit": "C15", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">若甲在編輯器裡立刻看到問題、乙在工作台等了很久，先問兩人做的是不是相同工作。模型推理、測試等待、登入授權及人工檢查都可能改變總耗時。比較之前先用下表挑出你需要查的那一種能力。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"入口表格\" data-passage=\"p-2\" data-block=\"2\" data-rows=\"1,2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">入口\u003c/th>\n\u003cth scope=\"col\">人怎麼接觸工作\u003c/th>\n\u003cth scope=\"col\">追查結果時要補的條件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>VS Code 主視窗與 Codex 擴充\u003c/td>\n\u003ctd>看原始檔、終端機、差異並直接編輯\u003c/td>\n\u003ctd>權限與擴充能否執行指定測試\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VS Code Agents Window\u003c/td>\n\u003ctd>依 session 找 Files、Changes、Browser\u003c/td>\n\u003ctd>分支或新 worktree 的實際位置；容器例外\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P06、P08、P12、P24、S01、P25", "passages": ["p-1", "p-2"]}, {"number": 143, "type": "content", "title": "比較 Antigravity 的編輯與產物審閱", "chapter": "02", "unit": "C15", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"入口表格\" data-passage=\"p-2\" data-block=\"2\" data-rows=\"3,4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">入口\u003c/th>\n\u003cth scope=\"col\">人怎麼接觸工作\u003c/th>\n\u003cth scope=\"col\">追查結果時要補的條件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Antigravity Editor View\u003c/td>\n\u003ctd>人與助手同步檢視修改\u003c/td>\n\u003ctd>記入口版本、帳戶可見模型與授權\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Antigravity Manager Surface\u003c/td>\n\u003ctd>依工作審閱產物\u003c/td>\n\u003ctd>產物所屬的工作區與版本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P06、P08、P12、P24、S01、P25", "passages": ["p-2"]}, {"number": 144, "type": "content", "title": "從桌面討論串與 Orca 工作區找交付版本", "chapter": "02", "unit": "C15", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"入口表格\" data-passage=\"p-2\" data-block=\"2\" data-rows=\"5,6,7\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">入口\u003c/th>\n\u003cth scope=\"col\">人怎麼接觸工作\u003c/th>\n\u003cth scope=\"col\">追查結果時要補的條件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ChatGPT 桌面 Chat／Work\u003c/td>\n\u003ctd>Chat 討論、Work 承接工作\u003c/td>\n\u003ctd>查看執行環境、核對版本及產物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Codex 桌面視圖\u003c/td>\n\u003ctd>依 project、thread 檢視 diff\u003c/td>\n\u003ctd>變更對應的檢出與驗收基準\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Orca 工作區／Orchestration\u003c/td>\n\u003ctd>依專案追 worktree 與活動，實驗性派工另追 Task 與 Dispatch\u003c/td>\n\u003ctd>需檢查目標版本、測項與採納者\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P06、P08、P12、P24、S01、P25", "passages": ["p-2"]}, {"number": 145, "type": "content", "title": "比較開發入口前，固定版本、資料、權限與驗收條件", "chapter": "02", "unit": "C15", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 用下列空表記錄每次比較，先填固定條件，另標可變或未控制。相同 B0 指同一提交及相同未提交狀態；固定 fixture、需求、權限邊界和品質門檻後，讓各入口各走一次找檔、測試、讀差異與續接。平台不同或無法取得同一模型時，保留差異並縮小結論。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"條件表格\" data-passage=\"p-4\" data-block=\"5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">條件\u003c/th>\n\u003cth scope=\"col\">入口甲\u003c/th>\n\u003cth scope=\"col\">入口乙\u003c/th>\n\u003cth scope=\"col\">固定／可變／未控制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>B0、fixture、任務、驗收\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>平台、軟體版本、帳戶方案\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型與推理設定、工具及權限\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P06、P08、P12、P24、S01、P25", "passages": ["p-3", "p-4"]}, {"number": 146, "type": "content", "title": "模型與介面一起更換，只能比較整組配置", "chapter": "02", "unit": "C15", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cstrong>判斷題\u003c/strong>　同時更換模型與介面，能按耗時建立工具效能排名嗎？兩者的影響無法拆開；缺固定任務、驗收、模型或權限時，結論只能描述該次配置與使用心得。來源為 T03、P06、P08、P12、P24、P25、S01。\u003c/p>\n\u003cfigure data-block=\"7\">\u003cfigcaption>讀完比較紀錄，你能回答哪個問題？\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">紀錄提供什麼\u003c/th>\u003cth scope=\"col\">可據以回答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">入口、版本與該次可見操作\u003c/th>\u003ctd>這個人當時從哪裡找到檔案與變更？\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">任務相同，模型和介面都換了\u003c/th>\u003ctd>兩次配置分別花了多久？單獨更換介面的效果仍待測。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">操作起訖、重疊動作與等待\u003c/th>\u003ctd>人實際介入多久？切換工作區且同時讀 diff 的區間只計一次。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "P06、P08、P12、P24、S01、P25", "passages": ["p-5"], "subtitle": "同時更換介面與模型時能下什麼結論？"}, {"number": 147, "type": "content", "title": "人工介入時間：重疊操作只算一次，純等待另計", "chapter": "02", "unit": "C15", "body": "\u003cp data-passage=\"p-6\" data-block=\"9\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 人工管理成本指人為了讓工作繼續或確認結果而實際操作的時間。保留開始、結束與動作，同一段可有多種動作標記，計時只算一次。下面的記錄表尚無執行樣本。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"開始表格\" data-passage=\"p-7\" data-block=\"10\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">開始\u003c/th>\n\u003cth scope=\"col\">結束\u003c/th>\n\u003cth scope=\"col\">事件（切工作區／讀 diff／處理權限／恢復）\u003c/th>\n\u003cth scope=\"col\">有效人工時間\u003c/th>\n\u003cth scope=\"col\">純等待\u003c/th>\n\u003cth scope=\"col\">缺少的觀察\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-8\" data-block=\"11\">\u003cstrong>判斷題\u003c/strong>　切換工作區時一併讀 diff，接著離開等測試，應怎樣填？切換與讀 diff 的重疊區間只計一份人工時間，離開後另記等待。缺起訖填「未記錄」；只有觀察完整且確認全程無介入時才能記零。人工管理只佔工程成本的一部分；完整效率評估見第五章。來源為 S01、concepts/cost.md。\u003c/p>", "layout": "table", "note": "", "sources": "P06、P08、P12、P24、S01、P25", "passages": ["p-6", "p-7", "p-8"]}, {"number": 148, "type": "content", "title": "建立待辦程式的測試基線：版本、資料與環境", "chapter": "02", "unit": "C16", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">若你只交給助手一個正在顯示清單的網頁，它不知道該改哪份檔案，也不知道哪些行為是專案刻意保留的。先建立基準。這裡稱為 B0 的，是待辦程式在這次需求開始時的版本。程式已有列表、讀取全部待辦的服務入口及既有列表測試。先查工作目錄（cwd）、分支、提交識別碼與既有差異，記下固定資料的版本、依賴鎖定檔與專案要求的執行環境。確認修改只及讀取和顯示流程及測試，使用者既有改動另外記下。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A、P04", "passages": ["p-1"]}, {"number": 149, "type": "content", "title": "用 AGENTS.md 記規則、用 Skill 記操作、用測試查違規", "chapter": "02", "unit": "C16", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 讓支援的工具能從 AGENTS.md 找到目錄限制、建置與測試命令；P04 的 Skill 可以保存重複使用的操作，例如啟動頁面、選標籤、核對資料、清除、保存觀察。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 固定規範放在可發現的位置，執行技巧另載入，需要阻止的錯誤再轉成能產生失敗訊號的檢查。P17 描述過團隊用自動檢查守住依賴方向。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A、P04", "passages": ["p-2"]}, {"number": 150, "type": "content", "title": "用合法與違規的匯入範例驗證依賴檢查器", "chapter": "02", "unit": "C16", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設規範要求「畫面模組只能經資料服務讀取待辦」。文件能讓人讀到規則；若沒有檢查程式，直接匯入儲存模組仍可能成功建置。可設計一項掃描匯入關係的測試，用一個違規依賴確認它會指出 違規匯入的路徑，再用合法範例確認它會通過。這樣助手便有可觀察的修正依據。對需要人判斷的文字品質，保留驗收樣例及審閱人較合適。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A、P04", "passages": ["p-3"]}, {"number": 151, "type": "content", "title": "沒有既有測試入口時如何約定替代檢查", "chapter": "02", "unit": "C16", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstrong>判斷題\u003c/strong>　找不到既有測試入口，可以直接改碼嗎？先查模組說明、測試檔及套件指令，請負責人確認可重現的基準檢查，或議定最小替代測試並記錄缺口，再動手。哪種約束最好轉成可執行測試？能明確描述有效與違規輸入、失敗能定位的依賴規則就是一例。來源為 P04、P05、P17、U-A、T02、T04、concepts/harness.md。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A、P04", "passages": ["p-4"]}, {"number": 152, "type": "content", "title": "用兩筆待辦定義單一標籤的精確比對", "chapter": "02", "unit": "C17", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">尚未決定「依標籤」的意思以前，任何實作都可能看起來合理。為了讓兩個人能算出同樣的答案，先給兩筆固定資料，稱為 fixture。A 是帶 work 標籤的待辦，B 帶 home。API 是畫面向服務讀取資料的介面；下列 GET 表示取資料，問號後的 tag 是篩選條件。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 需求者核准本次只支援單一標籤精確比對。按下面三列先算回應再說明畫面；明訂清除時省略參數。這些是驗收預期。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A", "passages": ["p-1", "p-2"]}, {"number": 153, "type": "content", "title": "推算三種篩選請求的預期回應與畫面", "chapter": "02", "unit": "C17", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"人的操作表格\" data-passage=\"p-3\" data-block=\"3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">人的操作\u003c/th>\n\u003cth scope=\"col\">同一次 API 請求\u003c/th>\n\u003cth scope=\"col\">預期回應與畫面\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>選 work\u003c/td>\n\u003ctd>\u003ccode>GET /todos?tag=work\u003c/code>\u003c/td>\n\u003ctd>只回 A，只見 A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除選擇\u003c/td>\n\u003ctd>\u003ccode>GET /todos\u003c/code>\u003c/td>\n\u003ctd>回 A、B，兩筆都恢復\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查不存在的標籤\u003c/td>\n\u003ctd>\u003ccode>GET /todos?tag=missing\u003c/code>\u003c/td>\n\u003ctd>HTTP 200、空陣列，畫面顯示空結果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P05、P17、U-A", "passages": ["p-3"]}, {"number": 154, "type": "content", "title": "分清省略 tag、空字串與未定義行為", "chapter": "02", "unit": "C17", "body": "\u003cp data-passage=\"p-4\" data-block=\"4\">排除多選、新增標籤與寫入資料。大小寫、多個值與空字串尚未定義，清除時不可自行把省略參數換成 \u003ccode>tag=\u003c/code>。未知標籤回空是預期還是猜測？本案例有經核准的第三列可回查；若自己的需求單未定義，應先列待決。案例規則來自 examples/scenario.md，P05、P17 只支持工程指引與回饋機制。\u003cspan class=\"evidence-label\" data-evidence=\"USER_RECONSTRUCTED\" data-original=\"[USER_RECONSTRUCTED]\">歷史整理／轉述\u003c/span> U02 歷史整理描述先用對話釐清目的，再到工程環境執行的做法。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A", "passages": ["p-4"]}, {"number": 155, "type": "content", "title": "跨畫面與服務的修復計畫：從基線到複驗的三個檢查點", "chapter": "02", "unit": "C17", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 需求者授權助手自行選擇檔案內的實作方式、重跑相關測試；若要改 API 語義或資料結構須先停。因這項需求跨畫面和服務，先規劃三個檢查點：現行資料與入口、第一個不符契約的位置、修復後三列的結果。選擇能讀寫指定檔案、跑測試、讀 Git 差異的環境；若環境只能跑命令，事前安排有權的人補 UI 操作。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A", "passages": ["p-5"]}, {"number": 156, "type": "content", "title": "依第一個失敗斷言定位修改並複驗", "chapter": "02", "unit": "C17", "body": "\u003cp data-passage=\"p-6\" data-block=\"7\">在 B0，先跑原列表檢查確認 A、B 都在，再建立「work 必須只回 A」的斷言。假設新的檢查收到 A、B，記下命令及實際輸入。確認請求已帶 work，服務仍回全部時，才把修改定位在服務讀取及比對條件；若請求根本沒帶 tag，就先查前端如何組請求。修正後以完全相同的資料重跑三個 API 樣例、原列表檢查，以及選取和清除的畫面操作。把結果附在當次 diff 旁交需求者驗收。若初次檢查已符合預期，就先保存通過證據並檢查其餘兩列，毋須憑猜想修程式。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A", "passages": ["p-6"]}, {"number": 157, "type": "content", "title": "畫面篩選正確，仍須核對 API 的請求與回應", "chapter": "02", "unit": "C17", "body": "\u003cp data-passage=\"p-7\" data-block=\"8\">\u003cstrong>判斷題\u003c/strong>　截圖正確能代替 API 測試嗎？畫面可以在本地把 B 隱藏，即使服務錯誤地回兩筆也能顯示 A。對照同次請求與回應才測到 API，操作清除才測到恢復路徑。來源為 T04、P05、P17、U-A、examples/scenario.md。下一節把其中一個失敗分支走到交付。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A", "passages": ["p-7"], "subtitle": "畫面只剩 A，服務可能回了什麼？"}, {"number": 158, "type": "content", "title": "清除仍帶舊標籤：用兩次請求定位故障", "chapter": "02", "unit": "C20", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">接手者看到「篩選失敗」時，需要知道失敗發生在工具啟動、規格解讀、服務回應，還是畫面更新。先把核准行為寫在失敗觀察旁。以下假設服務在固定資料 A(work)、B(home) 下已符合三種請求，專案委託還要求清除選擇時恢復全部待辦。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> \u003cstrong>修前\u003c/strong>先選 work 看 A，再按清除，發現新的請求仍帶 work。服務對這個舊條件正確地回 A，畫面因而沒有 B。直接呼叫不帶 tag 的服務則能回兩筆。這兩次觀察把調查縮到清除操作與請求組裝之間。\u003cstrong>修正\u003c/strong>時讓清除的處理器先移除所選條件，以目前狀態建立省略 tag 的請求；保留既有 API 契約、寫入介面和資料格式。若測試根本沒啟動，先查執行環境，無從對上述故障定位。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、U-C、U-B", "passages": ["p-1", "p-2"]}, {"number": 159, "type": "content", "title": "複驗單標籤修復，多標籤語義另交需求者決定", "chapter": "02", "unit": "C20", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>修後\u003c/strong>用同一 fixture 把「選 work 再清除，請求省略 tag 且兩筆恢復」加入回歸測試，重測原列表、work、missing 及窄畫面。修前與修後要保留命令、版本和實際輸出。若這時發現產品其實要求多標籤，該用交集還是聯集會改變可見結果，先保留 diff 與兩種預期，停在改 API 語義之前交需求者決定。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 此修復限於假設觀察成立，另一個故障位置需要新的定位證據。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、U-C、U-B", "passages": ["p-3"]}, {"number": 160, "type": "content", "title": "空字串能否代表全部？變更 API 語義前先核准", "chapter": "02", "unit": "C20", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstrong>判斷題\u003c/strong>　若下一步需讓空字串代表全部，該停在哪裡？既有契約只核准省略 tag，先提出相容性影響與選項，不把新語義寫進修正或測試。來源為 T04、P17、U-B、U-C。\u003c/p>", "layout": "prose", "note": "", "sources": "P17、U-C、U-B", "passages": ["p-4"]}, {"number": 161, "type": "content", "title": "交付卡：讓驗收者找到版本、差異與執行環境", "chapter": "02", "unit": "C20", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cstrong>一份尚未填結果的交付卡\u003c/strong>　即使同一人從頭做到尾，也要讓驗收者可重查產物。「Worker」在這張卡只表示承辦這項工作的人或助手。以下為 \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span>，案例中的假設分支沒有在本輪執行。\u003c/p>\n\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"欄位表格\" data-passage=\"p-6\" data-block=\"7\" data-rows=\"1,2,3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">欄位\u003c/th>\n\u003cth scope=\"col\">交付時應填什麼\u003c/th>\n\u003cth scope=\"col\">這張教學卡的狀態\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>工作與版本\u003c/td>\n\u003ctd>任務、B0 實際提交、工作區／分支、交付 commit\u003c/td>\n\u003ctd>版本未填\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>差異\u003c/td>\n\u003ctd>diff 或其路徑，改動檔案與理由、既有未提交檔\u003c/td>\n\u003ctd>未產生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>執行\u003c/td>\n\u003ctd>作業系統、依賴、cwd、測試命令\u003c/td>\n\u003ctd>未執行\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P17、U-C、U-B", "passages": ["p-5", "p-6"]}, {"number": 162, "type": "content", "title": "交付卡：分列測項、限制與接受決定", "chapter": "02", "unit": "C20", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"欄位表格\" data-passage=\"p-6\" data-block=\"7\" data-rows=\"4,5,6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">欄位\u003c/th>\n\u003cth scope=\"col\">交付時應填什麼\u003c/th>\n\u003cth scope=\"col\">這張教學卡的狀態\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>測項結果\u003c/td>\n\u003ctd>三組 API、選取／清除 UI、既有回歸各自的 exit code 或實際觀察及輸出位置\u003c/td>\n\u003ctd>未執行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>問題與限制\u003c/td>\n\u003ctd>失敗／未測路徑、重現方式、接手人與下一步\u003c/td>\n\u003ctd>待實作環境補查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>驗收\u003c/td>\n\u003ctd>需求者對指定版本的接受、退回或保留事項\u003c/td>\n\u003ctd>待驗收\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp data-passage=\"p-7\" data-block=\"8\">\u003cstrong>判斷題\u003c/strong>　為何一句「已完成」不夠？它沒有讓人找到哪份程式、哪個環境或哪條預期已被驗證。能核准的是特定版本在指定範圍內的行為；接受後才把新基準記為 B1。來源為 examples/handoff-and-evidence.md、T04、P17、U-C。日後換 session 可接 \u003ca href=\"#02-A08\">A 線續接\u003c/a>。\u003c/p>", "layout": "table", "note": "", "sources": "P17、U-C、U-B", "passages": ["p-6", "p-7"]}, {"number": 163, "type": "content", "title": "核對 Dungeon Lab 兩輪原紀錄的觀察範圍", "chapter": "02", "unit": "C21", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">假設要審一項遊戲修正，先找測試者描述的環境、原始症狀、修改的位置與重跑方式，再看通過數。\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 以下限於使用者個人工程資料包中的 Dungeon Lab Round 01／02 README。兩輪日期均為 2026-11-15，本教材核對文件，本輪未重跑其遊戲或產生截圖。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C", "passages": ["p-1"]}, {"number": 164, "type": "content", "title": "畫布撐寬窄視窗時，如何調整 CSS Grid 的最小寬度？", "chapter": "02", "unit": "C21", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cstrong>第一輪：同一張地圖換到窄視窗會怎樣？\u003c/strong> 起始提交 \u003ccode>76d8a5f\u003c/code>，分支 \u003ccode>experiment/map\u003c/code>，下一輪文件將本輪成果定位為 \u003ccode>6ad3029\u003c/code>。紀錄的環境是 Windows、Node.js 24.21.0、npm 11.7.0、TypeScript 7.0.2、Phaser 4.2.1、Vite 8.3.8，以及 Orca 內嵌 Chromium。原先 CSS Grid 的預設最小欄寬受畫布固有寬度影響；縮小視窗時，容器仍被撐寬，產生水平溢出。改用 \u003ccode>minmax(0, 1fr)\u003c/code> 讓欄可以收窄，再把子項的 \u003ccode>min-width\u003c/code> 設成 \u003ccode>0\u003c/code>，畫布才有空間隨容器縮放。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C", "passages": ["p-2"]}, {"number": 165, "type": "content", "title": "五種 Chromium 視窗尺寸的畫布縮放與溢出紀錄", "chapter": "02", "unit": "C21", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 第一輪的單元測試通過 8/8。另在 1440×1000、1024×768、390×844、320×640、844×390 五種視窗重驗容器邊界與畫布比例。320×640 時房間能縮小且無水平捲動；844×390 因最低頁高仍有少量垂直捲動。若要複查同類修正，應縮放實際 viewport（網頁可用顯示區），比較容器和畫布邊界，再記下水平與垂直方向的結果。\u003cstrong>判斷題\u003c/strong>　這能證明 Firefox 或手機實機也通過嗎？原紀錄使用內嵌 Chromium 的五種 viewport，Firefox、Safari、實體行動裝置及遠端部署均未驗。來源為 U-C／U05，raw_originals/README.txt。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C", "passages": ["p-3"]}, {"number": 166, "type": "content", "title": "第二輪：用斜向滑牆找出碰撞體接縫", "chapter": "02", "unit": "C21", "body": "\u003cp data-passage=\"p-4\" data-block=\"4\">\u003cstrong>第二輪：牆能擋住玩家，為什麼仍可能做錯？\u003c/strong> 從 \u003ccode>6ad3029\u003c/code> 開始，在 \u003ccode>experiment/movement\u003c/code> 驗角色移動。若只測正面向牆推進，能停下就會過關；沿牆持續斜向移動還需要保持切線方向的速度。每格各設一個碰撞體，格子的接縫也可能擋住本來應該滑動的角色。原首次滑牆測試預期到 Y 約 2.745，實際停在 52。改成合併相鄰阻擋格的矩形後，另加斷言核對這些矩形仍恰好覆蓋原本 68 個阻擋格且沒有占用地板，避免「滑得過去」只是因為牆被削掉。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C", "passages": ["p-4"]}, {"number": 167, "type": "content", "title": "Dungeon Lab 測試紀錄：12 項單元測試與 58 項瀏覽器整合檢查", "chapter": "02", "unit": "C21", "body": "\u003cp data-passage=\"p-5\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"TESTED\" data-original=\"[TESTED]\">有紀錄的實際測試\u003c/span> 第二輪報告 12/12 單元測試（含第一輪的八項）與 58 項內嵌 Chromium 瀏覽器定時整合檢查通過。前者核對資料與規則，後者透過實際鍵盤處理及物理更新檢查移動；文件另記一般畫面更新下的即時操作。鍵盤事件由程式派發，未用實體鍵盤人工遊玩，也未測 Firefox、Safari、實機手機或長時間壓力。讀紀錄時可逐項對照「格子覆蓋正確」和「連續移動不卡」各由哪個檢查支持。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C", "passages": ["p-5"]}, {"number": 168, "type": "content", "title": "用阻擋格覆蓋與連續移動排除兩種假修復", "chapter": "02", "unit": "C21", "body": "\u003cfigure data-block=\"6\">\u003cfigcaption>第二輪的兩個檢查各排除一種假修復（U06 歷史報告）\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">即使這項通過\u003c/th>\u003cth scope=\"col\">還可能有什麼錯\u003c/th>\u003cth scope=\"col\">另外核對\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">角色沿牆能滑動\u003c/th>\u003ctd>修正可能移除了部分牆體。\u003c/td>\u003ctd>合併矩形恰好覆蓋原有 68 個阻擋格，未占用地板。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">阻擋格覆蓋正確\u003c/th>\u003ctd>角色仍可能在碰撞體接縫卡住。\u003c/td>\u003ctd>在內嵌 Chromium 重做連續斜向移動，觀察切線方向位移。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "", "sources": "U-C", "passages": []}, {"number": 169, "type": "content", "title": "兩輪測試數量無法衡量單 Agent 與多 Agent 的效率", "chapter": "02", "unit": "C21", "body": "\u003cp data-passage=\"p-6\" data-block=\"8\">\u003cstrong>判斷題\u003c/strong>　第二輪比第一輪有更多測項，可以當成多 Agent 效率實驗嗎？兩輪驗不同功能，沒有同需求同品質門檻的單／多 Agent 對照，也缺兩種流程的時間與人工投入資料。這些紀錄支持特定版本的故障、修復與複驗。來源為 U-C／U06，raw_originals/README(1).txt；比較效益的方法見第五章。\u003c/p>", "layout": "prose", "note": "", "sources": "U-C", "passages": ["p-6"]}, {"number": 170, "type": "chapter", "title": "多 Agent 協作｜角色、Worktree、Task DAG 與整合", "chapter": "03", "unit": "", "body": "", "layout": "prose", "note": "", "sources": "", "passages": []}, {"number": 171, "type": "content", "title": "用獨立交付與驗收判斷能否分工", "chapter": "03", "unit": "C22", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 想像你只有一位能讀寫程式、執行測試的開發助手。新增一位助手之前，請試著各寫一張交付單，寫出它收到的輸入、能獨力產出的結果，以及別人用什麼例子驗收。寫第二張時若只能寫「等第一位決定」，目前仍只有一條可執行的路。所謂可分離，是雙方能依同一份約定各自完成並檢查一件工作。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P15、U-A", "passages": ["p-1"]}, {"number": 172, "type": "content", "title": "共用欄位未定，前端測試也要等", "chapter": "03", "unit": "C22", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 待辦網站由伺服器提供資料，畫面再將資料顯示給人看。假設資料介面（API）回傳的標籤欄位可能從字串清單改成物件清單，使用者介面（UI）的開發者就連測試資料該怎麼寫也得等。此時多開一位執行者（Worker），依然要等欄位決策，還多一次交接和整合。改由一人先釐清共同欄位，能把決定連同樣例留給下游。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P15、U-A", "passages": ["p-2"]}, {"number": 173, "type": "content", "title": "契約定版後，估算平行自測的收益與交接成本", "chapter": "03", "unit": "C22", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 再看約定已定的情況。API 可以拿固定資料檢查回傳內容，UI 可以先用約定的回應檢查畫面。分別寫下可同時進行的工作，再在旁邊記下交接契約、合併修改、審查差異及失敗後重試的代價。只有當可分開驗收帶來的預期收益值得負擔這些工作，增派人才有理由。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Anthropic 的 P01 討論可預拆的平行工作與額外步驟成本，Team Topologies 的 P15 討論人類團隊的負荷。將後者用來安排 Agent 是教材的設計類推。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cstrong>自我驗收\u003c/strong>　什麼情況下單 Agent 反而更合理？Agent 越多是否必然越快？若要解的只有共享欄位這一個決定，第二位沒有獨立產物，可以只留一人。若兩邊已可自測，才有機會縮短等待。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 這項分析沒有量到實際交付時間。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P15、U-A", "passages": ["p-3", "p-4"]}, {"number": 174, "type": "content", "title": "人類決定產品目標，協調者派工，執行者交件", "chapter": "03", "unit": "C23", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 使用者的 U07 陳述提出先配置工程職責與環境，再依需求派工。假如一項需求叫作「依標籤看待辦」，先讓產品負責人說明使用者應看到什麼，再問誰整理規格、誰實作、誰查驗，能看出工作漏在哪一段。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 在本例，人類決定目的、可接受的風險與最終採納。協調者（Coordinator）接收核准的目的，整理工作、記依賴、指派負責人；執行者（Worker）依票修改並交回可查的產物。當執行者碰到影響使用者的兩種合理解讀，把兩種結果及受影響的票送回協調者，由協調者找具權者決定，再把決議送回原票。專案應寫明誰有簽收權；流程中的職稱本身不會授權。\u003c/p>", "layout": "prose", "note": "", "sources": "P15、U-A、S02", "passages": ["p-1", "p-2"]}, {"number": 175, "type": "content", "title": "產品歧義由執行者回報、具權者裁決", "chapter": "03", "unit": "C23", "body": "\u003cfigure data-block=\"3\">\u003cfigcaption>案例中的決策路徑｜畫面出現兩種合理解讀時，誰接下一棒？\u003c/figcaption>\u003col class=\"flow-list\">\u003cli>\u003cstrong>執行者 → 協調者\u003c/strong>　附上兩種可見結果，列出會受影響的票。\u003c/li>\u003cli>\u003cstrong>協調者 → 具權者\u003c/strong>　查專案的授權記錄，請有權決定產品行為的人選定預期。\u003c/li>\u003cli>\u003cstrong>具權者 → 協調者 → 執行者\u003c/strong>　把決議寫回原票，讓各方按同一個預期續做。\u003c/li>\u003c/ol>\u003c/figure>", "layout": "figure", "note": "", "sources": "P15、U-A、S02", "passages": []}, {"number": 176, "type": "content", "title": "簽收時核對目標、風險與原始產物", "chapter": "03", "unit": "C23", "body": "\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cstrong>自我驗收\u003c/strong>　主管是否必須知道所有程式細節？要決定是否採納時，主管需要看到目標、風險、例外和檢查結果，並能追查原始產物。若兩種選擇會改變使用者看到的清單，主管須能決定或找到有權決定的人，無須代替每位 Worker 修改程式。\u003c/p>", "layout": "prose", "note": "", "sources": "P15、U-A、S02", "passages": ["p-3"]}, {"number": 177, "type": "content", "title": "審查者交差異意見，整合者交共同版本的結果", "chapter": "03", "unit": "C23", "body": "\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 審查者（Reviewer）拿契約與修改差異對讀，交出符合項、偏差與風險。整合者（Integrator）則拿雙方的確切版本放回指定的共同基線，也就是團隊承認的起始版本，檢查它們一起運作時的行為，再交付整合版及回歸結果。審查可能先發現缺少清除按鈕的測例；即使這條測例已補齊，整合者仍需查清除時畫面真的取得了完整清單。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cstrong>自我驗收\u003c/strong>　兩位 Worker 都自測通過，誰檢查合併後版本？把目標基線及兩份產物交給負有整合責任的人。小改動時同一位 Agent 可以兼任 Reviewer、Integrator，但應留下兩項輸出，讓接手者能分別找出審查意見及整合結果；涉及高風險改動時可另指派審查者。\u003c/p>", "layout": "prose", "note": "", "sources": "P15、U-A、S02", "passages": ["p-4", "p-5"]}, {"number": 178, "type": "content", "title": "依前置、授權與獨立驗收辨認可派工作", "chapter": "03", "unit": "C25", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 同一個專案在不同時刻，能交出的工作量可能差很多。拿出工作票（記錄一項交付及其完成條件的文件），在每張旁邊填三件事：還缺哪個上游決定、要用哪個版本的共用資料型別、拿什麼輸出驗收。前置已滿足而且有權開始的票，這裡稱為 ready。把 ready 的票依能否各自驗收分組，最後再問負責協調的人能否接收、審查和整合這些回報。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P15、U-A", "passages": ["p-1"]}, {"number": 179, "type": "content", "title": "契約核准後，再按可驗收的工作量增派人手", "chapter": "03", "unit": "C25", "body": "\u003cp data-passage=\"p-2\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在待辦案例，先由一張契約票 F0 決定標籤的型別、查詢的規則與一組共用樣本。F0 未准前，伺服器票 F1 與畫面票 F2 都要等同一個欄位，即使大型專案多出第三位 Worker，瓶頸還在。F0 核准後，F1 能單獨驗查詢結果，F2 能依同一份樣本驗畫面；此時可以各派一位，也可以在只能仔細接收一份回報時依序做。實際配置還受人力可管理的票數限制。\u003c/p>\n\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cstrong>自我驗收\u003c/strong>　新增第三個 Worker 會解除 F0 阻塞嗎？哪個例子更有平行化空間？請比對「大專案的兩票共等同一型別」和「小改動已有定版樣本、兩票可各交一份測試」；後者有兩件可同時驗收的事，前者要先取得決策。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 這個推導無法算出放諸各專案皆準的最佳人數。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P15、U-A", "passages": ["p-2", "p-3"]}, {"number": 180, "type": "content", "title": "Project 如何保存跨工作階段的協作記錄", "chapter": "03", "unit": "C24", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 一位同事關掉編輯器，接手的人該向哪裡找進度？先看專案（Project）這個長期容器，再辨認裡面的六種實體。把它們寫在不同欄位，才能說清楚換掉的究竟是人、工作、這一次指派，還是裝著檔案的目錄。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02", "passages": ["p-1"]}, {"number": 181, "type": "content", "title": "分清角色、執行個體與工作階段", "chapter": "03", "unit": "C24", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"實體表格\" data-passage=\"p-2\" data-block=\"2\" data-rows=\"1,2,3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">實體\u003c/th>\n\u003cth scope=\"col\">在待辦專案裡如何辨認\u003c/th>\n\u003cth scope=\"col\">什麼時候改變\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Role，角色\u003c/td>\n\u003ctd>例如「負責伺服器介面」這份職責\u003c/td>\n\u003ctd>可跨多項需求保留，直到組織調整責任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent，執行個體\u003c/td>\n\u003ctd>本次履行這個角色的開發助手\u003c/td>\n\u003ctd>能換人接手，一個個體也可兼任另一職責\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session，工作階段\u003c/td>\n\u003ctd>一次帶有對話與操作上下文的工作時段\u003c/td>\n\u003ctd>關閉後可另開，接手者須從記錄恢復\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P13、S02", "passages": ["p-2"]}, {"number": 182, "type": "content", "title": "任務、派工嘗試與工作目錄各追蹤什麼？", "chapter": "03", "unit": "C24", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"實體表格\" data-passage=\"p-2\" data-block=\"2\" data-rows=\"4,5,6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">實體\u003c/th>\n\u003cth scope=\"col\">在待辦專案裡如何辨認\u003c/th>\n\u003cth scope=\"col\">什麼時候改變\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Task，任務\u003c/td>\n\u003ctd>有目標及驗收條件的一張票\u003c/td>\n\u003ctd>同一工作重試時保留，到接受或終止才結案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dispatch，派工嘗試\u003c/td>\n\u003ctd>把這張票交給特定執行者的某一次指派\u003c/td>\n\u003ctd>重派時另編，舊嘗試保留歷史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Worktree，工作目錄\u003c/td>\n\u003ctd>檢出檔案、實際修改的地方\u003c/td>\n\u003ctd>可以在階段結束後保留，整理前要先查明產物\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P13、S02", "passages": ["p-2"]}, {"number": 183, "type": "content", "title": "工作階段結束後，如何核對任務是否結案？", "chapter": "03", "unit": "C24", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 將待辦網站的起始版本記為 B0。請把「API 角色、承辦助手、這次對話、API 票 F1、這次指派 d1、以 B0 起步的目錄」各放回表中一列。這樣即使對話結束，接手者仍知道要去哪裡查檔案、查哪張票，以及誰有權判定完成。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"4\">\u003cstrong>自我驗收\u003c/strong>　結束 Session 是否等於任務完成？若查票只找到一個目錄和一段已結束的對話，仍應查有效指派、產物及接受記錄；光憑關閉時間無從結案。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02", "passages": ["p-3", "p-4"]}, {"number": 184, "type": "content", "title": "重派後，遲到的回報歸入原派工紀錄", "chapter": "03", "unit": "C24", "body": "\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Orca 的 P13 文件摘要區分 Task 與 Dispatch，完成訊息帶回任務、嘗試及結果。此處按專案收錄時標為 Experimental 的文件說明機制。\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設同一張 F1 先派 d1，協調者確認重派後將 d2 登記為目前有效；此時才收到 d1 的成功訊息。把訊息附回 F1 的 d1 歷史，查 d2 的承辦者與狀態，再依 d2 的實際產物審核 F1。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"7\">\u003cstrong>自我驗收\u003c/strong>　為何舊 Dispatch 的完成訊息不能直接覆寫新狀態？票號相同只說明目標相同。舊嘗試可能依賴舊輸入，也沒有當前指派的交付權；用它覆寫會讓真正仍在工作的 d2 消失在帳上。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02", "passages": ["p-5", "p-6"], "subtitle": "F1 已從 d1 重派為 d2，遲到的成功訊息歸哪裡？"}, {"number": 185, "type": "content", "title": "用產物依賴區分循序與並行工作", "chapter": "03", "unit": "C26", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 先畫資料的箭頭。若乙必須讀甲的產物才能開始，兩步依序執行（Sequential）；若兩者已各自拿到穩定輸入，就能並行（Parallel）。\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 在紙上寫下「核准契約 F0 → API 修改 F1 與畫面修改 F2 → 整合 F3」，讓 F1、F2 分別指向 F3。F1 的回傳格式和 F2 的畫面預期都取自 F0，兩人無須等對方寫完，但整合需要兩份產物。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P16、P13", "passages": ["p-1"]}, {"number": 186, "type": "content", "title": "整合開工要等前後端的提交與局部檢查", "chapter": "03", "unit": "C26", "body": "\u003cfigure data-block=\"2\">\u003cfigcaption>合成案例｜沿每一條箭頭讀出下游要等的產物\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">上游 → 下游\u003c/th>\u003cth scope=\"col\">箭頭上要交什麼\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">F0 → F1\u003c/th>\u003ctd>核准的單標籤契約與固定樣本，供後端驗查詢。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">F0 → F2\u003c/th>\u003ctd>同一版契約與樣本，供畫面驗參數和顯示。\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">F1、F2 → F3\u003c/th>\u003ctd>兩邊指定的提交與局部檢查都齊備，整合者才有一組可重測的輸入。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>\n\u003cp data-passage=\"p-2\" data-block=\"3\">\u003cstrong>自我驗收\u003c/strong>　F3 能和 F1 同時開始嗎？可先準備整合用的測例；正式檢查合併版本這一步仍要等 F1 和 F2 交來指定版本。\u003c/p>", "layout": "figure", "note": "", "sources": "P01、P16、P13", "passages": ["p-2"]}, {"number": 187, "type": "content", "title": "用最終回覆者區分 Manager 與 Handoff", "chapter": "03", "unit": "C26", "body": "\u003cp data-passage=\"p-3\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> 接著畫控制權的箭頭。在 OpenAI Agents SDK 的 Manager 模式中，管理者呼叫專家取得局部結果，回來後仍由管理者綜合與回覆。在 Handoff 模式中，原執行者把本輪主控交給接手者，由後者接續處理與回應。先問結果回到誰手上，再問誰決定對外回什麼，就能區分委託與移交。這是 P16 描述的控制方式，跨輪工程治理仍要另行設計。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"6\">\u003cstrong>自我驗收\u003c/strong>　Worker 交結果給 Coordinator 是 handoff 嗎？如果協調者仍要審核、彙整及答覆，控制權留在協調者。一般文件交接也可以只移交資訊。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P16、P13", "passages": ["p-3", "p-4"]}, {"number": 188, "type": "content", "title": "並行分工時，誰保留最終回覆權？", "chapter": "03", "unit": "C26", "body": "\u003cp data-passage=\"p-5\" data-block=\"8\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 把兩種箭頭疊在剛才的圖上。協調者保留主控，同時請兩位 Worker 做 F1、F2，收件後依序安排 F3 並將結果報給人類。這條路同時用到 Manager、Parallel 和 Sequential。如果任務改成「請熟悉此模組的專家接手本輪說明」，可選 Handoff 並指定接手者直接答覆。單把整合票交給專家做，仍可能由原協調者收件。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"9\">\u003cstrong>自我驗收\u003c/strong>　哪個模式決定誰最後向人類回報？沿控制權去找最後持有者。看到兩位助手同時工作，只能判斷時序；要判斷最終回報人，還得知道主控留在管理者還是已移交。\u003c/p>", "layout": "prose", "note": "", "sources": "P01、P16、P13", "passages": ["p-5", "p-6"]}, {"number": 189, "type": "content", "title": "用初始化記錄定位工作目錄與交付對象", "chapter": "03", "unit": "C27", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"USER_DIRECT\" data-original=\"[USER_DIRECT]\">使用者直接觀點\u003c/span> 在 U07 的工作方法裡，先把專案環境和責任建立起來，再把需求交進來。想像今天有人加入，只收到「到最新的程式碼改畫面」。他即使改對了功能，也可能改在無人準備接受的版本上。初始化要交付的是一份能讓新承辦人抵達同一起點的專案記錄。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 以虛構的 todos 專案演練，逐欄填好後，請接手者依記錄指出自己的工作目錄和交付對象。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P12、S02、P14", "passages": ["p-1", "p-2"]}, {"number": 190, "type": "content", "title": "在專案記錄指明架構、基準提交與共享規範", "chapter": "03", "unit": "C27", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"初始化欄位表格\" data-passage=\"p-3\" data-block=\"3\" data-rows=\"1,2,3\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">初始化欄位\u003c/th>\n\u003cth scope=\"col\">接手者應能從記錄還原的事\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>產品與架構\u003c/td>\n\u003ctd>目標是顯示待辦，伺服器提供資料、畫面發出查詢；誰能批准跨兩者的改動\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>版本庫（repo）、權威分支與基準\u003c/td>\n\u003ctd>指定 todos 的 main 作接受成果的分支，記下起始提交，以 B0 代稱。分支可前進，提交識別特定快照\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>規範與共享資料\u003c/td>\n\u003ctd>專案指引列建置、測試、提交步驟與限制，共同介面和測試樣本附版本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P05、P12、S02、P14", "passages": ["p-3"]}, {"number": 191, "type": "content", "title": "登記工作區、操作權限與測試門檻", "chapter": "03", "unit": "C27", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"初始化欄位表格\" data-passage=\"p-3\" data-block=\"3\" data-rows=\"4,5,6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">初始化欄位\u003c/th>\n\u003cth scope=\"col\">接手者應能從記錄還原的事\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>責任與工作區\u003c/td>\n\u003ctd>登記產品決策者、協調者、執行者及整合者，為每次指派記目錄、分支及起點\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>權限\u003c/td>\n\u003ctd>逐一核對誰能讀、寫、執行、整合與批准，確認環境實際開放哪些操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>品質門檻\u003c/td>\n\u003ctd>先找舊列表測試，再約定每張票的局部測試、整合重驗及簽收記錄要放在哪裡\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P05、P12、S02、P14", "passages": ["p-3"]}, {"number": 192, "type": "content", "title": "核對實際檢出位置、環境權限與批准者", "chapter": "03", "unit": "C27", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P05 說明如何用 AGENTS.md 讓開發者與助手找到專案規則；寫下禁止事項仍須搭配環境的存取控制。P12 說明工作區可選起始版本，P14 說明如何核對檢出位置。\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 新承辦人若發現實際起點不同，先帶著目錄與提交回報差異，再決定是否放行。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"6\">\u003cstrong>自我驗收\u003c/strong>　沒有權威分支，合併後誰能決定 B1？要回到專案指定的批准者，先確認接受成果的位置、測試門檻與權限。例中 B1 指整合後獲准採用的下一個基準，僅找到最新提交無法推得這項批准。下一輪可沿用環境，如何重開任務見 \u003ca href=\"#C35\">3.14\u003c/a>。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P12、S02、P14", "passages": ["p-4", "p-5"]}, {"number": 193, "type": "content", "title": "Git 工作樹各有 HEAD 與暫存區，共用版本庫物件", "chapter": "03", "unit": "C28", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> Git 把已提交的內容存進版本庫（repo），分支（branch）指向一段工作的提交位置，工作樹（worktree）則讓你在一個目錄檢出並修改檔案。從同一個 repo 掛接多個工作樹，各自有目前檢出位置 HEAD 和準備提交內容的暫存區 index；物件及多數版本參照仍共用。知道 repo 名稱，還不足以知道一位 Worker 正在改哪份檔案。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、P12、U-A", "passages": ["p-1"]}, {"number": 194, "type": "content", "title": "用 Git 核對各工作樹的分支與起始提交", "chapter": "03", "unit": "C28", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 設團隊核准的起點是 main 指向的 B0。先記下 B0 的提交識別，再分別由此建立 API、UI 及整合用的分支，在三個工作目錄檢出。本例從專案根目錄讀路徑，\u003ccode>worktrees/wt-api\u003c/code> 檢出分支 \u003ccode>feature/api-filter\u003c/code>，\u003ccode>worktrees/wt-ui\u003c/code> 檢出 \u003ccode>feature/ui-filter\u003c/code>，\u003ccode>worktrees/wt-int\u003c/code> 檢出 \u003ccode>integration/filter\u003c/code>。下文的 wt-api、wt-ui、wt-int 是這三個目錄的簡稱。以 \u003ccode>git worktree list\u003c/code> 對照目錄及分支，到各目錄執行 \u003ccode>git rev-parse HEAD\u003c/code> 核對起點，將實際值填回票上。兩位 Worker 各交出新提交後，原先同祖的三個目錄內容就可以各不相同。Orca 側欄的父子分組供瀏覽，不能用來推斷 Git 的祖先關係。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、P12、U-A", "passages": ["p-2"]}, {"number": 195, "type": "content", "title": "檢查共用資料庫、固定埠與測試資料的干擾", "chapter": "03", "unit": "C28", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>自我驗收\u003c/strong>　多個 Worktree 會有完全獨立的資料庫嗎？要查測試的連線設定。若指向同一個資料庫，兩目錄的程序讀寫的仍是同一批資料。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 假設兩套測試都要啟動固定埠的服務。第一個程序佔用該埠後，第二個可能啟動失敗，甚至把請求送到上一個服務。也可能兩人共用一批固定測試資料（fixture），其中一方重設資料時，另一方的預期清單就變了。派工時列出埠、資料庫、樣本版本與權限；能分開的各配位置，無法分開的排好使用順序，並在測試報告寫出實際連到哪個服務。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、P12、U-A", "passages": ["p-3", "p-4"]}, {"number": 196, "type": "content", "title": "Git 合併後，用清除篩選驗證前後端語義", "chapter": "03", "unit": "C28", "body": "\u003cp data-passage=\"p-5\" data-block=\"7\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 檔案互不覆寫仍可能產生語義衝突。例如前端把空字串當作清除，後端卻把它當成查不到。即使 Git 能乾淨合併兩份檔案，人看到的清單仍可能不合契約。先給雙方同一份介面樣例，整合時重跑跨模組路徑。\u003cspan class=\"evidence-label\" data-evidence=\"GAP\" data-original=\"[GAP]\">證據待補／尚未驗證\u003c/span> 埠衝突是此處用來推理的假設，沒有本例事故紀錄。\u003c/p>\n\u003cp data-passage=\"p-6\" data-block=\"8\">\u003cstrong>自我驗收\u003c/strong>　Git merge 乾淨就能表示產品正確嗎？合併檢查回答的是檔案變更能否套用；要回答產品問題，得在合併版本上實際選取、清除並觀察請求與畫面。\u003c/p>", "layout": "prose", "note": "", "sources": "P14、P12、U-A", "passages": ["p-5", "p-6"]}, {"number": 197, "type": "content", "title": "單標籤契約的目標、範圍與簽收條件", "chapter": "03", "unit": "C29", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 想像你負責一個已有待辦列表的網站。收到「按標籤顯示待辦」後，你若只把同一句話轉寄給畫面和伺服器的作者，一人可能做多選，另一人只收一個值。先把共同承諾寫成契約票。這輪從 B0 開始，契約的全案唯一票號是 \u003ccode>R1-F0\u003c/code>；講解第一輪時簡稱 F0。工作票索引與跨輪交接一律寫全號。目標（Target）是讀取並顯示單一標籤精確匹配的待辦；限制（Constraints）是沿用既有資料與列表順序，本輪排除新增標籤、寫入資料與多選。最後寫可直接觀察的接受條件（Acceptance），交由產品負責人確認，並保存獲准的版本供兩邊讀取。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A", "passages": ["p-1"]}, {"number": 198, "type": "content", "title": "查詢契約如何區分省略參數、未知標籤與空字串", "chapter": "03", "unit": "C29", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">在這個契約裡，「清除」要送出沒有 tag 參數的列表請求，未知標籤則是一次合法查詢，只是沒有匹配記錄。明寫這個差別，兩位作者才知道畫面空了代表什麼。大小寫變體、多值、空字串的解讀留作待決，不能把自己選的值寫成已核准的預期。\u003c/p>\n\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>自我驗收\u003c/strong>　未定義空字串的行為應由誰決定？請先讓負責人看兩個可見後果：若等同省略，會看到全部；若當作未匹配，會看到空清單。交有產品決策權的人裁決並更新 F0；使用既有省略規則完成清除操作的部分仍有明確判準。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A", "passages": ["p-2", "p-3"]}, {"number": 199, "type": "content", "title": "前後端共用同版測試資料與預期結果", "chapter": "03", "unit": "C29", "body": "\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 用固定輸入把「如預期」換成可核對的結果。一筆待辦 A 帶 work 標籤，另一筆 B 帶 home 標籤。把這組資料編入 F0 核准版，同時交給伺服器票 F1 和畫面票 F2。GET 表示讀取資料，\u003ccode>/todos\u003c/code> 是列表位置，問號後面帶查詢參數。兩邊各在同一列寫下自己能驗的部分。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A", "passages": ["p-4"]}, {"number": 200, "type": "content", "title": "選取、清除與未知標籤的 API 和畫面斷言", "chapter": "03", "unit": "C29", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"動作表格\" data-passage=\"p-5\" data-block=\"6\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">動作\u003c/th>\n\u003cth scope=\"col\">F1 對介面的斷言\u003c/th>\n\u003cth scope=\"col\">F2 對畫面的斷言\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>選 work\u003c/td>\n\u003ctd>GET /todos?tag=work 回傳 [A]\u003c/td>\n\u003ctd>送出 tag=work，回應後只顯示 A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清除選取\u003c/td>\n\u003ctd>GET /todos 省略 tag，回傳 [A,B]\u003c/td>\n\u003ctd>查詢不帶 tag，恢復 A、B\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查不存在的標籤 missing\u003c/td>\n\u003ctd>GET /todos?tag=missing 回傳成功狀態 200 和空清單\u003c/td>\n\u003ctd>收到空清單後顯示有效的空結果，畫面仍可操作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P05、P17、U-A", "passages": ["p-5"]}, {"number": 201, "type": "content", "title": "樣本不一致時，前後端自測通過能證明什麼？", "chapter": "03", "unit": "C29", "body": "\u003cp data-passage=\"p-6\" data-block=\"7\">\u003cstrong>自我驗收\u003c/strong>　為何 UI/API 都用同一版 fixture？若伺服器測試把 B 設為 home，而畫面測試把 B 設為 work，兩邊都可按自己的預期通過，整合者卻無法判讀哪一份符合需求。F2 可先以模擬回應（mock）測畫面；這只能證明畫面能處理該回應，真實串接仍要在整合票驗。\u003c/p>", "layout": "prose", "note": "", "sources": "P05、P17、U-A", "passages": ["p-6"]}, {"number": 202, "type": "content", "title": "工程工作票的八個欄位與交接條件", "chapter": "03", "unit": "C30", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 收到工作票的人應能自己判斷「我改哪裡、憑什麼開始、什麼算交件」。八個欄位分別回答目的、改動、邊界、人、版本、前置、交付與驗收。若目的只寫「完成 API」，承辦人可能順手改掉排序，審查者也不知道該拿哪版資料檢查。下面把這張票填到另一人可以接手；提交和測試結果只能由真正執行的人補。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02", "passages": ["p-1"], "subtitle": "「完成 API」少了哪些可交接的欄位？"}, {"number": 203, "type": "content", "title": "API 工作票的目標、改動範圍與負責人", "chapter": "03", "unit": "C30", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"F1 工作票欄位表格\" data-passage=\"p-2\" data-block=\"2\" data-rows=\"1,2,3,4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">F1 工作票欄位\u003c/th>\n\u003cth scope=\"col\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 核准後可派的內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Target 目標\u003c/td>\n\u003ctd>使用者可依單一標籤讀取待辦\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Change 改動\u003c/td>\n\u003ctd>在既有 GET /todos 加入單值精確匹配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Constraints 邊界\u003c/td>\n\u003ctd>維持原列表順序與省略 tag 的行為，維持唯讀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Owner 負責人\u003c/td>\n\u003ctd>API Worker，在 wt-api 工作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P13、S02", "passages": ["p-2"]}, {"number": 204, "type": "content", "title": "API 工作票的基線、前置、產物與驗收", "chapter": "03", "unit": "C30", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"F1 工作票欄位表格\" data-passage=\"p-2\" data-block=\"2\" data-rows=\"5,6,7,8\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">F1 工作票欄位\u003c/th>\n\u003cth scope=\"col\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 核准後可派的內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Base 起點\u003c/td>\n\u003ctd>已登記的 B0 提交與核准的 F0 契約版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dependencies 前置\u003c/td>\n\u003ctd>F0 已接受，且同版 A(work)、B(home) 樣本可取得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Output 產物\u003c/td>\n\u003ctd>提交識別、程式差異（diff）、測試命令與實際輸出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Acceptance 驗收\u003c/td>\n\u003ctd>work 只回 A，missing 回成功空列表，省略回 A、B\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P13、S02", "passages": ["p-2"]}, {"number": 205, "type": "content", "title": "用工作票索引追蹤一輪需求的四項交付", "chapter": "03", "unit": "C30", "body": "\u003cp data-passage=\"p-3\" data-block=\"3\">\u003cstrong>自我驗收\u003c/strong>　只寫「完成 API」為何不夠？請試著只靠這句話判斷重排清單算不算完成。要有原順序的限制、比對用的基準和三種預期，驗收者才有理由接受或退回。\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"[PUBLIC_DOC]\">公開技術文件\u003c/span> P13 描述任務與派工嘗試；這份八欄票是教材的設計。\u003c/p>\n\u003cp data-passage=\"p-4\" data-block=\"5\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 四張票共用同一個需求，但交回來的東西可以逐張點收。B0 是團隊已承認的起點，B1 是下一次接受新版本後才會登記的名稱。這張工作票索引屬於第一輪。下表 F0、F1、F2、F3 的全案票號依序為 \u003ccode>R1-F0\u003c/code>、\u003ccode>R1-F1\u003c/code>、\u003ccode>R1-F2\u003c/code>、\u003ccode>R1-F3\u003c/code>。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02", "passages": ["p-3", "p-4"]}, {"number": 206, "type": "content", "title": "契約票交核准樣本，API 票交修改與測試", "chapter": "03", "unit": "C30", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"票與責任人表格\" data-passage=\"p-5\" data-block=\"6\" data-rows=\"1,2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">票與責任人\u003c/th>\n\u003cth scope=\"col\">輸入、位置與限制\u003c/th>\n\u003cth scope=\"col\">可交付的結果與接受條件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>F0 契約；協調者整理、人類核准\u003c/td>\n\u003ctd>從 B0 與原需求出發，在規格區決定單標籤匹配、清除及未知值，排除多選\u003c/td>\n\u003ctd>帶版本的介面例與樣本，三組預期經具權者核准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F1 資料介面；API Worker\u003c/td>\n\u003ctd>在 wt-api 以 B0 和 F0 做讀取篩選，前置為 F0\u003c/td>\n\u003ctd>依上表交修改提交、差異及三項介面測試\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P13、S02", "passages": ["p-5"]}, {"number": 207, "type": "content", "title": "畫面票交模擬測試，整合票驗真實資料路徑", "chapter": "03", "unit": "C30", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"票與責任人表格\" data-passage=\"p-5\" data-block=\"6\" data-rows=\"3,4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">票與責任人\u003c/th>\n\u003cth scope=\"col\">輸入、位置與限制\u003c/th>\n\u003cth scope=\"col\">可交付的結果與接受條件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>F2 使用者介面；UI Worker\u003c/td>\n\u003ctd>在 wt-ui 以 B0 和同版 F0 實作選取與清除，以模擬回應測試，維持 F0 語義\u003c/td>\n\u003ctd>交畫面修改、提交、操作與模擬範圍；核對送出的參數、顯示清單與清除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F3 整合；Integrator\u003c/td>\n\u003ctd>在 wt-int 以 B0 收 F1 與 F2 的指定提交，遇介面歧義交決策者\u003c/td>\n\u003ctd>交整合提交、真實介面與畫面回歸結果、未測清單；具權者查三例並簽收才登記 B1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "", "sources": "P13、S02", "passages": ["p-5"]}, {"number": 208, "type": "content", "title": "超出前後端契約的行為須回契約票核准", "chapter": "03", "unit": "C30", "body": "\u003cp data-passage=\"p-6\" data-block=\"7\">\u003cstrong>自我驗收\u003c/strong>　F2 可以自行改變 F0 的 API 語義嗎？若畫面需要的行為超出契約，把差異和受影響的案例交回 F0；要等新版本核准才能改寫共用規則。否則 F1 和 F2 看似各自完成，F3 收到的卻是兩個產品。\u003c/p>", "layout": "prose", "note": "", "sources": "P13、S02", "passages": ["p-6"]}, {"number": 209, "type": "content", "title": "把下游需要的產物寫在 DAG 的邊上", "chapter": "03", "unit": "C31", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">\u003cspan class=\"evidence-label\" data-evidence=\"DESIGN\" data-original=\"[DESIGN]\">工程設計／建議方法\u003c/span> 把工作票畫成點，以箭頭表示「下游要讀到這份上游產物」。沿箭頭前進不會繞回起點，這種圖稱為有向無環圖（DAG）。畫圖時要把「什麼算取得產物」寫在邊上；有人開始打字或傳來進度都無法滿足「契約已接受」這個條件。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "P13、P01", "passages": ["p-1"]}, {"number": 210, "type": "content", "title": "從契約獲准到整合開工，逐條核對依賴", "chapter": "03", "unit": "C31", "body": "\u003cp data-passage=\"p-2\" data-block=\"3\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 從待辦網站第一次進案開始，請逐行更新狀態。F0 等核准時，F1 資料介面和 F2 畫面都等同一份契約；F0 accepted 表示契約已被接受，這時 F1 與 F2 同時 ready，可以派工。F1 交件並經局部核對後，F3 的 API 輸入齊了，畫面輸入仍缺。F2 也交付符合約定的版本後，重查兩份是否源自同一基準，才放行 F3 做整合。\u003c/p>\n\u003cp data-passage=\"p-3\" data-block=\"4\">\u003cstrong>自我驗收\u003c/strong>　F1 完成後能直接進 F3 嗎？找出 F3 的兩條入邊，分別填上可取用的提交。只填得出 F1 時，即使整合者有空，也不能執行雙方版本的檢查。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "P13、P01", "passages": ["p-2", "p-3"]}, {"number": 211, "type": "content", "title": "只有後端交件時，整合票如何記錄缺件？", "chapter": "03", "unit": "C31", "body": "\u003cfigure data-block=\"5\">\u003cfigcaption>合成案例｜只有後端先交件時，逐邊檢查整合票\u003c/figcaption>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">F3 要讀的產物\u003c/th>\u003cth scope=\"col\">契約已准，兩邊尚未交件\u003c/th>\u003cth scope=\"col\">僅 F1 已交且經核對\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">後端輸入\u003c/th>\u003ctd>待交\u003c/td>\u003ctd>可取用\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">畫面輸入\u003c/th>\u003ctd>待交\u003c/td>\u003ctd>待交\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">整合者現在能做什麼\u003c/th>\u003ctd>等待兩份提交\u003c/td>\u003ctd>保留後端提交，繼續等畫面版本\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/figure>", "layout": "figure", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "P13、P01", "passages": []}, {"number": 212, "type": "content", "title": "缺產品決議等裁決，違反既定契約則退修", "chapter": "03", "unit": "C31", "body": "\u003cp data-passage=\"p-4\" data-block=\"7\">\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 同一張圖有兩種暫停原因。若 UI 提議把標籤改成多選，協調者把受影響的票標記 BLOCKED（缺決策而暫停），寫明待決語義與批准者。收到有權者的決議後，更新契約並重新核對每條前置。若已有明確契約而 F3 發現「清除後仍只見 A」，保存請求與回應以定位責任：畫面還送 work 就退 F2，省略 tag 而伺服器仍回 A 就退 F1。修正者交出新版本，整合者再用新輸入驗 F3。\u003c/p>\n\u003cp data-passage=\"p-5\" data-block=\"8\">\u003cstrong>自我驗收\u003c/strong>　哪種事件能解除 BLOCKED？有權者的決議解開語義問題，負責人才能重查依賴並放行；等待時間變長或多開一位 Worker 都沒有補齊輸入。測試失敗則需要能重現的反例與修正產物。圖上的修正回路是下一次嘗試的時間順序，不要在同一次 DAG 加上互等的前置條件。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "P13、P01", "passages": ["p-4", "p-5"]}, {"number": 213, "type": "content", "title": "在每條入邊登記基線、有效派工與局部檢查", "chapter": "03", "unit": "C31", "body": "\u003cp data-passage=\"p-6\" data-block=\"9\">\u003cstrong>沿著兩條入邊核對版本。\u003c/strong> \u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"[SYNTHETIC_EXAMPLE]\">合成教學案例\u003c/span> 這一輪的 F0 是 R1-F0 的短稱，核准的是 B0 上的單標籤契約。下列代號用於紙上追蹤；A1、U1、U2 各代表一份可取用的提交。協調者在每條入邊記下票號、當前派工嘗試（Dispatch）、基線、提交及局部檢查。F3 可開始代表輸入已齊，簽收還需要整合驗證。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "P13、P01", "passages": ["p-6"]}, {"number": 214, "type": "content", "title": "兩端交件齊備，登記首次整合的版本配對", "chapter": "03", "unit": "C31", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"事件表格\" data-passage=\"p-7\" data-block=\"10\" data-rows=\"1,2\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">事件\u003c/th>\n\u003cth scope=\"col\">F3 當下可採用的輸入\u003c/th>\n\u003cth scope=\"col\">整合者的動作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>F1 的有效嘗試交回 A1，局部 API 驗收通過；F2 還在工作\u003c/td>\n\u003ctd>API：B0/A1；UI：缺\u003c/td>\n\u003ctd>等 UI 產物。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F2 第一次派工 d1 交回 B0/U1，局部 UI 案例通過\u003c/td>\n\u003ctd>API：A1；UI：d1/U1，兩者都依 R1-F0\u003c/td>\n\u003ctd>記下這組版本，開始 F3 真實資料路徑檢查。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "P13、P01", "passages": ["p-7"]}, {"number": 215, "type": "content", "title": "清除失敗後撤回配對，以新前端提交重驗", "chapter": "03", "unit": "C31", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"事件表格\" data-passage=\"p-7\" data-block=\"10\" data-rows=\"3,4,5\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">事件\u003c/th>\n\u003cth scope=\"col\">F3 當下可採用的輸入\u003c/th>\n\u003cth scope=\"col\">整合者的動作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>F3 清除後仍見 A；紀錄顯示 UI 仍送 tag=work\u003c/td>\n\u003ctd>A1 仍可用；d1/U1 退回，這組整合輸入失效\u003c/td>\n\u003ctd>保存反例，撤回 F3 放行。協調者結束 d1，在同一張 F2 登記新嘗試 d2；此時 UI 入邊重新缺件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d2 尚未交件，d1 遲到的「通過」回報抵達\u003c/td>\n\u003ctd>仍只有 A1\u003c/td>\n\u003ctd>將回報留給 d1 的歷史；即使指向 U1，也不能替 d2 補件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d2 交回 B0/U2，重查契約、提交與局部結果均合格\u003c/td>\n\u003ctd>API：A1；UI：d2/U2\u003c/td>\n\u003ctd>用 A1＋U2 重跑選取、清除與未知標籤，留下新的整合結果，交具權者決定是否接受 B1。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "P13、P01", "passages": ["p-7"]}, {"number": 216, "type": "content", "title": "多選需求另開契約，重新取得核准", "chapter": "03", "unit": "C31", "body": "\u003cp data-passage=\"p-8\" data-block=\"11\">若退回時發現爭議其實是「要不要支援多選」，先標待決並記錄裁決者。第一輪簽收後才從 B1 建第二輪契約票 R2-F0；它須取得自己的核准，不能承接 R1-F0 的 accepted。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "P13、P01", "passages": ["p-8"]}, {"number": 217, "type": "content", "title": "前後端以同一份單標籤契約驗收三種操作", "chapter": "03", "unit": "C31-01", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">待辦網站要加上標籤篩選。一位開發者寫提供資料的服務，另一位寫使用者操作的畫面。假如前者把「清除」理解成省略篩選條件，後者卻送一個空字串，兩人各自在自己的測試裡通過，也可能接不起來。先把共同承諾的行為寫下來，再談哪張票可以交出去。\u003c/p>\n\u003cp data-passage=\"p-2\" data-block=\"2\">第一輪從同一個起始提交 B0 出發。測試資料有工作待辦 A(work)、居家待辦 B(home)。服務介面（API）和畫面（UI）都按以下約定實作：選 work 只見 A，清除時省略 tag，恢復 A、B。未知標籤回空清單，HTTP 狀態碼 200 表示成功處理請求。首輪只承諾單標籤；空字串或多選的意思仍要交由有決策權的人核定。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13、P01", "passages": ["p-1", "p-2"]}, {"number": 218, "type": "content", "title": "從契約到整合，沿四張工作票追蹤交付", "chapter": "03", "unit": "C31-01", "body": "\u003cp data-passage=\"p-4\" data-block=\"4\">先開一張契約票，由具權者核准介面契約和固定資料；然後分別交給後端與畫面的實作者。最後由整合者把兩份可定位的程式放回共同基準，沿真實資料路徑核驗。這四張工作票在第一輪的全號為 R1-F0～R1-F3，同輪簡稱 F0～F3。圖中虛線只標採用的基準；四條實線箭頭才表示下游須取得的上游產物。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13、P01", "passages": ["p-4"]}, {"number": 219, "type": "content", "title": "讀懂 DAG 圖中的版本基線與產物依賴", "chapter": "03", "unit": "C31-01", "body": "\u003cpre tabindex=\"0\" data-passage=\"p-5\" data-block=\"5\">\u003ccode class=\"language-text\">B0 ···▷ F0（契約、固定資料）\nF0 ──已核准的契約──→ F1（API）\nF0 ──已核准的契約──→ F2（UI）\nF1 ──API 提交與局部檢查──→ F3（整合）\nF2 ──UI 提交與局部檢查───→ F3（整合）\n\u003c/code>\u003c/pre>", "layout": "code", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13、P01", "passages": ["p-5"]}, {"number": 220, "type": "content", "title": "分清可派工、實際開工與整合收件條件", "chapter": "03", "unit": "C31-01", "body": "\u003cp data-passage=\"p-6\" data-block=\"6\">這叫有向無環圖（DAG）：順著依賴走不會回到原點。先看分岔，再看匯合。若契約還是草案，一句「差不多了」、兩位執行者都空閒、開著兩個視窗或等過一段時間，都填不上前兩條邊。把具權者批准的版本連到兩張票，F1、F2 才同時 ready（可派工）。真正開工還要指定負責人並登記這次派工。F3 則要等最後兩條入邊同時成立。\u003c/p>\n\u003cp data-passage=\"p-7\" data-block=\"7\">Orca 的 P13 公開文件快照（Experimental）以 Task 記工作責任、依賴與狀態，以 Dispatch 辨識一次派工嘗試。Anthropic Engineering 的 P01 支持順序與平行工作流分類（\u003cspan class=\"evidence-label\" data-evidence=\"PUBLIC_DOC\" data-original=\"PUBLIC_DOC\">公開技術文件\u003c/span>）。T06 與上圖是教材合成案例（\u003cspan class=\"evidence-label\" data-evidence=\"SYNTHETIC_EXAMPLE\" data-original=\"SYNTHETIC_EXAMPLE\">合成教學案例\u003c/span>）；這些票、版本與狀態沒有協調器實跑紀錄。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13、P01", "passages": ["p-6", "p-7"]}, {"number": 221, "type": "content", "title": "畫面截圖能否充當整合所需的前端提交？", "chapter": "03", "unit": "C31-02", "body": "\u003cp data-passage=\"p-1\" data-block=\"1\">待辦網站要能選工作標籤和清除篩選。寫後端的人交來可取得的程式版本；寫畫面的人交來一張清除按鈕運作正常的截圖。整合者想把兩端接起來，手上卻只有一份能放進應用程式的程式碼。要知道這項工作何時能開始，可以替兩個輸入各留一格。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": ["p-1"]}, {"number": 222, "type": "content", "title": "模擬回應可測畫面，整合仍需前端提交", "chapter": "03", "unit": "C31-02", "body": "\u003cp data-passage=\"p-2\" data-block=\"2\">這次大家從同一程式起點 B0 開發，按第一輪核准的單標籤契約 K1 驗收。契約票叫 F0，後端資料服務票叫 F1，前端畫面票叫 F2，接起兩份程式的整合票叫 F3。工作資料 A 帶 work 標籤，B 帶 home。後端交回版本 api-a，對 \u003ccode>GET /todos?tag=work\u003c/code> 的局部檢查得到 [A]。前端先用預先準備的模擬回應（mock）測清除按鈕；這只能說明局部畫面在那個回應下的行為。直到後來交回 ui-a，才有可以取用的前端提交。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": ["p-2"]}, {"number": 223, "type": "content", "title": "按收件狀態更新整合票的前後端輸入", "chapter": "03", "unit": "C31-02", "body": "\u003cdiv class=\"table-scroll ledger\" tabindex=\"0\" role=\"region\" aria-label=\"事件表格\" data-passage=\"p-4\" data-block=\"4\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth scope=\"col\">事件\u003c/th>\n\u003cth scope=\"col\">F1 狀態\u003c/th>\n\u003cth scope=\"col\">F2 狀態\u003c/th>\n\u003cth scope=\"col\">F3 的 API 格／UI 格\u003c/th>\n\u003cth scope=\"col\">F3 判斷\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>K1 待批准\u003c/td>\n\u003ctd>等契約\u003c/td>\n\u003ctd>等契約\u003c/td>\n\u003ctd>缺／缺\u003c/td>\n\u003ctd>等兩件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>K1 獲准\u003c/td>\n\u003ctd>ready\u003c/td>\n\u003ctd>ready\u003c/td>\n\u003ctd>缺／缺\u003c/td>\n\u003ctd>等兩件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接受 B0/K1 的 api-a\u003c/td>\n\u003ctd>已接受\u003c/td>\n\u003ctd>實作中\u003c/td>\n\u003ctd>api-a／缺\u003c/td>\n\u003ctd>只有一條入邊成立\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F2 只傳截圖\u003c/td>\n\u003ctd>已接受\u003c/td>\n\u003ctd>待補提交\u003c/td>\n\u003ctd>api-a／缺\u003c/td>\n\u003ctd>無 UI 可整合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接受 B0/K1 的 ui-a\u003c/td>\n\u003ctd>已接受\u003c/td>\n\u003ctd>已接受\u003c/td>\n\u003ctd>api-a／ui-a\u003c/td>\n\u003ctd>ready，可在整合版操作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>", "layout": "table", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": ["p-4"]}, {"number": 224, "type": "content", "title": "有提交仍須核對契約版本與局部證據", "chapter": "03", "unit": "C31-02", "body": "\u003cp data-passage=\"p-5\" data-block=\"5\">從上往下追同一張整合票，遇到「已接受」先橫讀另一格。局部收件要核對起始版本（base）、契約、可取用的提交、局部證據的範圍，以及這份交件目前是否仍有效。假如兩格看似都有提交，ui-a 卻按照尚未批准的多選契約製作，仍欠符合 B0/K1 的 UI。先取回或補做該版本及局部檢查，再核兩格。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": ["p-5"]}, {"number": 225, "type": "content", "title": "有效輸入齊備後，重驗真實介面再送簽收", "chapter": "03", "unit": "C31-02", "body": "\u003cp data-passage=\"p-6\" data-block=\"6\">兩個有效輸入到齊，協調者才可派 F3。整合者在共同版本接上真 API 與真畫面，重跑選 work 見 A、清除時省略 tag 並見 A、B、未知標籤見空清單，再跑既有回歸。具權者接受整合結果後才登記新的已簽收基線 B1。表的最後一列只到「可以開始整合」。\u003c/p>\n\u003cp data-passage=\"p-7\" data-block=\"7\">T06 與 Wiki 依賴圖是合成場景；K1、api-a、ui-a 均是教學代號，沒有實際提交雜湊。Orca 的 P13（Experimental 文件快照）支持 Task 與派工概念，表中狀態是教學約定。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": ["p-6", "p-7"]}, {"number": 226, "type": "content", "title": "用清除後的完整清單約定前後端行為", "chapter": "03", "unit": "C31-03", "body": "\u003cblockquote data-block=\"1\">在這個合成教學案例裡，團隊正在替待辦網站加上標籤篩選。清單上有兩件事：「回覆客戶」屬於工作，「買牛奶」屬於生活。點「工作」，應該只看見回覆客戶；再點「清除篩選」，兩件事都應該回來。\u003c/blockquote>\n\u003cp data-block=\"2\">一位 Agent 負責撰寫、測試後端的查詢程式。網站運作時，後端會按畫面送來的條件，從資料中挑出符合的待辦。另一位 Agent 負責前端程式，讓按鈕送出正確的條件，也讓畫面在收到資料後更新清單。團隊先約好按鈕的意思和預期清單，兩位就能各自開工。後端可以單獨測資料查詢，前端也可以用預先準備好的回應測按鈕。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": [], "subtitle": "清除篩選應讓「買牛奶」重新出現在清單"}, {"number": 227, "type": "content", "title": "清除後少一筆，應從請求、回應還是畫面查起？", "chapter": "03", "unit": "C31-03", "body": "\u003cp data-block=\"3\">兩邊都交了通過的局部測試。第三位 Agent 負責整合，把兩份修改放進同一版網站，用真正的服務試一次。它點「工作」，畫面正確地剩下一件；再點「清除篩選」，買牛奶卻沒有回來。現在需要知道的是哪一段要修，以及修完後該拿哪兩份程式再試。\u003c/p>\n\u003cp data-block=\"5\">按清除時，前端要向後端重新索取清單，這次應該把篩選條件整個省略。後端可能根本沒收到這個意思；也可能收對了，卻少給一筆；還可能兩筆都送回來了，畫面仍沿用舊清單。三種情況在使用者眼裡一模一樣。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 228, "type": "content", "title": "保存版本與操作，在 Network 對上同次請求和回應", "chapter": "03", "unit": "C31-03", "body": "\u003cp data-block=\"6\">重現故障時，先保存正在使用的前、後端版本、那兩筆測試資料，以及「選工作、再清除」的操作順序。接著從瀏覽器的網路紀錄（Network）找出\u003cstrong>這次清除\u003c/strong>送出的請求和它的回應，最後對照同一次操作的畫面。為了能在紀錄中認出兩件待辦，把「回覆客戶」記為 A，把「買牛奶」記為 B。程式用參數 \u003ccode>tag\u003c/code> 表示標籤，其中 \u003ccode>work\u003c/code> 是工作、\u003ccode>home\u003c/code> 是生活。讀下面三列時，可以先遮住最後一欄，自己沿資料走一次。若和表中的判斷不同，回到第一個與預期不符的欄位，再選一次負責修改的人。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 229, "type": "content", "title": "沿請求、回應和畫面找出第一個差異", "chapter": "03", "unit": "C31-03", "body": "\u003cdiv class=\"table-scroll cards\" tabindex=\"0\" role=\"region\" aria-label=\"清除時前端送了什麼表格\" data-block=\"7\">\u003ctable class=\"cols-4\">\u003cthead>\u003ctr>\u003cth scope=\"col\">清除時前端送了什麼\u003c/th>\u003cth scope=\"col\">後端給了哪些待辦\u003c/th>\u003cth scope=\"col\">畫面列出哪些待辦\u003c/th>\u003cth scope=\"col\">從哪裡開始修\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd data-label=\"清除時前端送了什麼\">仍帶著上一次的 \u003ccode>tag=work\u003c/code>\u003c/td>\u003ctd data-label=\"後端給了哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"畫面列出哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"從哪裡開始修\">回到前端查按鈕如何組出請求。後端其實照收到的條件交出了工作事項。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"清除時前端送了什麼\">已省略 tag\u003c/td>\u003ctd data-label=\"後端給了哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"畫面列出哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"從哪裡開始修\">回到後端查無篩選條件時的查詢。買牛奶在資料送到畫面之前就已經少了。\u003c/td>\u003c/tr>\u003ctr>\u003ctd data-label=\"清除時前端送了什麼\">已省略 tag\u003c/td>\u003ctd data-label=\"後端給了哪些待辦\">[A,B]\u003c/td>\u003ctd data-label=\"畫面列出哪些待辦\">[A]\u003c/td>\u003ctd data-label=\"從哪裡開始修\">回到前端查收到回應後如何更新清單。服務已把買牛奶送回來了。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "layout": "table", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 230, "type": "content", "title": "分開記錄程式基線與驗收契約版本", "chapter": "03", "unit": "C31-03", "body": "\u003cp data-block=\"9\">團隊需要讓下一位接手的人能重現剛才的判斷。先記兩個不同的版本：\u003cstrong>B0\u003c/strong> 是大家開始修改時共用的程式提交；\u003cstrong>K1\u003c/strong> 是產品負責人核准的行為約定，寫明工作標籤只回 A、清除恢復 A 與 B，以及查無相符標籤時要成功回傳空清單；畫面也應顯示空清單。前者讓人能還原程式起點，後者讓人知道該拿哪個結果驗收。核准這份約定的首輪工作票，全號叫 \u003cstrong>R1-F0\u003c/strong>，本輪內簡稱 \u003cstrong>F0\u003c/strong>。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 231, "type": "content", "title": "按第一個偏差把反例退回前端或後端", "chapter": "03", "unit": "C31-03", "body": "\u003cp data-block=\"10\">每件可以獨立交付與驗收的工作記成一張任務票（Task）。後端的資料介面叫 API，它的工作票記為 \u003cstrong>F1\u003c/strong>；前端的操作畫面叫 UI，工作票是 \u003cstrong>F2\u003c/strong>；將兩者接起來做整合檢查的是 \u003cstrong>F3\u003c/strong>。所以剛才三列故障依序退回 F2、F1、F2。負責安排和追蹤工作的協調者可以依票號轉交反例，歸屬的理由仍是表裡那三項觀察。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 232, "type": "content", "title": "讀整合依賴圖：前後端各交提交與局部測試", "chapter": "03", "unit": "C31-03", "body": "\u003cfigure data-block=\"11\">\u003cfigcaption>整合任務的兩條前置依賴\u003c/figcaption>\u003cdiv class=\"flow-node\">核准的約定（F0）\u003c/div>\n        \u003cdiv class=\"fork\">\u003cdiv>\u003cb>↓ 後端任務（F1）\u003c/b>\u003cspan>後端提交與局部測試 ↓\u003c/span>\u003c/div>\n        \u003cdiv>\u003cb>↓ 前端任務（F2）\u003c/b>\u003cspan>前端提交與局部測試 ↓\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"flow-node\">兩份齊備 → 整合任務（F3）\u003c/div>\u003cdetails>\u003csummary>讀取原稿文字圖\u003c/summary>\u003cpre>核准的約定（F0） → 後端任務（F1） → 後端提交與局部測試 ┐\n核准的約定（F0） → 前端任務（F2） → 前端提交與局部測試 ┘\n                                     兩份齊備 → 整合任務（F3）\u003c/pre>\u003c/details>\u003c/figure>", "layout": "figure", "note": "合成整合案例；票號、版本與回報用於演練分工。", "sources": "T06、P13", "passages": []}, {"number": 233, "type": "content", "title": "用 AND 依賴檢查兩端提交是否仍然有效", "chapter": "03", "unit": "C31-03", "body": "\u003cp data-block=\"12\">箭頭表示下游開工需要的產物。沿箭頭不會繞回原點，這就是任務的有向無環圖（Task DAG）。F0 獲准後，F1、F2 可以分頭派工。F3 有兩條必須\u003cstrong>同時成立\u003c/strong>的依賴，工程上也稱 AND 依賴。整合者要取得前、後端兩份仍有效、源自 B0、符合 K1 的提交及局部測試紀錄。只有其中一份，或前端只交了模擬畫面的截圖，仍缺可放進網站的版本。兩份齊備才可以開始驗整體行為。\u003c/p>", "layout": "prose", "note": "合成整合案例；票號、版本與回報
